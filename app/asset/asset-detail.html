<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRIV‑EN | Asset Detail</title>
<meta name="description" content="DRIV-EN — Asset detail view.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/assets/icons/favicon.png?v=2026" sizes="48x48">
<link rel="icon" type="image/png" href="/assets/icons/favicon-96.png?v=2026" sizes="96x96">
<link rel="icon" type="image/png" href="/assets/icons/favicon-192.png?v=2026" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/icons/favicon-180.png?v=2026">
<link rel="stylesheet" href="/app/shared/dashboard.css?v=11">
<link rel="stylesheet" href="/styles/diamond-plate.css?v=2">
<script>
(function() {
  var saved = localStorage.getItem("driven-theme");
  var system = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  var theme = saved || system;
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>
<style>
.ad-loading { display:flex; align-items:center; justify-content:center; height:100vh; font-size:16px; color:var(--text-muted); }
.dash-header-row3 { display:none !important; }
#dashHeader .dash-theme-wrapper { display:none !important; }
.dash-header-row2 { display:none !important; }
.ad-main { max-width:900px; margin:20px auto; padding:0 20px; position:relative; z-index:1; }
.ad-back { display:inline-flex; align-items:center; gap:6px; background:var(--bg-card); border:1px solid var(--border); border-radius:6px; padding:8px 16px; font-size:14px; color:var(--text); cursor:pointer; text-decoration:none; margin-bottom:16px; }
.ad-back:hover { border-color:var(--primary); color:var(--primary); }
.ad-header { background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:24px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:16px; }
.ad-header h2 { margin:0 0 4px 0; font-size:22px; color:var(--text); }
.ad-header .ad-subtitle { margin:0; font-size:14px; color:var(--text-muted); }
.ad-header-actions { display:flex; gap:10px; flex-wrap:wrap; }
.ad-badge { display:inline-block; padding:4px 12px; border-radius:12px; font-size:13px; font-weight:600; }
.ad-badge-available { background:rgba(34,197,94,0.15); color:#16a34a; }
.ad-badge-in-use { background:rgba(59,130,246,0.15); color:#2563eb; }
.ad-badge-maintenance { background:rgba(249,115,22,0.15); color:#ea580c; }
.ad-badge-retired { background:rgba(107,114,128,0.15); color:#6b7280; }
.ad-badge-lost { background:rgba(239,68,68,0.15); color:#dc2626; }
.ad-badge-sold { background:rgba(139,92,246,0.15); color:#7c3aed; }
.ad-card { background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:20px; margin-bottom:16px; }
.ad-card h3 { margin:0 0 16px 0; font-size:16px; color:var(--text); border-bottom:1px solid var(--border); padding-bottom:8px; }
.ad-field-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px; }
.ad-field { display:flex; flex-direction:column; border:1px solid var(--border); border-radius:6px; padding:10px 12px; }
.ad-field-label { font-size:12px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; }
.ad-field-value { font-size:15px; color:var(--text); }
.ad-btn-primary { background:var(--primary); color:#fff; padding:10px 18px; border-radius:6px; font-size:15px; border:1px solid var(--primary-hover); cursor:pointer; text-decoration:none; }
.ad-btn-primary:hover { background:var(--primary-hover); }
.ad-btn-secondary { background:var(--bg-card); color:var(--text); padding:10px 18px; border-radius:6px; font-size:15px; border:1px solid var(--border); cursor:pointer; text-decoration:none; }
.ad-btn-secondary:hover { border-color:var(--primary); color:var(--primary); }
.ad-error { text-align:center; padding:60px 20px; color:var(--error); font-size:16px; }
@media (max-width:700px) { .ad-main { padding:0 12px; margin:12px auto; } .ad-field-grid { grid-template-columns:1fr; } .ad-header { flex-direction:column; } }
</style>
</head>
<body data-page-title="Asset Detail">
<div class="steel-bg"></div>
<div class="steel-overlay"></div>
<div id="dashHeader"></div>
<div class="ad-main">
  <div class="ad-loading" id="adLoading">Loading asset detail...</div>
  <div id="adContent" style="display:none;">
    <a class="ad-back" href="/app/dashboard/asset-management.html">&#8592; Back to Asset List</a>
    <div class="ad-header">
      <div>
        <h2 id="adTitle">Asset</h2>
        <p class="ad-subtitle" id="adSubtitle"></p>
        <div style="margin-top:8px;" id="adStatusBadge"></div>
      </div>
      <div class="ad-header-actions">
        <a class="ad-btn-secondary" id="adEditBtn" href="#">Edit</a>
        <a class="ad-btn-primary" href="/app/dashboard/asset-management.html">Asset List</a>
      </div>
    </div>
    <div class="ad-card"><h3>Asset Information</h3><div class="ad-field-grid" id="adInfoGrid"></div></div>
    <div class="ad-card"><h3>Assignment & Location</h3><div class="ad-field-grid" id="adAssignGrid"></div></div>
    <div class="ad-card"><h3>Additional Details</h3><div class="ad-field-grid" id="adExtraGrid"></div></div>
  </div>
  <div id="adError" class="ad-error" style="display:none;"></div>
</div>
<div id="dashFooter"></div>
<script src="/app/shared/dashboard-common.js?v=13"></script>
<script>
document.addEventListener('dashSessionLoaded', async function() {
  var user = window.dashUser;
  if (!user) { window.location.href = '/public/login.html'; return; }
  var ha = 0, hi = setInterval(function() { ha++; if (fixHeaderLayout() || ha > 50) clearInterval(hi); }, 100);
  var params = new URLSearchParams(window.location.search);
  var assetId = params.get('id');
  if (!assetId) {
    document.getElementById('adLoading').style.display = 'none';
    document.getElementById('adError').style.display = 'block';
    document.getElementById('adError').textContent = 'No asset ID specified. Please go back to the Asset List and click View on an asset.';
    return;
  }
  try {
    var resp = await fetch('/api/Equipment/' + encodeURIComponent(assetId));
    var data = await resp.json();
    if (!resp.ok) {
      document.getElementById('adLoading').style.display = 'none';
      document.getElementById('adError').style.display = 'block';
      if (resp.status === 401) document.getElementById('adError').textContent = 'Your session has expired. Please log in again.';
      else if (resp.status === 404) document.getElementById('adError').textContent = 'Asset not found. It may have been deleted.';
      else if (resp.status === 403) document.getElementById('adError').textContent = 'You do not have permission to view this asset.';
      else document.getElementById('adError').textContent = 'Failed to load asset (HTTP ' + resp.status + ').';
      return;
    }
    var record = data.record;
    if (!record || !record.fields) {
      document.getElementById('adLoading').style.display = 'none';
      document.getElementById('adError').style.display = 'block';
      document.getElementById('adError').textContent = 'Asset data is incomplete or corrupted.';
      return;
    }
    var f = record.fields;
    var assetNumber = f['Equipment ID'] || '—';
    var assetType = f['Category'] || f['Equipment Name'] || '—';
    var status = f['Status'] || 'Available';
    document.getElementById('adTitle').textContent = assetNumber + ' — ' + assetType;
    document.getElementById('adSubtitle').textContent = 'Asset ID: ' + assetId;
    var badge = document.createElement('span');
    badge.className = 'ad-badge ad-badge-' + String(status).toLowerCase().replace(/\s+/g, '-');
    badge.textContent = status;
    document.getElementById('adStatusBadge').appendChild(badge);
    renderFields('adInfoGrid', [
      { label: 'Asset Number', value: f['Equipment ID'] },
      { label: 'Asset Type', value: f['Category'] || f['Equipment Name'] },
      { label: 'Serial Number', value: f['Serial Number'] },
      { label: 'Meter Reading', value: f['Meter Reading'] !== undefined ? f['Meter Reading'] : null },
      { label: 'Status', value: f['Status'] },
      { label: 'Condition', value: f['Condition'] },
    ]);
    renderFields('adAssignGrid', [
      { label: 'Current Project', value: f['Project'] },
      { label: 'Current Location', value: f['Location'] },
      { label: 'Assigned To', value: f['Assigned To'] },
      { label: 'Division', value: f['Division'] },
    ]);
    renderFields('adExtraGrid', [
      { label: 'Created Date', value: f['Created Date'] },
      { label: 'Purchase Date', value: f['Purchase Date'] },
      { label: 'Purchase Price', value: f['Purchase Price'] },
      { label: 'Notes', value: f['Notes'] },
    ]);
    document.getElementById('adEditBtn').href = '/app/dashboard/asset-management.html?edit=' + encodeURIComponent(assetId);
    document.getElementById('adLoading').style.display = 'none';
    document.getElementById('adContent').style.display = 'block';
  } catch(e) {
    document.getElementById('adLoading').style.display = 'none';
    document.getElementById('adError').style.display = 'block';
    document.getElementById('adError').textContent = 'Network error — could not reach the server. Please check your connection and try again.';
    if (window.DRIVENErrorHandler) window.DRIVENErrorHandler.report('asset-detail.html: load failed — ' + (e.message || e), 'assetDetail', e && e.stack ? e.stack : null);
  }
});
function renderFields(containerId, fields) {
  var container = document.getElementById(containerId);
  container.textContent = '';
  fields.forEach(function(field) {
    var div = document.createElement('div');
    div.className = 'ad-field';
    var label = document.createElement('div');
    label.className = 'ad-field-label';
    label.textContent = field.label;
    var value = document.createElement('div');
    value.className = 'ad-field-value';
    value.textContent = (field.value !== undefined && field.value !== null && field.value !== '') ? field.value : '—';
    div.appendChild(label);
    div.appendChild(value);
    container.appendChild(div);
  });
}
function fixHeaderLayout() {
  var header = document.querySelector('.dash-header');
  if (!header) return false;
  var row1 = header.querySelector('.dash-header-row1');
  var row2 = header.querySelector('.dash-header-row2');
  var row3 = header.querySelector('.dash-header-row3');
  var h1 = row2 ? row2.querySelector('h1') : null;
  if (!row1 || !h1) return false;
  if (h1.parentNode === row1) return true;
  var drivenLogo = row1.querySelector('.dash-driven-logo');
  row1.insertBefore(h1, drivenLogo);
  row1.style.cssText = 'display:flex !important; justify-content:space-between !important; align-items:center !important; padding:8px 20px !important; gap:16px !important;';
  h1.style.cssText = 'margin:0; font-size:20px; font-weight:600; text-align:center; flex:1;';
  if (row2) row2.style.display = 'none';
  if (row3) row3.style.display = 'none';
  return true;
}
</script>
<script src="/app/shared/auth-check.js?v=13"></script>
</body>
</html>
