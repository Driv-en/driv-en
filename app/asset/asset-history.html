<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Complete Asset History & Audit Log | DRIV-EN Platform</title>
  <meta name="description" content="DRIV-EN — Complete Asset Life-Cycle Audit Log, Inspection History, Closed Work Orders, and PM Completions.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://www.driv-en.com/app/asset/asset-history.html">
  <link rel="icon" type="image/png" href="/assets/icons/favicon.png?v=2026" sizes="48x48">
  <link rel="icon" type="image/png" href="/assets/icons/favicon-96.png?v=2026" sizes="96x96">
  <link rel="icon" type="image/png" href="/assets/icons/favicon-192.png?v=2026" sizes="192x192">
  <link rel="apple-touch-icon" href="/assets/icons/favicon-180.png?v=2026">
  <link rel="stylesheet" href="/app/shared/dashboard.css?v=13">
  <link rel="stylesheet" href="/styles/diamond-plate.css?v=2">
  <script>
    (function() {
      var saved = localStorage.getItem("driven-theme");
      var system = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      var theme = saved || system;
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      --header-height: 60px;
      --card-green-border: #16a34a;
      --blue-line: #1e3a8a;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background-color: var(--bg-body, #0f172a);
      color: var(--text, #f8fafc);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 200ms ease, color 200ms ease;
    }

    :root[data-theme="light"] body {
      background-color: #f1f5f9;
      color: #0f172a;
    }

    :root[data-theme="dark"] body {
      background-color: #0f172a;
      color: #f8fafc;
    }

    .dash-header-row3 { display: none !important; }
    #dashHeader .dash-theme-wrapper { display: none !important; }
    .dash-header-row2 { display: none !important; }

    #dashHeader, .dash-header {
      position: sticky !important;
      top: 0 !important;
      z-index: 101 !important;
      background: var(--bg-card, #ffffff);
      width: 100%;
      box-sizing: border-box;
      border-bottom: 2px solid var(--card-green-border);
    }

    @media (max-width: 700px) {
      .dash-customer-logo, .dash-customer-logo-placeholder {
        max-height: 32px;
        max-width: 70px;
      }
      .dash-driven-logo { max-height: 36px; }
      #dashHeader .dash-header-row1 {
        padding: 6px 12px !important;
        gap: 8px !important;
      }
      #dashHeader h1 {
        font-size: 16px !important;
      }
    }

    /* Sticky Tab Bar matching asset-detail.html & asset-configuration.html */
    .am-tab-bar {
      display: flex;
      gap: 2px;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
      overflow-x: auto;
      position: sticky !important;
      top: var(--header-height, 60px) !important;
      z-index: 100 !important;
      background: #cbd5e1;
      border-bottom: 2px solid #94a3b8;
      box-sizing: border-box;
      -webkit-overflow-scrolling: touch;
    }
    :root[data-theme="dark"] .am-tab-bar {
      background: #334155;
      border-bottom-color: #475569;
    }

    .am-tab {
      background: #94a3b8;
      border: 1px solid #64748b;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 500;
      color: #1e293b;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      transition: color 200ms ease, background 200ms ease, margin-top 200ms ease;
      margin-top: 4px;
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
    }
    :root[data-theme="dark"] .am-tab {
      background: #475569;
      border-color: #64748b;
      color: #f1f5f9;
    }

    .am-tab:hover {
      color: #0f172a;
      background: #a5b4c4;
      margin-top: 2px;
    }
    :root[data-theme="dark"] .am-tab:hover {
      color: #ffffff;
      background: #64748b;
    }

    .am-tab.active {
      color: #1d4ed8;
      background: #e2e8f0;
      border-color: #64748b;
      margin-top: 0;
      font-weight: 600;
      z-index: 2;
    }
    :root[data-theme="dark"] .am-tab.active {
      color: #60a5fa;
      background: #1e293b;
      border-color: #475569;
    }

    .am-tab-dashboard {
      background: #2563eb;
      border: 1px solid #1d4ed8;
      color: #fff;
    }
    .am-tab-dashboard:hover {
      background: #1d4ed8;
      color: #fff;
      margin-top: 2px;
    }
    .am-tab-logout {
      background: #b91c1c;
      border: 1px solid #dc2626;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      margin-top: 4px;
      margin-left: auto;
      position: relative;
      z-index: 1;
      transition: background 200ms ease, margin-top 200ms ease;
    }
    .am-tab-logout:hover {
      background: #dc2626;
      margin-top: 2px;
    }

    .presence-banner { 
      display: none; 
      align-items: center; 
      justify-content: center;
      gap: 8px; 
      background: #ea580c !important; 
      border: 1.5px solid #f97316 !important; 
      padding: 4px 12px; 
      border-radius: 16px; 
      font-size: 12px; 
      color: #ffffff !important; 
      font-weight: 600; 
      margin: 4px 8px 4px 0;
    }

    /* History Layout & Table Standard */
    .history-container {
      width: 100%;
      max-width: 1100px;
      margin: 16px auto 80px auto;
      padding: 0 16px;
      box-sizing: border-box;
      position: relative;
      z-index: 1;
    }
    .card-panel {
      background: var(--bg-card, #ffffff);
      border: 2px solid var(--card-green-border);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
      color: var(--text, #0f172a);
    }
    :root[data-theme="dark"] .card-panel {
      background: #1e293b;
      color: #f8fafc;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text, #0f172a);
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border, #e2e8f0);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    :root[data-theme="dark"] .card-title {
      border-bottom-color: #334155;
    }

    /* Isolated Resizable & Wrapping Table */
    .um-table-container {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border, #e2e8f0);
      border-radius: 6px;
    }
    :root[data-theme="dark"] .um-table-container {
      border-color: #334155;
    }

    .um-table {
      width: 100% !important;
      min-width: 800px !important;
      border-collapse: collapse;
      table-layout: fixed !important;
      font-size: 13px;
    }
    .um-table th, .um-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border, #e2e8f0);
      white-space: normal !important;
      word-break: break-word !important;
    }
    :root[data-theme="dark"] .um-table td {
      border-bottom-color: #334155;
      color: #f8fafc;
    }

    .um-table th {
      background: var(--bg-step, #f1f5f9);
      font-weight: 700;
      color: var(--text, #334155);
      border-bottom: 2px solid #1e3a8a;
    }
    :root[data-theme="dark"] .um-table th {
      background: #0f172a;
      color: #f1f5f9;
      border-bottom-color: #3b82f6;
    }

    .um-table tr:hover { background: var(--bg-step, #f8fafc); }
    :root[data-theme="dark"] .um-table tr:hover { background: #0f172a; }

    /* Buttons Standard */
    .btn-action {
      background: #16a34a;
      color: #ffffff;
      border: 1px solid #15803d;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: background 200ms ease;
    }
    .btn-action:hover { background: #2563eb; border-color: #1d4ed8; }

    .ah-message {
      display: none;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 16px;
      font-weight: 600;
    }
    .ah-message.error {
      background: #fef2f2;
      border: 1px solid #ef4444;
      color: #991b1b;
    }

    @media (max-width: 700px) {
      .history-container { padding: 0 12px; margin: 12px auto; }
      .am-tab { padding: 8px 12px; font-size: 13px; }
      .am-tab-logout { padding: 8px 12px; font-size: 13px; }

      /* Mobile 3-Row Header Layout Fix */
      .card-title {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .card-title .btn-action {
        order: 1;
        width: 100%;
        justify-content: center;
      }
      .card-title .card-title-text {
        order: 2;
        width: 100%;
      }
      .card-title .record-count-badge {
        order: 3;
        width: 100%;
      }
    }

    /* Targeted & Flush Printing */
    @media print {
      .am-tab-bar, #dashHeader, #dashFooter, .btn-action { display: none !important; }
      body { background: #ffffff !important; color: #000000 !important; }
      .history-container { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
      .card-panel { background: #ffffff !important; border: 1px solid #000000 !important; box-shadow: none !important; color: #000000 !important; }
      .um-table thead { display: table-header-group !important; }
      @page { margin: 10mm; }
    }
  </style>
</head>
<body data-page-title="Asset History">
  <div class="steel-bg"></div>
  <div class="steel-overlay"></div>

  <!-- Viewport Sticky Header -->
  <div id="dashHeader"></div>

  <!-- Sticky Tab Navigation Bar matching asset-detail.html & asset-configuration.html -->
  <div class="am-tab-bar" id="amTabBar">
    <a class="am-tab am-tab-dashboard" href="/app/dashboard/asset-management.html?tab=assets" data-i18n>&#8592; Asset Directory</a>
    <a class="am-tab" id="lnkOverview" href="/app/asset/asset-detail.html" data-i18n>Overview</a>
    <a class="am-tab" id="lnkConfig" href="/app/dashboard/asset-config.html" data-i18n>⚙️ Configuration</a>
    <div class="am-tab active" data-i18n>📜 History</div>
    
    <div class="presence-banner" id="presenceBanner">
      <span id="presenceText" data-i18n>Other Key Personnel active</span>
    </div>

    <div class="am-tab-logout" onclick="confirmLogout()" data-i18n>Logout</div>
  </div>

  <main class="history-container">
    <div id="ahMessage" class="ah-message"></div>

    <div class="card-panel">
      <div class="card-title">
        <button class="btn-action" onclick="doPrintHistory()" data-i18n>🖨 Print Audit History</button>
        <div class="card-title-text">
          <span data-i18n>📜 Complete Life-Cycle Audit Log: </span>
          <span id="txtAssetTitle" style="color: #2563eb;">Loading Asset Context...</span>
        </div>
        <div class="record-count-badge">
          <span id="recordCountBadge" style="font-size: 13px; font-weight: 600; color: var(--text-muted, #64748b);">0 Events</span>
        </div>
      </div>

      <div class="um-table-container">
        <table class="um-table" id="historyTable">
          <thead>
            <tr>
              <th style="width: 18%; min-width: 140px;" data-i18n>Timestamp</th>
              <th style="width: 14%; min-width: 110px;" data-i18n>Module / Type</th>
              <th style="width: 18%; min-width: 140px;" data-i18n>Logged By</th>
              <th style="width: 15%; min-width: 120px;" data-i18n>Action / Event</th>
              <th style="width: 35%; min-width: 250px;" data-i18n>Event Details &amp; Audit Notes</th>
            </tr>
          </thead>
          <tbody id="historyTableBody">
            <tr>
              <td colspan="5" style="text-align: center; color: var(--text-muted, #64748b); padding: 20px;" data-i18n>Loading historical audit log...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="dashFooter"></div>

  <script src="/app/shared/dashboard-common.js?v=13"></script>
  <script src="/app/shared/auth-check.js?v=13"></script>
  <script src="/app/shared/translate.js?v=2"></script>
  <script src="/app/asset/asset-history.js?v=1"></script>
</body>
</html>
