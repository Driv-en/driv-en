<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Complete Asset History & Audit Log | DRIV-EN Platform</title>
  <meta name="description" content="DRIV-EN — Complete Asset Life-Cycle Audit Log, Inspection History, Closed Work Orders, and PM Completions.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://www.driv-en.com/app/asset/asset-history.html">
  <link rel="icon" type="image/png" href="/assets/icons/favicon.png?v=2026" sizes="48x48">
  <link rel="icon" type="image/png" href="/assets/icons/favicon-96.png?v=2026" sizes="96x96">
  <link rel="icon" type="image/png" href="/assets/icons/favicon-192.png?v=2026" sizes="192x192">
  <link rel="apple-touch-icon" href="/assets/icons/favicon-180.png?v=2026">
  <link rel="stylesheet" href="/app/shared/dashboard.css?v=13">
  <link rel="stylesheet" href="/styles/diamond-plate.css?v=2">
  <script>
    (function() {
      var saved = localStorage.getItem("driven-theme");
      var system = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      var theme = saved || system;
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      --header-height: 60px;
      --card-green-border: #16a34a;
      --blue-line: #1e3a8a;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background-color: #0f172a;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .dash-header-row3 { display: none !important; }
    #dashHeader .dash-theme-wrapper { display: none !important; }
    .dash-header-row2 { display: none !important; }

    #dashHeader, .dash-header {
      position: sticky !important;
      top: 0 !important;
      z-index: 101 !important;
      background: var(--bg-card, #ffffff);
      width: 100%;
      box-sizing: border-box;
      border-bottom: 2px solid var(--card-green-border);
    }

    @media (max-width: 700px) {
      .dash-customer-logo, .dash-customer-logo-placeholder {
        max-height: 32px;
        max-width: 70px;
      }
      .dash-driven-logo { max-height: 36px; }
      #dashHeader .dash-header-row1 {
        padding: 6px 12px !important;
        gap: 8px !important;
      }
      #dashHeader h1 {
        font-size: 16px !important;
      }
    }

    /* Sticky Tab Bar matching asset-detail.html & asset-configuration.html */
    .am-tab-bar {
      display: flex;
      gap: 2px;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
      overflow-x: auto;
      position: sticky !important;
      top: var(--header-height, 60px) !important;
      z-index: 100 !important;
      background: #cbd5e1;
      border-bottom: 2px solid #94a3b8;
      box-sizing: border-box;
      -webkit-overflow-scrolling: touch;
    }
    .am-tab {
      background: #94a3b8;
      border: 1px solid #64748b;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 500;
      color: #1e293b;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      transition: color 200ms ease, background 200ms ease, margin-top 200ms ease;
      margin-top: 4px;
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
    }
    .am-tab:hover {
      color: #0f172a;
      background: #a5b4c4;
      margin-top: 2px;
    }
    .am-tab.active {
      color: #1d4ed8;
      background: #e2e8f0;
      border-color: #64748b;
      margin-top: 0;
      font-weight: 600;
      z-index: 2;
    }
    .am-tab-dashboard {
      background: #2563eb;
      border: 1px solid #1d4ed8;
      color: #fff;
    }
    .am-tab-dashboard:hover {
      background: #1d4ed8;
      color: #fff;
      margin-top: 2px;
    }
    .am-tab-logout {
      background: #b91c1c;
      border: 1px solid #dc2626;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      margin-top: 4px;
      margin-left: auto;
      position: relative;
      z-index: 1;
      transition: background 200ms ease, margin-top 200ms ease;
    }
    .am-tab-logout:hover {
      background: #dc2626;
      margin-top: 2px;
    }

    .presence-banner { 
      display: none; 
      align-items: center; 
      justify-content: center;
      gap: 8px; 
      background: #ea580c !important; 
      border: 1.5px solid #f97316 !important; 
      padding: 4px 12px; 
      border-radius: 16px; 
      font-size: 12px; 
      color: #ffffff !important; 
      font-weight: 600; 
      margin: 4px 8px 4px 0;
    }

    /* History Layout & Table Standard */
    .history-container {
      width: 100%;
      max-width: 1100px;
      margin: 16px auto 80px auto;
      padding: 0 16px;
      box-sizing: border-box;
      position: relative;
      z-index: 1;
    }
    .card-panel {
      background: #ffffff;
      border: 2px solid var(--card-green-border);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
      color: #0f172a;
    }
    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Isolated Resizable & Wrapping Table */
    .um-table-container {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
    }
    .um-table {
      width: 100% !important;
      min-width: 100% !important;
      border-collapse: collapse;
      table-layout: fixed !important;
      font-size: 13px;
    }
    .um-table th, .um-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
      white-space: normal !important;
      word-break: break-word !important;
    }
    .um-table th {
      background: #f1f5f9;
      font-weight: 700;
      color: #334155;
      border-bottom: 2px solid #1e3a8a;
    }
    .um-table tr:hover { background: #f8fafc; }

    /* Buttons Standard */
    .btn-action {
      background: #16a34a;
      color: #ffffff;
      border: 1px solid #15803d;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: background 200ms ease;
    }
    .btn-action:hover { background: #2563eb; border-color: #1d4ed8; }

    .ah-message {
      display: none;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 16px;
      font-weight: 600;
    }
    .ah-message.error {
      background: #fef2f2;
      border: 1px solid #ef4444;
      color: #991b1b;
    }

    @media (max-width: 700px) {
      .history-container { padding: 0 12px; margin: 12px auto; }
      .am-tab { padding: 8px 12px; font-size: 13px; }
      .am-tab-logout { padding: 8px 12px; font-size: 13px; }
    }

    /* Targeted & Flush Printing */
    @media print {
      .am-tab-bar, #dashHeader, #dashFooter, .btn-action { display: none !important; }
      body { background: #ffffff !important; color: #000000 !important; }
      .history-container { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
      .card-panel { background: #ffffff; border: 1px solid #000; box-shadow: none; }
      .um-table thead { display: table-header-group !important; }
      @page { margin: 10mm; }
    }
  </style>
</head>
<body data-page-title="Asset History">
  <div class="steel-bg"></div>
  <div class="steel-overlay"></div>

  <!-- Viewport Sticky Header -->
  <div id="dashHeader"></div>

  <!-- Sticky Tab Navigation Bar matching asset-detail.html & asset-configuration.html -->
  <div class="am-tab-bar" id="amTabBar">
    <a class="am-tab am-tab-dashboard" href="/app/dashboard/asset-management.html?tab=assets">&#8592; Asset Directory</a>
    <a class="am-tab" id="lnkOverview" href="/app/asset/asset-detail.html">Overview</a>
    <a class="am-tab" id="lnkConfig" href="/app/asset/asset-configuration.html">⚙️ Configuration</a>
    <div class="am-tab active">📜 History</div>
    
    <div class="presence-banner" id="presenceBanner">
      <span id="presenceText">Other Key Personnel active</span>
    </div>

    <div class="am-tab-logout" onclick="confirmLogout()">Logout</div>
  </div>

  <main class="history-container">
    <div id="ahMessage" class="ah-message"></div>

    <div class="card-panel">
      <div class="card-title">
        <div>
          <span>📜 Complete Life-Cycle Audit Log: </span>
          <span id="txtAssetTitle" style="color: #2563eb;">Loading Asset Context...</span>
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
          <span id="recordCountBadge" style="font-size: 13px; font-weight: 600; color: #64748b;">0 Events</span>
          <button class="btn-action" onclick="doPrintHistory()">🖨 Print Audit History</button>
        </div>
      </div>

      <div class="um-table-container">
        <table class="um-table" id="historyTable">
          <thead>
            <tr>
              <th style="width: 160px;">Timestamp</th>
              <th style="width: 130px;">Module / Type</th>
              <th style="width: 160px;">Logged By</th>
              <th style="width: 140px;">Action / Event</th>
              <th>Event Details & Audit Notes</th>
            </tr>
          </thead>
          <tbody id="historyTableBody">
            <tr>
              <td colspan="5" style="text-align: center; color: #64748b; padding: 20px;">Loading historical audit log...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="dashFooter"></div>

  <script src="/app/shared/dashboard-common.js?v=13"></script>
  <script src="/app/shared/auth-check.js?v=13"></script>

  <script>
    var activeOrgId = "";
    var currentAssetId = "";

    // Header Height Adjustment Logic matching asset-detail.html
    function updateHeaderOffset() {
      var h = document.getElementById('dashHeader') || document.querySelector('.dash-header');
      if (h) {
        var hh = h.getBoundingClientRect().height || 60;
        document.documentElement.style.setProperty('--header-height', hh + 'px');
      }
    }
    window.addEventListener('resize', updateHeaderOffset);

    function fixHeaderLayout() {
      var h = document.querySelector('.dash-header');
      if (!h) return false;
      var r1 = h.querySelector('.dash-header-row1');
      var r2 = h.querySelector('.dash-header-row2');
      var r3 = h.querySelector('.dash-header-row3');
      var h1 = r2 ? r2.querySelector('h1') : null;
      if (!r1 || !h1) return false;
      if (h1.parentNode === r1) return true;
      var dl = r1.querySelector('.dash-driven-logo');
      r1.insertBefore(h1, dl);
      r1.style.cssText = 'display:flex !important; justify-content:space-between !important; align-items:center !important; padding:8px 20px !important; gap:16px !important; width:100% !important; box-sizing:border-box !important;';
      h1.style.cssText = 'margin:0; font-size:20px; font-weight:600; text-align:center; flex:1;';
      if (r2) r2.style.display = 'none';
      if (r3) r3.style.display = 'none';
      return true;
    }

    function displayMessage(msg, type) {
      var el = document.getElementById("ahMessage");
      if (!el) return;
      el.textContent = msg;
      el.className = "ah-message " + type;
      el.style.display = "block";
    }

    function reportClientError(msg, context, err) {
      if (window.DRIVENErrorHandler) {
        window.DRIVENErrorHandler.report("asset-history.html: " + msg, context, err ? err.stack : null);
      }
    }

    // High-Frequency Co-Worker Polling & Fast Beacon Unload
    function sendPresenceUnload() {
      if (!activeOrgId) return;
      var payload = JSON.stringify({ page: "Asset History", action: "leave" });
      if (navigator.sendBeacon) {
        var blob = new Blob([payload], { type: "application/json" });
        navigator.sendBeacon("/api/onboarding/presence", blob);
      } else {
        fetch("/api/onboarding/presence", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-org-id": activeOrgId },
          body: payload,
          keepalive: true
        }).catch(function() {});
      }
    }

    async function checkActivePresence() {
      if (!activeOrgId || activeOrgId === "default_org") return;
      try {
        var resp = await fetch("/api/onboarding/presence", {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "x-org-id": activeOrgId
          },
          body: JSON.stringify({ page: "Asset History" })
        });
        if (resp.ok) {
          var data = await resp.json();
          var banner = document.getElementById("presenceBanner");
          var textEl = document.getElementById("presenceText");
          if (data.activeUsers && data.activeUsers.length > 0) {
            var fullNames = data.activeUsers.map(function(u) {
              if (typeof u === "object") {
                return ((u.firstName || u.first_name || "") + " " + (u.lastName || u.last_name || "")).trim() || u.name || u.email;
              }
              return String(u);
            });
            textEl.textContent = "🟢 " + fullNames.join(", ") + " active";
            banner.style.display = "inline-flex";
          } else {
            banner.style.display = "none";
          }
        }
      } catch (e) {
        reportClientError("Presence check failed", "checkActivePresence", e);
      }
    }

    window.addEventListener("pagehide", sendPresenceUnload);
    window.addEventListener("beforeunload", sendPresenceUnload);

    // URL Query Parameter Parsing
    var urlParams = new URLSearchParams(window.location.search);
    currentAssetId = urlParams.get('id') || urlParams.get('asset_id');

    // Strict Multi-Tenant Execution Guardrail & Boot via Platform Session Event
    document.addEventListener("dashSessionLoaded", async function(e) {
      var u = window.dashUser;
      
      // Multi-Tenant Isolation Verification
      activeOrgId = (u && u.org_id && u.org_id !== "default_org") ? u.org_id : null;

      if (!activeOrgId || activeOrgId === "default_org" || activeOrgId === "") {
        var errMsg = "Invalid multi-tenant session context. Execution halted to prevent data leaks.";
        if (window.DRIVENErrorHandler) {
          window.DRIVENErrorHandler.report(
            "asset-history.html: " + errMsg,
            "tenant-security-guardrail",
            new Error().stack
          );
        }
        displayMessage(errMsg, "error");
        document.querySelector(".history-container").style.opacity = "0.3";
        return;
      }

      // Fix Header Layout & Adjust Height Offset
      var ha = 0, hi = setInterval(function() {
        ha++;
        if (fixHeaderLayout() || ha > 50) {
          clearInterval(hi);
          updateHeaderOffset();
        }
      }, 100);

      // Configure sub-navigation links with asset context
      if (currentAssetId) {
        document.getElementById("lnkOverview").href = "/app/asset/asset-detail.html?id=" + encodeURIComponent(currentAssetId);
        document.getElementById("lnkConfig").href = "/app/asset/asset-configuration.html?id=" + encodeURIComponent(currentAssetId);
      }

      // Initialize presence tracking
      checkActivePresence();
      setInterval(checkActivePresence, 5000);

      if (currentAssetId) {
        await loadAssetInfo(currentAssetId);
        await loadAssetHistory(currentAssetId);
      } else {
        displayMessage("No Asset ID specified in navigation request.", "error");
      }

      updateHeaderOffset();
    });

    async function loadAssetInfo(assetId) {
      try {
        var resp = await fetch("/api/equipment/" + encodeURIComponent(assetId), {
          headers: { "x-org-id": activeOrgId }
        });
        if (resp.ok) {
          var data = await resp.json();
          var rec = data.record || data.equipment || data.data || data;
          var num = rec.asset_number || rec.assetNumber || "Asset #" + assetId;
          document.getElementById("txtAssetTitle").textContent = num;
        }
      } catch (e) {
        reportClientError("Failed loading asset header info", "loadAssetInfo", e);
      }
    }

    // Normalized extraction helper across all worker payload standards
    function extractRecords(resData) {
      if (Array.isArray(resData)) return resData;
      if (!resData || typeof resData !== "object") return [];
      if (Array.isArray(resData.records)) return resData.records;
      if (Array.isArray(resData.history)) return resData.history;
      if (Array.isArray(resData.audit_log)) return resData.audit_log;
      if (Array.isArray(resData.logs)) return resData.logs;
      if (Array.isArray(resData.data)) return resData.data;
      if (resData.results && Array.isArray(resData.results)) return resData.results;
      return [];
    }

    async function loadAssetHistory(assetId) {
      if (!assetId) return;
      
      // Endpoints to try sequentially for audit log fetching
      var endpoints = [
        "/api/equipment/history?id=" + encodeURIComponent(assetId),
        "/api/equipment/" + encodeURIComponent(assetId) + "/history",
        "/api/audit-log?record_id=" + encodeURIComponent(assetId) + "&module=equipment"
      ];

      var records = null;
      var lastError = null;

      for (var i = 0; i < endpoints.length; i++) {
        try {
          var resp = await fetch(endpoints[i], {
            headers: { "x-org-id": activeOrgId }
          });

          if (resp.ok) {
            var resData = await resp.json();
            records = extractRecords(resData);
            break; // Successfully loaded and parsed
          }
        } catch (e) {
          lastError = e;
        }
      }

      var tbody = document.getElementById("historyTableBody");

      if (records !== null) {
        document.getElementById("recordCountBadge").textContent = records.length + " Events";

        if (records.length > 0) {
          tbody.innerHTML = records.map(function(item) {
            var localTime = item.created_at ? new Date(item.created_at).toLocaleString() : "N/A";
            var mod = item.module || item.table_name || 'Equipment';
            var usr = item.user_email || item.user_name || item.user_id || 'System';
            var act = item.action || item.event_type || 'Log';
            var dtls = item.details || item.description || item.after_data || '--';

            if (typeof dtls === "object") {
              try { dtls = JSON.stringify(dtls); } catch(err) { dtls = String(dtls); }
            }

            return '<tr>' +
              '<td>' + localTime + '</td>' +
              '<td><strong>' + escapeHtml(mod) + '</strong></td>' +
              '<td>' + escapeHtml(usr) + '</td>' +
              '<td>' + escapeHtml(act) + '</td>' +
              '<td>' + escapeHtml(dtls) + '</td>' +
            '</tr>';
          }).join("");
        } else {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #64748b; padding: 20px;">No historical audit events recorded for this asset.</td></tr>';
        }
      } else {
        reportClientError("Failed loading asset audit log across endpoints", "loadAssetHistory", lastError || new Error("All endpoints failed"));
        displayMessage("Unable to retrieve historical audit log. Please check connection and try again.", "error");
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #ef4444; padding: 20px;">⚠️ Error loading audit logs. Please refresh the page.</td></tr>';
      }
    }

    function doPrintHistory() {
      document.title = "DRIV-EN Audit History | Asset #" + (currentAssetId || "Log");
      window.print();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function confirmLogout() {
      if (confirm("Are you sure you want to log out?")) {
        dashLogout();
      }
    }
  </script>
</body>
</html>
