<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DRIV‑EN | Founder Login</title>
<meta name="description" content="DRIV-EN Founder login portal.">
<meta name="robots" content="noindex, nofollow">

<link rel="icon" type="image/png" href="/assets/icons/favicon.png?v=2026" sizes="48x48">
<link rel="icon" type="image/png" href="/assets/icons/favicon-96.png?v=2026" sizes="96x96">
<link rel="icon" type="image/png" href="/assets/icons/favicon-192.png?v=2026" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/icons/favicon-180.png?v=2026">

<link rel="stylesheet" href="/styles/header.css?v=6">
<link rel="stylesheet" href="/styles/footer.css?v=3">

<style>
    .login-section { max-width: 360px; margin: 40px auto 80px auto; padding: 10px 24px; }
    .login-icon-wrap { text-align: center; margin-bottom: 16px; }
    .login-section h2 { text-align: center; margin-bottom: 8px; font-size: 26px; font-weight: 700; }
    .login-subtitle { text-align: center; margin-bottom: 24px; font-size: 14px; color: #64748b; }
    label { font-size: 14px; font-weight: 600; margin-bottom: 6px; display: block; }
    .required-star { color: #cc0000; margin-left: 3px; }
    input[type="email"], input[type="password"], input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; margin-bottom: 16px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    input[type="password"]::-ms-reveal, input[type="password"]::-webkit-reveal { display: none; }
    .password-wrapper { position: relative; margin-bottom: 16px; }
    .password-wrapper input { margin-bottom: 0; padding-right: 40px; }
    .password-toggle-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 12px; font-weight: 600; color: #2563eb; padding: 4px; line-height: 1; }
    .password-toggle-btn:hover { color: #1d4ed8; }
    input.error { border-color: #cc0000; }
    .action-row { display: flex; align-items: center; justify-content: space-between; margin-top: -6px; margin-bottom: 20px; width: 100%; }
    .action-col-1 { flex: 0 0 auto; display: flex; align-items: center; margin-right: 6px; }
    .action-col-2 { flex: 1; display: flex; align-items: center; white-space: nowrap; font-weight: bold; font-size: 14px; }
    .action-col-3 { flex: 1; text-align: right; white-space: nowrap; }
    .action-col-3 a { color: #111; font-size: 14px; text-decoration: underline; cursor: pointer; }
    .login-button { width: 100%; background: #ffcc00; color: #111; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; }
    .error-banner { background: #ffdddd; color: #cc0000; padding: 10px; border-radius: 6px; margin-bottom: 16px; text-align: center; font-size: 14px; display: none; }
    .inline-logo { height: 3.75em; vertical-align: middle; display: inline-block; }
    .brand-driv { color: #8c8c8c; font-weight: bold; font-style: italic; letter-spacing: -1px; }
    .brand-dash { color: #2da94f; font-weight: bold; font-style: italic; letter-spacing: -1px; }
    .brand-en { color: #dc2626; font-weight: bold; font-style: italic; letter-spacing: -1px; }
    .login-icon-mask { display: inline-block; width: 64px; height: 64px; background-color: #fff; -webkit-mask-image: url('/assets/icons/driven-login-icon.png'); -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; -webkit-mask-size: contain; mask-image: url('/assets/icons/driven-login-icon.png'); mask-repeat: no-repeat; mask-position: center; mask-size: contain; vertical-align: middle; }
    .login-icon-fallback { width: 64px; height: auto; filter: invert(1) brightness(200%); -webkit-filter: invert(1) brightness(200%); vertical-align: middle; display: none; }
    @supports not (mask-image: url('')) { .login-icon-mask { display: none; } .login-icon-fallback { display: inline-block; } }
</style>
</head>
<body>
<div id="header"></div>
<div class="login-section">
    <div class="login-icon-wrap">
        <span class="login-icon-mask"></span>
        <img src="/assets/icons/driven-login-icon.png" class="login-icon-fallback" alt="DRIV‑EN login icon">
    </div>
    <h2>Login to <span class="brand-driv">DRIV</span><span class="brand-dash">‑</span><span class="brand-en">EN</span></h2>
    <div class="login-subtitle">Founder Portal</div>
    <div id="error-banner" class="error-banner">Invalid credentials.</div>
    <form id="login-form">
        <label>Email Address<span class="required-star">*</span></label>
        <input type="email" id="email" required />
        <label>Password<span class="required-star">*</span></label>
        <div class="password-wrapper">
            <input type="password" id="password" required />
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility()" title="Show/Hide password">
                <span id="password-toggle-icon" style="color:#2563eb;font-size:12px;font-weight:600;">SHOW</span>
            </button>
        </div>
        <div class="action-row">
            <div class="action-col-1"><input type="checkbox" id="remember" /></div>
            <div class="action-col-2">Remember me</div>
            <div class="action-col-3"><a id="forgot-link">Forgot Password?</a></div>
        </div>
        <button type="submit" class="login-button">Login</button>
    </form>
</div>
<div id="footer"></div>
<script>
async function loadComponent(id, file) {
    try { const el = document.getElementById(id); const html = await fetch(file).then(r => r.text()); el.innerHTML = html; }
    catch (e) { console.error("Component failed:", id, file, e); }
}
document.addEventListener("DOMContentLoaded", async () => {
    await loadComponent("header", "/components/header.html");
    await loadComponent("footer", "/components/footer.html");
    const yearEl = document.getElementById('footer-year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();
});
</script>
<script src="/components/nav.js?v=2"></script>
<script>
    function togglePasswordVisibility() {
        var passwordInput = document.getElementById("password");
        var toggleLabel = document.getElementById("password-toggle-icon");
        if (passwordInput.type === "password") { passwordInput.type = "text"; toggleLabel.textContent = "HIDE"; }
        else { passwordInput.type = "password"; toggleLabel.textContent = "SHOW"; }
    }
    document.getElementById("forgot-link").addEventListener("click", async () => {
        const email = document.getElementById("email").value.trim();
        if (!email) { alert("Please enter your email address first, then click Forgot Password."); return; }
        try {
            const resp = await fetch("/auth/forgot-password", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: email }) });
            const data = await resp.json();
            if (data.success) { alert("If an account exists for " + email + ", a password reset link has been sent to that email."); }
            else { alert("Could not process request: " + (data.error || "Unknown error")); }
        } catch (e) { alert("Could not process request. Please try again."); }
    });
    document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const remember = document.getElementById("remember");
        const errorBanner = document.getElementById("error-banner");
        const loginBtn = document.querySelector(".login-button");
        email.classList.remove("error"); password.classList.remove("error"); errorBanner.style.display = "none";
        loginBtn.textContent = "Logging in..."; loginBtn.disabled = true;
        try {
            const response = await fetch("/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: email.value.trim(), password: password.value.trim(), remember: remember.checked }) });
            const result = await response.json();
            if (!result.success) { errorBanner.textContent = result.error || "Invalid credentials."; errorBanner.style.display = "block"; email.classList.add("error"); password.classList.add("error"); return; }
            if (result.must_change_password) { window.location.href = "/app/auth/change-password.html"; return; }
            if (result.role === "DRIV-EN Founder") { window.location.href = "/app/dashboard/owner-dashboard.html"; }
            else { errorBanner.textContent = "This portal is for DRIV-EN Founders only. Please use the customer login page."; errorBanner.style.display = "block"; email.classList.add("error"); password.classList.add("error"); }
        } catch (err) { errorBanner.textContent = "Login failed: " + (err.message || "Network error") + ". Please try again."; errorBanner.style.display = "block"; }
        finally { loginBtn.textContent = "Login"; loginBtn.disabled = false; }
    });
</script>
</body>
</html>
