<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRIV‑EN | Access Denied</title>
<meta name="robots" content="noindex, nofollow">
<style>
  body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 0;
    background: #f8fafc;
    color: #1e293b;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .no-access-card {
    max-width: 460px;
    text-align: center;
    padding: 40px;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .no-access-icon {
    font-size: 48px;
    margin-bottom: 16px;
  }
  .no-access-card h1 {
    font-size: 24px;
    margin: 0 0 12px 0;
    color: #dc2626;
  }
  .no-access-card p {
    font-size: 15px;
    color: #64748b;
    line-height: 1.6;
    margin: 0 0 24px 0;
  }
  .no-access-btn {
    display: inline-block;
    background: #2563eb;
    color: #fff;
    padding: 12px 28px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    margin: 0 6px;
  }
  .no-access-btn:hover { background: #1d4ed8; }
  .no-access-btn-secondary {
    background: #64748b;
  }
  .no-access-btn-secondary:hover { background: #475569; }
</style>
</head>
<body>
  <div class="no-access-card">
    <div class="no-access-icon">🔒</div>
    <h1>Access Denied</h1>
    <p>You do not have permission to view this page. This onboarding step has not been assigned to you. If you believe you should have access, please contact your administrator.</p>
    <a href="/app/dashboard/onboarding-dashboard.html" class="no-access-btn">Onboarding Dashboard</a>
    <a href="/app/auth/login.html" class="no-access-btn no-access-btn-secondary">Return to Login</a>
  </div>
</body>
</html>
