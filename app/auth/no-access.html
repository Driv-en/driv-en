<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRIV‑EN | Access Denied</title>
<meta name="robots" content="noindex, nofollow">
<style>
  body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 0;
    color: #1e293b;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .no-access-card {
    max-width: 460px;
    text-align: center;
    padding: 40px;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .no-access-icon {
    font-size: 48px;
    margin-bottom: 16px;
  }
  .no-access-card h1 {
    font-size: 24px;
    margin: 0 0 12px 0;
    color: #dc2626;
  }
  .no-access-card p {
    font-size: 15px;
    color: #64748b;
    line-height: 1.6;
    margin: 0 0 24px 0;
  }
  .no-access-btn {
    display: inline-block;
    background: #2563eb;
    color: #fff;
    padding: 12px 28px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    margin: 0 6px;
  }
  .no-access-btn:hover { background: #1d4ed8; }
  .no-access-btn-secondary {
    background: #64748b;
  }
  .no-access-btn-secondary:hover { background: #475569; }
</style>
<link rel="stylesheet" href="/styles/diamond-plate.css?v=2">
</head>
<body>

<!-- ===== INDUSTRIAL DIAMOND-PLATE BACKGROUND ===== -->
<div class="steel-bg"></div>
<div class="steel-overlay"></div>

<div class="no-access-card">
  <div class="no-access-icon" aria-hidden="true">🔒</div>
  <h1>Access Denied</h1>
  <p id="access-message">You do not have permission to view this page. If you believe you should have access, please contact your administrator.</p>
  <div id="access-buttons">
    <a href="/public/login.html" class="no-access-btn no-access-btn-secondary">Return to Login</a>
  </div>
</div>

<script>
(async function() {
  var msg = document.getElementById('access-message');
  var btnsContainer = document.getElementById('access-buttons');

  function renderButtons(btnConfigs) {
    if (!btnsContainer) return;
    btnsContainer.textContent = ''; // Safe clear without innerHTML
    btnConfigs.forEach(function(cfg) {
      var a = document.createElement('a');
      a.href = cfg.href;
      a.className = cfg.secondary ? 'no-access-btn no-access-btn-secondary' : 'no-access-btn';
      a.textContent = cfg.text;
      btnsContainer.appendChild(a);
    });
  }

  try {
    var resp = await fetch('/auth/session');
    
    // Check network response status and content-type before parsing
    var contentType = resp.headers.get('content-type') || '';
    if (!resp.ok || !contentType.includes('application/json')) {
      msg.textContent = 'Session verification unavailable. Please log in again.';
      renderButtons([{ href: '/public/login.html', text: 'Return to Login' }]);
      return;
    }

    var data = await resp.json();

    if (!data || !data.authenticated || !data.user) {
      msg.textContent = 'You must be logged in to view this page. Please log in and try again.';
      renderButtons([{ href: '/public/login.html', text: 'Login to DRIV-EN' }]);
      return;
    }

    // Normalized role and ID inspection
    var user = data.user || {};
    var role = String(user.role || '').toLowerCase().trim();
    var roleId = String(user.role_id || '').trim();
    var email = String(user.email || '').toLowerCase().trim();

    var isFounder = role === 'driv-en founder' || 
                    role === 'founder' || 
                    roleId === 'RO-Founder' || 
                    email === 'jblood@digitalsafetyinspection.com';

    var isAdmin = role === 'admin' || 
                  role === 'administrator' || 
                  roleId === 'RO-admin';

    if (isFounder) {
      msg.textContent = 'You are logged in as a DRIV-EN Founder. Redirecting you to the Owner Dashboard…';
      renderButtons([{ href: '/app/dashboard/owner-dashboard.html', text: 'Go to Owner Dashboard' }]);
      setTimeout(function() { 
        window.location.href = '/app/dashboard/owner-dashboard.html'; 
      }, 1500);
    } else if (isAdmin) {
      msg.textContent = 'You are logged in as an Administrator. This page is restricted to DRIV-EN Founders.';
      renderButtons([
        { href: '/app/dashboard/admin.html', text: 'Go to Admin Dashboard' },
        { href: '/public/login.html', text: 'Return to Login', secondary: true }
      ]);
    } else {
      msg.textContent = 'You do not have permission to view this page. This area is restricted to DRIV-EN Founders. If you believe you should have access, please contact your administrator.';
      renderButtons([
        { href: '/app/dashboard/employee-dashboard.html', text: 'Go to Dashboard' },
        { href: '/public/login.html', text: 'Return to Login', secondary: true }
      ]);
    }

  } catch (e) {
    console.error('Session check failed:', e);
    msg.textContent = 'An error occurred while verifying your permissions. Please log in again.';
    renderButtons([{ href: '/public/login.html', text: 'Return to Login' }]);
  }
})();
</script>
</body>
</html>
