<!-- ===== RESET PASSWORD SCRIPT ===== -->
<script>
    // Read token from URL query parameter
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const resetForm = document.getElementById('reset-form');
    const invalidToken = document.getElementById('invalid-token');
    const successMessage = document.getElementById('success-message');
    const errorBanner = document.getElementById('error-banner');
    const successBanner = document.getElementById('success-banner');
    const submitBtn = document.getElementById('submitBtn');

    // Show/hide password toggles (matches login page style)
    function setupToggle(toggleId, inputId) {
        const toggle = document.getElementById(toggleId);
        const input = document.getElementById(inputId);
        toggle.addEventListener("click", function() {
            if (input.type === "password") {
                input.type = "text";
                toggle.textContent = "Hide";
                toggle.title = "Hide password";
            } else {
                input.type = "password";
                toggle.textContent = "Show";
                toggle.title = "Show password";
            }
        });
    }

    setupToggle("toggleNew", "newPassword");
    setupToggle("toggleConfirm", "confirmPassword");

    // Check if token exists in URL
    if (!token) {
        invalidToken.style.display = 'block';
    } else {
        resetForm.style.display = 'block';
    }

    // Handle form submission
    document.getElementById('reset-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        errorBanner.style.display = 'none';
        successBanner.style.display = 'none';

        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (newPassword.length < 8) {
            errorBanner.textContent = 'Password must be at least 8 characters.';
            errorBanner.style.display = 'block';
            return;
        }

        if (newPassword !== confirmPassword) {
            errorBanner.textContent = 'Passwords do not match.';
            errorBanner.style.display = 'block';
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Resetting\u2026';

        try {
            const response = await fetch('/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token, new_password: newPassword })
            });

            const result = await response.json();

            if (result.success) {
                resetForm.style.display = 'none';
                successMessage.style.display = 'block';
            } else {
                errorBanner.textContent = result.error || 'Failed to reset password.';
                errorBanner.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            }
        } catch (err) {
            errorBanner.textContent = 'An error occurred. Please try again.';
            errorBanner.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Reset Password';
        }
    });
</script>
