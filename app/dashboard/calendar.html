<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRIV-EN | Calendar</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://www.driv-en.com/app/dashboard/calendar.html">

<!-- Favicon -->
<link rel="icon" type="image/png" href="/assets/icons/favicon.png?v=2026" sizes="48x48">
<link rel="icon" type="image/png" href="/assets/icons/favicon-96.png?v=2026" sizes="96x96">
<link rel="icon" type="image/png" href="/assets/icons/favicon-192.png?v=2026" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/icons/favicon-180.png?v=2026">
<link rel="manifest" href="/manifest.json?v=2026">
<meta name="theme-color" content="#16a34a">

<!-- Theme init (CSP-safe, no inline script) -->
<script src="/app/shared/theme-init.js"></script>

<!-- Shared dashboard CSS -->
<link rel="stylesheet" href="/app/shared/dashboard.css?v=15">
<link rel="stylesheet" href="/styles/diamond-plate.css?v=2">

<style>
/* ===== HEADER — sticky, full-width, single row (matches admin/onboarding) ===== */
#dashHeader {
  width: 100% !important;
  box-sizing: border-box;
  position: -webkit-sticky !important;
  position: sticky !important;
  top: 0 !important;
  z-index: 100000 !important;
  background: #ffffff !important;
  border-bottom: 1px solid var(--border, #cbd5e1);
}
:root[data-theme="dark"] #dashHeader {
  background: #1e293b !important;
  border-bottom-color: var(--border, #475569);
}

/* ===== FORCE SINGLE-ROW HEADER ===== */
/* Hide ALL children of .dash-header except the first (row1).
   This catches stale 3-row templates regardless of class names. */
.dash-header > :not(:first-child) { display: none !important; }
/* Also hide known stale class names explicitly */
.dash-header-row2, .dash-header-row3, .dash-utility-bar { display: none !important; }
/* Hide theme toggle in header (it lives in the welcome card) */
#dashHeader .dash-theme-wrapper { display: none !important; }
/* Hide logout button in header (it lives in the tab bar) */
#dashHeader .dash-logout { display: none !important; }

/* Single-row grid layout */
.dash-header-row1 {
  display: grid !important;
  grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) minmax(0, 1fr) !important;
  padding: 8px 20px !important;
  align-items: center;
}
.dash-header-row1 > #dashCustomerLogoArea { grid-column: 1; min-width: 0; }
.dash-header-row1 > .dash-driven-logo { grid-column: 3; justify-self: end; max-width: 100%; }
.dash-header-row1 > .dash-header-logo-right { grid-column: 3; justify-self: end; }
@media (max-width: 600px) {
  .dash-header-row1 { grid-template-columns: auto 1fr auto !important; padding: 6px 12px !important; }
}

/* ===== TAB BAR ===== */
.cal-tab-bar {
  display: flex;
  gap: 2px;
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px;
  overflow-x: auto;
  position: relative;
  z-index: 1;
  background: #cbd5e1;
  border-bottom: 2px solid #94a3b8;
}
.cal-tab-dashboard {
  background: #1d4ed8;
  border: 1px solid #2563eb;
  border-bottom: none;
  border-radius: 8px 8px 0 0;
  padding: 10px 22px;
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
  white-space: nowrap;
  margin-top: 4px;
  margin-left: 0;
  position: relative;
  z-index: 1;
  transition: background 200ms ease, margin-top 200ms ease;
  text-decoration: none;
  display: inline-block;
}
.cal-tab-dashboard:hover { background: #2563eb; margin-top: 2px; }
.cal-tab-link {
  background: #16a34a;
  border: 1px solid #15803d;
  border-bottom: none;
  border-radius: 8px 8px 0 0;
  padding: 10px 22px;
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
  white-space: nowrap;
  margin-top: 4px;
  margin-left: 0;
  position: relative;
  z-index: 1;
  transition: background 200ms ease, margin-top 200ms ease;
  text-decoration: none;
  display: inline-block;
}
.cal-tab-link:hover { background: #15803d; margin-top: 2px; }
.cal-tab-logout {
  background: #b91c1c;
  border: 1px solid #dc2626;
  border-bottom: none;
  border-radius: 8px 8px 0 0;
  padding: 10px 22px;
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
  white-space: nowrap;
  margin-top: 4px;
  margin-left: auto;
  position: relative;
  z-index: 1;
  transition: background 200ms ease, margin-top 200ms ease;
}
.cal-tab-logout:hover { background: #dc2626; margin-top: 2px; }

/* ===== MAIN LAYOUT ===== */
.cal-main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px;
  position: relative;
  z-index: 1;
}

/* ===== WELCOME CARD ===== */
.cal-welcome-card {
  background: var(--bg-card, #ffffff);
  border: 2px solid var(--success, #16a34a);
  border-radius: 8px;
  padding: 24px;
  margin-bottom: 20px;
  position: relative;
  z-index: 1;
}
.cal-welcome-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
}
.cal-welcome-greeting h2 { margin: 0; font-size: 20px; color: var(--text, #0f172a); }
.cal-welcome-details {
  margin-top: 16px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 24px;
  align-items: center;
}
.welcome-detail-rows { display: flex; flex-direction: column; gap: 8px; }
.cal-welcome-row { font-size: 14px; color: var(--text, #0f172a); display: flex; align-items: center; gap: 6px; }
.cal-welcome-label { font-weight: 600; color: var(--text-muted, #64748b); }
.welcome-change-password {
  background: var(--success, #16a34a); border: 1px solid #15803d; color: #fff;
  text-decoration: none; display: inline-block; text-align: center; cursor: pointer;
  font-weight: 600; padding: 8px 16px; border-radius: 6px; white-space: nowrap;
}
.welcome-change-password:hover { background: #15803d; }
@media (max-width: 600px) {
  .cal-welcome-details { grid-template-columns: 1fr; }
  .cal-welcome-header { flex-direction: column; }
}

/* ===== CALENDAR CARD ===== */
.cal-card {
  background: var(--bg-card, #ffffff);
  border: 2px solid var(--success, #16a34a);
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 20px;
  position: relative;
  z-index: 1;
}

/* ===== CALENDAR TOOLBAR ===== */
.cal-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 16px;
}
.cal-nav-group { display: flex; align-items: center; gap: 8px; }
.cal-btn {
  background: var(--bg-card, #e2e8f0); border: 1px solid var(--border, #94a3b8);
  border-radius: 6px; padding: 6px 14px; font-size: 14px; font-weight: 500;
  color: var(--text, #0f172a); cursor: pointer; transition: background 150ms ease;
}
.cal-btn:hover { background: #cbd5e1; }
.cal-btn.active { background: var(--success, #16a34a); color: #fff; border-color: #15803d; }
.cal-btn:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
.cal-period-label { font-size: 18px; font-weight: 700; color: var(--text, #0f172a); min-width: 200px; text-align: center; }

/* ===== FILTER BAR ===== */
.cal-filter-bar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
}
.cal-filter-bar select, .cal-filter-bar input {
  padding: 5px 10px; border: 1px solid var(--border, #94a3b8); border-radius: 6px;
  font-size: 13px; background: var(--bg-card, #fff); color: var(--text, #0f172a);
}
.cal-filter-bar select:focus, .cal-filter-bar input:focus { outline: none; border-color: var(--primary, #3b82f6); }
.cal-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-left: auto; }
.cal-legend-item { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-muted, #64748b); }
.cal-legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

/* ===== MONTH VIEW ===== */
.cal-month-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  border: 1px solid var(--border, #94a3b8);
  border-radius: 6px;
  overflow: hidden;
}
.cal-day-header {
  background: var(--bg-card, #e2e8f0);
  padding: 8px 6px;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted, #64748b);
  text-transform: uppercase;
  border-bottom: 1px solid var(--border, #94a3b8);
}
.cal-day-cell {
  min-height: 90px;
  border-right: 1px solid var(--border, #e2e8f0);
  border-bottom: 1px solid var(--border, #e2e8f0);
  padding: 4px;
  position: relative;
  background: var(--bg-card, #fff);
}
.cal-day-cell.other-month { background: rgba(148, 163, 184, 0.08); }
.cal-day-cell.today { background: rgba(22, 163, 74, 0.06); }
.cal-day-num {
  font-size: 13px; font-weight: 600; color: var(--text, #0f172a);
  margin-bottom: 2px; padding: 0 2px;
}
.cal-day-cell.today .cal-day-num { color: var(--success, #16a34a); font-weight: 800; }
.cal-day-cell.other-month .cal-day-num { color: var(--text-muted, #94a3b8); }
.cal-items { display: flex; flex-direction: column; gap: 2px; }
.cal-item {
  font-size: 11px; padding: 2px 6px; border-radius: 4px; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: opacity 150ms ease;
}
.cal-item:hover { opacity: 0.85; }
.cal-item.wo { background: rgba(59, 130, 246, 0.15); color: #2563eb; border-left: 3px solid #3b82f6; }
.cal-item.pm { background: rgba(22, 163, 74, 0.15); color: #16a34a; border-left: 3px solid #16a34a; }
.cal-item.insp { background: rgba(249, 115, 22, 0.15); color: #ea580c; border-left: 3px solid #f97316; }
.cal-item.overdue { background: rgba(239, 68, 68, 0.15); color: #dc2626; border-left: 3px solid #ef4444; }
.cal-overflow { font-size: 10px; color: var(--text-muted, #64748b); padding: 1px 6px; cursor: pointer; }
.cal-overflow:hover { text-decoration: underline; }

/* ===== WEEK VIEW ===== */
.cal-week-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  border: 1px solid var(--border, #94a3b8);
  border-radius: 6px;
  overflow: hidden;
}
.cal-week-day {
  min-height: 300px;
  border-right: 1px solid var(--border, #e2e8f0);
  padding: 6px;
  background: var(--bg-card, #fff);
}
.cal-week-day.today { background: rgba(22, 163, 74, 0.04); }
.cal-week-day-header { font-size: 13px; font-weight: 700; color: var(--text, #0f172a); margin-bottom: 8px; text-align: center; padding-bottom: 6px; border-bottom: 1px solid var(--border, #e2e8f0); }
.cal-week-day-header .cal-week-date { font-size: 20px; display: block; }
.cal-week-day.today .cal-week-date { color: var(--success, #16a34a); }
.cal-week-items { display: flex; flex-direction: column; gap: 4px; }
.cal-week-item {
  font-size: 12px; padding: 4px 8px; border-radius: 4px; cursor: pointer;
  transition: opacity 150ms ease;
}
.cal-week-item:hover { opacity: 0.85; }
.cal-week-item.wo { background: rgba(59, 130, 246, 0.15); color: #2563eb; border-left: 3px solid #3b82f6; }
.cal-week-item.pm { background: rgba(22, 163, 74, 0.15); color: #16a34a; border-left: 3px solid #16a34a; }
.cal-week-item.insp { background: rgba(249, 115, 22, 0.15); color: #ea580c; border-left: 3px solid #f97316; }
.cal-week-item.overdue { background: rgba(239, 68, 68, 0.15); color: #dc2626; border-left: 3px solid #ef4444; }
.cal-week-item-title { font-weight: 600; display: block; }
.cal-week-item-meta { font-size: 11px; color: var(--text-muted, #64748b); display: block; }

/* ===== DAY VIEW ===== */
.cal-day-view { border: 1px solid var(--border, #94a3b8); border-radius: 6px; overflow: hidden; }
.cal-day-view-header { background: var(--bg-card, #e2e8f0); padding: 12px 16px; font-size: 16px; font-weight: 700; color: var(--text, #0f172a); border-bottom: 1px solid var(--border, #94a3b8); }
.cal-day-view-body { padding: 12px; }
.cal-day-item {
  display: flex; align-items: flex-start; gap: 12px; padding: 10px 12px;
  border-radius: 6px; margin-bottom: 6px; cursor: pointer; transition: opacity 150ms ease;
}
.cal-day-item:hover { opacity: 0.85; }
.cal-day-item.wo { background: rgba(59, 130, 246, 0.10); border-left: 4px solid #3b82f6; }
.cal-day-item.pm { background: rgba(22, 163, 74, 0.10); border-left: 4px solid #16a34a; }
.cal-day-item.insp { background: rgba(249, 115, 22, 0.10); border-left: 4px solid #f97316; }
.cal-day-item.overdue { background: rgba(239, 68, 68, 0.10); border-left: 4px solid #ef4444; }
.cal-day-item-time { font-size: 12px; color: var(--text-muted, #64748b); min-width: 60px; font-weight: 600; }
.cal-day-item-body { flex: 1; }
.cal-day-item-title { font-size: 14px; font-weight: 600; color: var(--text, #0f172a); }
.cal-day-item-meta { font-size: 12px; color: var(--text-muted, #64748b); margin-top: 2px; }

/* ===== EMPTY STATE ===== */
.cal-empty { text-align: center; padding: 40px 20px; color: var(--text-muted, #64748b); font-size: 14px; }

/* ===== LOADING ===== */
.cal-loading { text-align: center; padding: 40px; color: var(--text-muted, #64748b); font-size: 14px; }

/* ===== RESPONSIVE ===== */
@media (max-width: 700px) {
  .cal-month-grid { font-size: 11px; }
  .cal-day-cell { min-height: 60px; }
  .cal-day-header { font-size: 10px; padding: 4px 2px; }
  .cal-item { font-size: 10px; padding: 1px 4px; }
  .cal-period-label { font-size: 14px; min-width: auto; }
  .cal-toolbar { justify-content: center; }
}
</style>
</head>

<body data-page-title="Calendar">

<!-- ===== DIAMOND-PLATE BACKGROUND ===== -->
<div class="steel-bg"></div>
<div class="steel-overlay"></div>

<!-- Shared header -->
<div id="dashHeader"></div>

<!-- ===== TAB BAR ===== -->
<div class="cal-tab-bar">
  <a class="cal-tab-dashboard" id="calHomeLink" href="/app/dashboard/employee-dashboard.html">Dashboard</a>
  <a class="cal-tab-link" href="/app/dashboard/work-orders.html">Work Orders</a>
  <button class="cal-tab-logout" onclick="dashLogout()">Logout</button>
</div>

<!-- Main content -->
<div class="cal-main">

  <!-- ===== WELCOME CARD ===== -->
  <div class="cal-welcome-card">
    <div class="cal-welcome-header">
      <div class="cal-welcome-greeting">
        <h2 id="calWelcomeName">Welcome back</h2>
      </div>
      <div class="dash-theme-wrapper" title="Toggle light/dark mode">
        <span class="dash-theme-label" id="dashThemeLabelLight">Light</span>
        <label class="dash-theme-switch">
          <input type="checkbox" id="dashThemeCheckbox" aria-label="Toggle light or dark theme">
          <span class="dash-theme-slider"></span>
        </label>
        <span class="dash-theme-label" id="dashThemeLabelDark">Dark</span>
      </div>
    </div>
    <div class="cal-welcome-details">
      <div class="welcome-detail-rows">
        <div class="cal-welcome-row">
          <span class="cal-welcome-label">Role:</span>
          <span id="calWelcomeRole">-</span>
        </div>
        <div class="cal-welcome-row">
          <span class="cal-welcome-label">Email:</span>
          <span id="calWelcomeEmail">-</span>
        </div>
      </div>
      <a href="/app/auth/change-password.html" class="welcome-change-password">Change Password</a>
    </div>
  </div>

  <!-- ===== CALENDAR CARD ===== -->
  <div class="cal-card">
    <!-- Toolbar -->
    <div class="cal-toolbar">
      <div class="cal-nav-group">
        <button class="cal-btn" id="calPrev" aria-label="Previous period">&laquo;</button>
        <button class="cal-btn" id="calToday">Today</button>
        <button class="cal-btn" id="calNext" aria-label="Next period">&raquo;</button>
      </div>
      <div class="cal-period-label" id="calPeriodLabel">--</div>
      <div class="cal-nav-group">
        <button class="cal-btn active" id="calViewMonth" aria-label="Month view">Month</button>
        <button class="cal-btn" id="calViewWeek" aria-label="Week view">Week</button>
        <button class="cal-btn" id="calViewDay" aria-label="Day view">Day</button>
      </div>
    </div>

    <!-- Filter bar -->
    <div class="cal-filter-bar">
      <select id="calFilterType" aria-label="Filter by type">
        <option value="all">All Types</option>
        <option value="wo">Work Orders</option>
        <option value="pm">PM / Recurring</option>
        <option value="insp">Inspections</option>
      </select>
      <select id="calFilterStatus" aria-label="Filter by status">
        <option value="all">All Statuses</option>
        <option value="open">Open</option>
        <option value="in_progress">In Progress</option>
        <option value="completed">Completed</option>
        <option value="overdue">Overdue</option>
      </select>
      <div class="cal-legend">
        <div class="cal-legend-item"><span class="cal-legend-dot" style="background:#3b82f6"></span> Work Order</div>
        <div class="cal-legend-item"><span class="cal-legend-dot" style="background:#16a34a"></span> PM</div>
        <div class="cal-legend-item"><span class="cal-legend-dot" style="background:#f97316"></span> Inspection</div>
        <div class="cal-legend-item"><span class="cal-legend-dot" style="background:#ef4444"></span> Overdue</div>
      </div>
    </div>

    <!-- Calendar grid container -->
    <div id="calGridContainer">
      <div class="cal-loading">Loading calendar...</div>
    </div>
  </div>

</div>

<!-- Shared footer -->
<div id="dashFooter"></div>

<!-- Shared scripts (order matters: auth-check -> dashboard-common -> page JS) -->
<script src="/app/shared/auth-check.js?v=21"></script>
<script src="/app/shared/dashboard-common.js?v=20"></script>
<script src="/app/dashboard/calendar.js?v=4"></script>
</body>
</html>
