<!-- ===== THEME TOGGLE (applies before render to prevent flash) ===== -->
<script>
(function() {
  var saved = localStorage.getItem("driven-theme");
  var system = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  var theme = saved || system;
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>

<style>
.alerts-loading{display:flex;align-items:center;justify-content:center;height:60vh;font-size:16px;color:var(--text-muted);}
.flag-card{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;transition:border-color .2s;}
.flag-card.critical{border-left:4px solid #cc0000;}
.flag-card.warning{border-left:4px solid #ff9900;}
.flag-card.info{border-left:4px solid #0066cc;}
.flag-card.resolved{opacity:.55;}
.flag-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px;}
.flag-type{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 8px;border-radius:4px;}
.flag-type.capacity_exceeded{background:#cc0000;color:#fff;}
.flag-type.consumption_anomaly{background:#ff9900;color:#fff;}
.flag-type.employee_tank_fill{background:#0066cc;color:#fff;}
.flag-message{font-size:14px;color:var(--text);margin:4px 0 8px 0;line-height:1.5;}
.flag-meta{font-size:12px;color:var(--text-muted);display:flex;flex-wrap:wrap;gap:12px;}
.flag-actions{margin-top:10px;display:flex;gap:8px;align-items:center;}
.flag-resolve-btn{background:var(--primary);color:#fff;border:none;border-radius:4px;padding:6px 14px;font-size:13px;cursor:pointer;}
.flag-resolve-btn:hover{opacity:.85;}
.flag-resolve-input{flex:1;background:var(--bg-input);border:1px solid var(--border);border-radius:4px;padding:6px 10px;font-size:13px;color:var(--text);}
.flag-resolved-badge{font-size:12px;color:var(--text-muted);font-style:italic;}
.settings-toggle{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:20px;}
.settings-toggle h3{margin:0 0 12px 0;font-size:15px;color:var(--text);}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);}
.toggle-row:last-child{border-bottom:none;}
.toggle-row label{font-size:13px;color:var(--text);}
.toggle-switch{position:relative;width:40px;height:22px;}
.toggle-switch input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:22px;transition:.3s;}
.toggle-slider:before{content:"";position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;}
.toggle-switch input:checked+.toggle-slider{background:var(--primary);}
.toggle-switch input:checked+.toggle-slider:before{transform:translateX(18px);}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.filter-btn{background:var(--bg-card);border:1px solid var(--border);border-radius:4px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--text);}
.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.empty-state{text-align:center;padding:40px;color:var(--text-muted);font-size:14px;}
</style>
</head>
<body data-page-title="Fuel Alerts" data-required-permission="fuel.view">

<div id="adminDashboard" style="display:none;">
  <div id="dashHeader"></div>

  <div style="max-width:900px;margin:0 auto;padding:20px;">

    <!-- Email notification settings -->
    <div class="settings-toggle">
      <h3>📧 Email Notification Settings</h3>
      <div class="toggle-row">
        <label>Capacity exceeded alerts</label>
        <label class="toggle-switch"><input type="checkbox" id="toggleCapacity" onchange="saveSettings()"><span class="toggle-slider"></span></label>
      </div>
      <div class="toggle-row">
        <label>Consumption anomaly alerts</label>
        <label class="toggle-switch"><input type="checkbox" id="toggleConsumption" onchange="saveSettings()"><span class="toggle-slider"></span></label>
      </div>
      <div class="toggle-row">
        <label>Employee tank fill alerts</label>
        <label class="toggle-switch"><input type="checkbox" id="toggleEmployee" onchange="saveSettings()"><span class="toggle-slider"></span></label>
      </div>
      <div class="toggle-row">
        <label>Equipment manager notifications</label>
        <label class="toggle-switch"><input type="checkbox" id="toggleManager" onchange="saveSettings()"><span class="toggle-slider"></span></label>
      </div>
    </div>

    <!-- Filter bar -->
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterFlags('open',this)">Open</button>
      <button class="filter-btn" onclick="filterFlags('resolved',this)">Resolved</button>
      <button class="filter-btn" onclick="filterFlags('all',this)">All</button>
      <button class="filter-btn" onclick="filterFlags('capacity_exceeded',this)">Capacity</button>
      <button class="filter-btn" onclick="filterFlags('consumption_anomaly',this)">Consumption</button>
      <button class="filter-btn" onclick="filterFlags('employee_tank_fill',this)">Employee Tank</button>
    </div>

    <!-- Flags list -->
    <div id="flagsList" class="alerts-loading">Loading fuel alerts…</div>

  </div>
  <div id="dashFooter"></div>
</div>

<script>
let currentFilter = 'open';
let allFlags = [];

async function loadFlags() {
  try {
    const resp = await fetch('/api/fuel-flags');
    const data = await resp.json();
    if (data.success) {
      allFlags = data.flags || [];
      renderFlags();
    } else {
      document.getElementById('flagsList').innerHTML = '<div class="empty-state">Failed to load flags.</div>';
    }
  } catch (e) {
    document.getElementById('flagsList').innerHTML = '<div class="empty-state">Error: ' + e.message + '</div>';
  }
}

function renderFlags() {
  let filtered = allFlags;
  if (currentFilter === 'open') filtered = allFlags.filter(f => f.status === 'open');
  else if (currentFilter === 'resolved') filtered = allFlags.filter(f => f.status === 'resolved');
  else if (currentFilter !== 'all') filtered = allFlags.filter(f => f.flag_type === currentFilter);

  if (filtered.length === 0) {
    document.getElementById('flagsList').innerHTML = '<div class="empty-state">No fuel alerts found.</div>';
    return;
  }

  document.getElementById('flagsList').innerHTML = filtered.map(f => {
    const sevClass = f.severity || 'warning';
    const resolved = f.status === 'resolved';
    const date = new Date(f.created_at).toLocaleString();
    let html = '<div class="flag-card ' + sevClass + (resolved ? ' resolved' : '') + '">';
    html += '<div class="flag-header">';
    html += '<span class="flag-type ' + f.flag_type + '">' + f.flag_type.replace(/_/g,' ') + '</span>';
    html += resolved ? '<span class="flag-resolved-badge">Resolved by ' + (f.resolved_by||'—') + '</span>' : '';
    html += '</div>';
    html += '<div class="flag-message">' + (f.message||'') + '</div>';
    html += '<div class="flag-meta">';
    if (f.asset_name) html += '<span>Asset: ' + f.asset_name + '</span>';
    if (f.tank_name) html += '<span>Tank: ' + f.tank_name + '</span>';
    html += '<span>' + date + '</span>';
    html += '</div>';
    if (!resolved) {
      html += '<div class="flag-actions">';
      html += '<input type="text" class="flag-resolve-input" id="notes-' + f.id + '" placeholder="Resolution notes…">';
      html += '<button class="flag-resolve-btn" onclick="resolveFlag(\'' + f.id + '\')">Resolve</button>';
      html += '</div>';
    }
    if (resolved && f.resolution_notes) {
      html += '<div style="margin-top:6px;font-size:12px;color:var(--text-muted);">Notes: ' + f.resolution_notes + '</div>';
    }
    html += '</div>';
    return html;
  }).join('');
}

async function resolveFlag(id) {
  const notes = document.getElementById('notes-' + id).value || '';
  try {
    const resp = await fetch('/api/fuel-flags/' + id + '/resolve', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ resolution_notes: notes })
    });
    const data = await resp.json();
    if (data.success) {
      loadFlags();
    } else {
      alert('Failed to resolve: ' + (data.error||'Unknown error'));
    }
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

function filterFlags(type, btn) {
  currentFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderFlags();
}

async function loadSettings() {
  try {
    const resp = await fetch('/api/org-settings');
    const data = await resp.json();
    if (data.success && data.settings) {
      document.getElementById('toggleCapacity').checked = !!data.settings.notify_capacity_flags_email;
      document.getElementById('toggleConsumption').checked = !!data.settings.notify_consumption_flags_email;
      document.getElementById('toggleEmployee').checked = !!data.settings.notify_employee_tank_flags_email;
      document.getElementById('toggleManager').checked = !!data.settings.notify_equipment_manager_email;
    }
  } catch (e) { console.error('Settings load error:', e); }
}

async function saveSettings() {
  try {
    await fetch('/api/org-settings', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        notify_capacity_flags_email: document.getElementById('toggleCapacity').checked,
        notify_equipment_manager_email: document.getElementById('toggleManager').checked,
        notify_consumption_flags_email: document.getElementById('toggleConsumption').checked,
        notify_employee_tank_flags_email: document.getElementById('toggleEmployee').checked
      })
    });
  } catch (e) { console.error('Settings save error:', e); }
}

// Init after auth
document.addEventListener('dashSessionLoaded', function() {
  document.getElementById('adminDashboard').style.display = 'block';
  loadSettings();
  loadFlags();
});
</script>
