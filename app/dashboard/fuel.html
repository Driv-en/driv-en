<html lang="en">
<head>

<script>
(function() {
  var saved = localStorage.getItem("driven-theme");
  var system = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  var theme = saved || system;
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>

<style>
.fuel-loading{display:flex;align-items:center;justify-content:center;height:60vh;font-size:16px;color:var(--text-muted);}
.dash-header-row2 { display: none !important; }
.dash-header-row3 { display: none !important; }
#dashHeader .dash-theme-wrapper { display: none !important; }
.dash-header-row1 { padding: 8px 20px !important; align-items: center; }
.fuel-header-title { flex: 1; text-align: center; font-size: 20px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fuel-tab-bar { display: flex; gap: 2px; max-width: 1100px; margin: 0 auto; padding: 0 20px; overflow-x: auto; position: relative; z-index: 1; background: #cbd5e1; border-bottom: 2px solid #94a3b8; }
.fuel-tab { background: #94a3b8; border: 1px solid #64748b; border-bottom: none; border-radius: 8px 8px 0 0; padding: 10px 22px; font-size: 15px; font-weight: 500; color: #1e293b; cursor: pointer; white-space: nowrap; transition: color 200ms ease, background 200ms ease, border-color 200ms ease, margin-top 200ms ease; margin-top: 4px; position: relative; z-index: 1; }
.fuel-tab:hover { color: #0f172a; background: #a5b4c4; margin-top: 2px; }
.fuel-tab.active { color: #1d4ed8; background: #e2e8f0; border-color: #64748b; margin-top: 0; font-weight: 600; z-index: 2; }
.fuel-tab-content { display: none; }
.fuel-tab-content.active { display: block; }
.fuel-subtab-bar { display: none; gap: 2px; max-width: 1100px; margin: 0 auto; padding: 0 20px; overflow-x: auto; position: relative; z-index: 1; background: #475569; border-bottom: 2px solid #334155; }
.fuel-subtab-bar.visible { display: flex; }
.fuel-subtab { background: #22c55e; border: 1px solid #16a34a; border-bottom: none; border-radius: 8px 8px 0 0; padding: 8px 18px; font-size: 14px; font-weight: 500; color: #ffffff; cursor: pointer; white-space: nowrap; transition: color 200ms ease, background 200ms ease, border-color 200ms ease, margin-top 200ms ease; margin-top: 4px; position: relative; z-index: 1; }
.fuel-subtab:hover { background: #16a34a; color: #ffffff; margin-top: 2px; }
.fuel-subtab.active { color: #ffffff; background: #15803d; border-color: #22c55e; margin-top: 0; font-weight: 600; z-index: 2; }
.fuel-subtab-content { display: none; }
.fuel-subtab-content.active { display: block; margin-top: 20px; }
.fuel-tab-logout { background: #b91c1c; border: 1px solid #dc2626; border-bottom: none; border-radius: 8px 8px 0 0; padding: 10px 22px; font-size: 15px; font-weight: 600; color: #fff; cursor: pointer; white-space: nowrap; margin-top: 4px; margin-left: auto; position: relative; z-index: 1; transition: background 200ms ease, margin-top 200ms ease; }
.fuel-tab-logout:hover { background: #dc2626; margin-top: 2px; }
.fuel-main { max-width: 1100px; margin: 20px auto; padding: 0 20px; position: relative; z-index: 1; }
.section-heading { position: sticky; top: 0; z-index: 5; background: var(--bg-card); border-bottom: 2px solid var(--border); padding: 12px 0; margin: 0 0 16px 0; font-size: 16px; font-weight: 700; color: var(--text); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-heading-count { font-size: 13px; font-weight: 400; color: var(--text-muted); }
.fuel-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.fuel-stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; text-align: center; }
.fuel-stat-number { font-size: 32px; font-weight: 700; color: var(--text); }
.fuel-stat-label { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
.fuel-filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.fuel-filter-bar select, .fuel-filter-bar input { padding: 8px 12px; font-size: 13px; border: 1px solid var(--border-input, var(--border)); border-radius: 6px; background: var(--bg-step); color: var(--text); box-sizing: border-box; }
.fuel-filter-bar select:focus, .fuel-filter-bar input:focus { outline: none; border-color: var(--primary); }
.fuel-filter-label { font-size: 13px; color: var(--text-muted); font-weight: 600; }
.fuel-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); }
.fuel-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 700px; }
.fuel-table thead { background: var(--bg-step); }
.fuel-table th { padding: 10px 14px; text-align: left; font-weight: 600; color: var(--text); border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; position: relative; }
.fuel-table th:hover { color: var(--primary); }
.fuel-table th .sort-arrow { font-size: 10px; margin-left: 4px; opacity: 0.5; }
.fuel-table th.sorted-asc .sort-arrow::after { content: ' ▲'; opacity: 1; }
.fuel-table th.sorted-desc .sort-arrow::after { content: ' ▼'; opacity: 1; }
.fuel-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text); white-space: nowrap; }
.fuel-table tbody tr { transition: background 150ms ease; }
.fuel-table tbody tr:hover { background: var(--bg-step); }
.fuel-table tbody tr:last-child td { border-bottom: none; }
.tank-badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; font-weight: 600; white-space: nowrap; }
.tank-badge.bulk { background: #0066cc; color: #fff; }
.tank-badge.dragup { background: #ff9900; color: #fff; }
.tank-badge.portable { background: #666; color: #fff; }
.tank-badge.equipment { background: #7c3aed; color: #fff; }
.tank-level-mini { display: flex; align-items: center; gap: 8px; min-width: 140px; }
.tank-level-bar { flex: 1; height: 16px; background: var(--border); border-radius: 4px; overflow: hidden; position: relative; min-width: 80px; }
.tank-level-fill { height: 100%; background: linear-gradient(90deg, #0066cc, #00aa44); transition: width .5s; }
.tank-level-fill.low { background: linear-gradient(90deg, #cc0000, #ff6600); }
.tank-level-text { font-size: 11px; font-weight: 600; color: var(--text); white-space: nowrap; }
.ownership-badge { font-size: 11px; padding: 2px 6px; border-radius: 3px; background: var(--border); color: var(--text); white-space: nowrap; }
.ownership-badge.employee { background: #cc0000; color: #fff; }
.ownership-badge.rental { background: #9933cc; color: #fff; }
.status-badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; text-transform: uppercase; white-space: nowrap; }
.status-badge.active { background: #dcfce7; color: #15803d; border: 1px solid #16a34a; }
.status-badge.inactive { background: var(--border); color: var(--text-muted); border: 1px solid var(--border); }
.empty-state { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }
@media (max-width: 800px) { .fuel-stats { grid-template-columns: repeat(2, 1fr); } .fuel-main { padding: 0 12px; margin: 12px auto; } .fuel-tab { padding: 10px 16px; font-size: 14px; } .fuel-tab-logout { padding: 10px 16px; font-size: 14px; } }
</style>
</head>
<body data-page-title="Fuel Management" data-required-permission="fuel.view">

<div class="steel-bg"></div>
<div class="steel-overlay"></div>
<div id="dashHeader"></div>

<div class="fuel-tab-bar" id="fuelTabBar">
  <button class="fuel-tab active" data-tab="tanks" onclick="switchTab('tanks')">Tanks</button>
  <button class="fuel-tab" data-tab="transactions" onclick="switchTab('transactions')">Transactions</button>
  <button class="fuel-tab-logout" onclick="dashLogout()">Logout</button>
</div>

<div id="loading" class="fuel-loading">Checking session…</div>

<div id="dashboard" style="display:none;">
  <div class="fuel-tab-content active" id="tab-tanks">
    <div class="fuel-main">
      <div class="fuel-subtab-bar visible" id="tanksSubtabBar">
        <button class="fuel-subtab active" data-subtab="all" onclick="switchTankSubtab('all')">All Tanks</button>
        <button class="fuel-subtab" data-subtab="bulk" onclick="switchTankSubtab('bulk')">Bulk</button>
        <button class="fuel-subtab" data-subtab="dragup" onclick="switchTankSubtab('dragup')">Drag-Up</button>
        <button class="fuel-subtab" data-subtab="portable" onclick="switchTankSubtab('portable')">Gas Cans</button>
        <button class="fuel-subtab" data-subtab="equipment" onclick="switchTankSubtab('equipment')">Equipment</button>
      </div>
      <div class="fuel-subtab-content active" id="tanks-subtab-all">
        <div class="fuel-stats">
          <div class="fuel-stat-card"><div class="fuel-stat-number" id="stat-total-tanks">0</div><div class="fuel-stat-label">Total Tanks</div></div>
          <div class="fuel-stat-card"><div class="fuel-stat-number" id="stat-low-tanks">0</div><div class="fuel-stat-label">Low (<20%)</div></div>
          <div class="fuel-stat-card"><div class="fuel-stat-number" id="stat-total-gallons">0</div><div class="fuel-stat-label">Total Gallons</div></div>
          <div class="fuel-stat-card"><div class="fuel-stat-number" id="stat-equipment-tanks">0</div><div class="fuel-stat-label">Equipment Tanks</div></div>
        </div>
        <div id="allTanksContainer"></div>
      </div>
      <div class="fuel-subtab-content" id="tanks-subtab-bulk"><div id="bulkTanksContainer"></div></div>
      <div class="fuel-subtab-content" id="tanks-subtab-dragup"><div id="dragupTanksContainer"></div></div>
      <div class="fuel-subtab-content" id="tanks-subtab-portable"><div id="portableTanksContainer"></div></div>
      <div class="fuel-subtab-content" id="tanks-subtab-equipment"><div id="equipmentTanksContainer"></div></div>
    </div>
  </div>
  <div class="fuel-tab-content" id="tab-transactions">
    <div class="fuel-main">
      <div class="fuel-subtab-bar visible" id="txSubtabBar">
        <button class="fuel-subtab active" data-subtab="all" onclick="switchTxSubtab('all')">All Transactions</button>
        <button class="fuel-subtab" data-subtab="purchase" onclick="switchTxSubtab('purchase')">Purchases</button>
        <button class="fuel-subtab" data-subtab="issue" onclick="switchTxSubtab('issue')">Issues to Equipment</button>
        <button class="fuel-subtab" data-subtab="transfer" onclick="switchTxSubtab('transfer')">Transfers</button>
      </div>
      <div class="fuel-subtab-content active" id="tx-subtab-all"><div id="allTxContainer"></div></div>
      <div class="fuel-subtab-content" id="tx-subtab-purchase"><div id="purchaseTxContainer"></div></div>
      <div class="fuel-subtab-content" id="tx-subtab-issue"><div id="issueTxContainer"></div></div>
      <div class="fuel-subtab-content" id="tx-subtab-transfer"><div id="transferTxContainer"></div></div>
    </div>
  </div>
</div>

<div id="dashFooter"></div>
<script src="/app/shared/dashboard-common.js?v=7"></script>
<script>
var allTanks = [];
var allTransactions = [];

function switchTab(tabName) {
  document.querySelectorAll('.fuel-tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.fuel-tab-content').forEach(function(c) { c.classList.remove('active'); });
  document.querySelector('[data-tab="' + tabName + '"]').classList.add('active');
  document.getElementById('tab-' + tabName).classList.add('active');
  var tanksBar = document.getElementById('tanksSubtabBar');
  var txBar = document.getElementById('txSubtabBar');
  if (tanksBar) tanksBar.classList.toggle('visible', tabName === 'tanks');
  if (txBar) txBar.classList.toggle('visible', tabName === 'transactions');
  if (tabName === 'transactions' && !window._txLoaded) loadTransactions();
}

function switchTankSubtab(subtabName) {
  document.querySelectorAll('#tanksSubtabBar .fuel-subtab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.fuel-subtab-content[id^="tanks-subtab-"]').forEach(function(c) { c.classList.remove('active'); });
  document.querySelector('#tanksSubtabBar [data-subtab="' + subtabName + '"]').classList.add('active');
  document.getElementById('tanks-subtab-' + subtabName).classList.add('active');
  renderTanksForSubtab(subtabName);
}

function switchTxSubtab(subtabName) {
  document.querySelectorAll('#txSubtabBar .fuel-subtab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.fuel-subtab-content[id^="tx-subtab-"]').forEach(function(c) { c.classList.remove('active'); });
  document.querySelector('#txSubtabBar [data-subtab="' + subtabName + '"]').classList.add('active');
  document.getElementById('tx-subtab-' + subtabName).classList.add('active');
  renderTxForSubtab(subtabName);
}

function makeTabsSticky() {
  var header = document.getElementById('dashHeader');
  var tabBar = document.getElementById('fuelTabBar');
  if (header && tabBar && !header.contains(tabBar)) header.appendChild(tabBar);
  var tanksBar = document.getElementById('tanksSubtabBar');
  var txBar = document.getElementById('txSubtabBar');
  if (header && tanksBar && !header.contains(tanksBar)) header.appendChild(tanksBar);
  if (header && txBar && !header.contains(txBar)) header.appendChild(txBar);
}

function insertHeaderTitle() {
  var row1 = document.querySelector('.dash-header-row1');
  if (row1 && !document.querySelector('.fuel-header-title')) {
    var title = document.createElement('div');
    title.className = 'fuel-header-title';
    title.textContent = 'Fuel Management';
    var logoArea = document.getElementById('dashCustomerLogoArea');
    var drivenLogo = row1.querySelector('.dash-driven-logo');
    if (logoArea && drivenLogo) row1.insertBefore(title, drivenLogo);
  }
}

window.dashLogout = function() {
  try { fetch('/auth/logout', { method: 'POST' }); } catch (e) {}
  window.location.href = '/public/login.html';
};

function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function tankLevelHtml(t) {
  var pct = t.capacity > 0 ? Math.min(100, (t.current_quantity / t.capacity) * 100) : 0;
  var lowClass = pct < 20 ? ' low' : '';
  return '<div class="tank-level-mini"><div class="tank-level-bar"><div class="tank-level-fill' + lowClass + '" style="width:' + pct + '%"></div></div><span class="tank-level-text">' + (t.current_quantity||0) + '/' + (t.capacity||0) + '</span></div>';
}

function tankTypeBadge(t) {
  var type = t.tank_type || '';
  var label = type === 'bulk' ? 'Bulk' : type === 'dragup' ? 'Drag-Up' : type === 'portable' ? 'Gas Can' : type === 'equipment' ? 'Equipment' : type;
  return '<span class="tank-badge ' + type + '">' + label + '</span>';
}

function ownershipBadge(t) {
  if (!t.ownership_type || t.ownership_type === 'company') return '';
  return '<span class="ownership-badge ' + t.ownership_type + '">' + t.ownership_type + (t.owner_name ? ': ' + esc(t.owner_name) : '') + '</span>';
}

function statusBadge(t) {
  var status = t.status || 'active';
  return '<span class="status-badge ' + status + '">' + status + '</span>';
}

function sortTanks(tanks, col, dir) {
  return tanks.slice().sort(function(a, b) {
    var av, bv;
    if (col === 'name') { av = (a.name||'').toLowerCase(); bv = (b.name||'').toLowerCase(); }
    else if (col === 'tank_type') { av = (a.tank_type||'').toLowerCase(); bv = (b.tank_type||'').toLowerCase(); }
    else if (col === 'fuel_type') { av = (a.fuel_type||'').toLowerCase(); bv = (b.fuel_type||'').toLowerCase(); }
    else if (col === 'level') { av = a.capacity > 0 ? (a.current_quantity/a.capacity) : 0; bv = b.capacity > 0 ? (b.current_quantity/b.capacity) : 0; }
    else if (col === 'current_quantity') { av = a.current_quantity||0; bv = b.current_quantity||0; }
    else if (col === 'capacity') { av = a.capacity||0; bv = b.capacity||0; }
    else if (col === 'status') { av = (a.status||'').toLowerCase(); bv = (b.status||'').toLowerCase(); }
    else if (col === 'location') { av = (a.location||'').toLowerCase(); bv = (b.location||'').toLowerCase(); }
    else { av = a.created_at||''; bv = b.created_at||''; }
    if (av < bv) return dir === 'asc' ? -1 : 1;
    if (av > bv) return dir === 'asc' ? 1 : -1;
    return 0;
  });
}

function sortTransactions(txs, col, dir) {
  return txs.slice().sort(function(a, b) {
    var av, bv;
    if (col === 'transaction_type') { av = (a.transaction_type||'').toLowerCase(); bv = (b.transaction_type||'').toLowerCase(); }
    else if (col === 'fuel_type') { av = (a.fuel_type||'').toLowerCase(); bv = (b.fuel_type||'').toLowerCase(); }
    else if (col === 'quantity') { av = a.quantity||0; bv = b.quantity||0; }
    else if (col === 'asset') { av = (a.asset_name||a.asset_number||'').toLowerCase(); bv = (b.asset_name||b.asset_number||'').toLowerCase(); }
    else if (col === 'project') { av = (a.project_name||'').toLowerCase(); bv = (b.project_name||'').toLowerCase(); }
    else if (col === 'person') { av = (a.person||'').toLowerCase(); bv = (b.person||'').toLowerCase(); }
    else { av = a.transaction_date||''; bv = b.transaction_date||''; }
    if (av < bv) return dir === 'asc' ? -1 : 1;
    if (av > bv) return dir === 'asc' ? 1 : -1;
    return 0;
  });
}

function filterTanks(tanks, search) {
  if (!search) return tanks;
  var s = search.toLowerCase();
  return tanks.filter(function(t) {
    var hay = [t.name, t.tank_type, t.fuel_type, t.location, t.status, t.owner_name, t.ownership_type].filter(Boolean).join(' ').toLowerCase();
    return hay.indexOf(s) !== -1;
  });
}

function renderTankTable(tanks, containerId, showTypeColumn) {
  var container = document.getElementById(containerId);
  if (tanks.length === 0) { container.innerHTML = '<div class="empty-state">No tanks found.</div>'; return; }
  var filterBarId = containerId + '-filter';
  var tableId = containerId + '-table';
  container.innerHTML = '<div class="fuel-filter-bar"><span class="fuel-filter-label">Search:</span><input type="text" id="' + filterBarId + '" placeholder="Name, type, fuel, location…" oninput="onTankFilter(\'' + containerId + '\', this.value)" style="flex:1;min-width:180px;"></div>' +
    '<div class="fuel-table-wrap"><table class="fuel-table" id="' + tableId + '"><thead><tr>' +
    '<th onclick="onTankSort(\'' + containerId + '\',\'name\')" class="sortable">Tank Name <span class="sort-arrow"></span></th>' +
    (showTypeColumn ? '<th onclick="onTankSort(\'' + containerId + '\',\'tank_type\')" class="sortable">Type <span class="sort-arrow"></span></th>' : '') +
    '<th onclick="onTankSort(\'' + containerId + '\',\'fuel_type\')" class="sortable">Fuel <span class="sort-arrow"></span></th>' +
    '<th onclick="onTankSort(\'' + containerId + '\',\'level\')" class="sortable">Level <span class="sort-arrow"></span></th>' +
    '<th onclick="onTankSort(\'' + containerId + '\',\'capacity\')" class="sortable">Capacity <span class="sort-arrow"></span></th>' +
    '<th onclick="onTankSort(\'' + containerId + '\',\'location\')" class="sortable">Location <span class="sort-arrow"></span></th>' +
    '<th>Ownership</th>' +
    '<th onclick="onTankSort(\'' + containerId + '\',\'status\')" class="sortable">Status <span class="sort-arrow"></span></th>' +
    '</tr></thead><tbody id="' + tableId + '-body">' + renderTankRows(tanks, showTypeColumn) + '</tbody></table></div>';
  container._tankSortCol = 'name';
  container._tankSortDir = 'asc';
  updateSortIndicators(container);
}

function renderTankRows(tanks, showTypeColumn) {
  return tanks.map(function(t) {
    return '<tr><td style="font-weight:600;">' + esc(t.name||'') + '</td>' +
      (showTypeColumn ? '<td>' + tankTypeBadge(t) + '</td>' : '') +
      '<td>' + esc(t.fuel_type||'—') + '</td>' +
      '<td>' + tankLevelHtml(t) + '</td>' +
      '<td>' + (t.capacity||0) + ' ' + esc(t.unit||'gal') + '</td>' +
      '<td>' + esc(t.location||'—') + '</td>' +
      '<td>' + ownershipBadge(t) + '</td>' +
      '<td>' + statusBadge(t) + '</td></tr>';
  }).join('');
}

function onTankSort(containerId, col) {
  var container = document.getElementById(containerId);
  if (container._tankSortCol === col) { container._tankSortDir = container._tankSortDir === 'asc' ? 'desc' : 'asc'; }
  else { container._tankSortCol = col; container._tankSortDir = 'asc'; }
  updateSortIndicators(container);
  reRenderTankTable(containerId);
}

function onTankFilter(containerId, searchText) {
  document.getElementById(containerId)._tankSearch = searchText;
  reRenderTankTable(containerId);
}

function reRenderTankTable(containerId) {
  var container = document.getElementById(containerId);
  var subtab = container.getAttribute('data-subtab') || 'all';
  var tanks = getTanksForSubtab(subtab);
  var filtered = filterTanks(tanks, container._tankSearch || '');
  var sorted = sortTanks(filtered, container._tankSortCol || 'name', container._tankSortDir || 'asc');
  var showTypeColumn = (subtab === 'all');
  var tbody = container.querySelector('tbody');
  if (tbody) tbody.innerHTML = renderTankRows(sorted, showTypeColumn);
}

function updateSortIndicators(container) {
  container.querySelectorAll('th.sortable').forEach(function(th) { th.classList.remove('sorted-asc', 'sorted-desc'); });
  var th = container.querySelector('th[onclick*="' + container._tankSortCol + '"]');
  if (th) th.classList.add(container._tankSortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
}

function getTanksForSubtab(subtab) {
  if (subtab === 'all') return allTanks;
  if (subtab === 'equipment') return allTanks.filter(function(t) { return t.tank_type === 'equipment' || t.asset_id; });
  return allTanks.filter(function(t) { return t.tank_type === subtab; });
}

function renderTanksForSubtab(subtab) {
  var tanks = getTanksForSubtab(subtab);
  var containerId, showType;
  if (subtab === 'all') { containerId = 'allTanksContainer'; showType = true; }
  else if (subtab === 'bulk') { containerId = 'bulkTanksContainer'; showType = false; }
  else if (subtab === 'dragup') { containerId = 'dragupTanksContainer'; showType = false; }
  else if (subtab === 'portable') { containerId = 'portableTanksContainer'; showType = false; }
  else if (subtab === 'equipment') { containerId = 'equipmentTanksContainer'; showType = false; }
  var container = document.getElementById(containerId);
  container.setAttribute('data-subtab', subtab);
  var headingText = subtab === 'all' ? 'All Fuel Tanks' : subtab === 'bulk' ? 'Bulk Tanks' : subtab === 'dragup' ? 'Drag-Up Tanks' : subtab === 'portable' ? 'Portable Gas Cans' : 'Equipment Fuel Tanks';
  container.innerHTML = '<div class="section-heading">' + headingText + ' <span class="section-heading-count">' + tanks.length + ' tank' + (tanks.length !== 1 ? 's' : '') + '</span></div>';
  var innerDiv = document.createElement('div');
  innerDiv.id = containerId + '-inner';
  container.appendChild(innerDiv);
  renderTankTable(tanks, innerDiv.id, showType);
}

function updateTankStats() {
  var total = allTanks.length;
  var low = allTanks.filter(function(t) { return t.capacity > 0 && (t.current_quantity / t.capacity) < 0.2; }).length;
  var totalGal = allTanks.reduce(function(sum, t) { return sum + (t.current_quantity || 0); }, 0);
  var equipCount = allTanks.filter(function(t) { return t.tank_type === 'equipment' || t.asset_id; }).length;
  document.getElementById('stat-total-tanks').textContent = total;
  document.getElementById('stat-low-tanks').textContent = low;
  document.getElementById('stat-total-gallons').textContent = totalGal.toLocaleString();
  document.getElementById('stat-equipment-tanks').textContent = equipCount;
}

async function loadTanks() {
  try {
    var resp = await fetch('/api/fuel-tanks');
    var data = await resp.json();
    if (data.success && data.tanks) { allTanks = data.tanks; updateTankStats(); renderTanksForSubtab('all'); }
    else { document.getElementById('allTanksContainer').innerHTML = '<div class="empty-state">Failed to load tanks.</div>'; }
  } catch (e) { document.getElementById('allTanksContainer').innerHTML = '<div class="empty-state">Error: ' + esc(e.message) + '</div>'; }
}

function txTypeLabel(type) {
  var labels = { purchase: 'Purchase', bulk_issue: 'Bulk Issue', dragup_fill: 'Drag-Up Fill', dragup_issue: 'Drag-Up Issue', portable_fill: 'Can Fill', portable_issue: 'Can Issue', return: 'Return' };
  return labels[type] || (type || '').replace(/_/g, ' ');
}

function getTxForSubtab(subtab) {
  if (subtab === 'all') return allTransactions;
  if (subtab === 'purchase') return allTransactions.filter(function(t) { return t.transaction_type === 'purchase'; });
  if (subtab === 'issue') return allTransactions.filter(function(t) { return t.transaction_type && t.transaction_type.indexOf('issue') !== -1; });
  if (subtab === 'transfer') return allTransactions.filter(function(t) { return t.transaction_type === 'return' || (t.transaction_type && t.transaction_type.indexOf('fill') !== -1); });
  return allTransactions;
}

function renderTxTable(txs, containerId) {
  var container = document.getElementById(containerId);
  if (txs.length === 0) { container.innerHTML = '<div class="empty-state">No transactions found.</div>'; return; }
  var filterId = containerId + '-filter';
  var tableId = containerId + '-table';
  container.innerHTML = '<div class="fuel-filter-bar"><span class="fuel-filter-label">Search:</span><input type="text" id="' + filterId + '" placeholder="Type, fuel, asset, person, project…" oninput="onTxFilter(\'' + containerId + '\', this.value)" style="flex:1;min-width:180px;"></div>' +
    '<div class="fuel-table-wrap"><table class="fuel-table" id="' + tableId + '"><thead><tr>' +
    '<th onclick="onTxSort(\'' + containerId + '\',\'transaction_date\')" class="sortable">Date <span class="sort-arrow"></span></th>' +
    '<th onclick="onTxSort(\'' + containerId + '\',\'transaction_type\')" class="sortable">Type <span class="sort-arrow"></span></th>' +
    '<th onclick="onTxSort(\'' + containerId + '\',\'fuel_type\')" class="sortable">Fuel <span class="sort-arrow"></span></th>' +
    '<th onclick="onTxSort(\'' + containerId + '\',\'quantity\')" class="sortable">Qty <span class="sort-arrow"></span></th>' +
    '<th onclick="onTxSort(\'' + containerId + '\',\'asset\')" class="sortable">Equipment <span class="sort-arrow"></span></th>' +
    '<th onclick="onTxSort(\'' + containerId + '\',\'person\')" class="sortable">Person <span class="sort-arrow"></span></th>' +
    '<th onclick="onTxSort(\'' + containerId + '\',\'project\')" class="sortable">Project <span class="sort-arrow"></span></th>' +
    '</tr></thead><tbody id="' + tableId + '-body">' + renderTxRows(txs) + '</tbody></table></div>';
  container._txSortCol = 'transaction_date';
  container._txSortDir = 'desc';
  updateTxSortIndicators(container);
}

function renderTxRows(txs) {
  return txs.map(function(t) {
    var date = t.transaction_date ? new Date(t.transaction_date).toLocaleDateString() : '—';
    return '<tr><td>' + date + '</td><td>' + esc(txTypeLabel(t.transaction_type)) + '</td><td>' + esc(t.fuel_type||'—') + '</td><td style="font-weight:600;color:var(--primary);">' + (t.quantity||0) + ' gal</td><td>' + esc(t.asset_name||t.asset_number||'—') + '</td><td>' + esc(t.person||'—') + '</td><td>' + esc(t.project_name||'—') + '</td></tr>';
  }).join('');
}

function onTxSort(containerId, col) {
  var container = document.getElementById(containerId);
  if (container._txSortCol === col) { container._txSortDir = container._txSortDir === 'asc' ? 'desc' : 'asc'; }
  else { container._txSortCol = col; container._txSortDir = 'asc'; }
  updateTxSortIndicators(container);
  reRenderTxTable(containerId);
}

function onTxFilter(containerId, searchText) {
  document.getElementById(containerId)._txSearch = searchText;
  reRenderTxTable(containerId);
}

function reRenderTxTable(containerId) {
  var container = document.getElementById(containerId);
  var subtab = container.getAttribute('data-subtab') || 'all';
  var txs = getTxForSubtab(subtab);
  var s = (container._txSearch || '').toLowerCase();
  if (s) { txs = txs.filter(function(t) { var hay = [t.transaction_type, t.fuel_type, t.asset_name, t.asset_number, t.person, t.project_name].filter(Boolean).join(' ').toLowerCase(); return hay.indexOf(s) !== -1; }); }
  var sorted = sortTransactions(txs, container._txSortCol || 'transaction_date', container._txSortDir || 'desc');
  var tbody = container.querySelector('tbody');
  if (tbody) tbody.innerHTML = renderTxRows(sorted);
}

function updateTxSortIndicators(container) {
  container.querySelectorAll('th.sortable').forEach(function(th) { th.classList.remove('sorted-asc', 'sorted-desc'); });
  var th = container.querySelector('th[onclick*="' + container._txSortCol + '"]');
  if (th) th.classList.add(container._txSortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
}

function renderTxForSubtab(subtab) {
  var txs = getTxForSubtab(subtab);
  var containerId;
  if (subtab === 'all') containerId = 'allTxContainer';
  else if (subtab === 'purchase') containerId = 'purchaseTxContainer';
  else if (subtab === 'issue') containerId = 'issueTxContainer';
  else if (subtab === 'transfer') containerId = 'transferTxContainer';
  var container = document.getElementById(containerId);
  container.setAttribute('data-subtab', subtab);
  var headingText = subtab === 'all' ? 'All Fuel Transactions' : subtab === 'purchase' ? 'Fuel Purchases' : subtab === 'issue' ? 'Issues to Equipment' : 'Tank Transfers & Fills';
  container.innerHTML = '<div class="section-heading">' + headingText + ' <span class="section-heading-count">' + txs.length + ' record' + (txs.length !== 1 ? 's' : '') + '</span></div>';
  var innerDiv = document.createElement('div');
  innerDiv.id = containerId + '-inner';
  container.appendChild(innerDiv);
  renderTxTable(txs, innerDiv.id);
}

async function loadTransactions() {
  window._txLoaded = true;
  try {
    var resp = await fetch('/api/fuel-transactions');
    var data = await resp.json();
    if (data.success && data.transactions) { allTransactions = data.transactions; renderTxForSubtab('all'); }
    else { document.getElementById('allTxContainer').innerHTML = '<div class="empty-state">Failed to load transactions.</div>'; }
  } catch (e) { document.getElementById('allTxContainer').innerHTML = '<div class="empty-state">Error: ' + esc(e.message) + '</div>'; }
}

async function init() {
  document.addEventListener('dashSessionLoaded', async function() {
    var user = window.dashUser;
    if (!user) { window.location.href = '/public/login.html'; return; }
    insertHeaderTitle();
    makeTabsSticky();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    await loadTanks();
  });
}
init();
</script>
