<!-- ===== THEME TOGGLE (applies before render to prevent flash) ===== -->
<script>
(function() {
  var saved = localStorage.getItem("driven-theme");
  var system = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  var theme = saved || system;
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>

<style>
/* ===== LOADING SCREEN ===== */
.tf-loading{display:flex;align-items:center;justify-content:center;height:60vh;font-size:16px;color:var(--text-muted);}

/* ===== HEADER OVERRIDE -- hide stale 3-row SW header rows ===== */
.dash-header-row2, .dash-header-row3, .dash-utility-bar { display: none !important; }
#dashHeader { position: sticky; top: 0; z-index: 100000; }
#dashHeader .dash-theme-wrapper { display: none !important; }

/* ===== TAB BAR ===== */
.tf-tab-bar {
  display: flex;
  gap: 2px;
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px;
  overflow-x: auto;
  position: relative;
  z-index: 1;
  background: #cbd5e1;
  border-bottom: 2px solid #94a3b8;
}
.tf-tab-home {
  background: #1d4ed8;
  border: 1px solid #2563eb;
  border-bottom: none;
  border-radius: 8px 8px 0 0;
  padding: 10px 22px;
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
  white-space: nowrap;
  margin-top: 4px;
  margin-left: auto;
  position: relative;
  z-index: 1;
  transition: background 200ms ease, margin-top 200ms ease;
  text-decoration: none;
  display: inline-block;
}
.tf-tab-home:hover { background: #2563eb; margin-top: 2px; }
.tf-tab-logout {
  background: #b91c1c;
  border: 1px solid #dc2626;
  border-bottom: none;
  border-radius: 8px 8px 0 0;
  padding: 10px 22px;
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
  white-space: nowrap;
  margin-top: 4px;
  margin-left: 0;
  position: relative;
  z-index: 1;
  transition: background 200ms ease, margin-top 200ms ease;
}
.tf-tab-logout:hover { background: #dc2626; margin-top: 2px; }

/* ===== MAIN CONTAINER ===== */
.tf-main {
  max-width: 1100px;
  margin: 20px auto;
  padding: 0 20px;
  position: relative;
  z-index: 1;
}

/* ===== STICKY SECTION HEADING ===== */
.section-heading {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--bg-card);
  border-bottom: 2px solid var(--border);
  padding: 12px 0;
  margin: 0 0 16px 0;
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.section-heading-count {
  font-size: 13px;
  font-weight: 400;
  color: var(--text-muted);
}

/* ===== FILTER BAR ===== */
.tf-filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  align-items: center;
}
.tf-filter-bar select,
.tf-filter-bar input {
  padding: 8px 12px;
  font-size: 13px;
  border: 1px solid var(--border-input, var(--border));
  border-radius: 6px;
  background: var(--bg-step);
  color: var(--text);
  box-sizing: border-box;
}
.tf-filter-bar select:focus,
.tf-filter-bar input:focus { outline: none; border-color: var(--primary); }
.tf-filter-label { font-size: 13px; color: var(--text-muted); font-weight: 600; }

/* ===== SORTABLE TABLE ===== */
.tf-table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-card);
}
.tf-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  min-width: 800px;
}
.tf-table thead { background: var(--bg-step); }
.tf-table th {
  padding: 10px 14px;
  text-align: left;
  font-weight: 600;
  color: var(--text);
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  position: relative;
}
.tf-table th:hover { color: var(--primary); }
.tf-table th .sort-arrow { font-size: 10px; margin-left: 4px; opacity: 0.5; }
.tf-table th.sorted-asc .sort-arrow::after { content: ' \25B2'; opacity: 1; }
.tf-table th.sorted-desc .sort-arrow::after { content: ' \25BC'; opacity: 1; }
.tf-table td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
  white-space: nowrap;
}
.tf-table tbody tr { cursor: pointer; transition: background 150ms ease; }
.tf-table tbody tr:hover { background: var(--bg-step); }
.tf-table tbody tr:last-child td { border-bottom: none; }

/* ===== STATUS BADGE ===== */
.tf-status { font-size: 11px; padding: 2px 10px; border-radius: 12px; font-weight: 600; text-transform: uppercase; }
.tf-status.created { background: var(--border); color: var(--text); }
.tf-status.picked_up { background: #0066cc; color: #fff; }
.tf-status.in_transit { background: #ff9900; color: #fff; }
.tf-status.delivered { background: #00aa44; color: #fff; }
.tf-status.closed { background: var(--border); color: var(--text-muted); }

/* ===== WARNING FLAGS ===== */
.tf-flag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; margin-left: 6px; }
.tf-flag-unclosed { background: #fef3c7; border: 1px solid #f59e0b; color: #92400e; }
.tf-flag-duplicate { background: #fee2e2; border: 1px solid #ef4444; color: #991b1b; }

/* ===== WARNING BANNER ===== */
.tf-warnings-banner { background: #fef3c7; border: 1px solid #f59e0b; border-radius: 8px; padding: 14px 18px; margin-bottom: 16px; }
.tf-warnings-banner h4 { margin: 0 0 8px 0; font-size: 14px; color: #92400e; }
.tf-warnings-banner ul { margin: 0; padding-left: 20px; }
.tf-warnings-banner li { font-size: 13px; color: #92400e; margin-bottom: 4px; line-height: 1.4; }
.tf-warnings-banner a { color: #92400e; font-weight: 600; cursor: pointer; text-decoration: underline; }

/* ===== DETAIL VIEW ===== */
.tf-detail { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
.tf-event { display: flex; align-items: flex-start; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.tf-event:last-child { border-bottom: none; }
.tf-event-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); margin-top: 4px; flex-shrink: 0; }
.tf-event-content { font-size: 13px; color: var(--text); }
.tf-event-time { font-size: 11px; color: var(--text-muted); }
.tf-back { background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px; padding: 6px 14px; font-size: 13px; cursor: pointer; color: var(--text); margin-bottom: 16px; }
.tf-back:hover { border-color: var(--primary); }
.section-title { font-size: 16px; font-weight: 700; color: var(--text); margin: 24px 0 12px 0; padding-bottom: 8px; border-bottom: 2px solid var(--border); }
.empty-state { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }

/* ===== MOBILE ===== */
@media (max-width: 800px) {
  .tf-main { padding: 0 12px; margin: 12px auto; }
  .tf-tab-home { padding: 10px 16px; font-size: 14px; }
  .tf-tab-logout { padding: 10px 16px; font-size: 14px; }
}
</style>
</head>
<body data-page-title="Transfers" data-required-permission="transfer.view">

<!-- ===== DIAMOND-PLATE BACKGROUND ===== -->
<div class="steel-bg"></div>
<div class="steel-overlay"></div>

<!-- ===== SHARED HEADER ===== -->
<div id="dashHeader"></div>

<!-- ===== TAB BAR ===== -->
<div class="tf-tab-bar" id="tfTabBar">
  <a class="tf-tab-home" id="dashHomeLink" href="/app/dashboard/employee-dashboard.html">Dashboard</a>
  <button class="tf-tab-logout" id="tfLogoutBtn">Logout</button>
</div>

<!-- ===== LOADING SCREEN ===== -->
<div id="loading" class="tf-loading">Checking session...</div>

<!-- ===== DASHBOARD CONTENT ===== -->
<div id="dashboard" style="display:none;">
  <div class="tf-main">

    <!-- ===== WARNING BANNER ===== -->
    <div id="tfWarningsBanner" class="tf-warnings-banner" style="display:none;">
      <h4>&#9888; Transfer Alerts</h4>
      <ul id="tfWarningsList"></ul>
    </div>

    <!-- ===== LIST VIEW ===== -->
    <div id="tfListView">
      <!-- Filter bar -->
      <div class="tf-filter-bar">
        <span class="tf-filter-label">Status:</span>
        <select id="tfStatusFilter">
          <option value="">All Statuses</option>
          <option value="created">Created</option>
          <option value="picked_up">Picked Up</option>
          <option value="in_transit">In Transit</option>
          <option value="delivered">Delivered</option>
          <option value="closed">Closed</option>
          <option value="open">Open (unclosed)</option>
        </select>
        <span class="tf-filter-label">Search:</span>
        <input type="text" id="tfSearchInput" placeholder="Ticket #, asset, location..." data-voice-input style="flex:1;min-width:200px;">
      </div>

      <div class="section-heading">Transfer Tickets <span class="section-heading-count" id="tfCount">0 tickets</span></div>
      <div id="tfTableContainer"></div>
    </div>

    <!-- ===== DETAIL VIEW ===== -->
    <div id="tfDetailView" style="display:none;">
      <button class="tf-back" id="tfBackBtn">&larr; Back to list</button>
      <div id="tfDetail"></div>
    </div>

  </div>
</div>

<!-- ===== FOOTER ===== -->
<div id="dashFooter"></div>
