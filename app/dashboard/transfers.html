<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRIV‑EN | Transfers</title>
<meta name="description" content="DRIV-EN equipment transfers — transfer tickets, status tracking, and delivery signatures.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://www.driv-en.com/app/dashboard/transfers.html">

<link rel="icon" type="image/png" href="/assets/icons/favicon-96.png?v=2026" sizes="96x96">

<script>
(function() {
  var saved = localStorage.getItem("driven-theme");
  var system = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  var theme = saved || system;
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>
<style>
.tf-loading{display:flex;align-items:center;justify-content:center;height:60vh;font-size:16px;color:var(--text-muted);}
.tf-card{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;cursor:pointer;transition:border-color .2s;}
.tf-card:hover{border-color:var(--primary);}
.tf-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.tf-ticket{font-size:15px;font-weight:700;color:var(--text);}
.tf-status{font-size:11px;padding:2px 10px;border-radius:12px;font-weight:600;text-transform:uppercase;}
.tf-status.created{background:var(--border);color:var(--text);}
.tf-status.picked_up{background:#0066cc;color:#fff;}
.tf-status.in_transit{background:#ff9900;color:#fff;}
.tf-status.delivered{background:#00aa44;color:#fff;}
.tf-status.closed{background:var(--border);color:var(--text-muted);}
.tf-meta{font-size:12px;color:var(--text-muted);display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;}
.tf-detail{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;}
.tf-event{display:flex;align-items:flex-start;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);}
.tf-event:last-child{border-bottom:none;}
.tf-event-dot{width:10px;height:10px;border-radius:50%;background:var(--primary);margin-top:4px;flex-shrink:0;}
.tf-event-content{font-size:13px;color:var(--text);}
.tf-event-time{font-size:11px;color:var(--text-muted);}
.tf-back{background:var(--bg-card);border:1px solid var(--border);border-radius:4px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--text);margin-bottom:16px;}
.tf-back:hover{border-color:var(--primary);}
.section-title{font-size:16px;font-weight:700;color:var(--text);margin:24px 0 12px 0;padding-bottom:8px;border-bottom:2px solid var(--border);}
.empty-state{text-align:center;padding:40px;color:var(--text-muted);font-size:14px;}
.tf-flag{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:3px 10px;border-radius:6px;font-weight:600;margin-left:8px;animation:flagPulse 2s ease-in-out infinite;}
.tf-flag-unclosed{background:#fef3c7;border:1px solid #f59e0b;color:#92400e;}
.tf-flag-duplicate{background:#fee2e2;border:1px solid #ef4444;color:#991b1b;}
.tf-flag-icon{font-size:13px;line-height:1;}
@keyframes flagPulse{0%,100%{opacity:1;}50%{opacity:0.7;}}
.tf-warnings-banner{background:#fef3c7;border:1px solid #f59e0b;border-radius:8px;padding:14px 18px;margin-bottom:16px;}
.tf-warnings-banner h4{margin:0 0 8px 0;font-size:14px;color:#92400e;display:flex;align-items:center;gap:6px;}
.tf-warnings-banner ul{margin:0;padding-left:20px;}
.tf-warnings-banner li{font-size:13px;color:#92400e;margin-bottom:4px;line-height:1.4;}
.tf-warnings-banner a{color:#92400e;font-weight:600;cursor:pointer;text-decoration:underline;}
.tf-filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.tf-filter-bar select,.tf-filter-bar input{padding:8px 12px;font-size:13px;border:1px solid var(--border);border-radius:6px;background:var(--bg-card);color:var(--text);box-sizing:border-box;}
.tf-filter-bar select:focus,.tf-filter-bar input:focus{outline:none;border-color:var(--primary);}
.tf-filter-label{font-size:13px;color:var(--text-muted);font-weight:600;}
</style>
</head>
<body data-page-title="Transfers" data-required-permission="transfer.view">
<div id="adminDashboard" style="display:none;">
  <div id="dashHeader"></div>
  <div style="max-width:1100px;margin:0 auto;padding:20px;">
    <div id="tfWarningsBanner" class="tf-warnings-banner" style="display:none;">
      <h4>⚠ Transfer Alerts</h4>
      <ul id="tfWarningsList"></ul>
    </div>
    <div class="tf-filter-bar">
      <span class="tf-filter-label">Filter:</span>
      <select id="tfStatusFilter" onchange="applyFilters()">
        <option value="">All Statuses</option>
        <option value="created">Created</option>
        <option value="picked_up">Picked Up</option>
        <option value="in_transit">In Transit</option>
        <option value="delivered">Delivered</option>
        <option value="closed">Closed</option>
        <option value="open">Open (unclosed)</option>
      </select>
      <input type="text" id="tfSearchInput" placeholder="Search ticket #, asset, location…" oninput="applyFilters()" style="flex:1;min-width:200px;">
    </div>
    <div id="tfListView">
      <div class="section-title">Transfer Tickets</div>
      <div id="tfList" class="tf-loading">Loading transfers…</div>
    </div>
    <div id="tfDetailView" style="display:none;">
      <button class="tf-back" onclick="showList()">← Back to list</button>
      <div id="tfDetail"></div>
    </div>
  </div>
  <div id="dashFooter"></div>
</div>
<script>
let allTransfers = [];
let filteredTransfers = [];
const UNCLOSSED_THRESHOLD_HOURS = 12;

async function loadTransfers() {
  try {
    const resp = await fetch('/api/transfers');
    const data = await resp.json();
    if (data.success && data.transfers) { allTransfers = data.transfers; applyFilters(); renderWarnings(); }
    else { document.getElementById('tfList').innerHTML = '<div class="empty-state">Failed to load transfers.</div>'; }
  } catch (e) { document.getElementById('tfList').innerHTML = '<div class="empty-state">Error: ' + e.message + '</div>'; }
}

function isOpenTransfer(t) { return ['created', 'picked_up', 'in_transit', 'delivered'].includes(t.status); }
function hoursSince(dateStr) { return Math.floor((new Date() - new Date(dateStr)) / (1000 * 60 * 60)); }
function isUnclosedTransfer(t) { return isOpenTransfer(t) && hoursSince(t.created_at) >= UNCLOSSED_THRESHOLD_HOURS; }

function getDuplicateOpenTransfers() {
  const openByAsset = {};
  allTransfers.forEach(t => { if (isOpenTransfer(t) && t.asset_id) { if (!openByAsset[t.asset_id]) openByAsset[t.asset_id] = []; openByAsset[t.asset_id].push(t); } });
  const duplicates = {};
  Object.keys(openByAsset).forEach(assetId => { if (openByAsset[assetId].length > 1) { openByAsset[assetId].forEach(t => { duplicates[t.id] = true; }); } });
  return duplicates;
}

function renderWarnings() {
  const banner = document.getElementById('tfWarningsBanner');
  const list = document.getElementById('tfWarningsList');
  const warnings = [];
  const unclosed = allTransfers.filter(isUnclosedTransfer);
  if (unclosed.length > 0) {
    warnings.push('<strong>' + unclosed.length + ' transfer' + (unclosed.length > 1 ? 's' : '') + '</strong> open for ' + UNCLOSSED_THRESHOLD_HOURS + '+ hours: ' + unclosed.map(t => '<a onclick="jumpToDetail(\'' + t.id + '\')">' + (t.ticket_number || '—') + '</a>').join(', '));
  }
  const duplicates = getDuplicateOpenTransfers();
  const dupAssetIds = {};
  allTransfers.forEach(t => { if (duplicates[t.id] && t.asset_id) { if (!dupAssetIds[t.asset_id]) dupAssetIds[t.asset_id] = { name: t.asset_name || t.asset_number || 'Unknown', tickets: [] }; dupAssetIds[t.asset_id].tickets.push(t.ticket_number || '—'); } });
  const dupCount = Object.keys(dupAssetIds).length;
  if (dupCount > 0) {
    warnings.push('<strong>' + dupCount + ' asset' + (dupCount > 1 ? 's' : '') + '</strong> with multiple open transfer tickets: ' + Object.values(dupAssetIds).map(d => d.name + ' (' + d.tickets.join(', ') + ')').join('; '));
  }
  if (warnings.length > 0) { list.innerHTML = warnings.map(w => '<li>' + w + '</li>').join(''); banner.style.display = 'block'; } else { banner.style.display = 'none'; }
}

function jumpToDetail(id) { showDetail(id); }

function applyFilters() {
  const statusFilter = document.getElementById('tfStatusFilter').value;
  const searchText = document.getElementById('tfSearchInput').value.toLowerCase();
  filteredTransfers = allTransfers.filter(t => {
    if (statusFilter === 'open') { if (!isOpenTransfer(t)) return false; } else if (statusFilter && t.status !== statusFilter) return false;
    if (searchText) { const hay = [t.ticket_number, t.asset_name, t.asset_number, t.from_location, t.to_location, t.from_project_name, t.to_project_name, t.carrier_name, t.status].filter(Boolean).join(' ').toLowerCase(); if (!hay.includes(searchText)) return false; }
    return true;
  });
  renderList();
}

function renderList() {
  if (filteredTransfers.length === 0) { document.getElementById('tfList').innerHTML = '<div class="empty-state">No transfer tickets match your filters.</div>'; return; }
  const duplicates = getDuplicateOpenTransfers();
  document.getElementById('tfList').innerHTML = filteredTransfers.map(t => {
    const date = new Date(t.created_at).toLocaleDateString();
    const hoursOpen = isOpenTransfer(t) ? hoursSince(t.created_at) : null;
    let flags = '';
    if (isUnclosedTransfer(t)) flags += '<span class="tf-flag tf-flag-unclosed" title="Open for ' + hoursOpen + ' hours"><span class="tf-flag-icon">⏰</span> Open ' + hoursOpen + 'h</span>';
    if (duplicates[t.id]) flags += '<span class="tf-flag tf-flag-duplicate" title="This asset has multiple open transfer tickets"><span class="tf-flag-icon">⚠</span> Duplicate</span>';
    return '<div class="tf-card" onclick="showDetail(\'' + t.id + '\')"><div class="tf-header"><span class="tf-ticket">' + (t.ticket_number||'—') + flags + '</span><span class="tf-status ' + (t.status||'created') + '">' + (t.status||'created') + '</span></div><div class="tf-meta"><span>From: ' + (t.from_location||t.from_project_name||'—') + '</span><span>To: ' + (t.to_location||t.to_project_name||'—') + '</span><span>' + date + '</span>' + (t.carrier_type === 'third_party' ? '<span>3rd party</span>' : '<span>Internal</span>') + (t.asset_name ? '<span>📦 ' + t.asset_name + '</span>' : '') + '</div></div>';
  }).join('');
}

async function showDetail(id) {
  document.getElementById('tfListView').style.display = 'none';
  document.getElementById('tfDetailView').style.display = '';
  document.getElementById('tfDetail').innerHTML = '<div class="tf-loading">Loading…</div>';
  try {
    const resp = await fetch('/api/transfers/' + id);
    const data = await resp.json();
    if (data.success && data.transfer) {
      const t = data.transfer;
      const events = data.events || [];
      let html = '<div class="tf-detail">';
      let flags = '';
      if (isUnclosedTransfer(t)) { const hrs = hoursSince(t.created_at); flags += '<span class="tf-flag tf-flag-unclosed"><span class="tf-flag-icon">⏰</span> Open ' + hrs + ' hours — needs closing</span>'; }
      if (getDuplicateOpenTransfers()[t.id]) flags += '<span class="tf-flag tf-flag-duplicate"><span class="tf-flag-icon">⚠</span> Asset has multiple open tickets</span>';
      html += '<div class="tf-header"><span class="tf-ticket">' + (t.ticket_number||'—') + flags + '</span><span class="tf-status ' + (t.status||'created') + '">' + (t.status||'created') + '</span></div>';
      html += '<div class="tf-meta"><span>From: ' + (t.from_location||t.from_project_name||'—') + '</span><span>To: ' + (t.to_location||t.to_project_name||'—') + '</span><span>Carrier: ' + (t.carrier_type||'—') + '</span>';
      if (t.carrier_name) html += '<span>' + t.carrier_name + '</span>';
      if (t.asset_name) html += '<span>📦 ' + t.asset_name + '</span>';
      html += '</div>';
      if (t.notes) html += '<p style="margin-top:10px;font-size:13px;color:var(--text-muted);">Notes: ' + t.notes + '</p>';
      html += '</div><div class="section-title">Event Trail</div><div class="tf-detail">';
      if (events.length === 0) html += '<div class="empty-state">No events recorded.</div>';
      else html += events.map(e => { const time = new Date(e.event_at || e.created_at).toLocaleString(); return '<div class="tf-event"><div class="tf-event-dot"></div><div><div class="tf-event-content"><strong>' + (e.event_type||'event') + '</strong>' + (e.notes ? ' — ' + e.notes : '') + '</div><div class="tf-event-time">' + time + (e.event_by ? ' · ' + e.event_by : '') + '</div></div></div>'; }).join('');
      html += '</div>';
      document.getElementById('tfDetail').innerHTML = html;
    } else { document.getElementById('tfDetail').innerHTML = '<div class="empty-state">Failed to load transfer detail.</div>'; }
  } catch (e) { document.getElementById('tfDetail').innerHTML = '<div class="empty-state">Error: ' + e.message + '</div>'; }
}

function showList() { document.getElementById('tfListView').style.display = ''; document.getElementById('tfDetailView').style.display = 'none'; }

async function checkOpenTransfersForAsset(assetNumber) {
  try {
    const resp = await fetch('/api/transfers/open/' + encodeURIComponent(assetNumber));
    const data = await resp.json();
    if (data.success && data.open_transfers && data.open_transfers.length > 0) return { hasOpen: true, openTransfers: data.open_transfers, asset: data.asset };
    return { hasOpen: false, openTransfers: [], asset: data.asset };
  } catch (e) { return { hasOpen: false, openTransfers: [], error: e.message }; }
}

function showOpenTransferWarning(openTransfers, assetName, onProceed, onCancel) {
  var existing = document.getElementById('openTransferWarningModal');
  if (existing) existing.remove();
  var modal = document.createElement('div');
  modal.id = 'openTransferWarningModal';
  modal.style.cssText = 'display:flex;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:10000;align-items:center;justify-content:center;';
  var ticketList = openTransfers.map(function(t) { var age = hoursSince(t.created_at); var ageLabel = age >= 24 ? Math.floor(age / 24) + 'd' : age + 'h'; return '<li style="margin-bottom:6px;"><strong>' + (t.ticket_number || '—') + '</strong> — Status: ' + (t.status || '—') + ' — From: ' + (t.from_location || '—') + ' → To: ' + (t.to_location || '—') + ' — Open ' + ageLabel + '</li>'; }).join('');
  modal.innerHTML = '<div style="max-width:500px;width:90%;background:var(--bg-card);border:2px solid #f59e0b;border-radius:12px;padding:28px;text-align:center;"><h3 style="margin:0 0 10px 0;font-size:20px;color:#92400e;">⚠ Open Transfer Ticket Exists</h3><p style="margin:0 0 14px 0;font-size:14px;color:var(--text-muted);line-height:1.5;">The asset <strong>' + esc(assetName) + '</strong> already has ' + openTransfers.length + ' open transfer ticket' + (openTransfers.length > 1 ? 's' : '') + ':</p><ul style="text-align:left;margin:0 0 18px 0;padding-left:20px;font-size:13px;color:var(--text);">' + ticketList + '</ul><p style="margin:0 0 18px 0;font-size:13px;color:#92400e;font-weight:600;">Did you forget to close the previous transfer?</p><div><button id="openTransferCancelBtn" style="background:var(--bg-step);border:1px solid var(--border);color:var(--text);padding:10px 20px;border-radius:6px;font-size:14px;cursor:pointer;margin:0 6px;">Go Back</button><button id="openTransferProceedBtn" style="background:#f59e0b;border:1px solid #d97706;color:#fff;padding:10px 20px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;margin:0 6px;">Create New Transfer Anyway</button></div></div>';
  document.body.appendChild(modal);
  document.getElementById('openTransferCancelBtn').onclick = function() { modal.remove(); if (onCancel) onCancel(); };
  document.getElementById('openTransferProceedBtn').onclick = function() { modal.remove(); if (onProceed) onProceed(); };
}

function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

document.addEventListener('dashSessionLoaded', function() { document.getElementById('adminDashboard').style.display = 'block'; loadTransfers(); });
</script>
