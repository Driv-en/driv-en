<!-- ===== THEME TOGGLE (applies before render to prevent flash) ===== -->
<script>
(function() {
  var saved = localStorage.getItem("driven-theme");
  var system = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  var theme = saved || system;
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>

<style>
.wo-loading{display:flex;align-items:center;justify-content:center;height:60vh;font-size:16px;color:var(--text-muted);}
.wo-card{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;cursor:pointer;transition:border-color .2s;}
.wo-card:hover{border-color:var(--primary);}
.wo-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.wo-number{font-size:15px;font-weight:700;color:var(--text);}
.wo-status{font-size:11px;padding:2px 10px;border-radius:12px;font-weight:600;text-transform:uppercase;}
.wo-status.open{background:var(--border);color:var(--text);}
.wo-status.assigned{background:#0066cc;color:#fff;}
.wo-status.in_progress{background:#ff9900;color:#fff;}
.wo-status.completed{background:#00aa44;color:#fff;}
.wo-status.closed{background:var(--border);color:var(--text-muted);}
.wo-meta{font-size:12px;color:var(--text-muted);display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;}
.wo-priority{font-size:11px;padding:1px 6px;border-radius:3px;font-weight:600;}
.wo-priority.high{background:#cc0000;color:#fff;}
.wo-priority.medium{background:#ff9900;color:#fff;}
.wo-priority.low{background:var(--border);color:var(--text);}
.wo-detail{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;}
.wo-back{background:var(--bg-card);border:1px solid var(--border);border-radius:4px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--text);margin-bottom:16px;}
.wo-back:hover{border-color:var(--primary);}
.wo-checklist-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.wo-checklist-item:last-child{border-bottom:none;}
.wo-check-icon{width:20px;height:20px;border-radius:4px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
.wo-check-icon.completed{background:#00aa44;border-color:#00aa44;color:#fff;}
.wo-check-text{font-size:13px;color:var(--text);}
.wo-check-text.completed{text-decoration:line-through;color:var(--text-muted);}
.wo-parts{background:var(--bg-input);border:1px solid var(--border);border-radius:4px;padding:8px 12px;margin:4px 0;font-size:12px;color:var(--text-muted);}
.section-title{font-size:16px;font-weight:700;color:var(--text);margin:24px 0 12px 0;padding-bottom:8px;border-bottom:2px solid var(--border);}
.empty-state{text-align:center;padding:40px;color:var(--text-muted);font-size:14px;}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.filter-btn{background:var(--bg-card);border:1px solid var(--border);border-radius:4px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--text);}
.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
</style>
</head>
<body data-page-title="Work Orders" data-required-permission="workorders.view">

<div id="adminDashboard" style="display:none;">
  <div id="dashHeader"></div>
  <div style="max-width:900px;margin:0 auto;padding:20px;">

    <div id="woListView">
      <div class="filter-bar">
        <button class="filter-btn active" onclick="filterWO('all',this)">All</button>
        <button class="filter-btn" onclick="filterWO('open',this)">Open</button>
        <button class="filter-btn" onclick="filterWO('assigned',this)">Assigned</button>
        <button class="filter-btn" onclick="filterWO('in_progress',this)">In Progress</button>
        <button class="filter-btn" onclick="filterWO('completed',this)">Completed</button>
        <button class="filter-btn" onclick="filterWO('closed',this)">Closed</button>
      </div>
      <div class="section-title">Work Orders</div>
      <div id="woList" class="wo-loading">Loading work orders…</div>
    </div>

    <div id="woDetailView" style="display:none;">
      <button class="wo-back" onclick="showList()">← Back to list</button>
      <div id="woDetail"></div>
    </div>

  </div>
  <div id="dashFooter"></div>
</div>

<script>
let currentFilter = 'all';
let allWOs = [];

async function loadWorkOrders() {
  try {
    const resp = await fetch('/api/work-orders');
    const data = await resp.json();
    if (data.success && data.work_orders) {
      allWOs = data.work_orders;
      renderWOs();
    } else {
      document.getElementById('woList').innerHTML = '<div class="empty-state">Failed to load work orders.</div>';
    }
  } catch (e) {
    document.getElementById('woList').innerHTML = '<div class="empty-state">Error: ' + e.message + '</div>';
  }
}

function renderWOs() {
  let filtered = allWOs;
  if (currentFilter !== 'all') filtered = allWOs.filter(w => w.status === currentFilter);
  if (filtered.length === 0) {
    document.getElementById('woList').innerHTML = '<div class="empty-state">No work orders found.</div>';
    return;
  }
  document.getElementById('woList').innerHTML = filtered.map(w => {
    const date = new Date(w.created_at).toLocaleDateString();
    return '<div class="wo-card" onclick="showDetail(\'' + w.id + '\')">' +
      '<div class="wo-header">' +
        '<span class="wo-number">' + (w.wo_number||w.id.slice(0,8)) + '</span>' +
        '<span class="wo-status ' + (w.status||'open') + '">' + (w.status||'open') + '</span>' +
      '</div>' +
      '<div class="wo-meta">' +
        '<span>' + (w.wo_type||'').replace(/_/g,' ') + '</span>' +
        '<span class="wo-priority ' + (w.priority||'low') + '">' + (w.priority||'low') + '</span>' +
        (w.description ? '<span>' + w.description.slice(0,60) + '</span>' : '') +
        '<span>' + date + '</span>' +
      '</div>' +
    '</div>';
  }).join('');
}

async function showDetail(id) {
  document.getElementById('woListView').style.display = 'none';
  document.getElementById('woDetailView').style.display = '';
  document.getElementById('woDetail').innerHTML = '<div class="wo-loading">Loading…</div>';

  try {
    const resp = await fetch('/api/work-orders/' + id);
    const data = await resp.json();
    if (data.success && data.work_order) {
      const w = data.work_order;
      const items = data.items || [];
      const parts = data.parts || [];

      let html = '<div class="wo-detail">';
      html += '<div class="wo-header"><span class="wo-number">' + (w.wo_number||w.id.slice(0,8)) + '</span>';
      html += '<span class="wo-status ' + (w.status||'open') + '">' + (w.status||'open') + '</span></div>';
      html += '<div class="wo-meta">';
      html += '<span>Type: ' + (w.wo_type||'').replace(/_/g,' ') + '</span>';
      html += '<span class="wo-priority ' + (w.priority||'low') + '">' + (w.priority||'low') + '</span>';
      if (w.assigned_to) html += '<span>Assigned: ' + w.assigned_to + '</span>';
      if (w.labor_hours != null) html += '<span>Labor: ' + w.labor_hours + 'h</span>';
      html += '</div>';
      if (w.description) html += '<p style="margin-top:10px;font-size:14px;color:var(--text);">' + w.description + '</p>';
      html += '</div>';

      if (items.length > 0) {
        html += '<div class="section-title">Checklist (' + items.filter(i=>i.status==='completed').length + '/' + items.length + ')</div>';
        html += '<div class="wo-detail">';
        html += items.map(i => {
          const done = i.status === 'completed';
          return '<div class="wo-checklist-item">' +
            '<div class="wo-check-icon ' + (done?'completed':'') + '">' + (done?'✓':'') + '</div>' +
            '<div class="wo-check-text ' + (done?'completed':'') + '">' + (i.item_text||'') + '</div>' +
          '</div>';
        }).join('');
        html += '</div>';
      }

      if (parts.length > 0) {
        html += '<div class="section-title">Parts</div>';
        html += '<div class="wo-detail">';
        html += parts.map(p => '<div class="wo-parts">' + (p.quantity||1) + '× ' + (p.description||p.part_number||'') + (p.part_number?' ['+p.part_number+']':'') + '</div>').join('');
        html += '</div>';
      }

      document.getElementById('woDetail').innerHTML = html;
    } else {
      document.getElementById('woDetail').innerHTML = '<div class="empty-state">Failed to load work order.</div>';
    }
  } catch (e) {
    document.getElementById('woDetail').innerHTML = '<div class="empty-state">Error: ' + e.message + '</div>';
  }
}

function filterWO(status, btn) {
  currentFilter = status;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderWOs();
}

function showList() {
  document.getElementById('woListView').style.display = '';
  document.getElementById('woDetailView').style.display = 'none';
}

document.addEventListener('dashSessionLoaded', function() {
  document.getElementById('adminDashboard').style.display = 'block';
  loadWorkOrders();
});
</script>

<script src="/app/shared/dashboard-common.js?v=7"></script>
