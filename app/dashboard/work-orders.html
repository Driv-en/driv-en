<html lang="en">
<head>

<meta name="description" content="DRIV-EN work orders — maintenance tickets, checklists, and completion tracking.">

<link rel="icon" type="image/png" href="/assets/icons/favicon-96.png?v=2026" sizes="96x96">

<script>
(function() {
  var saved = localStorage.getItem("driven-theme");
  var system = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  var theme = saved || system;
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>

<style>
.wo-loading{display:flex;align-items:center;justify-content:center;height:60vh;font-size:16px;color:var(--text-muted);}
.dash-header-row2 { display: none !important; }
.dash-header-row3 { display: none !important; }
#dashHeader .dash-theme-wrapper { display: none !important; }
.dash-header-row1 { padding: 8px 20px !important; align-items: center; }
.wo-header-title { flex: 1; text-align: center; font-size: 20px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wo-tab-bar { display: flex; gap: 2px; max-width: 1100px; margin: 0 auto; padding: 0 20px; overflow-x: auto; position: relative; z-index: 1; background: #cbd5e1; border-bottom: 2px solid #94a3b8; }
.wo-tab-home { background: #1d4ed8; border: 1px solid #2563eb; border-bottom: none; border-radius: 8px 8px 0 0; padding: 10px 22px; font-size: 15px; font-weight: 600; color: #fff; cursor: pointer; white-space: nowrap; margin-top: 4px; margin-left: auto; position: relative; z-index: 1; transition: background 200ms ease, margin-top 200ms ease; text-decoration: none; display: inline-block; }
.wo-tab-home:hover { background: #2563eb; margin-top: 2px; }
.wo-tab-logout { background: #b91c1c; border: 1px solid #dc2626; border-bottom: none; border-radius: 8px 8px 0 0; padding: 10px 22px; font-size: 15px; font-weight: 600; color: #fff; cursor: pointer; white-space: nowrap; margin-top: 4px; margin-left: 0; position: relative; z-index: 1; transition: background 200ms ease, margin-top 200ms ease; }
.wo-tab-logout:hover { background: #dc2626; margin-top: 2px; }
.wo-main { max-width: 1100px; margin: 20px auto; padding: 0 20px; position: relative; z-index: 1; }
.section-heading { position: sticky; top: 0; z-index: 5; background: var(--bg-card); border-bottom: 2px solid var(--border); padding: 12px 0; margin: 0 0 16px 0; font-size: 16px; font-weight: 700; color: var(--text); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-heading-count { font-size: 13px; font-weight: 400; color: var(--text-muted); }
.wo-filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.wo-filter-bar select, .wo-filter-bar input { padding: 8px 12px; font-size: 13px; border: 1px solid var(--border-input, var(--border)); border-radius: 6px; background: var(--bg-step); color: var(--text); box-sizing: border-box; }
.wo-filter-bar select:focus, .wo-filter-bar input:focus { outline: none; border-color: var(--primary); }
.wo-filter-label { font-size: 13px; color: var(--text-muted); font-weight: 600; }
.wo-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); }
.wo-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 800px; }
.wo-table thead { background: var(--bg-step); }
.wo-table th { padding: 10px 14px; text-align: left; font-weight: 600; color: var(--text); border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; position: relative; }
.wo-table th:hover { color: var(--primary); }
.wo-table th .sort-arrow { font-size: 10px; margin-left: 4px; opacity: 0.5; }
.wo-table th.sorted-asc .sort-arrow::after { content: ' ▲'; opacity: 1; }
.wo-table th.sorted-desc .sort-arrow::after { content: ' ▼'; opacity: 1; }
.wo-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text); white-space: nowrap; }
.wo-table tbody tr { cursor: pointer; transition: background 150ms ease; }
.wo-table tbody tr:hover { background: var(--bg-step); }
.wo-table tbody tr:last-child td { border-bottom: none; }
.wo-status { font-size: 11px; padding: 2px 10px; border-radius: 12px; font-weight: 600; text-transform: uppercase; }
.wo-status.open { background: var(--border); color: var(--text); }
.wo-status.assigned { background: #0066cc; color: #fff; }
.wo-status.in_progress { background: #ff9900; color: #fff; }
.wo-status.completed { background: #00aa44; color: #fff; }
.wo-status.closed { background: var(--border); color: var(--text-muted); }
.wo-priority { font-size: 11px; padding: 1px 6px; border-radius: 3px; font-weight: 600; }
.wo-priority.high { background: #cc0000; color: #fff; }
.wo-priority.medium { background: #ff9900; color: #fff; }
.wo-priority.low { background: var(--border); color: var(--text); }
.wo-detail { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
.wo-back { background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px; padding: 6px 14px; font-size: 13px; cursor: pointer; color: var(--text); margin-bottom: 16px; }
.wo-back:hover { border-color: var(--primary); }
.wo-checklist-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.wo-checklist-item:last-child { border-bottom: none; }
.wo-check-icon { width: 20px; height: 20px; border-radius: 4px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
.wo-check-icon.completed { background: #00aa44; border-color: #00aa44; color: #fff; }
.wo-check-text { font-size: 13px; color: var(--text); }
.wo-check-text.completed { text-decoration: line-through; color: var(--text-muted); }
.wo-parts { background: var(--bg-input); border: 1px solid var(--border); border-radius: 4px; padding: 8px 12px; margin: 4px 0; font-size: 12px; color: var(--text-muted); }
.section-title { font-size: 16px; font-weight: 700; color: var(--text); margin: 24px 0 12px 0; padding-bottom: 8px; border-bottom: 2px solid var(--border); }
.empty-state { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }
@media (max-width: 800px) {
  .wo-main { padding: 0 12px; margin: 12px auto; }
  .wo-tab-home { padding: 10px 16px; font-size: 14px; }
  .wo-tab-logout { padding: 10px 16px; font-size: 14px; }
}
</style>
</head>
<body data-page-title="Work Orders" data-required-permission="workorders.view">

<div class="steel-bg"></div>
<div class="steel-overlay"></div>

<div id="dashHeader"></div>

<div class="wo-tab-bar" id="woTabBar">
  <a class="wo-tab-home" id="dashHomeLink" href="/app/dashboard/employee-dashboard.html">Dashboard</a>
  <button class="wo-tab-logout" onclick="dashLogout()">Logout</button>
</div>

<div id="loading" class="wo-loading">Checking session…</div>

<div id="dashboard" style="display:none;">
  <div class="wo-main">
    <div id="woListView">
      <div class="wo-filter-bar">
        <span class="wo-filter-label">Status:</span>
        <select id="woStatusFilter" onchange="applyFilters()">
          <option value="">All Statuses</option>
          <option value="open">Open</option>
          <option value="assigned">Assigned</option>
          <option value="in_progress">In Progress</option>
          <option value="completed">Completed</option>
          <option value="closed">Closed</option>
        </select>
        <span class="wo-filter-label">Priority:</span>
        <select id="woPriorityFilter" onchange="applyFilters()">
          <option value="">All Priorities</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <span class="wo-filter-label">Search:</span>
        <input type="text" id="woSearchInput" placeholder="WO #, type, description…" oninput="applyFilters()" style="flex:1;min-width:200px;">
      </div>
      <div class="section-heading">Work Orders <span class="section-heading-count" id="woCount">0 work orders</span></div>
      <div id="woTableContainer"></div>
    </div>
    <div id="woDetailView" style="display:none;">
      <button class="wo-back" onclick="showList()">&larr; Back to list</button>
      <div id="woDetail"></div>
    </div>
  </div>
</div>

<div id="dashFooter"></div>

<script src="/app/shared/dashboard-common.js?v=8"></script>

<script>
var allWOs = [];
var filteredWOs = [];
var woSortCol = 'created_at';
var woSortDir = 'desc';
var woSearchText = '';
var woStatusFilterVal = '';
var woPriorityFilterVal = '';

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function insertHeaderTitle() {
  var row1 = document.querySelector('.dash-header-row1');
  if (row1 && !document.querySelector('.wo-header-title')) {
    var title = document.createElement('div');
    title.className = 'wo-header-title';
    title.textContent = 'Work Orders';
    var logoArea = document.getElementById('dashCustomerLogoArea');
    var drivenLogo = row1.querySelector('.dash-driven-logo');
    if (logoArea && drivenLogo) row1.insertBefore(title, drivenLogo);
  }
}

window.dashLogout = function() {
  try { fetch('/auth/logout', { method: 'POST' }); } catch (e) {}
  window.location.href = '/public/login.html';
};

function sortWOs(wos, col, dir) {
  var sorted = wos.slice();
  sorted.sort(function(a, b) {
    var av, bv;
    if (col === 'wo_number') { av = (a.wo_number||'').toLowerCase(); bv = (b.wo_number||'').toLowerCase(); }
    else if (col === 'wo_type') { av = (a.wo_type||'').toLowerCase(); bv = (b.wo_type||'').toLowerCase(); }
    else if (col === 'priority') {
      var priOrder = { high: 3, medium: 2, low: 1 };
      av = priOrder[a.priority] || 0; bv = priOrder[b.priority] || 0;
    }
    else if (col === 'status') { av = (a.status||'').toLowerCase(); bv = (b.status||'').toLowerCase(); }
    else if (col === 'assigned_to') { av = (a.assigned_to||'').toLowerCase(); bv = (b.assigned_to||'').toLowerCase(); }
    else { av = a.created_at||''; bv = b.created_at||''; }
    if (av < bv) return dir === 'asc' ? -1 : 1;
    if (av > bv) return dir === 'asc' ? 1 : -1;
    return 0;
  });
  return sorted;
}

function applyFilters() {
  woStatusFilterVal = document.getElementById('woStatusFilter').value;
  woPriorityFilterVal = document.getElementById('woPriorityFilter').value;
  woSearchText = (document.getElementById('woSearchInput').value || '').toLowerCase();
  filteredWOs = allWOs.filter(w => {
    if (woStatusFilterVal && w.status !== woStatusFilterVal) return false;
    if (woPriorityFilterVal && (w.priority||'low') !== woPriorityFilterVal) return false;
    if (woSearchText) {
      var haystack = [w.wo_number, w.wo_type, w.description, w.status, w.priority, w.assigned_to].filter(Boolean).join(' ').toLowerCase();
      if (!haystack.includes(woSearchText)) return false;
    }
    return true;
  });
  renderTable();
}

function renderTable() {
  var container = document.getElementById('woTableContainer');
  var sorted = sortWOs(filteredWOs, woSortCol, woSortDir);
  document.getElementById('woCount').textContent = sorted.length + ' work order' + (sorted.length !== 1 ? 's' : '');
  if (sorted.length === 0) {
    container.innerHTML = '<div class="empty-state">No work orders match your filters.</div>';
    return;
  }
  var html = '<div class="wo-table-wrap"><table class="wo-table" id="woTable"><thead><tr>' +
    '<th onclick="onWoSort(\'wo_number\')" class="sortable">WO # <span class="sort-arrow"></span></th>' +
    '<th onclick="onWoSort(\'wo_type\')" class="sortable">Type <span class="sort-arrow"></span></th>' +
    '<th onclick="onWoSort(\'priority\')" class="sortable">Priority <span class="sort-arrow"></span></th>' +
    '<th onclick="onWoSort(\'status\')" class="sortable">Status <span class="sort-arrow"></span></th>' +
    '<th onclick="onWoSort(\'assigned_to\')" class="sortable">Assigned <span class="sort-arrow"></span></th>' +
    '<th onclick="onWoSort(\'created_at\')" class="sortable">Date <span class="sort-arrow"></span></th>' +
    '</tr></thead><tbody>';
  sorted.forEach(function(w) {
    var date = w.created_at ? new Date(w.created_at).toLocaleDateString() : '—';
    html += '<tr onclick="showDetail(\'' + w.id + '\')">' +
      '<td style="font-weight:600;">' + esc(w.wo_number||w.id.slice(0,8)) + '</td>' +
      '<td>' + esc((w.wo_type||'').replace(/_/g,' ')) + '</td>' +
      '<td><span class="wo-priority ' + (w.priority||'low') + '">' + esc(w.priority||'low') + '</span></td>' +
      '<td><span class="wo-status ' + (w.status||'open') + '">' + esc(w.status||'open') + '</span></td>' +
      '<td>' + esc(w.assigned_to||'—') + '</td>' +
      '<td>' + date + '</td>' +
    '</tr>';
  });
  html += '</tbody></table></div>';
  container.innerHTML = html;
  updateWoSortIndicators();
}

function onWoSort(col) {
  if (woSortCol === col) { woSortDir = woSortDir === 'asc' ? 'desc' : 'asc'; }
  else { woSortCol = col; woSortDir = 'asc'; }
  renderTable();
}

function updateWoSortIndicators() {
  var container = document.getElementById('woTableContainer');
  if (!container) return;
  var ths = container.querySelectorAll('th.sortable');
  ths.forEach(function(th) { th.classList.remove('sorted-asc', 'sorted-desc'); });
  var th = container.querySelector('th[onclick*="' + woSortCol + '"]');
  if (th) th.classList.add(woSortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
}

async function showDetail(id) {
  document.getElementById('woListView').style.display = 'none';
  document.getElementById('woDetailView').style.display = '';
  document.getElementById('woDetail').innerHTML = '<div class="wo-loading">Loading…</div>';
  try {
    const resp = await fetch('/api/work-orders/' + id);
    const data = await resp.json();
    if (data.success && data.work_order) {
      const w = data.work_order;
      const items = data.items || [];
      const parts = data.parts || [];
      let html = '<div class="wo-detail">';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">';
      html += '<span style="font-size:15px;font-weight:700;color:var(--text);">' + esc(w.wo_number||w.id.slice(0,8)) + '</span>';
      html += '<span class="wo-status ' + (w.status||'open') + '">' + esc(w.status||'open') + '</span></div>';
      html += '<div style="font-size:12px;color:var(--text-muted);display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;">';
      html += '<span>Type: ' + esc((w.wo_type||'').replace(/_/g,' ')) + '</span>';
      html += '<span class="wo-priority ' + (w.priority||'low') + '">' + esc(w.priority||'low') + '</span>';
      if (w.assigned_to) html += '<span>Assigned: ' + esc(w.assigned_to) + '</span>';
      if (w.labor_hours != null) html += '<span>Labor: ' + w.labor_hours + 'h</span>';
      html += '</div>';
      if (w.description) html += '<p style="margin-top:10px;font-size:14px;color:var(--text);">' + esc(w.description) + '</p>';
      html += '</div>';
      if (items.length > 0) {
        html += '<div class="section-title">Checklist (' + items.filter(i=>i.status==='completed').length + '/' + items.length + ')</div>';
        html += '<div class="wo-detail">';
        html += items.map(i => {
          const done = i.status === 'completed';
          return '<div class="wo-checklist-item"><div class="wo-check-icon ' + (done?'completed':'') + '">' + (done?'✓':'') + '</div><div class="wo-check-text ' + (done?'completed':'') + '">' + esc(i.item_text||'') + '</div></div>';
        }).join('');
        html += '</div>';
      }
      if (parts.length > 0) {
        html += '<div class="section-title">Parts</div>';
        html += '<div class="wo-detail">';
        html += parts.map(p => '<div class="wo-parts">' + (p.quantity||1) + '× ' + esc(p.description||p.part_number||'') + (p.part_number?' ['+esc(p.part_number)+']':'') + '</div>').join('');
        html += '</div>';
      }
      document.getElementById('woDetail').innerHTML = html;
    } else {
      document.getElementById('woDetail').innerHTML = '<div class="empty-state">Failed to load work order.</div>';
    }
  } catch (e) {
    document.getElementById('woDetail').innerHTML = '<div class="empty-state">Error: ' + esc(e.message) + '</div>';
  }
}

function showList() {
  document.getElementById('woListView').style.display = '';
  document.getElementById('woDetailView').style.display = 'none';
}

async function loadWorkOrders() {
  try {
    const resp = await fetch('/api/work-orders');
    const data = await resp.json();
    if (data.success && data.work_orders) {
      allWOs = data.work_orders;
      applyFilters();
    } else {
      document.getElementById('woTableContainer').innerHTML = '<div class="empty-state">Failed to load work orders.</div>';
    }
  } catch (e) {
    document.getElementById('woTableContainer').innerHTML = '<div class="empty-state">Error: ' + esc(e.message) + '</div>';
  }
}

document.addEventListener('dashSessionLoaded', function() {
  var user = window.dashUser;
  if (!user) { window.location.href = '/public/login.html'; return; }
  var role = (user.role || '').toLowerCase();
  var dashUrl = role === 'admin' ? '/app/dashboard/admin.html' : '/app/dashboard/employee-dashboard.html';
  var homeLink = document.getElementById('dashHomeLink');
  if (homeLink) homeLink.href = dashUrl;
  insertHeaderTitle();
  document.getElementById('loading').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadWorkOrders();
});
</script>
