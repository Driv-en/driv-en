<style>
/* ===== LOADING SCREEN ===== */
.wo-loading{display:flex;align-items:center;justify-content:center;height:60vh;font-size:16px;color:var(--text-muted);}

/* ===== TAB BAR ===== */
.wo-tab-bar {
  display: flex;
  gap: 2px;
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px;
  overflow-x: auto;
  position: relative;
  z-index: 1;
  background: #cbd5e1;
  border-bottom: 2px solid #94a3b8;
}
.wo-tab-home {
  background: #1d4ed8;
  border: 1px solid #2563eb;
  border-bottom: none;
  border-radius: 8px 8px 0 0;
  padding: 10px 22px;
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
  white-space: nowrap;
  margin-top: 4px;
  margin-left: auto;
  position: relative;
  z-index: 1;
  transition: background 200ms ease, margin-top 200ms ease;
  text-decoration: none;
  display: inline-block;
}
.wo-tab-home:hover { background: #2563eb; margin-top: 2px; }
.wo-tab-logout {
  background: #b91c1c;
  border: 1px solid #dc2626;
  border-bottom: none;
  border-radius: 8px 8px 0 0;
  padding: 10px 22px;
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
  white-space: nowrap;
  margin-top: 4px;
  margin-left: 0;
  position: relative;
  z-index: 1;
  transition: background 200ms ease, margin-top 200ms ease;
}
.wo-tab-logout:hover { background: #dc2626; margin-top: 2px; }

/* ===== WELCOME BAR (matches admin/test-dashboard standard) ===== */
.wo-welcome-bar {
  max-width: 1100px;
  margin: 16px auto 0 auto;
  padding: 0 20px;
  box-sizing: border-box;
  position: relative;
  z-index: 1;
}
.wo-welcome {
  background: var(--bg-card, #ffffff);
  border: 2px solid var(--success, #16a34a);
  border-radius: 8px;
  padding: 24px;
  margin-bottom: 20px;
  position: relative;
  z-index: 1;
}
.wo-welcome-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
}
.wo-welcome-greeting h2 {
  margin: 0 0 4px 0;
  font-size: 20px;
  color: var(--text, #0f172a);
}
.wo-welcome-details {
  margin-top: 16px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 24px;
  align-items: center;
}
.wo-welcome-rows { display: flex; flex-direction: column; gap: 8px; }
.wo-welcome-row { font-size: 14px; color: var(--text, #0f172a); display: flex; align-items: center; gap: 6px; }
.wo-welcome-label { font-weight: 600; color: var(--text-muted, #64748b); }
.wo-change-password {
  background: var(--success, #16a34a); border: 1px solid #15803d; color: #fff;
  text-decoration: none; display: inline-block; text-align: center; cursor: pointer;
  font-weight: 600; padding: 8px 16px; border-radius: 6px; white-space: nowrap;
}
.wo-change-password:hover { background: #15803d; }
@media (max-width: 600px) {
  .wo-welcome-details { grid-template-columns: 1fr; }
  .wo-welcome-header { flex-direction: column; }
}

/* ===== MAIN CONTAINER ===== */
.wo-main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px 20px 20px;
  position: relative;
  z-index: 1;
}

/* ===== CONTENT CARD (white bg, rounded corners, green border) ===== */
.wo-card {
  background: var(--bg-card, #ffffff);
  border: 2px solid var(--success, #16a34a);
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 20px;
  position: relative;
  z-index: 1;
}

/* ===== FILTER BAR (inside card) ===== */
.wo-filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  align-items: center;
}
.wo-filter-bar select,
.wo-filter-bar input {
  padding: 8px 12px;
  font-size: 13px;
  border: 1px solid var(--border-input, var(--border));
  border-radius: 6px;
  background: var(--bg-step);
  color: var(--text);
  box-sizing: border-box;
}
.wo-filter-bar select:focus,
.wo-filter-bar input:focus { outline: none; border-color: var(--primary); }
.wo-filter-label { font-size: 13px; color: var(--text-muted); font-weight: 600; }

/* ===== SECTION HEADING ===== */
.section-heading {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.section-heading-count {
  font-size: 13px;
  font-weight: 400;
  color: var(--text-muted);
}

/* ===== TABLE ===== */
.wo-table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.wo-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  min-width: 800px;
}
.wo-table thead { background: var(--bg-step); }
.wo-table th {
  padding: 10px 14px;
  text-align: left;
  font-weight: 600;
  color: var(--text);
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  position: relative;
}
.wo-table th:hover { color: var(--primary); }
.wo-table th .sort-arrow { font-size: 10px; margin-left: 4px; opacity: 0.5; }
.wo-table th.sorted-asc .sort-arrow::after { content: ' ▲'; opacity: 1; }
.wo-table th.sorted-desc .sort-arrow::after { content: ' ▼'; opacity: 1; }
.wo-table td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
  white-space: nowrap;
}
.wo-table tbody tr { cursor: pointer; transition: background 150ms ease; }
.wo-table tbody tr:hover { background: var(--bg-step); }
.wo-table tbody tr:last-child td { border-bottom: none; }

/* ===== STATUS BADGE ===== */
.wo-status { font-size: 11px; padding: 2px 10px; border-radius: 12px; font-weight: 600; text-transform: uppercase; }
.wo-status.open { background: var(--border); color: var(--text); }
.wo-status.assigned { background: #0066cc; color: #fff; }
.wo-status.in_progress { background: #ff9900; color: #fff; }
.wo-status.completed { background: #00aa44; color: #fff; }
.wo-status.closed { background: var(--border); color: var(--text-muted); }

/* ===== PRIORITY BADGE ===== */
.wo-priority { font-size: 11px; padding: 1px 6px; border-radius: 3px; font-weight: 600; }
.wo-priority.high { background: #cc0000; color: #fff; }
.wo-priority.medium { background: #ff9900; color: #fff; }
.wo-priority.low { background: var(--border); color: var(--text); }

/* ===== DETAIL VIEW ===== */
.wo-back { background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px; padding: 6px 14px; font-size: 13px; cursor: pointer; color: var(--text); margin-bottom: 16px; }
.wo-back:hover { border-color: var(--primary); }
.wo-checklist-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.wo-checklist-item:last-child { border-bottom: none; }
.wo-check-icon { width: 20px; height: 20px; border-radius: 4px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
.wo-check-icon.completed { background: #00aa44; border-color: #00aa44; color: #fff; }
.wo-check-text { font-size: 13px; color: var(--text); }
.wo-check-text.completed { text-decoration: line-through; color: var(--text-muted); }
.wo-parts { background: var(--bg-input); border: 1px solid var(--border); border-radius: 4px; padding: 8px 12px; margin: 4px 0; font-size: 12px; color: var(--text-muted); }
.section-title { font-size: 16px; font-weight: 700; color: var(--text); margin: 24px 0 12px 0; padding-bottom: 8px; border-bottom: 2px solid var(--border); }
.empty-state { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }

/* ===== MOBILE ===== */
@media (max-width: 800px) {
  .wo-main { padding: 0 12px 12px 12px; }
  .wo-tab-home, .wo-tab-logout { padding: 10px 16px; font-size: 14px; }
  .wo-card { padding: 16px; }
}
</style>
</head>
<body data-page-title="Work Orders">

<!-- ===== DIAMOND-PLATE BACKGROUND ===== -->
<div class="steel-bg"></div>

<!-- Shared header -->
<div id="dashHeader"></div>

<!-- ===== TAB BAR ===== -->
<div class="wo-tab-bar" id="woTabBar">
  <a class="wo-tab-home" id="dashHomeLink" href="/app/dashboard/employee-dashboard.html">Dashboard</a>
  <a class="wo-tab-home" href="/app/dashboard/calendar.html">Calendar</a>
  <button class="wo-tab-logout" onclick="dashLogout()">Logout</button>
</div>

<!-- ===== WELCOME BAR ===== -->
<div class="wo-welcome-bar">
  <div class="wo-welcome">
    <div class="wo-welcome-header">
      <div class="wo-welcome-greeting">
        <h2 id="woWelcomeName">Welcome back</h2>
      </div>
      <div class="dash-theme-wrapper" title="Toggle light/dark mode">
        <span class="dash-theme-label" id="dashThemeLabelLight">Light</span>
        <label class="dash-theme-switch">
          <input type="checkbox" id="dashThemeCheckbox" aria-label="Toggle light or dark theme">
          <span class="dash-theme-slider"></span>

        <span class="dash-theme-label" id="dashThemeLabelDark">Dark</span>

    <div class="wo-welcome-details">

        </div>
        <div class="wo-welcome-row">
          <span class="wo-welcome-label">Email:</span>
          <span id="woWelcomeEmail">-</span>
        </div>
      </div>
      <a href="/app/auth/change-password.html" class="wo-change-password">Change Password</a>
    </div>
  </div>
</div>

<!-- ===== LOADING SCREEN ===== -->
<div id="loading" class="wo-loading">Checking session…</div>

<!-- ===== DASHBOARD CONTENT ===== -->
<div id="dashboard" style="display:none;">
  <div class="wo-main">

    <!-- ===== LIST VIEW ===== -->
    <div id="woListView">

      <div class="wo-card">
        <div class="wo-filter-bar">
          <span class="wo-filter-label">Status:</span>
          <select id="woStatusFilter">
            <option value="">All Statuses</option>

            <option value="in_progress">In Progress</option>

            <option value="closed">Closed</option>
          </select>
          <span class="wo-filter-label">Priority:</span>
          <select id="woPriorityFilter">
            <option value="">All Priorities</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
          <span class="wo-filter-label">Search:</span>
          <input type="text" id="woSearchInput" placeholder="WO #, type, description…" style="flex:1;min-width:200px;">
        </div>
      </div>

      <!-- Work Orders table inside a card -->
      <div class="wo-card">
        <div class="section-heading">Work Orders <span class="section-heading-count" id="woCount">0 work orders</span></div>
        <div id="woTableContainer"></div>
      </div>
    </div>

    <!-- ===== DETAIL VIEW ===== -->
    <div id="woDetailView" style="display:none;">
      <button class="wo-back" id="woBackBtn">&larr; Back to list</button>
      <div id="woDetail"></div>
    </div>

  </div>
</div>

<!-- ===== FOOTER ===== -->
<div id="dashFooter"></div>

</body>
