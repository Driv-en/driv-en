<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Driv-en | Attachment Detail</title>
  <link rel="stylesheet" href="/app/assets/css/admin.css">
</head>
<body>
<header class="app-header">
  <h1>Attachment Detail</h1>
</header>

<main class="app-main">
  <section class="summary">
    <div class="field-group">
      <label>Attachment ID</label>
      <input type="text" name="attachment_id" readonly>
    </div>
    <div class="field-group">
      <label>Name</label>
      <input type="text" name="name">
    </div>
    <div class="field-group">
      <label>Type</label>
      <input type="text" name="type">
    </div>
    <div class="field-group">
      <label>Notes</label>
      <textarea name="notes" rows="3"></textarea>
    </div>
  </section>
</main>
</body>
</html>
