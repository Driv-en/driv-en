<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Driv-en | Configuration Detail</title>
  <link rel="stylesheet" href="/app/assets/css/admin.css">
</head>
<body>
<header class="app-header">
  <h1>Configuration Detail</h1>
</header>

<main class="app-main">
  <section class="summary">
    <div class="field-group">
      <label>Configuration ID</label>
      <input type="text" name="configuration_id" readonly>
    </div>
    <div class="field-group">
      <label>Name</label>
      <input type="text" name="name">
    </div>
    <div class="field-group">
      <label>Equipment Type</label>
      <input type="text" name="equipment_type">
    </div>
    <div class="field-group">
      <label>Parameters</label>
      <textarea name="parameters" rows="4"></textarea>
    </div>
  </section>
</main>
</body>
</html>
