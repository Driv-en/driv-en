<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Driv-en | Fuel Usage</title>
  <link rel="stylesheet" href="/app/assets/css/admin.css">
</head>
<body>
<header class="app-header">
  <h1>Fuel Usage Dashboard</h1>
</header>

<main class="app-main">
  <section class="toolbar">
    <button type="button" onclick="location.href='form.html'">New Fuel Entry</button>
    <button type="button">Filter</button>
    <button type="button">Export</button>
  </section>

  <section class="grid">
    <table>
      <thead>
        <tr>
          <th>Entry ID</th>
          <th>Equipment</th>
          <th>Date</th>
          <th>Fuel Type</th>
          <th>Quantity (gal)</th>
          <th>Meter Reading</th>
          <th>Operator</th>
          <th>Project</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>
</main>
</body>
</html>
