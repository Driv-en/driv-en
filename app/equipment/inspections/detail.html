<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Driv-en | Inspection Detail</title>
  <link rel="stylesheet" href="/app/assets/css/admin.css">
</head>
<body>
<header class="app-header">
  <h1>Inspection Detail</h1>
</header>

<main class="app-main">
  <section class="summary">
    <div class="field-group">
      <label>Inspection ID</label>
      <input type="text" name="inspection_id" readonly>
    </div>
    <div class="field-group">
      <label>Equipment</label>
      <input type="text" name="equipment" readonly>
    </div>
    <div class="field-group">
      <label>Date</label>
      <input type="date" name="inspection_date" readonly>
    </div>
    <div class="field-group">
      <label>Inspector</label>
      <input type="text" name="inspector" readonly>
    </div>
    <div class="field-group">
      <label>Status</label>
      <input type="text" name="status" readonly>
    </div>
  </section>

  <section class="grid">
    <h2>Checklist Results</h2>
    <table>
      <thead>
        <tr>
          <th>Item</th>
          <th>OK</th>
          <th>Defect Notes</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>
</main>
</body>
</html>
