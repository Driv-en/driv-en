<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Driv-en | New Equipment Inspection</title>
  <link rel="stylesheet" href="/app/assets/css/admin.css">
</head>
<body>
<header class="app-header">
  <h1>New Equipment Inspection</h1>
</header>

<main class="app-main">
  <form>
    <div class="field-group">
      <label>Equipment</label>
      <input type="text" name="equipment">
    </div>
    <div class="field-group">
      <label>Inspection Type</label>
      <select name="inspection_type">
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
        <option value="pre-trip">Pre-Trip</option>
        <option value="post-trip">Post-Trip</option>
      </select>
    </div>
    <div class="field-group">
      <label>Date</label>
      <input type="date" name="inspection_date">
    </div>
    <div class="field-group">
      <label>Inspector</label>
      <input type="text" name="inspector">
    </div>

    <fieldset class="checklist">
      <legend>Inspection Checklist</legend>
      <div class="field-group">
        <label>Item</label>
        <input type="text" name="item_description[]">
      </div>
      <div class="field-group inline">
        <label>OK</label>
        <input type="checkbox" name="item_ok[]">
      </div>
      <div class="field-group">
        <label>Defect Notes</label>
        <textarea name="item_notes[]" rows="2"></textarea>
      </div>
      <button type="button">Add Checklist Item</button>
    </fieldset>

    <div class="field-group">
      <label>Overall Status</label>
      <select name="status">
        <option value="pass">Pass</option>
        <option value="fail">Fail</option>
        <option value="conditional">Conditional</option>
      </select>
    </div>

    <div class="form-actions">
      <button type="submit">Save Inspection</button>
      <button type="button" onclick="history.back()">Cancel</button>
    </div>
  </form>
</main>
</body>
</html>
