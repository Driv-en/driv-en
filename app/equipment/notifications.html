<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Driv-en | Equipment Notifications</title>
  <link rel="stylesheet" href="/app/assets/css/admin.css">
</head>
<body>
<header class="app-header">
  <h1>Equipment Notifications</h1>
</header>

<main class="app-main">
  <section class="grid">
    <table>
      <thead>
        <tr>
          <th>Notification ID</th>
          <th>Type</th>
          <th>Equipment</th>
          <th>Message</th>
          <th>Channel</th>
          <th>Created</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="settings-section">
    <h2>Notification Rules</h2>
    <form>
      <div class="field-group">
        <label>Rule Name</label>
        <input type="text" name="rule_name">
      </div>
      <div class="field-group">
        <label>Trigger</label>
        <select name="trigger">
          <option value="pm_due">PM Due</option>
          <option value="pm_overdue">PM Overdue</option>
          <option value="inspection_fail">Inspection Fail</option>
          <option value="fuel_threshold">Fuel Threshold</option>
        </select>
      </div>
      <div class="field-group">
        <label>Channel</label>
        <select name="channel">
          <option value="email">Email</option>
          <option value="sms">SMS</option>
          <option value="in-app">In-App</option>
        </select>
      </div>
      <div class="field-group">
        <label>Recipients</label>
        <input type="text" name="recipients" placeholder="Role or email list">
      </div>
      <div class="field-group">
        <label>Message Template</label>
        <textarea name="message_template" rows="4"></textarea>
      </div>

      <div class="form-actions">
        <button type="submit">Save Rule</button>
      </div>
    </form>
  </section>
</main>
</body>
</html>
