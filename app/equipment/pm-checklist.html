<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Driv-en | PM Checklist</title>
  <link rel="stylesheet" href="/app/assets/css/admin.css">
</head>
<body>
<header class="app-header">
  <h1>Preventative Maintenance Checklist</h1>
</header>

<main class="app-main">
  <section class="toolbar">
    <button type="button">New Checklist</button>
    <button type="button">Filter</button>
  </section>

  <section class="grid">
    <table>
      <thead>
        <tr>
          <th>Checklist ID</th>
          <th>Equipment Type</th>
          <th>PM Program</th>
          <th>Interval</th>
          <th>Active</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="detail-panel" aria-hidden="true">
    <h2>Checklist Detail</h2>
    <form>
      <div class="field-group">
        <label>Equipment Type</label>
        <input type="text" name="equipment_type">
      </div>
      <div class="field-group">
        <label>PM Program</label>
        <input type="text" name="pm_program">
      </div>
      <div class="field-group">
        <label>Interval (Days / Hours)</label>
        <input type="text" name="interval">
      </div>

      <fieldset class="checklist-items">
        <legend>Checklist Items</legend>
        <div class="field-group">
          <label>Item Description</label>
          <input type="text" name="item_description[]">
        </div>
        <div class="field-group inline">
          <label>Required</label>
          <input type="checkbox" name="item_required[]">
        </div>
        <button type="button">Add Item</button>
      </fieldset>

      <div class="field-group inline">
        <label>Active</label>
        <input type="checkbox" name="active">
      </div>

      <div class="form-actions">
        <button type="submit">Save</button>
        <button type="button">Cancel</button>
      </div>
    </form>
  </section>
</main>
</body>
</html>
