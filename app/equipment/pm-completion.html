<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Driv-en | PM Completion</title>
  <link rel="stylesheet" href="/app/assets/css/admin.css">
</head>
<body>
<header class="app-header">
  <h1>Preventative Maintenance Completion</h1>
</header>

<main class="app-main">
  <section class="toolbar">
    <button type="button">New PM Completion</button>
    <button type="button">Filter</button>
    <button type="button">Export</button>
  </section>

  <section class="grid">
    <table>
      <thead>
        <tr>
          <th>PM ID</th>
          <th>Equipment</th>
          <th>PM Type</th>
          <th>Completed Date</th>
          <th>Completed By</th>
          <th>Odometer / Hours</th>
          <th>Status</th>
          <th>Verified</th>
        </tr>
      </thead>
      <tbody>
        <!-- rows rendered by JS -->
      </tbody>
    </table>
  </section>

  <section class="detail-panel" aria-hidden="true">
    <h2>PM Completion Detail</h2>
    <form>
      <div class="field-group">
        <label>PM ID</label>
        <input type="text" name="pm_id" readonly>
      </div>
      <div class="field-group">
        <label>Equipment</label>
        <input type="text" name="equipment" readonly>
      </div>
      <div class="field-group">
        <label>Completed Date</label>
        <input type="date" name="completed_date">
      </div>
      <div class="field-group">
        <label>Completed By</label>
        <input type="text" name="completed_by">
      </div>
      <div class="field-group">
        <label>Odometer / Hours</label>
        <input type="number" name="meter">
      </div>
      <div class="field-group">
        <label>Status</label>
        <select name="status">
          <option value="completed">Completed</option>
          <option value="pending">Pending</option>
          <option value="failed">Failed</option>
        </select>
      </div>
      <div class="field-group">
        <label>Verification</label>
        <select name="verified">
          <option value="unverified">Unverified</option>
          <option value="verified">Verified</option>
        </select>
      </div>
      <div class="field-group">
        <label>Notes</label>
        <textarea name="notes" rows="3"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit">Save</button>
        <button type="button">Cancel</button>
      </div>
    </form>
  </section>
</main>
</body>
</html>
