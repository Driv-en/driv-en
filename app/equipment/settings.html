<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Driv-en | Equipment Settings</title>
  <link rel="stylesheet" href="/app/assets/css/admin.css">
</head>
<body>
<header class="app-header">
  <h1>Equipment Module Settings</h1>
</header>

<main class="app-main">
  <section class="settings-section">
    <h2>PM Defaults</h2>
    <div class="field-group">
      <label>Default PM Interval (Days)</label>
      <input type="number" name="default_pm_interval_days">
    </div>
    <div class="field-group">
      <label>Default PM Interval (Hours)</label>
      <input type="number" name="default_pm_interval_hours">
    </div>
  </section>

  <section class="settings-section">
    <h2>Inspection Settings</h2>
    <div class="field-group inline">
      <label>Require Daily Inspection</label>
      <input type="checkbox" name="require_daily_inspection">
    </div>
    <div class="field-group inline">
      <label>Lock Equipment if Inspection Fails</label>
      <input type="checkbox" name="lock_on_fail">
    </div>
  </section>

  <section class="settings-section">
    <h2>Fuel Settings</h2>
    <div class="field-group inline">
      <label>Require Meter Reading</label>
      <input type="checkbox" name="require_meter">
    </div>
  </section>

  <div class="form-actions">
    <button type="button">Save Settings</button>
  </div>
</main>
</body>
</html>
