<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Driv-en | New Equipment Transfer</title>
  <link rel="stylesheet" href="/app/assets/css/admin.css">
</head>
<body>
<header class="app-header">
  <h1>New Equipment Transfer</h1>
</header>

<main class="app-main">
  <form>
    <div class="field-group">
      <label>Equipment</label>
      <input type="text" name="equipment">
    </div>
    <div class="field-group">
      <label>From Project / Yard</label>
      <input type="text" name="from_location">
    </div>
    <div class="field-group">
      <label>To Project / Yard</label>
      <input type="text" name="to_location">
    </div>
    <div class="field-group">
      <label>Requested By</label>
      <input type="text" name="requested_by">
    </div>
    <div class="field-group">
      <label>Transfer Date</label>
      <input type="date" name="transfer_date">
    </div>
    <div class="field-group">
      <label>Status</label>
      <select name="status">
        <option value="requested">Requested</option>
        <option value="in-transit">In Transit</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>
    <div class="field-group">
      <label>Notes</label>
      <textarea name="notes" rows="3"></textarea>
    </div>

    <div class="form-actions">
      <button type="submit">Save Transfer</button>
      <button type="button" onclick="history.back()">Cancel</button>
    </div>
  </form>
</main>
</body>
</html>
