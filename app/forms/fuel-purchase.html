<script>
(function() {
  var saved = localStorage.getItem("driven-theme");
  var system = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  var theme = saved || system;
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>

<style>
.fp-loading{display:flex;align-items:center;justify-content:center;height:60vh;font-size:16px;color:var(--text-muted);}
.dash-header-row2 { display: none !important; }
.dash-header-row3 { display: none !important; }
#dashHeader .dash-theme-wrapper { display: none !important; }
.dash-header-row1 { padding: 8px 20px !important; align-items: center; }
.fp-header-title { flex: 1; text-align: center; font-size: 20px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fp-tab-bar { display: flex; gap: 2px; max-width: 1100px; margin: 0 auto; padding: 0 20px; overflow-x: auto; position: relative; z-index: 1; background: #cbd5e1; border-bottom: 2px solid #94a3b8; }
.fp-tab-home { background: #1d4ed8; border: 1px solid #2563eb; border-bottom: none; border-radius: 8px 8px 0 0; padding: 10px 22px; font-size: 15px; font-weight: 600; color: #fff; cursor: pointer; white-space: nowrap; margin-top: 4px; margin-left: auto; position: relative; z-index: 1; transition: background 200ms ease, margin-top 200ms ease; text-decoration: none; display: inline-block; }
.fp-tab-home:hover { background: #2563eb; margin-top: 2px; }
.fp-tab-logout { background: #b91c1c; border: 1px solid #dc2626; border-bottom: none; border-radius: 8px 8px 0 0; padding: 10px 22px; font-size: 15px; font-weight: 600; color: #fff; cursor: pointer; white-space: nowrap; margin-top: 4px; margin-left: 0; position: relative; z-index: 1; transition: background 200ms ease, margin-top 200ms ease; }
.fp-tab-logout:hover { background: #dc2626; margin-top: 2px; }
.fp-main { max-width: 600px; margin: 20px auto; padding: 0 20px; position: relative; z-index: 1; }
.fp-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 28px; margin-bottom: 20px; }
.fp-card h2 { margin: 0 0 20px 0; font-size: 20px; font-weight: 700; color: var(--text); }
.fp-link-row { margin-bottom: 20px; }
.fp-link-row label { display: block; font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.fp-link-row label .req { color: #cc0000; }
.fp-link-row select, .fp-link-row input, .fp-link-row textarea { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid var(--border-input, var(--border)); border-radius: 6px; background: var(--bg-input); color: var(--text); box-sizing: border-box; }
.fp-link-row select:focus, .fp-link-row input:focus, .fp-link-row textarea:focus { outline: none; border-color: var(--primary); }
.fp-link-row textarea { resize: vertical; min-height: 60px; }
.fp-link-row .hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.fp-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.fp-btn-row { display: flex; gap: 12px; margin-top: 24px; }
.fp-submit-btn { flex: 1; background: var(--primary); color: #fff; border: none; border-radius: 6px; padding: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
.fp-submit-btn:hover { opacity: 0.9; }
.fp-submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.fp-cancel-btn { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 12px 20px; font-size: 16px; font-weight: 600; cursor: pointer; }
.fp-cancel-btn:hover { border-color: var(--primary); }
.fp-success { text-align: center; padding: 40px 20px; }
.fp-success h3 { font-size: 20px; color: var(--text); margin: 0 0 8px 0; }
.fp-success p { font-size: 14px; color: var(--text-muted); margin: 0 0 20px 0; }
.fp-success .fp-again-btn { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
.fp-error-banner { background: #ffdddd; color: #cc0000; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; display: none; }
.fp-alt-link { text-align: center; margin-top: 16px; }
.fp-alt-link a { font-size: 14px; color: var(--primary); font-weight: 600; text-decoration: none; }
.fp-alt-link a:hover { text-decoration: underline; }
@media (max-width: 600px) {
  .fp-two-col { grid-template-columns: 1fr; }
  .fp-main { padding: 0 12px; margin: 12px auto; }
}

<body data-page-title="Log Fuel Purchase" data-required-permission="fuel.add">

<div class="steel-bg"></div>
<div class="steel-overlay"></div>

<div id="dashHeader"></div>

<div class="fp-tab-bar">
  <a class="fp-tab-home" id="dashHomeLink" href="/app/dashboard/employee-dashboard.html">Dashboard</a>
  <button class="fp-tab-logout" onclick="dashLogout()">Logout</button>
</div>

<div id="loading" class="fp-loading">Checking session…</div>

<div id="dashboard" style="display:none;">
  <div class="fp-main">

    <div id="errorBanner" class="fp-error-banner"></div>

    <!-- ===== FORM VIEW ===== -->
    <div id="formView">
      <div class="fp-card">
        <h2>Log Fuel Purchase</h2>

        <div class="fp-link-row">
          <label>Fuel Type <span class="req">*</span></label>
          <select id="fuelType" required>
            <option value="">Select fuel type…</option>
            <option value="gasoline">Gasoline</option>
            <option value="diesel">Diesel</option>
            <option value="def">DEF</option>
            <option value="propane">Propane</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="fp-two-col">
          <div class="fp-link-row">
            <label>Quantity (gallons) <span class="req">*</span></label>
            <input type="number" id="quantity" step="0.01" min="0.01" placeholder="0.00" required>
          </div>
          <div class="fp-link-row">
            <label>Date <span class="req">*</span></label>
            <input type="date" id="txDate" required>
          </div>
        </div>

        <div class="fp-link-row">
          <label>Purchased From <span class="req">*</span></label>
          <input type="text" id="vendor" placeholder="Vendor name or gas station" required>
          <div class="hint">Who did you buy the fuel from?</div>
        </div>

        <div class="fp-link-row">
          <label>Delivered To (which tank) <span class="req">*</span></label>
          <select id="destTank" required>
            <option value="">Select tank…</option>
          </select>
          <div class="hint">Which tank did the fuel go into?</div>
        </div>

        <div class="fp-two-col">
          <div class="fp-link-row">
            <label>Cost (optional)</label>
            <input type="number" id="cost" step="0.01" min="0" placeholder="0.00">
          </div>
          <div class="fp-link-row">
            <label>Project (optional)</label>
            <select id="project">
              <option value="">No project…</option>
            </select>
          </div>
        </div>

        <div class="fp-link-row">
          <label>Location (optional)</label>
          <input type="text" id="location" placeholder="Where the purchase happened">
        </div>

        <div class="fp-link-row">
          <label>Notes (optional)</label>
          <textarea id="notes" placeholder="Any additional details…"></textarea>
        </div>

        <div class="fp-btn-row">
          <button class="fp-cancel-btn" onclick="goBack()">Cancel</button>
          <button class="fp-submit-btn" id="submitBtn" onclick="submitPurchase()">Log Purchase</button>
        </div>

        <div class="fp-alt-link">
          <a href="/app/forms/fuel-transfer.html">Transfer fuel instead →</a>
        </div>
      </div>
    </div>

    <!-- ===== SUCCESS VIEW ===== -->
    <div id="successView" style="display:none;">
      <div class="fp-card fp-success">
        <h3>✓ Purchase Logged</h3>
        <p id="successMsg"></p>
        <button class="fp-again-btn" onclick="resetForm()">Log Another Purchase</button>
      </div>
    </div>

  </div>
</div>

<div id="dashFooter"></div>

<script src="/app/shared/dashboard-common.js?v=8"></script>

<script>
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function insertHeaderTitle() {
  var row1 = document.querySelector('.dash-header-row1');
  if (row1 && !document.querySelector('.fp-header-title')) {
    var title = document.createElement('div');
    title.className = 'fp-header-title';
    title.textContent = 'Log Fuel Purchase';
    var logoArea = document.getElementById('dashCustomerLogoArea');
    var drivenLogo = row1.querySelector('.dash-driven-logo');
    if (logoArea && drivenLogo) row1.insertBefore(title, drivenLogo);
  }
}

window.dashLogout = function() {
  try { fetch('/auth/logout', { method: 'POST' }); } catch (e) {}
  window.location.href = '/public/login.html';
};

function goBack() {
  var role = (window.dashUser && window.dashUser.role || '').toLowerCase();
  window.location.href = role === 'admin' ? '/app/dashboard/admin.html' : '/app/dashboard/employee-dashboard.html';
}

function showError(msg) {
  var el = document.getElementById('errorBanner');
  if (!msg) { el.style.display = 'none'; return; }
  el.textContent = msg;
  el.style.display = 'block';
}

// Set today's date
document.getElementById('txDate').value = new Date().toISOString().split('T')[0];

// Load tanks (bulk, dragup, portable — not equipment)
async function loadTanks() {
  try {
    var resp = await fetch('/api/fuel-tanks');
    var data = await resp.json();
    if (data.success && data.tanks) {
      var select = document.getElementById('destTank');
      var tanks = data.tanks.filter(function(t) {
        return t.tank_type === 'bulk' || t.tank_type === 'dragup' || t.tank_type === 'portable';
      });
      tanks.forEach(function(t) {
        var opt = document.createElement('option');
        opt.value = t.id;
        opt.textContent = t.name + ' (' + (t.tank_type||'tank') + ') — ' + (t.current_quantity||0) + '/' + (t.capacity||0) + ' gal';
        opt.dataset.tankType = t.tank_type;
        opt.dataset.tankId = t.id;
        select.appendChild(opt);
      });
    }
  } catch (e) {
    console.error('Failed to load tanks:', e);
  }
}

// Load projects
async function loadProjects() {
  try {
    var resp = await fetch('/api/projects');
    var data = await resp.json();
    if (data.success && data.projects) {
      var select = document.getElementById('project');
      data.projects.forEach(function(p) {
        var opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.name || p.project_name || p.id;
        select.appendChild(opt);
      });
    }
  } catch (e) {
    // Projects endpoint may not exist yet — that's OK
  }
}

async function submitPurchase() {
  showError('');

  var fuelType = document.getElementById('fuelType').value;
  var quantity = parseFloat(document.getElementById('quantity').value);
  var txDate = document.getElementById('txDate').value;
  var vendor = document.getElementById('vendor').value.trim();
  var destTankSelect = document.getElementById('destTank');
  var destTankId = destTankSelect.value;
  var destTankType = destTankSelect.selectedOptions[0] ? destTankSelect.selectedOptions[0].dataset.tankType : '';
  var cost = document.getElementById('cost').value;
  var projectId = document.getElementById('project').value;
  var location = document.getElementById('location').value.trim();
  var notes = document.getElementById('notes').value.trim();

  // Validation
  if (!fuelType) { showError('Please select a fuel type.'); return; }
  if (!quantity || quantity <= 0) { showError('Please enter a valid quantity.'); return; }
  if (!txDate) { showError('Please select a date.'); return; }
  if (!vendor) { showError('Please enter who the fuel was purchased from.'); return; }
  if (!destTankId) { showError('Please select which tank the fuel went into.'); return; }

  // Map to API: transaction_type = "purchase"
  // from_entity_type = "vendor", to_entity_type = "{type}_tank" or "portable_can"
  var toEntityType;
  if (destTankType === 'bulk') toEntityType = 'bulk_tank';
  else if (destTankType === 'dragup') toEntityType = 'dragup_tank';
  else if (destTankType === 'portable') toEntityType = 'portable_can';
  else toEntityType = 'bulk_tank';

  var notesCombined = notes;
  if (cost) {
    notesCombined = (notesCombined ? notesCombined + ' | ' : '') + 'Cost: $' + cost;
  }

  var submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Saving…';

  try {
    var resp = await fetch('/api/fuel-transactions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        transaction_type: 'purchase',
        fuel_type: fuelType,
        quantity: quantity,
        transaction_date: txDate,
        from_entity_type: 'vendor',
        from_entity_id: vendor,
        to_entity_type: toEntityType,
        to_entity_id: destTankId,
        project_id: projectId || null,
        location: location || null,
        notes: notesCombined || null
      })
    });

    var data = await resp.json();

    if (data.success) {
      document.getElementById('formView').style.display = 'none';
      document.getElementById('successView').style.display = 'block';
      document.getElementById('successMsg').textContent =
        quantity + ' gallons of ' + fuelType + ' purchased from ' + vendor + ' and added to ' + (destTankSelect.selectedOptions[0].textContent.split(' —')[0]);
    } else {
      showError(data.error || 'Failed to log purchase. Please try again.');
    }
  } catch (e) {
    showError('Network error: ' + e.message);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Log Purchase';
  }
}

function resetForm() {
  document.getElementById('formView').style.display = 'block';
  document.getElementById('successView').style.display = 'none';
  document.getElementById('quantity').value = '';
  document.getElementById('vendor').value = '';
  document.getElementById('cost').value = '';
  document.getElementById('location').value = '';
  document.getElementById('notes').value = '';
  document.getElementById('txDate').value = new Date().toISOString().split('T')[0];
  showError('');
}

document.addEventListener('dashSessionLoaded', function() {
  var user = window.dashUser;
  if (!user) { window.location.href = '/public/login.html'; return; }

  var role = (user.role || '').toLowerCase();
  var dashUrl = role === 'admin' ? '/app/dashboard/admin.html' : '/app/dashboard/employee-dashboard.html';
  var homeLink = document.getElementById('dashHomeLink');
  if (homeLink) homeLink.href = dashUrl;

  insertHeaderTitle();
  document.getElementById('loading').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';

  loadTanks();
  loadProjects();
});
</script>

<script src="/app/shared/auth-check.js?v=8"></script>
