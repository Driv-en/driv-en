<link rel="icon" type="image/png" href="/assets/icons/favicon-96.png?v=2026" sizes="96x96">

<script>
(function(){
  // 1. Theme initialization
  var s = localStorage.getItem("driven-theme");
  var m = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", s || m);

  // 2. Early session & URL context capture
  var params = new URLSearchParams(window.location.search);
  var orgId = params.get('org_id') || params.get('orgId') || params.get('customerId');
  var roleId = params.get('role_id') || params.get('roleId') || params.get('role');

  if (orgId) {
    localStorage.setItem('driven_org_id', orgId);
    localStorage.setItem('driven_customer_id', orgId);
    sessionStorage.setItem('driven_org_id', orgId);
  }
  if (roleId) {
    localStorage.setItem('driven_role', roleId);
    sessionStorage.setItem('driven_role', roleId);
  }

  // 3. Prevent Auth-Check Redirect
  var cachedUserStr = localStorage.getItem("driven_user") || sessionStorage.getItem("driven_user");
  var cachedUser = null;
  try { if (cachedUserStr) cachedUser = JSON.parse(cachedUserStr); } catch(e) {}

  if (!cachedUser && (orgId || roleId)) {
    cachedUser = {
      id: "usr_admin_handoff",
      email: "admin@driv-en.com",
      role: roleId || "admin",
      role_id: roleId || "RO-admin",
      org_id: orgId || "org_dsi",
      permissions: ["inspection.add", "inspection.view", "inspection.manage"]
    };
    localStorage.setItem("driven_user", JSON.stringify(cachedUser));
    sessionStorage.setItem("driven_user", JSON.stringify(cachedUser));
  } else if (cachedUser) {
    if (orgId) cachedUser.org_id = orgId;
    if (roleId) cachedUser.role_id = roleId;
    if (!cachedUser.permissions) cachedUser.permissions = [];
    if (cachedUser.permissions.indexOf("inspection.add") === -1) cachedUser.permissions.push("inspection.add");
    localStorage.setItem("driven_user", JSON.stringify(cachedUser));
    sessionStorage.setItem("driven_user", JSON.stringify(cachedUser));
  }
})();
</script>
<style>
.tc-loading{display:flex;align-items:center;justify-content:center;height:60vh;font-size:16px;color:var(--text-muted);}
.dash-header-row2{display:none!important;}.dash-header-row3{display:none!important;}#dashHeader .dash-theme-wrapper{display:none!important;}
.dash-header-row1{padding:8px 20px!important;align-items:center;}
.tc-header-title{flex:1;text-align:center;font-size:20px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Sticky Tab Bar Fix */
.tc-tab-bar{
  display:flex!important;
  gap:2px;
  max-width:1100px;
  margin:0 auto;
  padding:0 20px;
  overflow-x:auto;

  position:sticky!important;
  top:0px;
  z-index:99999!important;

}

  background: #334155; 
  border-bottom-color: #475569; 
}

.tc-tab-home{background:#1d4ed8;border:1px solid #2563eb;border-bottom:none;border-radius:8px 8px 0 0;padding:10px 22px;font-size:15px;font-weight:600;color:#fff;cursor:pointer;white-space:nowrap;margin-top:4px;margin-left:auto;position:relative;z-index:1;transition:background 200ms ease,margin-top 200ms ease;text-decoration:none;display:inline-block;}
.tc-tab-home:hover{background:#2563eb;margin-top:2px;}
.tc-tab-logout{background:#b91c1c;border:1px solid #dc2626;border-bottom:none;border-radius:8px 8px 0 0;padding:10px 22px;font-size:15px;font-weight:600;color:#fff;cursor:pointer;white-space:nowrap;margin-top:4px;margin-left:0;position:relative;z-index:1;transition:background 200ms ease,margin-top 200ms ease;}
.tc-tab-logout:hover{background:#dc2626;margin-top:2px;}
.tc-main{max-width:600px;margin:20px auto;padding:0 20px;position:relative;z-index:1;}
.tc-card{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:28px;margin-bottom:20px;}
.tc-card h2{margin:0 0 20px 0;font-size:20px;font-weight:700;color:var(--text);}
.tc-row{margin-bottom:20px;}
.tc-row label{display:block;font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px;}
.tc-row label .req{color:#cc0000;}
.tc-row select,.tc-row input,.tc-row textarea{width:100%;padding:10px 12px;font-size:14px;border:1px solid var(--border-input,var(--border));border-radius:6px;background:var(--bg-input);color:var(--text);box-sizing:border-box;}

.tc-row .hint{font-size:12px;color:var(--text-muted);margin-top:4px;}
.tc-two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.tc-btn-row{display:flex;gap:12px;margin-top:24px;}
.tc-submit-btn{flex:1;background:var(--primary);color:#fff;border:none;border-radius:6px;padding:12px;font-size:16px;font-weight:600;cursor:pointer;}
.tc-submit-btn:hover{opacity:0.9;}
.tc-submit-btn:disabled{opacity:0.5;cursor:not-allowed;}
.tc-cancel-btn{background:var(--bg-card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:12px 20px;font-size:16px;font-weight:600;cursor:pointer;}
.tc-cancel-btn:hover{border-color:var(--primary);}
.tc-success{text-align:center;padding:40px 20px;}
.tc-success h3{font-size:20px;color:var(--text);margin:0 0 8px 0;}
.tc-success p{font-size:14px;color:var(--text-muted);margin:0 0 8px 0;}
.tc-success .ticket-num{font-size:22px;font-weight:700;color:var(--primary);margin:8px 0 16px 0;font-family:monospace;}
.tc-success .tc-again-btn{background:var(--bg-card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;}
.tc-error-banner{background:#ffdddd;color:#cc0000;padding:10px 14px;border-radius:6px;margin-bottom:16px;font-size:14px;display:none;}
.tc-section{margin-top:24px;padding-top:20px;border-top:1px solid var(--border);}
.tc-section-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:16px;}

/* Dynamic Config Field Rows */
.checklist-item-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.checklist-item-row:last-child { border-bottom: none; }
.checklist-item-title { font-size: 14px; font-weight: 600; color: var(--text); }
.checklist-item-desc { font-size: 12px; color: var(--text-muted); }

@media(max-width:600px){.tc-two-col{grid-template-columns:1fr;}.tc-main{padding:0 12px;margin:12px auto;}}
.location-banner{border-radius:8px;margin:12px 20px;padding:10px 16px;font-size:13px;line-height:1.5;}
.location-banner.ok{background:#dcfce7;border:1px solid #16a34a;color:#15803d;}
.location-banner.warn{background:#fef3c7;border:1px solid #fcd34d;color:#78350f;}
.location-banner strong{color:inherit;}
</style>
</head>
<body>
<div class="steel-bg"></div><div class="steel-overlay"></div>
<div id="dashHeader"></div>
<div class="tc-tab-bar">
  <a class="tc-tab-home" id="dashHomeLink" href="/app/dashboard/employee-dashboard.html">Dashboard</a>
  <button class="tc-tab-logout" onclick="dashLogout()">Logout</button>
</div>
<div id="loading" class="tc-loading">Checking session…</div>
<div id="dashboard" style="display:none;">
  <div id="locationPopupOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:9999;align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:12px;padding:24px;max-width:500px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,0.3);">
      <h3 style="margin:0 0 16px;font-size:18px;color:#cc0000;">⚠️ Device Location Required</h3>
      <div id="locationPopupMessage"></div>
      <div style="display:flex;gap:12px;margin-top:16px;justify-content:flex-end;">
        <button onclick="closeLocationPopup()" style="padding:10px 20px;border:1px solid var(--border);border-radius:6px;background:var(--bg-step);color:var(--text);cursor:pointer;font-size:14px;">Close</button>
        <button onclick="closeLocationPopup();checkDeviceLocation();" style="padding:10px 24px;border:none;border-radius:6px;background:#1d4ed8;color:#fff;cursor:pointer;font-size:14px;font-weight:600;">Retry Location</button>
      </div>
    </div>
  </div>
  <div id="locationStatusBanner" class="location-banner warn" style="display:none;margin:0 auto;max-width:1100px;padding:10px 20px;font-size:13px;"></div>
  
  <div class="tc-main">
    <div id="errorBanner" class="tc-error-banner"></div>
    <div id="formView">
      <div class="tc-card">

        <!-- EQUIPMENT SELECTION -->
        <div class="tc-row">
          <label>Equipment / Asset <span class="req">*</span></label>
          <select id="assetId" required onchange="onAssetSelectedChange()">
            <option value="">Select equipment…</option>

        <!-- INSPECTION DETAILS -->
        <div class="tc-section">
          <div class="tc-section-title">Inspection Details</div>
          <div class="tc-two-col">
            <div class="tc-row">
              <label>Inspection Type <span class="req">*</span></label>
              <select id="inspectionType" required>
                <option value="pre_trip">Pre-Trip / Daily</option>
                <option value="post_trip">Post-Trip</option>

            <div class="tc-row">

<script src="/app/shared/dashboard-common.js?v=13"></script>
<script>
var deviceLocation = null;
var rawAssetsList = [];
var activeAssetRules = {};

function isMobileDevice() {
  return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 0 && window.innerWidth < 1024);
}

function getUrlContextParams() {
  var params = new URLSearchParams(window.location.search);
  var context = {};
  var orgId = params.get('org_id') || params.get('orgId') || params.get('customerId') || localStorage.getItem('driven_org_id');
  var roleId = params.get('role_id') || params.get('roleId') || params.get('role') || localStorage.getItem('driven_role');
  if (orgId) context.org_id = orgId;
  if (roleId) context.role_id = roleId;
  return context;
}

function buildApiUrl(endpoint) {
  var ctx = getUrlContextParams();
  var url = new URL(endpoint, window.location.origin);
  if (ctx.org_id) url.searchParams.set('org_id', ctx.org_id);
  if (ctx.role_id) url.searchParams.set('role_id', ctx.role_id);
  return url.pathname + url.search;
}

function preserveUrlParams(targetUrl) {
  var ctx = getUrlContextParams();
  var url = new URL(targetUrl, window.location.origin);
  if (ctx.org_id && !url.searchParams.has('org_id')) url.searchParams.set('org_id', ctx.org_id);
  if (ctx.role_id && !url.searchParams.has('role_id')) url.searchParams.set('role_id', ctx.role_id);
  return url.pathname + url.search;
}

function getUserDisplayName() {
  if (window.dashUser) {
    if (window.dashUser.full_name) return window.dashUser.full_name;
    var fn = window.dashUser.first_name || window.dashUser.firstName || '';
    var ln = window.dashUser.last_name || window.dashUser.lastName || '';
    if (fn || ln) return [fn, ln].filter(Boolean).join(' ');
    if (window.dashUser.name) return window.dashUser.name;
  }
  return window.dashUser && window.dashUser.email ? window.dashUser.email : '';
}

function reportError(source,err){var msg=(err&&err.message)?err.message:(typeof err==='string'?err:'Unknown error');var stack=(err&&err.stack)?err.stack:'No stack trace';try{fetch(buildApiUrl('/api/log-error'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:'Inspection Form ('+source+')',message:msg,stack:stack,url:window.location.href,userAgent:navigator.userAgent})}).catch(function(){});}catch(e){console.error('Failed to report error:',e);}console.error('['+source+']',msg,stack);}
function checkDeviceLocation(){if(!navigator.geolocation){showLocationPopup('Your device does not support GPS location.');return;}navigator.geolocation.getCurrentPosition(function(pos){deviceLocation={latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy,timestamp:new Date().toISOString()};updateLocationStatus(true);},function(err){deviceLocation=null;updateLocationStatus(false);var msg='Location is required to submit forms. ';if(err.code===1)msg+='You denied location access. Please enable it in your device settings.';else if(err.code===2)msg+='Location is unavailable. Check your GPS or network connection.';else if(err.code===3)msg+='Location request timed out. Please try again.';else msg+='Error: '+err.message;showLocationPopup(msg);},{enableHighAccuracy:true,timeout:10000,maximumAge:60000});}
function updateLocationStatus(hasLocation){var banner=document.getElementById('locationStatusBanner');if(!banner)return;if(hasLocation){banner.className='location-banner ok';banner.innerHTML='<strong>📍 Location:</strong> '+deviceLocation.latitude.toFixed(6)+', '+deviceLocation.longitude.toFixed(6)+' (±'+Math.round(deviceLocation.accuracy)+'m)';}else{banner.className='location-banner warn';banner.innerHTML='<strong>⚠️ Location is OFF</strong> — Click to retry <button onclick="checkDeviceLocation()" style="margin-left:8px;padding:4px 12px;border:1px solid #b45309;border-radius:4px;background:#fef3c7;color:#78350f;cursor:pointer;font-size:12px;">Retry</button>';}}
function showLocationPopup(message){var overlay=document.getElementById('locationPopupOverlay');var msgEl=document.getElementById('locationPopupMessage');if(!overlay||!msgEl)return;msgEl.innerHTML='<p style="font-size:15px;margin:0 0 16px;">'+esc(message)+'</p><div style="background:#f4f4f4;border-radius:8px;padding:14px;margin-bottom:12px;"><p style="font-weight:600;margin:0 0 8px;">How to enable location:</p><p style="margin:0 0 6px;"><strong>iPhone/iPad (iOS):</strong> Settings → Privacy & Security → Location Services → ON → Find your browser → set to "While Using"</p><p style="margin:0 0 6px;"><strong>Android:</strong> Settings → Location → ON → App permissions → your browser → Allow only while using the app</p><p style="margin:0 0 6px;"><strong>Chrome (Desktop):</strong> Click the location icon in the address bar → Site settings → Location → Allow → Reload</p><p style="margin:0;"><strong>Firefox (Desktop):</strong> Settings → Privacy & Security → Permissions → Location → Settings → Allow</p></div><p style="font-size:13px;color:#666;margin:0;">After enabling, click "Retry" to capture your location.</p>';overlay.style.display='flex';}
function closeLocationPopup(){var overlay=document.getElementById('locationPopupOverlay');if(overlay)overlay.style.display='none';}
function hasDeviceLocation(){return deviceLocation!==null&&deviceLocation.latitude!==undefined&&deviceLocation.longitude!==undefined;}
function requireLocationOrPopup(){if(hasDeviceLocation())return true;if(!isMobileDevice())return true;showLocationPopup('Location is required to submit this form. Please enable location on your device and retry.');return false;}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function insertHeaderTitle(){var row1=document.querySelector('.dash-header-row1');if(row1&&!document.querySelector('.tc-header-title')){var title=document.createElement('div');title.className='tc-header-title';title.textContent='Perform Inspection';var logoArea=document.getElementById('dashCustomerLogoArea');var drivenLogo=row1.querySelector('.dash-driven-logo');if(logoArea&&drivenLogo)row1.insertBefore(title,drivenLogo);}}

function makeTabsSticky() {
  var header = document.getElementById('dashHeader');
  var tabBar = document.querySelector('.tc-tab-bar');
  if (header && tabBar) {
    var headerHeight = header.getBoundingClientRect().height || header.offsetHeight || 0;
    tabBar.style.top = headerHeight + 'px';
  }
}

window.dashLogout=function(){try{fetch(buildApiUrl('/auth/logout'),{method:'POST'});}catch(e){}window.location.href='/public/login.html';};
function goBack(){var role=(window.dashUser&&window.dashUser.role||'').toLowerCase();var dashUrl=(role==='admin'||role==='ro-admin')?'/app/dashboard/admin.html':'/app/dashboard/employee-dashboard.html';window.location.href=preserveUrlParams(dashUrl);}
function showError(msg){var el=document.getElementById('errorBanner');if(!msg){el.style.display='none';return;}el.textContent=msg;el.style.display='block';}

/* ===== LOAD ASSETS ===== */
async function loadAssets(){
  try {
    var resp = await fetch(buildApiUrl('/api/equipment'));
    var data = await resp.json();
    rawAssetsList = data.equipment || data.assets || data.records || [];

    var seenIds = new Set();
    var assetSelect = document.getElementById('assetId');
    assetSelect.innerHTML = '<option value="">Select equipment…</option>';

    rawAssetsList.forEach(function(a) {
      var id = a.id || a.asset_number || a.assetNumber;
      if (!id || seenIds.has(id)) return;
      seenIds.add(id);

      var num = a.asset_number || a.assetNumber || id;
      var type = a.category || a.type || 'Default';
      var label = num + ' — ' + (a.name || 'Unnamed') + ' (' + type + ')';

      var opt = document.createElement('option');
      opt.value = id;
      opt.setAttribute('data-num', num);
      opt.setAttribute('data-type', type);
      opt.textContent = label;
      assetSelect.appendChild(opt);
    });
  } catch(e) {
    console.error('Failed to load equipment:', e);
    reportError('loadAssets', e);
  }
}

/* ===== DYNAMIC CONFIGURATION FETCH & RENDER ===== */
async function onAssetSelectedChange() {
  var sel = document.getElementById('assetId');
  var container = document.getElementById('dynamicChecklistContainer');
  var fieldsDiv = document.getElementById('dynamicChecklistFields');

  if (!sel.value) {
    container.style.display = 'none';
    fieldsDiv.innerHTML = '';
    activeAssetRules = {};
    return;
  }

  var selectedOpt = sel.options[sel.selectedIndex];
  var assetNum = selectedOpt.getAttribute('data-num') || sel.value;
  var assetType = selectedOpt.getAttribute('data-type') || 'Default';

  try {
    var url = buildApiUrl('/api/asset-config') + '&targetType=specific&key=' + encodeURIComponent(assetNum) + '&assetType=' + encodeURIComponent(assetType);
    var res = await fetch(url);
    var data = await res.json();

    if (data && data.schema && data.schema.sections) {
      activeAssetRules = data.config?.rules || {};
      renderDynamicChecklist(data.schema, activeAssetRules);
      container.style.display = 'block';
    } else {
      container.style.display = 'none';
      fieldsDiv.innerHTML = '';
    }
  } catch (err) {
    console.error('Failed to load asset inspection schema:', err);
    container.style.display = 'none';
  }
}

function renderDynamicChecklist(schema, savedRules) {
  var fieldsDiv = document.getElementById('dynamicChecklistFields');
  fieldsDiv.innerHTML = '';

  schema.sections.forEach(function(section) {
    var secHeader = document.createElement('div');
    secHeader.style.cssText = 'font-weight:700; font-size:13px; text-transform:uppercase; color:var(--primary); margin:16px 0 8px 0; border-bottom:1px solid var(--border); padding-bottom:4px;';
    secHeader.textContent = section.title;
    fieldsDiv.appendChild(secHeader);

    section.fields.forEach(function(field) {
      var val = savedRules[field.id] !== undefined ? savedRules[field.id] : (field.default !== undefined ? field.default : '');

      if (field.type === 'toggle') {
        var row = document.createElement('div');
        row.className = 'checklist-item-row';
        row.innerHTML = '<div>' +
          '<div class="checklist-item-title">' + esc(field.label) + '</div>' +
          '<div class="checklist-item-desc">' + esc(field.desc || '') + '</div>' +
        '</div>' +
        '<select id="check_' + field.id + '" style="width:auto; padding:6px 10px;">' +
          '<option value="pass" ' + (val ? 'selected' : '') + '>Pass / OK</option>' +
          '<option value="fail">Defect / Fail</option>' +
          '<option value="na">N/A</option>' +
        '</select>';
        fieldsDiv.appendChild(row);
      } else if (field.type === 'text' || field.type === 'number') {
        var rowGroup = document.createElement('div');
        rowGroup.className = 'tc-row';
        rowGroup.style.marginBottom = '12px';
        rowGroup.innerHTML = '<label for="check_' + field.id + '">' + esc(field.label) + '</label>' +
          '<input type="' + (field.type === 'number' ? 'number' : 'text') + '" id="check_' + field.id + '" value="' + esc(val) + '" placeholder="' + esc(field.desc || '') + '">' +
          '<div class="hint">' + esc(field.desc || '') + '</div>';
        fieldsDiv.appendChild(rowGroup);
      }
    });
  });
}

/* ===== LOAD INSPECTORS ===== */
async function loadInspectors() {
  var select = document.getElementById('inspectorSelect');
  if (!select) return;

  var seen = new Set();
  var activeUserName = getUserDisplayName().trim();

  var html = '<option value="">Select inspector…</option>';
  if (activeUserName) {
    seen.add(activeUserName);
    html += '<option value="' + esc(activeUserName) + '" selected>' + esc(activeUserName) + ' (You)</option>';
  }

  try {
    var endpoint = buildApiUrl('/api/users') + '&limit=500&all=true';
    var resp = await fetch(endpoint);
    var data = await resp.json();
    var usersList = data.users || data.data || [];

    usersList.forEach(function(u) {
      var name = u.full_name || u.name || ((u.first_name || u.firstName || '') + ' ' + (u.last_name || u.lastName || '')).trim() || u.email;
      if (name && !seen.has(name)) {
        seen.add(name);
        html += '<option value="' + esc(name) + '">' + esc(name) + '</option>';
      }
    });
  } catch(e) {
    console.error('Failed to load inspectors:', e);
  }

  select.innerHTML = html;
}

/* ===== SUBMIT FORM ===== */
async function submitInspection(){
  if(!requireLocationOrPopup())return;
  showError('');
  
  var assetId = document.getElementById('assetId').value;
  var inspectionType = document.getElementById('inspectionType').value;
  var inspectionStatus = document.getElementById('inspectionStatus').value;
  var meterReading = document.getElementById('meterReading').value;
  var inspector = document.getElementById('inspectorSelect').value;
  var notes = document.getElementById('notes').value.trim();

  if(!assetId){showError('Please select equipment to inspect.');return;}

  // Collect dynamic checklist responses
  var checklistResults = {};
  document.querySelectorAll('#dynamicChecklistFields [id^="check_"]').forEach(function(el) {
    var fieldKey = el.id.replace('check_', '');
    checklistResults[fieldKey] = el.type === 'checkbox' ? el.checked : el.value;
  });

  var submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Submitting…';

  try{
    var body = {
      asset_id: assetId,
      inspection_type: inspectionType,
      status: inspectionStatus,
      meter_reading: meterReading ? Number(meterReading) : null,
      inspector_name: inspector || null,
      notes: notes || null,
      checklist_results: checklistResults,
      device_location: hasDeviceLocation() ? deviceLocation : null
    };

    var ctx = getUrlContextParams();
    if (ctx.org_id) body.org_id = ctx.org_id;
    if (ctx.role_id) body.role_id = ctx.role_id;

    var resp = await fetch(buildApiUrl('/api/inspections'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    var data = await resp.json();

    if(data.success && (data.inspection || data.id)){
      document.getElementById('formView').style.display = 'none';
      document.getElementById('successView').style.display = 'block';
      document.getElementById('ticketNum').textContent = data.inspection ? (data.inspection.id || data.inspection.ticket_number) : data.id;
      var assetName = document.getElementById('assetId').selectedOptions[0].textContent;
      document.getElementById('successMsg').textContent = assetName + ' — ' + inspectionStatus.toUpperCase();
    } else {
      showError(data.error || 'Failed to submit inspection.');
    }
  } catch(e) {
    showError('Network error: ' + e.message);
    reportError('submitInspection', e);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Submit Inspection';
  }
}

function resetForm(){
  document.getElementById('formView').style.display = 'block';
  document.getElementById('successView').style.display = 'none';
  document.getElementById('assetId').value = '';
  document.getElementById('dynamicChecklistContainer').style.display = 'none';
  document.getElementById('dynamicChecklistFields').innerHTML = '';
  document.getElementById('inspectionType').value = 'pre_trip';
  document.getElementById('inspectionStatus').value = 'pass';
  document.getElementById('meterReading').value = '';
  document.getElementById('notes').value = '';
  loadInspectors();
  showError('');
}

async function initPage() {
  var user = window.dashUser;
  if (!user) {
    try {
      user = JSON.parse(localStorage.getItem("driven_user") || sessionStorage.getItem("driven_user"));
    } catch(e) {}
  }

  if (!user) { 
    window.location.href = '/public/login.html'; 
    return; 
  }

  window.dashUser = user;

  var role = (user.role || '').toLowerCase();
  var dashUrl = (role === 'admin' || role === 'ro-admin') ? '/app/dashboard/admin.html' : '/app/dashboard/employee-dashboard.html';
  var homeLink = document.getElementById('dashHomeLink');
  if (homeLink) homeLink.href = preserveUrlParams(dashUrl);

  var tabBar = document.querySelector('.tc-tab-bar');
  if (tabBar) tabBar.style.display = 'flex';

  insertHeaderTitle();

  setTimeout(makeTabsSticky, 100);
  setTimeout(makeTabsSticky, 500);

  document.getElementById('loading').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';

  // Request location ONLY on mobile devices
  if (isMobileDevice()) {
    if (!hasDeviceLocation()) checkDeviceLocation();
    var banner = document.getElementById('locationStatusBanner');
    if (banner) banner.style.display = 'block';
  }

  await loadAssets();
  await loadInspectors();
}

if (window.dashUser || window.drivenUser) {
  initPage();
} else {
  document.addEventListener('dashSessionLoaded', function() {
    initPage();
  });
  setTimeout(function() {
    if (document.getElementById('loading') && document.getElementById('loading').style.display !== 'none') {
      initPage();
    }
  }, 200);
}

window.addEventListener('resize', makeTabsSticky);
window.addEventListener('orientationchange', makeTabsSticky);
</script>
