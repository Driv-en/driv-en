<script>
(function() {
  var saved = localStorage.getItem("driven-theme");
  var system = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  var theme = saved || system;
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>

<style>
.tc-loading{display:flex;align-items:center;justify-content:center;height:60vh;font-size:16px;color:var(--text-muted);}
.dash-header-row2 { display: none !important; }
.dash-header-row3 { display: none !important; }
#dashHeader .dash-theme-wrapper { display: none !important; }
.dash-header-row1 { padding: 8px 20px !important; align-items: center; }
.tc-header-title { flex: 1; text-align: center; font-size: 20px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tc-tab-bar { display: flex; gap: 2px; max-width: 1100px; margin: 0 auto; padding: 0 20px; overflow-x: auto; position: relative; z-index: 1; background: #cbd5e1; border-bottom: 2px solid #94a3b8; }
.tc-tab-home { background: #1d4ed8; border: 1px solid #2563eb; border-bottom: none; border-radius: 8px 8px 0 0; padding: 10px 22px; font-size: 15px; font-weight: 600; color: #fff; cursor: pointer; white-space: nowrap; margin-top: 4px; margin-left: auto; position: relative; z-index: 1; transition: background 200ms ease, margin-top 200ms ease; text-decoration: none; display: inline-block; }
.tc-tab-home:hover { background: #2563eb; margin-top: 2px; }
.tc-tab-logout { background: #b91c1c; border: 1px solid #dc2626; border-bottom: none; border-radius: 8px 8px 0 0; padding: 10px 22px; font-size: 15px; font-weight: 600; color: #fff; cursor: pointer; white-space: nowrap; margin-top: 4px; margin-left: 0; position: relative; z-index: 1; transition: background 200ms ease, margin-top 200ms ease; }
.tc-tab-logout:hover { background: #dc2626; margin-top: 2px; }
.tc-main { max-width: 600px; margin: 20px auto; padding: 0 20px; position: relative; z-index: 1; }
.tc-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 28px; margin-bottom: 20px; }
.tc-card h2 { margin: 0 0 20px 0; font-size: 20px; font-weight: 700; color: var(--text); }
.tc-row { margin-bottom: 20px; }
.tc-row label { display: block; font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.tc-row label .req { color: #cc0000; }
.tc-row select, .tc-row input, .tc-row textarea { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid var(--border-input, var(--border)); border-radius: 6px; background: var(--bg-input); color: var(--text); box-sizing: border-box; }
.tc-row select:focus, .tc-row input:focus, .tc-row textarea:focus { outline: none; border-color: var(--primary); }
.tc-row textarea { resize: vertical; min-height: 60px; }
.tc-row .hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.tc-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.tc-btn-row { display: flex; gap: 12px; margin-top: 24px; }
.tc-submit-btn { flex: 1; background: var(--primary); color: #fff; border: none; border-radius: 6px; padding: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
.tc-submit-btn:hover { opacity: 0.9; }
.tc-submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.tc-cancel-btn { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 12px 20px; font-size: 16px; font-weight: 600; cursor: pointer; }
.tc-cancel-btn:hover { border-color: var(--primary); }
.tc-success { text-align: center; padding: 40px 20px; }
.tc-success h3 { font-size: 20px; color: var(--text); margin: 0 0 8px 0; }
.tc-success p { font-size: 14px; color: var(--text-muted); margin: 0 0 8px 0; }
.tc-success .ticket-num { font-size: 22px; font-weight: 700; color: var(--primary); margin: 8px 0 16px 0; font-family: monospace; }
.tc-success .tc-again-btn { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
.tc-error-banner { background: #ffdddd; color: #cc0000; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; display: none; }
.tc-section { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
.tc-section-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 16px; }
@media (max-width: 600px) {
  .tc-two-col { grid-template-columns: 1fr; }
  .tc-main { padding: 0 12px; margin: 12px auto; }
}

<body data-page-title="Create Transfer Ticket" data-required-permission="transfer.add">

<div class="steel-bg"></div>
<div class="steel-overlay"></div>

<div id="dashHeader"></div>

<div class="tc-tab-bar">
  <a class="tc-tab-home" id="dashHomeLink" href="/app/dashboard/employee-dashboard.html">Dashboard</a>
  <button class="tc-tab-logout" onclick="dashLogout()">Logout</button>
</div>

<div id="loading" class="tc-loading">Checking session…</div>

<div id="dashboard" style="display:none;">
  <div class="tc-main">

    <div id="errorBanner" class="tc-error-banner"></div>

    <!-- ===== FORM VIEW ===== -->
    <div id="formView">
      <div class="tc-card">
        <h2>Create Transfer Ticket</h2>

        <!-- Equipment -->
        <div class="tc-row">
          <label>Equipment to Transfer <span class="req">*</span></label>
          <select id="assetId" required>
            <option value="">Select equipment…</option>
          </select>
          <div class="hint">Search by asset number or name</div>
        </div>

        <!-- FROM -->
        <div class="tc-section">
          <div class="tc-section-title">From (current location)</div>

          <div class="tc-two-col">
            <div class="tc-row">
              <label>Project / Jobsite</label>
              <select id="fromProject">
                <option value="">No project…</option>
              </select>
            </div>
            <div class="tc-row">
              <label>Location</label>
              <input type="text" id="fromLocation" placeholder="Yard, shop, site name…">
            </div>
          </div>
        </div>

        <!-- TO -->
        <div class="tc-section">
          <div class="tc-section-title">To (destination)</div>

          <div class="tc-two-col">
            <div class="tc-row">
              <label>Project / Jobsite</label>
              <select id="toProject">
                <option value="">No project…</option>
              </select>
            </div>
            <div class="tc-row">
              <label>Location <span class="req">*</span></label>
              <input type="text" id="toLocation" placeholder="Where is it going?" required>
            </div>
          </div>
        </div>

        <!-- CARRIER -->
        <div class="tc-section">
          <div class="tc-section-title">Carrier (who is moving it)</div>

          <div class="tc-row">
            <label>Carrier Type</label>
            <select id="carrierType" onchange="onCarrierChange()">
              <option value="internal">Internal (our crew)</option>
              <option value="third_party">Third Party (hired transport)</option>
            </select>
          </div>

          <div class="tc-two-col">
            <div class="tc-row" id="carrierNameRow" style="display:none;">
              <label>Carrier Company Name</label>
              <input type="text" id="carrierName" placeholder="Transport company">
            </div>
            <div class="tc-row">
              <label>Driver / Operator</label>
              <input type="text" id="carrierDriver" placeholder="Who is driving / operating">
            </div>
          </div>
        </div>

        <!-- NOTES -->
        <div class="tc-row">
          <label>Notes (optional)</label>
          <textarea id="notes" placeholder="Any additional details about this transfer…"></textarea>
        </div>

        <div class="tc-btn-row">
          <button class="tc-cancel-btn" onclick="goBack()">Cancel</button>
          <button class="tc-submit-btn" id="submitBtn" onclick="submitTransfer()">Create Ticket</button>
        </div>
      </div>
    </div>

    <!-- ===== SUCCESS VIEW ===== -->
    <div id="successView" style="display:none;">
      <div class="tc-card tc-success">
        <h3>✓ Transfer Ticket Created</h3>
        <p>Ticket Number:</p>
        <div class="ticket-num" id="ticketNum"></div>
        <p id="successMsg"></p>
        <div style="margin-top:20px;">
          <button class="tc-again-btn" onclick="resetForm()">Create Another Transfer</button>
        </div>
      </div>
    </div>

  </div>
</div>

<div id="dashFooter"></div>

<script src="/app/shared/dashboard-common.js?v=8"></script>

<script>
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function insertHeaderTitle() {
  var row1 = document.querySelector('.dash-header-row1');
  if (row1 && !document.querySelector('.tc-header-title')) {
    var title = document.createElement('div');
    title.className = 'tc-header-title';
    title.textContent = 'Create Transfer Ticket';
    var logoArea = document.getElementById('dashCustomerLogoArea');
    var drivenLogo = row1.querySelector('.dash-driven-logo');
    if (logoArea && drivenLogo) row1.insertBefore(title, drivenLogo);
  }
}

window.dashLogout = function() {
  try { fetch('/auth/logout', { method: 'POST' }); } catch (e) {}
  window.location.href = '/public/login.html';
};

function goBack() {
  var role = (window.dashUser && window.dashUser.role || '').toLowerCase();
  window.location.href = role === 'admin' ? '/app/dashboard/admin.html' : '/app/dashboard/employee-dashboard.html';
}

function showError(msg) {
  var el = document.getElementById('errorBanner');
  if (!msg) { el.style.display = 'none'; return; }
  el.textContent = msg;
  el.style.display = 'block';
}

function onCarrierChange() {
  var type = document.getElementById('carrierType').value;
  var nameRow = document.getElementById('carrierNameRow');
  if (type === 'third_party') {
    nameRow.style.display = 'block';
  } else {
    nameRow.style.display = 'none';
    document.getElementById('carrierName').value = '';
  }
}

// ===== LOAD DATA =====
async function loadAssets() {
  try {
    var resp = await fetch('/api/equipment');
    var data = await resp.json();
    if (data.success && data.equipment) {
      var select = document.getElementById('assetId');
      data.equipment.forEach(function(a) {
        var opt = document.createElement('option');
        opt.value = a.id;
        opt.textContent = (a.asset_number || a.id.slice(0,8)) + ' — ' + (a.name || 'Unnamed');
        select.appendChild(opt);
      });
    }
  } catch (e) {
    console.error('Failed to load equipment:', e);
  }
}

async function loadProjects() {
  try {
    var resp = await fetch('/api/projects');
    var data = await resp.json();
    if (data.success && data.projects) {
      var fromSel = document.getElementById('fromProject');
      var toSel = document.getElementById('toProject');
      data.projects.forEach(function(p) {
        var opt1 = document.createElement('option');
        opt1.value = p.id;
        opt1.textContent = p.name || p.project_name || p.id;
        fromSel.appendChild(opt1);

        var opt2 = document.createElement('option');
        opt2.value = p.id;
        opt2.textContent = p.name || p.project_name || p.id;
        toSel.appendChild(opt2);
      });
    }
  } catch (e) {}
}

// ===== SUBMIT =====
async function submitTransfer() {
  showError('');

  var assetId = document.getElementById('assetId').value;
  var fromProjectId = document.getElementById('fromProject').value;
  var fromLocation = document.getElementById('fromLocation').value.trim();
  var toProjectId = document.getElementById('toProject').value;
  var toLocation = document.getElementById('toLocation').value.trim();
  var carrierType = document.getElementById('carrierType').value;
  var carrierName = document.getElementById('carrierName').value.trim();
  var carrierDriver = document.getElementById('carrierDriver').value.trim();
  var notes = document.getElementById('notes').value.trim();

  // Validation
  if (!assetId) { showError('Please select the equipment to transfer.'); return; }
  if (!toLocation) { showError('Please enter the destination location.'); return; }

  var submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Creating…';

  try {
    var body = {
      asset_id: assetId,
      from_project_id: fromProjectId || null,
      from_location: fromLocation || null,
      to_project_id: toProjectId || null,
      to_location: toLocation || null,
      carrier_type: carrierType,
      carrier_name: carrierName || null,
      carrier_driver: carrierDriver || null,
      notes: notes || null
    };

    var resp = await fetch('/api/transfers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    var data = await resp.json();

    if (data.success && data.transfer) {
      document.getElementById('formView').style.display = 'none';
      document.getElementById('successView').style.display = 'block';
      document.getElementById('ticketNum').textContent = data.transfer.ticket_number;
      var assetName = document.getElementById('assetId').selectedOptions[0].textContent;
      document.getElementById('successMsg').textContent =
        assetName + ' → ' + toLocation;
    } else {
      showError(data.error || 'Failed to create transfer ticket. Please try again.');
    }
  } catch (e) {
    showError('Network error: ' + e.message);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Create Ticket';
  }
}

function resetForm() {
  document.getElementById('formView').style.display = 'block';
  document.getElementById('successView').style.display = 'none';
  document.getElementById('assetId').value = '';
  document.getElementById('fromProject').value = '';
  document.getElementById('fromLocation').value = '';
  document.getElementById('toProject').value = '';
  document.getElementById('toLocation').value = '';
  document.getElementById('carrierType').value = 'internal';
  document.getElementById('carrierName').value = '';
  document.getElementById('carrierDriver').value = '';
  document.getElementById('notes').value = '';
  document.getElementById('carrierNameRow').style.display = 'none';
  showError('');
}

document.addEventListener('dashSessionLoaded', async function() {
  var user = window.dashUser;
  if (!user) { window.location.href = '/public/login.html'; return; }

  var role = (user.role || '').toLowerCase();
  var dashUrl = role === 'admin' ? '/app/dashboard/admin.html' : '/app/dashboard/employee-dashboard.html';
  var homeLink = document.getElementById('dashHomeLink');
  if (homeLink) homeLink.href = dashUrl;

  insertHeaderTitle();
  document.getElementById('loading').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';

  await loadAssets();
  loadProjects();
});
</script>

<script src="/app/shared/auth-check.js?v=8"></script>
