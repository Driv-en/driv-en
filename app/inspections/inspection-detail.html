<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inspection Detail | DRIV‑EN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/app/shared/dashboard.css?v=7">
</head>
<body>

  <header class="app-header">
    <div class="app-header-inner">
      <a href="/website/index.html" class="app-logo">
        <span class="logo-driv">DRIV</span><span class="logo-en">-EN</span>
      </a>
      <nav class="app-nav-desktop">
        <a href="/app/equipment/equipment.html">Equipment</a>
        <a href="/app/pm/pm.html">PM</a>
        <a href="/app/inspections/inspections.html">Inspections</a>
        <a href="/app/work-orders/workorders.html">Work Orders</a>
        <a href="/app/dashboard/admin.html">Admin</a>
      </nav>
      <button class="app-mobile-menu-btn" id="appMobileMenuBtn">☰</button>
    </div>
  </header>

  <nav class="app-nav-mobile" id="appNavMobile">
    <a href="/app/equipment/equipment.html">Equipment</a>
    <a href="/app/pm/pm.html">PM</a>
    <a href="/app/inspections/inspections.html">Inspections</a>
    <a href="/app/work-orders/workorders.html">Work Orders</a>
    <a href="/app/dashboard/admin.html">Admin</a>
  </nav>

  <div class="app-sticky-wrapper">
    <main class="app-main">

      <section class="app-page-header">
        <h1>Inspection Detail</h1>
        <p>Single inspection record and safety status.</p>
      </section>

      <section class="app-section">
        <h2 class="app-section-title">Inspection Info</h2>
        <div id="inspectionInfo">
          <!-- Equipment, operator, date -->
        </div>
      </section>

      <section class="app-section">
        <h2 class="app-section-title">Inspection Checklist</h2>
        <form class="app-form" id="inspectionForm">
          <div class="form-group">
            <label for="inspectionResult">Result</label>
            <select id="inspectionResult" name="inspectionResult">
              <option value="">Select...</option>
              <option value="pass">Pass</option>
              <option value="fail">Fail</option>
            </select>
          </div>
          <div class="form-group">
            <label for="inspectionSafetyFlag">Safety Flag</label>
            <select id="inspectionSafetyFlag" name="inspectionSafetyFlag">
              <option value="">Select...</option>
              <option value="none">None</option>
              <option value="safety_issue">Safety Issue</option>
            </select>
          </div>
          <div class="form-group">
            <label for="inspectionNotes">Notes</label>
            <textarea id="inspectionNotes" name="inspectionNotes"></textarea>
          </div>
          <button type="submit" class="app-btn-primary">Submit Inspection</button>
        </form>
      </section>

      <section class="app-section">
        <h2 class="app-section-title">Result Summary</h2>
        <div id="inspectionResultSummary">
          <!-- Summary, work order trigger info -->
        </div>
      </section>

    </main>

    <footer class="app-footer">
      <p>© 2026 DRIV‑EN — Built for the Field.</p>
    </footer>
  </div>

  <script>
    const mobileBtn = document.getElementById('appMobileMenuBtn');
    const mobileNav = document.getElementById('appNavMobile');
    mobileBtn.addEventListener('click', () => {
      mobileNav.classList.toggle('open');
    });

    const header = document.querySelector('.app-header');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 10) header.classList.add('sticky');
      else header.classList.remove('sticky');
    });

    // TODO: integrate with Worker: load inspection info, submit inspection, show result summary
  </script>
</body>
</html>
