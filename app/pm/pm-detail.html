<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PM Detail | DRIV‑EN</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/icons/favicon.png?v=2026" sizes="48x48">
  <link rel="icon" type="image/png" href="/assets/icons/favicon-96.png?v=2026" sizes="96x96">
  <link rel="icon" type="image/png" href="/assets/icons/favicon-192.png?v=2026" sizes="192x192">
  <link rel="apple-touch-icon" href="/assets/icons/favicon-180.png?v=2026">
  <link rel="stylesheet" href="/app/shared/dashboard.css?v=13">
  <link rel="stylesheet" href="/styles/diamond-plate.css?v=2">
  <script>
    (function() {
      var saved = localStorage.getItem("driven-theme");
      var system = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", saved || system);
    })();
  </script>
  <style>
    :root { --header-height: 60px; --card-green-border: #16a34a; }
    html, body { margin:0; padding:0; width:100%; background:var(--bg-body,#0f172a); color:var(--text,#f8fafc); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; transition:background-color 200ms ease,color 200ms ease; }
    :root[data-theme="light"] body { background:#f1f5f9; color:#0f172a; }
    :root[data-theme="dark"] body { background:#0f172a; color:#f8fafc; }
    .dash-header-row3{display:none!important;} #dashHeader .dash-theme-wrapper{display:none!important;} .dash-header-row2{display:none!important;}
    #dashHeader,.dash-header{position:sticky!important;top:0!important;z-index:101!important;background:var(--bg-card,#fff);width:100%;box-sizing:border-box;border-bottom:2px solid var(--card-green-border);}
    .pmd-tab-bar{display:flex!important;gap:2px;max-width:1100px;margin:0 auto;padding:0 16px;overflow-x:auto;position:sticky!important;top:var(--header-height,60px)!important;z-index:100!important;background:#cbd5e1;border-bottom:2px solid #94a3b8;box-sizing:border-box;-webkit-overflow-scrolling:touch;}
    :root[data-theme="dark"] .pmd-tab-bar{background:#334155;border-bottom-color:#475569;}
    .pmd-tab{background:#94a3b8;border:1px solid #64748b;border-bottom:none;border-radius:8px 8px 0 0;padding:10px 18px;font-size:14px;font-weight:500;color:#1e293b;cursor:pointer;white-space:nowrap;text-decoration:none;transition:color 200ms,background 200ms,margin-top 200ms;margin-top:4px;position:relative;z-index:1;display:inline-flex;align-items:center;}
    :root[data-theme="dark"] .pmd-tab{background:#475569;border-color:#64748b;color:#f1f5f9;}
    .pmd-tab:hover{color:#0f172a;background:#a5b4c4;margin-top:2px;}
    :root[data-theme="dark"] .pmd-tab:hover{color:#fff;background:#64748b;}
    .pmd-tab.active{color:#1d4ed8;background:#e2e8f0;border-color:#64748b;margin-top:0;font-weight:600;z-index:2;}
    :root[data-theme="dark"] .pmd-tab.active{color:#60a5fa;background:#1e293b;border-color:#475569;}
    .pmd-tab-dashboard{background:#2563eb;border:1px solid #1d4ed8;color:#fff;}
    .pmd-tab-dashboard:hover{background:#1d4ed8;color:#fff;margin-top:2px;}
    .pmd-tab-logout{background:#b91c1c;border:1px solid #dc2626;border-bottom:none;border-radius:8px 8px 0 0;padding:10px 18px;font-size:14px;font-weight:600;color:#fff;cursor:pointer;white-space:nowrap;margin-top:4px;margin-left:auto;position:relative;z-index:1;transition:background 200ms,margin-top 200ms;}
    .pmd-tab-logout:hover{background:#dc2626;margin-top:2px;}
    .pmd-main{width:100%;max-width:600px;margin:16px auto 80px auto;padding:0 16px;box-sizing:border-box;position:relative;z-index:1;}
    .pmd-card{background:var(--bg-card,#fff);border:2px solid var(--card-green-border);border-radius:8px;padding:20px;margin-bottom:20px;box-shadow:0 4px 6px rgba(0,0,0,0.08);color:var(--text,#0f172a);}
    :root[data-theme="dark"] .pmd-card{background:#1e293b;color:#f8fafc;}
    .pmd-card h2{margin:0 0 16px 0;font-size:18px;font-weight:700;color:var(--text,#0f172a);padding-bottom:12px;border-bottom:1px solid var(--border,#e2e8f0);}
    :root[data-theme="dark"] .pmd-card h2{border-bottom-color:#334155;}
    .pmd-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
    .pmd-info-item{display:flex;flex-direction:column;gap:4px;}
    .pmd-info-label{font-size:12px;font-weight:600;color:var(--text-muted,#64748b);text-transform:uppercase;letter-spacing:0.02em;}
    .pmd-info-value{font-size:15px;font-weight:600;color:var(--text,#0f172a);}
    .pmd-form-group{margin-bottom:16px;}
    .pmd-form-group label{display:block;font-size:14px;font-weight:600;color:var(--text,#0f172a);margin-bottom:6px;}
    .pmd-form-group label .req{color:#cc0000;}
    .pmd-form-group input,.pmd-form-group select,.pmd-form-group textarea{width:100%;padding:10px 12px;font-size:14px;border:1px solid var(--border,#cbd5e1);border-radius:6px;background:var(--bg-step,#f8fafc);color:var(--text,#0f172a);box-sizing:border-box;}
    :root[data-theme="dark"] .pmd-form-group input,:root[data-theme="dark"] .pmd-form-group select,:root[data-theme="dark"] .pmd-form-group textarea{background:#0f172a;border-color:#475569;color:#f8fafc;}
    .pmd-form-group input:focus,.pmd-form-group select:focus,.pmd-form-group textarea:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,0.2);}
    .pmd-form-group textarea{resize:vertical;min-height:60px;}
    .pmd-btn{background:#16a34a;color:#fff;border:1px solid #15803d;padding:10px 24px;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer;transition:background 200ms;}
    .pmd-btn:hover{background:#2563eb;border-color:#1d4ed8;}
    .pmd-btn:disabled{opacity:0.5;cursor:not-allowed;}
    .pmd-message{display:none;padding:12px 16px;border-radius:6px;font-size:14px;margin-bottom:16px;font-weight:600;}
    .pmd-message.error{background:#fef2f2;border:1px solid #ef4444;color:#991b1b;}
    .pmd-message.success{background:#f0fdf4;border:1px solid #22c55e;color:#15803d;}
    .pmd-status-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;}
    .pmd-status-open{background:#fef3c7;color:#92400e;}
    .pmd-status-overdue{background:#fef2f2;color:#991b1b;}
    .pmd-status-completed{background:#f0fdf4;color:#166534;}
    @media(max-width:600px){.pmd-info-grid{grid-template-columns:1fr;}.pmd-main{padding:0 12px;margin:12px auto;}}
    @media print{.pmd-tab-bar,#dashHeader,#dashFooter,.pmd-btn{display:none!important;}body{background:#fff!important;color:#000!important;}.pmd-card{background:#fff!important;border:1px solid #000!important;box-shadow:none!important;}}
  </style>
</head>
<body data-page-title="PM Detail">
  <div class="steel-bg"></div>
  <div class="steel-overlay"></div>
  <div id="dashHeader"></div>
  <div class="pmd-tab-bar">
    <a class="pmd-tab pmd-tab-dashboard" id="dashHomeLink" href="/app/dashboard/employee-dashboard.html" data-i18n>&#8592; Dashboard</a>
    <a class="pmd-tab" id="lnkPMList" href="/app/pm/pm.html" data-i18n>📋 PM Schedules</a>
    <div class="pmd-tab active" data-i18n>PM Detail</div>
    <div class="pmd-tab-logout" onclick="confirmLogout()" data-i18n>Logout</div>
  </div>
  <div class="pmd-main">
    <div id="pmdMessage" class="pmd-message"></div>

    <!-- PM Info -->
    <div class="pmd-card">
      <h2 data-i18n>PM Info</h2>
      <div class="pmd-info-grid" id="pmInfo">
        <div class="pmd-info-item"><span class="pmd-info-label" data-i18n>Equipment</span><span class="pmd-info-value" id="valEquipment">—</span></div>
        <div class="pmd-info-item"><span class="pmd-info-label" data-i18n>PM Type</span><span class="pmd-info-value" id="valPmType">—</span></div>
        <div class="pmd-info-item"><span class="pmd-info-label" data-i18n>Interval</span><span class="pmd-info-value" id="valInterval">—</span></div>
        <div class="pmd-info-item"><span class="pmd-info-label" data-i18n>Due Date</span><span class="pmd-info-value" id="valDueDate">—</span></div>
        <div class="pmd-info-item"><span class="pmd-info-label" data-i18n>Status</span><span class="pmd-info-value" id="valStatus">—</span></div>
        <div class="pmd-info-item"><span class="pmd-info-label" data-i18n>Required Parts</span><span class="pmd-info-value" id="valParts">—</span></div>
      </div>
    </div>

    <!-- Completion Form -->
    <div class="pmd-card" id="completionCard">
      <h2 data-i18n>Completion</h2>
      <form id="pmCompletionForm" onsubmit="submitCompletion(event)">
        <div class="pmd-form-group">
          <label for="pmCompletedDate" data-i18n>Completed Date <span class="req">*</span></label>
          <input type="date" id="pmCompletedDate" name="pmCompletedDate" required>
        </div>
        <div class="pmd-form-group">
          <label for="pmMeter" data-i18n>Meter Reading</label>
          <input type="number" id="pmMeter" name="pmMeter" step="0.1">
        </div>
        <div class="pmd-form-group">
          <label for="pmNotes" data-i18n>Notes</label>
          <textarea id="pmNotes" name="pmNotes"></textarea>
        </div>
        <button type="submit" class="pmd-btn" id="btnComplete" data-i18n>Complete PM</button>
      </form>
    </div>

    <!-- Review Form -->
    <div class="pmd-card" id="reviewCard">
      <h2 data-i18n>Review</h2>
      <form id="pmReviewForm" onsubmit="submitReview(event)">
        <div class="pmd-form-group">
          <label for="pmReviewStatus" data-i18n>Review Status <span class="req">*</span></label>
          <select id="pmReviewStatus" name="pmReviewStatus" required>
            <option value="" data-i18n>Select…</option>
            <option value="approved" data-i18n>Approved</option>
            <option value="requires_work_order" data-i18n>Requires Work Order</option>
          </select>
        </div>
        <div class="pmd-form-group">
          <label for="pmReviewNotes" data-i18n>Review Notes</label>
          <textarea id="pmReviewNotes" name="pmReviewNotes"></textarea>
        </div>
        <button type="submit" class="pmd-btn" id="btnReview" data-i18n>Submit Review</button>
      </form>
    </div>
  </div>
  <div id="dashFooter"></div>
  <script src="/app/shared/dashboard-common.js?v=13"></script>
  <script src="/app/shared/auth-check.js?v=13"></script>
  <script src="/app/shared/translate.js?v=2"></script>
  <script src="/app/pm/pm-detail.js?v=1"></script>
</body>
</html>
