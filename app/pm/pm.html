<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Preventative Maintenance | DRIV‑EN</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/icons/favicon.png?v=2026" sizes="48x48">
  <link rel="icon" type="image/png" href="/assets/icons/favicon-96.png?v=2026" sizes="96x96">
  <link rel="icon" type="image/png" href="/assets/icons/favicon-192.png?v=2026" sizes="192x192">
  <link rel="apple-touch-icon" href="/assets/icons/favicon-180.png?v=2026">
  <link rel="stylesheet" href="/app/shared/dashboard.css?v=13">
  <link rel="stylesheet" href="/styles/diamond-plate.css?v=2">
  <script>
    (function() {
      var saved = localStorage.getItem("driven-theme");
      var system = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", saved || system);
    })();
  </script>
  <style>
    :root { --header-height: 60px; --card-green-border: #16a34a; }
    html, body { margin:0; padding:0; width:100%; background:var(--bg-body,#0f172a); color:var(--text,#f8fafc); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; transition:background-color 200ms ease,color 200ms ease; }
    :root[data-theme="light"] body { background:#f1f5f9; color:#0f172a; }
    :root[data-theme="dark"] body { background:#0f172a; color:#f8fafc; }
    .dash-header-row3{display:none!important;} #dashHeader .dash-theme-wrapper{display:none!important;} .dash-header-row2{display:none!important;}
    #dashHeader,.dash-header{position:sticky!important;top:0!important;z-index:101!important;background:var(--bg-card,#fff);width:100%;box-sizing:border-box;border-bottom:2px solid var(--card-green-border);}
    .pm-tab-bar{display:flex!important;gap:2px;max-width:1100px;margin:0 auto;padding:0 16px;overflow-x:auto;position:sticky!important;top:var(--header-height,60px)!important;z-index:100!important;background:#cbd5e1;border-bottom:2px solid #94a3b8;box-sizing:border-box;-webkit-overflow-scrolling:touch;}
    :root[data-theme="dark"] .pm-tab-bar{background:#334155;border-bottom-color:#475569;}
    .pm-tab{background:#94a3b8;border:1px solid #64748b;border-bottom:none;border-radius:8px 8px 0 0;padding:10px 18px;font-size:14px;font-weight:500;color:#1e293b;cursor:pointer;white-space:nowrap;text-decoration:none;transition:color 200ms,background 200ms,margin-top 200ms;margin-top:4px;position:relative;z-index:1;display:inline-flex;align-items:center;}
    :root[data-theme="dark"] .pm-tab{background:#475569;border-color:#64748b;color:#f1f5f9;}
    .pm-tab:hover{color:#0f172a;background:#a5b4c4;margin-top:2px;}
    :root[data-theme="dark"] .pm-tab:hover{color:#fff;background:#64748b;}
    .pm-tab.active{color:#1d4ed8;background:#e2e8f0;border-color:#64748b;margin-top:0;font-weight:600;z-index:2;}
    :root[data-theme="dark"] .pm-tab.active{color:#60a5fa;background:#1e293b;border-color:#475569;}
    .pm-tab-dashboard{background:#2563eb;border:1px solid #1d4ed8;color:#fff;}
    .pm-tab-dashboard:hover{background:#1d4ed8;color:#fff;margin-top:2px;}
    .pm-tab-logout{background:#b91c1c;border:1px solid #dc2626;border-bottom:none;border-radius:8px 8px 0 0;padding:10px 18px;font-size:14px;font-weight:600;color:#fff;cursor:pointer;white-space:nowrap;margin-top:4px;margin-left:auto;position:relative;z-index:1;transition:background 200ms,margin-top 200ms;}
    .pm-tab-logout:hover{background:#dc2626;margin-top:2px;}
    .pm-main{width:100%;max-width:1100px;margin:16px auto 80px auto;padding:0 16px;box-sizing:border-box;position:relative;z-index:1;}
    .pm-card{background:var(--bg-card,#fff);border:2px solid var(--card-green-border);border-radius:8px;padding:20px;margin-bottom:20px;box-shadow:0 4px 6px rgba(0,0,0,0.08);color:var(--text,#0f172a);}
    :root[data-theme="dark"] .pm-card{background:#1e293b;color:#f8fafc;}
    .pm-card-title{font-size:18px;font-weight:700;color:var(--text,#0f172a);margin:0 0 16px 0;padding-bottom:12px;border-bottom:1px solid var(--border,#e2e8f0);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
    :root[data-theme="dark"] .pm-card-title{border-bottom-color:#334155;}
    .pm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;}
    .pm-stat-box{background:var(--bg-step,#f8fafc);border:1px solid var(--border,#cbd5e1);border-radius:6px;padding:16px;text-align:center;}
    :root[data-theme="dark"] .pm-stat-box{background:#0f172a;border-color:#334155;}
    .pm-stat-label{font-size:12px;font-weight:600;color:var(--text-muted,#64748b);text-transform:uppercase;letter-spacing:0.02em;margin-bottom:6px;}
    .pm-stat-value{font-size:28px;font-weight:700;color:var(--text,#0f172a);}
    .pm-table-scroll{width:100%;overflow-x:auto;border:1px solid var(--border,#e2e8f0);border-radius:6px;margin-top:12px;}
    :root[data-theme="dark"] .pm-table-scroll{border-color:#334155;}
    .pm-table{width:100%;border-collapse:collapse;table-layout:fixed!important;font-size:13px;min-width:700px;}
    .pm-table th{background:var(--bg-step,#f1f5f9);color:var(--text,#334155);text-align:left;padding:10px 12px;border-bottom:2px solid #1e3a8a;white-space:normal!important;word-break:break-word!important;}
    :root[data-theme="dark"] .pm-table th{background:#0f172a;color:#f1f5f9;border-bottom-color:#3b82f6;}
    .pm-table td{padding:10px 12px;border-bottom:1px solid var(--border,#e2e8f0);color:var(--text,#0f172a);white-space:normal!important;word-break:break-word!important;}
    :root[data-theme="dark"] .pm-table td{border-bottom-color:#334155;color:#f8fafc;}
    .pm-table tr:hover{background:var(--bg-step,#f8fafc);}
    :root[data-theme="dark"] .pm-table tr:hover{background:#0f172a;}
    .pm-status-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;}
    .pm-status-open{background:#fef3c7;color:#92400e;}
    .pm-status-overdue{background:#fef2f2;color:#991b1b;}
    .pm-status-completed{background:#f0fdf4;color:#166534;}
    .pm-btn{background:#16a34a;color:#fff;border:1px solid #15803d;padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:background 200ms;}
    .pm-btn:hover{background:#2563eb;border-color:#1d4ed8;}
    .pm-message{display:none;padding:12px 16px;border-radius:6px;font-size:14px;margin-bottom:16px;font-weight:600;}
    .pm-message.error{background:#fef2f2;border:1px solid #ef4444;color:#991b1b;}
    .pm-message.success{background:#f0fdf4;border:1px solid #22c55e;color:#15803d;}
    @media(max-width:700px){.pm-main{padding:0 12px;margin:12px auto;}.pm-tab{padding:8px 12px;font-size:13px;}.pm-tab-logout{padding:8px 12px;font-size:13px;}}
    @media print{.pm-tab-bar,#dashHeader,#dashFooter,.pm-btn{display:none!important;}body{background:#fff!important;color:#000!important;}.pm-card{background:#fff!important;border:1px solid #000!important;box-shadow:none!important;}}
  </style>
</head>
<body data-page-title="Preventative Maintenance">
  <div class="steel-bg"></div>
  <div class="steel-overlay"></div>
  <div id="dashHeader"></div>
  <div class="pm-tab-bar">
    <a class="pm-tab pm-tab-dashboard" id="dashHomeLink" href="/app/dashboard/employee-dashboard.html" data-i18n>&#8592; Dashboard</a>
    <div class="pm-tab active" data-i18n>📋 PM Schedules</div>
    <div class="pm-tab-logout" onclick="confirmLogout()" data-i18n>Logout</div>
  </div>
  <div class="pm-main">
    <div id="pmMessage" class="pm-message"></div>
    <div class="pm-card">
      <div class="pm-card-title">
        <span data-i18n>📊 PM Dashboard</span>
      </div>
      <div class="pm-grid">
        <div class="pm-stat-box">
          <div class="pm-stat-label" data-i18n>Open PMs</div>
          <div class="pm-stat-value" id="cardPMOpen">0</div>
        </div>
        <div class="pm-stat-box">
          <div class="pm-stat-label" data-i18n>Overdue PMs</div>
          <div class="pm-stat-value" id="cardPMOverdue">0</div>
        </div>
        <div class="pm-stat-box">
          <div class="pm-stat-label" data-i18n>Completed This Month</div>
          <div class="pm-stat-value" id="cardPMCompleted">0</div>
        </div>
      </div>
    </div>
    <div class="pm-card">
      <div class="pm-card-title">
        <span data-i18n>📋 PM Schedules</span>
      </div>
      <div class="pm-table-scroll">
        <table class="pm-table">
          <thead>
            <tr>
              <th style="width:25%;" data-i18n>Equipment</th>
              <th style="width:20%;" data-i18n>PM Type</th>
              <th style="width:15%;" data-i18n>Interval</th>
              <th style="width:15%;" data-i18n>Due Date</th>
              <th style="width:15%;" data-i18n>Status</th>
              <th style="width:10%;" data-i18n>Action</th>
            </tr>
          </thead>
          <tbody id="pmTableBody">
            <tr><td colspan="6" style="text-align:center;color:var(--text-muted,#64748b);padding:20px;" data-i18n>Loading PM schedules…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <div id="dashFooter"></div>
  <script src="/app/shared/dashboard-common.js?v=13"></script>
  <script src="/app/shared/auth-check.js?v=13"></script>
  <script src="/app/shared/translate.js?v=2"></script>
  <script src="/app/pm/pm.js?v=1"></script>
</body>
</html>
