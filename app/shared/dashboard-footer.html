<!-- ==========================================================================
     DRIV‑EN DASHBOARD FOOTER — Shared across all dashboard pages
     ==========================================================================
     This file is loaded by dashboard-common.js via fetch() and injected
     into the <div id="dashFooter"></div> placeholder on each page.

     WHAT IT CONTAINS:
     - Copyright line with auto-updating year (no manual updates needed)
     - DRIV-EN brand text with color styling
     - Legal links (Terms, Privacy, Refund Policy)

     HOW IT WORKS:
     The copyright year is set automatically by JavaScript when the footer
     loads. No manual updates needed — it always shows the current year.

     HOW TO USE:
     1. Add <div id="dashFooter"></div> at the bottom of your page (before scripts)
     2. dashboard-common.js fetches this file and injects it
     3. The year auto-updates via the inline script below

     YOU SHOULD NOT NEED TO EDIT THIS FILE.
     ========================================================================== -->

<div class="dash-footer">
  <div class="dash-footer-content">
    <!-- Copyright line — year auto-updates via JavaScript -->
    <p class="dash-footer-copyright">
      &copy; <span id="dashFooterYear">2026</span> DRIV-EN. All rights reserved.
    </p>

    <!-- Legal links — same as website footer -->
    <div class="dash-footer-links">
      <a href="/public/legal/privacy.html">Privacy Policy</a>
      <a href="/public/legal/terms.html">Terms of Service</a>
      <a href="/public/legal/refund.html">Refund Policy</a>
    </div>
  </div>
</div>

<!-- Auto-update the copyright year — runs immediately when footer loads -->
<script>
  (function() {
    var yearEl = document.getElementById("dashFooterYear");
    if (yearEl) {
      yearEl.textContent = new Date().getFullYear();
    }
  })();
</script>
