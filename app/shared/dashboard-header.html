<!-- ==========================================================================
     DRIV‑EN DASHBOARD HEADER — Shared across all dashboard pages
     ==========================================================================
     This file is loaded by dashboard-common.js via fetch() and injected
     into the <div id="dashHeader"></div> placeholder on each page.

     WHAT IT CONTAINS:
     - Row 1: Customer logo (left, loaded from D1) | DRIV-EN logo (right)
     - Row 2: Page title (centered, set from body data-page-title attribute)
     - Row 3: Theme toggle slide switch (left) | Logout button (right)

     HOW THE PAGE TITLE WORKS:
     dashboard-common.js reads the body's data-page-title attribute and
     inserts it into the h1 below. Example:
       <body data-page-title="Admin Dashboard">
     The header will show "Admin Dashboard" as the title.

     HOW THE CUSTOMER LOGO WORKS:
     dashboard-common.js fetches the logo from D1 via /auth/get-logo.
     If no logo exists, a placeholder is shown.
     The logo syncs across all devices and employees.

     HOW THE THEME TOGGLE WORKS:
     dashboard-common.js reads the checkbox state and toggles
     data-theme="light" or "dark" on the <html> element.
     The theme is saved in localStorage key "driven-theme".

     HOW LOGOUT WORKS:
     dashboard-common.js handles the logout button click —
     calls /auth/logout then redirects to /app/auth/login.html.

     YOU SHOULD NOT NEED TO EDIT THIS FILE.
     All customization is done per-page via the data-page-title attribute.
     ========================================================================== -->

<div class="dash-header">

  <!-- Row 1: Customer logo (left) | DRIV-EN logo (right) -->
  <div class="dash-header-row1">

    <!-- Customer logo area — filled by dashboard-common.js -->
    <!-- If a logo exists in D1, an <img> is inserted here -->
    <!-- If no logo, a placeholder div is shown -->
    <div id="dashCustomerLogoArea">
      <div class="dash-customer-logo-placeholder">No logo uploaded</div>
    </div>

    <!-- DRIV-EN logo (right side) -->
    <!-- Cache buster ?v=2026 — bump when the logo image changes -->
    <img src="/assets/logo.png?v=2026" class="dash-driven-logo" alt="DRIV‑EN Logo">

  </div>

  <!-- Row 2: Page title (centered) -->
  <!-- The text inside this h1 is replaced by dashboard-common.js -->
  <!-- It reads the value from <body data-page-title="..."> -->
  <div class="dash-header-row2">
    <h1 id="dashPageTitle">Dashboard</h1>
  </div>

  <!-- Row 3: Theme toggle (left) | Logout (right) -->
  <div class="dash-header-row3">

    <!-- Theme slide switch with labels -->
    <!-- Checkbox checked = dark mode, unchecked = light mode -->
    <div class="dash-theme-wrapper" title="Toggle light/dark mode">
      <span class="dash-theme-label" id="dashThemeLabelLight">Light Mode</span>
      <label class="dash-theme-switch">
        <input type="checkbox" id="dashThemeCheckbox" onchange="dashToggleTheme()">
        <span class="dash-theme-slider"></span>
      </label>
      <span class="dash-theme-label" id="dashThemeLabelDark">Dark Mode</span>
    </div>

    <!-- Logout button — calls /auth/logout then redirects to login -->
    <button class="dash-logout" onclick="dashLogout()">Logout</button>

  </div>

</div>
