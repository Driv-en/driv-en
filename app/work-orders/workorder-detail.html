<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Work Order Detail | DRIV‑EN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/app/shared/dashboard.css?v=7">
</head>
<body>

  <header class="app-header">
    <div class="app-header-inner">
      <a href="/website/index.html" class="app-logo">
        <span class="logo-driv">DRIV</span><span class="logo-en">-EN</span>
      </a>
      <nav class="app-nav-desktop">
        <a href="/app/equipment/equipment.html">Equipment</a>
        <a href="/app/pm/pm.html">PM</a>
        <a href="/app/inspections/inspections.html">Inspections</a>
        <a href="/app/work-orders/workorders.html">Work Orders</a>
        <a href="/app/dashboard/admin.html">Admin</a>
      </nav>
      <button class="app-mobile-menu-btn" id="appMobileMenuBtn">☰</button>
    </div>
  </header>

  <nav class="app-nav-mobile" id="appNavMobile">
    <a href="/app/equipment/equipment.html">Equipment</a>
    <a href="/app/pm/pm.html">PM</a>
    <a href="/app/inspections/inspections.html">Inspections</a>
    <a href="/app/work-orders/workorders.html">Work Orders</a>
    <a href="/app/dashboard/admin.html">Admin</a>
  </nav>

  <div class="app-sticky-wrapper">
    <main class="app-main">

      <section class="app-page-header">
        <h1>Work Order Detail</h1>
        <p>Single work order, completion, and review.</p>
      </section>

      <section class="app-section">
        <h2 class="app-section-title">Work Order Info</h2>
        <div id="workorderInfo">
          <!-- Equipment, issue, severity, created from (PM/Inspection/Status) -->
        </div>
      </section>

      <section class="app-section">
        <h2 class="app-section-title">Completion</h2>
        <form class="app-form" id="workorderCompletionForm">
          <div class="form-group">
            <label for="woCompletedDate">Completed Date</label>
            <input type="date" id="woCompletedDate" name="woCompletedDate" required>
          </div>
          <div class="form-group">
            <label for="woCompletionNotes">Completion Notes</label>
            <textarea id="woCompletionNotes" name="woCompletionNotes"></textarea>
          </div>
          <button type="submit" class="app-btn-primary">Complete Work Order</button>
        </form>
      </section>

      <section class="app-section">
        <h2 class="app-section-title">Foreman Review</h2>
        <form class="app-form" id="workorderReviewForm">
          <div class="form-group">
            <label for="woReviewStatus">Review Status</label>
            <select id="woReviewStatus" name="woReviewStatus">
              <option value="">Select...</option>
              <option value="approved">Approved</option>
              <option value="reopen">Reopen</option>
            </select>
          </div>
          <div class="form-group">
            <label for="woReviewNotes">Review Notes</label>
            <textarea id="woReviewNotes" name="woReviewNotes"></textarea>
          </div>
          <button type="submit" class="app-btn-primary">Submit Review</button>
        </form>
      </section>

    </main>

    <footer class="app-footer">
      <p>© 2026 DRIV‑EN — Built for the Field.</p>
    </footer>
  </div>

  <script>
    const mobileBtn = document.getElementById('appMobileMenuBtn');
    const mobileNav = document.getElementById('appNavMobile');
    mobileBtn.addEventListener('click', () => {
      mobileNav.classList.toggle('open');
    });

    const header = document.querySelector('.app-header');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 10) header.classList.add('sticky');
      else header.classList.remove('sticky');
    });

    // TODO: integrate with Worker: load WO info, submit completion and review
  </script>
</body>
</html>
