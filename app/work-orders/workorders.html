<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Work Orders | DRIV‑EN</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/icons/favicon.png?v=2026" sizes="48x48">
  <link rel="icon" type="image/png" href="/assets/icons/favicon-96.png?v=2026" sizes="96x96">
  <link rel="icon" type="image/png" href="/assets/icons/favicon-192.png?v=2026" sizes="192x192">
  <link rel="apple-touch-icon" href="/assets/icons/favicon-180.png?v=2026">
  <link rel="stylesheet" href="/app/shared/dashboard.css?v=13">
  <link rel="stylesheet" href="/styles/diamond-plate.css?v=2">
  <script>
    (function() {
      var saved = localStorage.getItem("driven-theme");
      var system = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", saved || system);
    })();
  </script>
  <style>
    :root { --header-height: 60px; --card-green-border: #16a34a; }
    html, body { margin:0; padding:0; width:100%; background:var(--bg-body,#0f172a); color:var(--text,#f8fafc); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; transition:background-color 200ms ease,color 200ms ease; }
    :root[data-theme="light"] body { background:#f1f5f9; color:#0f172a; }
    :root[data-theme="dark"] body { background:#0f172a; color:#f8fafc; }
    .dash-header-row3{display:none!important;} #dashHeader .dash-theme-wrapper{display:none!important;} .dash-header-row2{display:none!important;}
    #dashHeader,.dash-header{position:sticky!important;top:0!important;z-index:101!important;background:var(--bg-card,#fff);width:100%;box-sizing:border-box;border-bottom:2px solid var(--card-green-border);}
    .wo-tab-bar{display:flex!important;gap:2px;max-width:1100px;margin:0 auto;padding:0 16px;overflow-x:auto;position:sticky!important;top:var(--header-height,60px)!important;z-index:100!important;background:#cbd5e1;border-bottom:2px solid #94a3b8;box-sizing:border-box;-webkit-overflow-scrolling:touch;}
    :root[data-theme="dark"] .wo-tab-bar{background:#334155;border-bottom-color:#475569;}
    .wo-tab{background:#94a3b8;border:1px solid #64748b;border-bottom:none;border-radius:8px 8px 0 0;padding:10px 18px;font-size:14px;font-weight:500;color:#1e293b;cursor:pointer;white-space:nowrap;text-decoration:none;transition:color 200ms,background 200ms,margin-top 200ms;margin-top:4px;position:relative;z-index:1;display:inline-flex;align-items:center;}
    :root[data-theme="dark"] .wo-tab{background:#475569;border-color:#64748b;color:#f1f5f9;}
    .wo-tab:hover{color:#0f172a;background:#a5b4c4;margin-top:2px;}
    :root[data-theme="dark"] .wo-tab:hover{color:#fff;background:#64748b;}
    .wo-tab.active{color:#1d4ed8;background:#e2e8f0;border-color:#64748b;margin-top:0;font-weight:600;z-index:2;}
    :root[data-theme="dark"] .wo-tab.active{color:#60a5fa;background:#1e293b;border-color:#475569;}
    .wo-tab-dashboard{background:#2563eb;border:1px solid #1d4ed8;color:#fff;}
    .wo-tab-dashboard:hover{background:#1d4ed8;color:#fff;margin-top:2px;}
    .wo-tab-logout{background:#b91c1c;border:1px solid #dc2626;border-bottom:none;border-radius:8px 8px 0 0;padding:10px 18px;font-size:14px;font-weight:600;color:#fff;cursor:pointer;white-space:nowrap;margin-top:4px;margin-left:auto;position:relative;z-index:1;transition:background 200ms,margin-top 200ms;}
    .wo-tab-logout:hover{background:#dc2626;margin-top:2px;}
    .wo-main{width:100%;max-width:1100px;margin:16px auto 80px auto;padding:0 16px;box-sizing:border-box;position:relative;z-index:1;}
    .wo-card{background:var(--bg-card,#fff);border:2px solid var(--card-green-border);border-radius:8px;padding:20px;margin-bottom:20px;box-shadow:0 4px 6px rgba(0,0,0,0.08);color:var(--text,#0f172a);}
    :root[data-theme="dark"] .wo-card{background:#1e293b;color:#f8fafc;}
    .wo-card-title{font-size:18px;font-weight:700;color:var(--text,#0f172a);margin:0 0 16px 0;padding-bottom:12px;border-bottom:1px solid var(--border,#e2e8f0);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
    :root[data-theme="dark"] .wo-card-title{border-bottom-color:#334155;}
    .wo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;}
    .wo-stat-box{background:var(--bg-step,#f8fafc);border:1px solid var(--border,#cbd5e1);border-radius:6px;padding:16px;text-align:center;}
    :root[data-theme="dark"] .wo-stat-box{background:#0f172a;border-color:#334155;}
    .wo-stat-label{font-size:12px;font-weight:600;color:var(--text-muted,#64748b);text-transform:uppercase;letter-spacing:0.02em;margin-bottom:6px;}
    .wo-stat-value{font-size:28px;font-weight:700;color:var(--text,#0f172a);}
    .wo-table-scroll{width:100%;overflow-x:auto;border:1px solid var(--border,#e2e8f0);border-radius:6px;margin-top:12px;}
    :root[data-theme="dark"] .wo-table-scroll{border-color:#334155;}
    .wo-table{width:100%;border-collapse:collapse;table-layout:fixed!important;font-size:13px;min-width:700px;}
    .wo-table th{background:var(--bg-step,#f1f5f9);color:var(--text,#334155);text-align:left;padding:10px 12px;border-bottom:2px solid #1e3a8a;white-space:normal!important;word-break:break-word!important;}
    :root[data-theme="dark"] .wo-table th{background:#0f172a;color:#f1f5f9;border-bottom-color:#3b82f6;}
    .wo-table td{padding:10px 12px;border-bottom:1px solid var(--border,#e2e8f0);color:var(--text,#0f172a);white-space:normal!important;word-break:break-word!important;}
    :root[data-theme="dark"] .wo-table td{border-bottom-color:#334155;color:#f8fafc;}
    .wo-table tr:hover{background:var(--bg-step,#f8fafc);}
    :root[data-theme="dark"] .wo-table tr:hover{background:#0f172a;}
    .wo-status-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;}
    .wo-status-open{background:#fef3c7;color:#92400e;}
    .wo-status-urgent{background:#fef2f2;color:#991b1b;}
    .wo-status-completed{background:#f0fdf4;color:#166534;}
    .wo-severity-high{color:#dc2626;font-weight:700;}
    .wo-severity-medium{color:#d97706;font-weight:600;}
    .wo-severity-low{color:#16a34a;font-weight:600;}
    .wo-btn{background:#16a34a;color:#fff;border:1px solid #15803d;padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:background 200ms;}
    .wo-btn:hover{background:#2563eb;border-color:#1d4ed8;}
    .wo-btn-create{background:#2563eb;border-color:#1d4ed8;}
    .wo-btn-create:hover{background:#1d4ed8;border-color:#1e40af;}
    .wo-message{display:none;padding:12px 16px;border-radius:6px;font-size:14px;margin-bottom:16px;font-weight:600;}
    .wo-message.error{background:#fef2f2;border:1px solid #ef4444;color:#991b1b;}
    .wo-message.success{background:#f0fdf4;border:1px solid #22c55e;color:#15803d;}
    @media(max-width:700px){.wo-main{padding:0 12px;margin:12px auto;}.wo-tab{padding:8px 12px;font-size:13px;}.wo-tab-logout{padding:8px 12px;font-size:13px;}}
    @media print{.wo-tab-bar,#dashHeader,#dashFooter,.wo-btn{display:none!important;}body{background:#fff!important;color:#000!important;}.wo-card{background:#fff!important;border:1px solid #000!important;box-shadow:none!important;}}
  </style>
</head>
<body data-page-title="Work Orders">
  <div class="steel-bg"></div>
  <div class="steel-overlay"></div>
  <div id="dashHeader"></div>
  <div class="wo-tab-bar">
    <a class="wo-tab wo-tab-dashboard" id="dashHomeLink" href="/app/dashboard/employee-dashboard.html" data-i18n>&#8592; Dashboard</a>
    <div class="wo-tab active" data-i18n>🛠️ Work Orders</div>
    <a class="wo-tab wo-tab-create" href="/app/forms/work-order-create.html" data-i18n>+ Create Work Order</a>
    <div class="wo-tab-logout" onclick="confirmLogout()" data-i18n>Logout</div>
  </div>
  <div class="wo-main">
    <div id="woMessage" class="wo-message"></div>
    <div class="wo-card">
      <div class="wo-card-title"><span data-i18n>📊 Work Order Dashboard</span></div>
      <div class="wo-grid">
        <div class="wo-stat-box"><div class="wo-stat-label" data-i18n>Open Work Orders</div><div class="wo-stat-value" id="cardWOOpen">0</div></div>
        <div class="wo-stat-box"><div class="wo-stat-label" data-i18n>Urgent / Critical</div><div class="wo-stat-value" id="cardWOUrgent">0</div></div>
        <div class="wo-stat-box"><div class="wo-stat-label" data-i18n>Completed This Month</div><div class="wo-stat-value" id="cardWOCompleted">0</div></div>
      </div>
    </div>
    <div class="wo-card">
      <div class="wo-card-title"><span data-i18n>🛠️ Work Order List</span></div>
      <div class="wo-table-scroll">
        <table class="wo-table">
          <thead>
            <tr>
              <th style="width:18%;" data-i18n>WO Number</th>
              <th style="width:22%;" data-i18n>Equipment</th>
              <th style="width:25%;" data-i18n>Issue</th>
              <th style="width:10%;" data-i18n>Priority</th>
              <th style="width:13%;" data-i18n>Assigned To</th>
              <th style="width:12%;" data-i18n>Status</th>
            </tr>
          </thead>
          <tbody id="woTableBody">
            <tr><td colspan="6" style="text-align:center;color:var(--text-muted,#64748b);padding:20px;" data-i18n>Loading work orders…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <div id="dashFooter"></div>
  <script src="/app/shared/dashboard-common.js?v=13"></script>
  <script src="/app/shared/auth-check.js?v=13"></script>
  <script src="/app/shared/translate.js?v=2"></script>
  <script src="/app/work-orders/workorders.js?v=1"></script>
</body>
</html>
