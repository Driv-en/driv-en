<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin • Audit Logs | Driv-en</title>

    <link rel="stylesheet" href="/frontend/css/layout.css">
    <link rel="stylesheet" href="/frontend/css/form.css">

    <style>
        .audit-section {
            background: #fff;
            border: 1px solid #ddd;
            padding: 24px;
            border-radius: 6px;
            margin-top: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            font-weight: 700;
        }

        .btn-secondary {
            padding: 10px 16px;
            background: #e0e0e0;
            color: #000;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 24px;
            display: inline-block;
        }

        .btn-secondary:hover {
            background: #d5d5d5;
        }
    </style>
</head>

<body>

    <!-- Header Include -->
    <div id="header-container"></div>
    <script>
        fetch('/frontend/includes/header.html')
            .then(r => r.text())
            .then(h => document.getElementById('header-container').innerHTML = h);
    </script>

    <div class="container">
        <h1 class="page-title">Admin • Audit Logs</h1>

        <div id="auditContainer" class="audit-section">
            <!-- Dynamic audit log table loads here -->
        </div>

        <a class="btn-secondary" href="/frontend/admin/index.html">Back to Admin</a>
    </div>

    <!-- Footer Include -->
    <div id="footer-container"></div>
    <script>
        fetch('/frontend/includes/footer.html')
            .then(r => r.text())
            .then(h => document.getElementById('footer-container').innerHTML = h);
    </script>

    <script>
        async function loadAuditLogs() {
            try {
                const res = await fetch('/api/audit-logs');
                if (!res.ok) throw new Error('Failed to load audit logs');

                const logs = await res.json();
                const container = document.getElementById('auditContainer');

                container.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Action</th>
                                <th>Module</th>
                                <th>Timestamp</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${
                                logs && logs.length > 0
                                    ? logs.map(log => `
                                        <tr>
                                            <td>${log.userName || '—'}</td>
                                            <td>${log.action}</td>
                                            <td>${log.module}</td>
                                            <td>${new Date(log.timestamp).toLocaleString()}</td>
                                        </tr>
                                    `).join('')
                                    : `<tr><td colspan="4">No audit logs available.</td></tr>`
                            }
                        </tbody>
                    </table>
                `;

            } catch (err) {
                document.getElementById('auditContainer').innerHTML =
                    '<p>Unable to load audit logs.</p>';
            }
        }

        loadAuditLogs();
    </script>

</body>
</html>
