<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin • Work Orders | Driv-en</title>

    <link rel="stylesheet" href="/frontend/css/layout.css">
    <link rel="stylesheet" href="/frontend/css/form.css">

    <style>
        .admin-header {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h1 {
            margin: 0;
        }

        .btn-primary {
            padding: 10px 16px;
            background: #1a1a1a;
            color: #fff;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 24px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            font-weight: 700;
        }

        .action-link {
            color: #1a1a1a;
            font-weight: 600;
            text-decoration: none;
        }

        .action-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- Header Include -->
    <div id="header-container"></div>
    <script>
        fetch('/frontend/includes/header.html')
            .then(r => r.text())
            .then(h => document.getElementById('header-container').innerHTML = h);
    </script>

    <div class="container">

        <div class="admin-header">
            <h1 class="page-title">Admin • Work Orders</h1>
            <a class="btn-primary" href="/frontend/work-orders/create.html">+ New Work Order</a>
        </div>

        <table id="workOrdersTable">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Equipment</th>
                    <th>Assigned To</th>
                    <th>Status</th>
                    <th style="width: 120px;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dynamic rows load here -->
            </tbody>
        </table>

    </div>

    <!-- Footer Include -->
    <div id="footer-container"></div>
    <script>
        fetch('/frontend/includes/footer.html')
            .then(r => r.text())
            .then(h => document.getElementById('footer-container').innerHTML = h);
    </script>

    <script>
        async function loadWorkOrders() {
            try {
                const res = await fetch('/api/work-orders');
                if (!res.ok) throw new Error('Failed to load work orders');

                const workOrders = await res.json();
                const tbody = document.querySelector('#workOrdersTable tbody');

                tbody.innerHTML = '';

                workOrders.forEach(wo => {
                    const tr = document.createElement('tr');

                    tr.innerHTML = `
                        <td>${wo.title}</td>
                        <td>${wo.equipmentName || '—'}</td>
                        <td>${wo.assignedToName || '—'}</td>
                        <td>${wo.status}</td>
                        <td>
                            <a class="action-link" href="/frontend/work-orders/detail.html?id=${wo.id}">View</a>
                            &nbsp;|&nbsp;
                            <a class="action-link" href="/frontend/work-orders/edit.html?id=${wo.id}">Edit</a>
                        </td>
                    `;

                    tbody.appendChild(tr);
                });

            } catch (err) {
                alert('Unable to load work orders.');
            }
        }

        loadWorkOrders();
    </script>

</body>
</html>
