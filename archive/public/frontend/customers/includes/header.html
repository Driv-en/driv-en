<div class="header">
    <div class="header-left">
        <a href="/frontend/index.html" class="logo">DRIV‑EN</a>
    </div>

    <div class="header-right" id="navContainer">
        <!-- Dynamic navigation loads here -->
    </div>
</div>

<style>
    .header {
        width: 100%;
        padding: 16px 24px;
        background: #fff;
        border-bottom: 1px solid #ddd;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        font-size: 22px;
        font-weight: 700;
        color: #1a1a1a;
        text-decoration: none;
    }

    .nav-link {
        margin-left: 18px;
        font-weight: 600;
        color: #1a1a1a;
        text-decoration: none;
    }

    .nav-link:hover {
        text-decoration: underline;
    }
</style>

<script>
    async function loadNav() {
        try {
            const res = await fetch('/api/auth/me');
            if (!res.ok) throw new Error('Unable to load user');

            const user = await res.json();
            const nav = document.getElementById('navContainer');

            if (user.role === 'admin') {
                nav.innerHTML = `
                    <a class="nav-link" href="/frontend/admin/index.html">Admin</a>
                    <a class="nav-link" href="/frontend/admin/projects/index.html">Projects</a>
                    <a class="nav-link" href="/frontend/admin/equipment/index.html">Equipment</a>
                    <a class="nav-link" href="/frontend/admin/employees/index.html">Employees</a>
                    <a class="nav-link" href="/frontend/admin/audit-logs/index.html">Audit Logs</a>
                    <a class="nav-link" href="/frontend/logout.html">Logout</a>
                `;
            } else {
                nav.innerHTML = `
                    <a class="nav-link" href="/frontend/customers/index.html">Dashboard</a>
                    <a class="nav-link" href="/frontend/customers/projects/index.html">Projects</a>
                    <a class="nav-link" href="/frontend/customers/equipment/index.html">Equipment</a>
                    <a class="nav-link" href="/frontend/customers/pm/index.html">PMs</a>
                    <a class="nav-link" href="/frontend/customers/inspections/index.html">Inspections</a>
                    <a class="nav-link" href="/frontend/customers/work-orders/index.html">Work Orders</a>
                    <a class="nav-link" href="/frontend/customers/employees/index.html">Employees</a>
                    <a class="nav-link" href="/frontend/logout.html">Logout</a>
                `;
            }

        } catch (err) {
            console.error('Navigation load failed');
        }
    }

    loadNav();
</script>
