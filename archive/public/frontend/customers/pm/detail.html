<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer • PM Detail | Driv-en</title>

    <link rel="stylesheet" href="/frontend/css/layout.css">
    <link rel="stylesheet" href="/frontend/css/form.css">

    <style>
        .detail-section {
            background: #fff;
            border: 1px solid #ddd;
            padding: 24px;
            border-radius: 6px;
            margin-top: 24px;
        }

        .detail-row {
            margin-bottom: 16px;
        }

        .detail-label {
            font-weight: 700;
            margin-bottom: 4px;
        }

        .btn-secondary {
            padding: 10px 16px;
            background: #e0e0e0;
            color: #000;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 24px;
            display: inline-block;
        }

        .btn-secondary:hover {
            background: #d5d5d5;
        }
    </style>
</head>

<body>

    <!-- Header Include -->
    <div id="header-container"></div>
    <script>
        fetch('/frontend/includes/header.html')
            .then(r => r.text())
            .then(h => document.getElementById('header-container').innerHTML = h);
    </script>

    <div class="container">
        <h1 class="page-title">Customer • PM Detail</h1>

        <div id="detailContainer" class="detail-section">
            <!-- Dynamic content loads here -->
        </div>

        <a class="btn-secondary" href="/frontend/customers/pm/index.html">Back</a>
    </div>

    <!-- Footer Include -->
    <div id="footer-container"></div>
    <script>
        fetch('/frontend/includes/footer.html')
            .then(r => r.text())
            .then(h => document.getElementById('footer-container').innerHTML = h);
    </script>

    <script>
        function getParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        async function loadPM() {
            const id = getParam('id');
            if (!id) {
                alert('Invalid PM ID.');
                return;
            }

            try {
                const res = await fetch(`/api/customer/pm/${id}`);
                if (!res.ok) throw new Error('Failed to load PM');

                const pm = await res.json();
                const container = document.getElementById('detailContainer');

                container.innerHTML = `
                    <div class="detail-row">
                        <div class="detail-label">Equipment</div>
                        <div>${pm.equipmentName || '—'}</div>
                    </div>

                    <div class="detail-row">
                        <div class="detail-label">PM Type</div>
                        <div>${pm.pmTypeName || '—'}</div>
                    </div>

                    <div class="detail-row">
                        <div class="detail-label">Interval</div>
                        <div>${pm.interval || '—'}</div>
                    </div>

                    <div class="detail-row">
                        <div class="detail-label">Next Due</div>
                        <div>${pm.nextDue || '—'}</div>
                    </div>

                    <div class="detail-row">
                        <div class="detail-label">Description</div>
                        <div>${pm.description || '—'}</div>
                    </div>
                `;
            } catch (err) {
                alert('Unable to load PM.');
            }
        }

        loadPM();
    </script>

</body>
</html>
