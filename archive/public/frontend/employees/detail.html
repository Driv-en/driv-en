<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Detail | Driv-en</title>

    <link rel="stylesheet" href="/frontend/css/layout.css">
    <link rel="stylesheet" href="/frontend/css/form.css">

    <style>
        .detail-section {
            margin-bottom: 32px;
        }

        .detail-label {
            font-weight: 700;
            margin-bottom: 6px;
        }

        .detail-value {
            font-size: 16px;
            margin-bottom: 14px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background: #1a1a1a;
            color: #fff;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            background: #333;
        }
    </style>
</head>

<body>

    <!-- Header Include -->
    <div id="header-container"></div>
    <script>
        fetch('/frontend/includes/header.html')
            .then(r => r.text())
            .then(h => document.getElementById('header-container').innerHTML = h);
    </script>

    <div class="container">
        <h1 class="page-title">Employee Detail</h1>

        <div id="employeeDetail">
            <!-- Dynamic employee detail loads here -->
        </div>

        <a class="back-link" href="/frontend/employees/index.html">Back to Employees</a>
    </div>

    <!-- Footer Include -->
    <div id="footer-container"></div>
    <script>
        fetch('/frontend/includes/footer.html')
            .then(r => r.text())
            .then(h => document.getElementById('footer-container').innerHTML = h);
    </script>

    <script>
        function getParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        async function loadEmployeeDetail() {
            const id = getParam('id');
            if (!id) {
                document.getElementById('employeeDetail').innerHTML =
                    '<div class="section">Invalid employee ID.</div>';
                return;
            }

            try {
                const res = await fetch(`/api/employees/${id}`);
                if (!res.ok) throw new Error('Failed to load employee');

                const emp = await res.json();
                const container = document.getElementById('employeeDetail');

                container.innerHTML = `
                    <div class="section detail-section">
                        <div class="detail-label">Name</div>
                        <div class="detail-value">${emp.firstName} ${emp.lastName}</div>

                        <div class="detail-label">Role</div>
                        <div class="detail-value">${emp.roleName || 'N/A'}</div>

                        <div class="detail-label">Division</div>
                        <div class="detail-value">${emp.divisionName || 'N/A'}</div>

                        <div class="detail-label">Email</div>
                        <div class="detail-value">${emp.email || 'N/A'}</div>

                        <div class="detail-label">Phone</div>
                        <div class="detail-value">${emp.phone || 'N/A'}</div>

                        <div class="detail-label">Status</div>
                        <div class="detail-value">${emp.status || 'N/A'}</div>
                    </div>
                `;
            } catch (err) {
                document.getElementById('employeeDetail').innerHTML =
                    '<div class="section">Unable to load employee details.</div>';
            }
        }

        loadEmployeeDetail();
    </script>

</body>
</html>
