<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment Detail | Driv-en</title>

    <link rel="stylesheet" href="/frontend/css/layout.css">
    <link rel="stylesheet" href="/frontend/css/form.css">

    <style>
        .detail-section {
            margin-bottom: 32px;
        }

        .detail-label {
            font-weight: 700;
            margin-bottom: 6px;
        }

        .detail-value {
            font-size: 16px;
            margin-bottom: 14px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background: #1a1a1a;
            color: #fff;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            background: #333;
        }
    </style>
</head>

<body>

    <!-- Header Include -->
    <div id="header-container"></div>
    <script>
        fetch('/frontend/includes/header.html')
            .then(r => r.text())
            .then(h => document.getElementById('header-container').innerHTML = h);
    </script>

    <div class="container">
        <h1 class="page-title">Equipment Detail</h1>

        <div id="equipmentDetail">
            <!-- Dynamic equipment detail loads here -->
        </div>

        <a class="back-link" href="/frontend/equipment/index.html">Back to Equipment</a>
    </div>

    <!-- Footer Include -->
    <div id="footer-container"></div>
    <script>
        fetch('/frontend/includes/footer.html')
            .then(r => r.text())
            .then(h => document.getElementById('footer-container').innerHTML = h);
    </script>

    <script>
        function getParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        async function loadEquipmentDetail() {
            const id = getParam('id');
            if (!id) {
                document.getElementById('equipmentDetail').innerHTML =
                    '<div class="section">Invalid equipment ID.</div>';
                return;
            }

            try {
                const res = await fetch(`/api/equipment/${id}`);
                if (!res.ok) throw new Error('Failed to load equipment');

                const eq = await res.json();
                const container = document.getElementById('equipmentDetail');

                container.innerHTML = `
                    <div class="section detail-section">
                        <div class="detail-label">Equipment Name</div>
                        <div class="detail-value">${eq.name}</div>

                        <div class="detail-label">Equipment Type</div>
                        <div class="detail-value">${eq.typeName || 'N/A'}</div>

                        <div class="detail-label">Serial Number</div>
                        <div class="detail-value">${eq.serialNumber || 'N/A'}</div>

                        <div class="detail-label">Status</div>
                        <div class="detail-value">${eq.status || 'N/A'}</div>

                        <div class="detail-label">Assigned Division</div>
                        <div class="detail-value">${eq.divisionName || 'N/A'}</div>

                        <div class="detail-label">Year</div>
                        <div class="detail-value">${eq.year || 'N/A'}</div>

                        <div class="detail-label">Manufacturer</div>
                        <div class="detail-value">${eq.manufacturer || 'N/A'}</div>

                        <div class="detail-label">Model</div>
                        <div class="detail-value">${eq.model || 'N/A'}</div>
                    </div>
                `;
            } catch (err) {
                document.getElementById('equipmentDetail').innerHTML =
                    '<div class="section">Unable to load equipment details.</div>';
            }
        }

        loadEquipmentDetail();
    </script>

</body>
</html>
