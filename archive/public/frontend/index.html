<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Driv-en</title>

    <link rel="stylesheet" href="/frontend/css/layout.css">
    <link rel="stylesheet" href="/frontend/css/form.css">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f5f5f5;
        }

        .landing-box {
            background: #fff;
            padding: 40px;
            border: 1px solid #ddd;
            border-radius: 6px;
            width: 380px;
            text-align: center;
        }

        .landing-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .btn-primary,
        .btn-secondary {
            display: block;
            padding: 12px;
            margin-top: 12px;
            border-radius: 4px;
            font-weight: 600;
            text-decoration: none;
        }

        .btn-primary {
            background: #1a1a1a;
            color: #fff;
        }

        .btn-primary:hover {
            background: #333;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #000;
        }

        .btn-secondary:hover {
            background: #d5d5d5;
        }
    </style>
</head>

<body>

    <div class="landing-box">
        <div class="landing-title">Welcome to Driv-en</div>

        <a class="btn-primary" href="/frontend/login.html">Login</a>
        <a class="btn-secondary" href="/frontend/register.html">Register</a>
    </div>

</body>
</html>
