<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit PM | Driv-en</title>

    <link rel="stylesheet" href="/frontend/css/layout.css">
    <link rel="stylesheet" href="/frontend/css/form.css">
</head>

<body>

    <!-- Header Include -->
    <div id="header-container"></div>
    <script>
        fetch('/frontend/includes/header.html')
            .then(r => r.text())
            .then(h => document.getElementById('header-container').innerHTML = h);
    </script>

    <div class="container">
        <h1 class="page-title">Edit Preventative Maintenance</h1>

        <form id="editPMForm" class="section">

            <div class="form-group">
                <label for="templateName">Template Name</label>
                <input id="templateName" name="templateName" type="text" required>
            </div>

            <div class="form-group">
                <label for="equipment">Equipment</label>
                <select id="equipment" name="equipment" required></select>
            </div>

            <div class="form-inline">
                <div class="form-group">
                    <label for="interval">Interval</label>
                    <input id="interval" name="interval" type="number" min="1" required>
                </div>

                <div class="form-group">
                    <label for="meterType">Meter Type</label>
                    <select id="meterType" name="meterType" required>
                        <option value="Hours">Hours</option>
                        <option value="Miles">Miles</option>
                        <option value="Days">Days</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="tasks">Tasks (one per line)</label>
                <textarea id="tasks" name="tasks" rows="6"></textarea>
            </div>

            <button type="submit" class="btn-primary">Save Changes</button>
        </form>

        <a class="back-link" href="/frontend/pm/index.html">Back to PMs</a>
    </div>

    <!-- Footer Include -->
    <div id="footer-container"></div>
    <script>
        fetch('/frontend/includes/footer.html')
            .then(r => r.text())
            .then(h => document.getElementById('footer-container').innerHTML = h);
    </script>

    <script>
        function getParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        async function loadSelectOptions() {
            try {
                const equipRes = await fetch('/api/equipment');
                const equipment = await equipRes.json();

                const equipmentSelect = document.getElementById('equipment');

                equipment.forEach(eq => {
                    const opt = document.createElement('option');
                    opt.value = eq.id;
                    opt.textContent = eq.name;
                    equipmentSelect.appendChild(opt);
                });

            } catch (err) {
                alert('Unable to load equipment list.');
            }
        }

        async function loadPM() {
            const id = getParam('id');
            if (!id) {
                alert('Invalid PM ID.');
                return;
            }

            try {
                const res = await fetch(`/api/pm/${id}`);
                if (!res.ok) throw new Error('Failed to load PM');

                const pm = await res.json();

                document.getElementById('templateName').value = pm.templateName || '';
                document.getElementById('equipment').value = pm.equipmentId || '';
                document.getElementById('interval').value = pm.interval || '';
                document.getElementById('meterType').value = pm.meterType || '';

                // Convert tasks array → textarea
                document.getElementById('tasks').value = pm.tasks
                    ? pm.tasks.map(t => t.description).join('\n')
                    : '';

            } catch (err) {
                alert('Unable to load PM.');
            }
        }

        async function submitForm(e) {
            e.preventDefault();

            const id = getParam('id');
            const form = document.getElementById('editPMForm');
            const data = Object.fromEntries(new FormData(form));

            // Convert tasks textarea → array
            data.tasks = data.tasks
                ? data.tasks.split('\n').map(t => t.trim()).filter(t => t.length > 0)
                : [];

            try {
                const res = await fetch(`/api/pm/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!res.ok) throw new Error('Failed to update PM');

                window.location.href = '/frontend/pm/index.html';

            } catch (err) {
                alert('Unable to update PM.');
            }
        }

        loadSelectOptions().then(loadPM);
        document.getElementById('editPMForm').addEventListener('submit', submitForm);
    </script>

</body>
</html>
