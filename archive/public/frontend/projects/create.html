<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Project | Driv-en</title>

    <link rel="stylesheet" href="/frontend/css/layout.css">
    <link rel="stylesheet" href="/frontend/css/form.css">
</head>

<body>

    <!-- Header Include -->
    <div id="header-container"></div>
    <script>
        fetch('/frontend/includes/header.html')
            .then(r => r.text())
            .then(h => document.getElementById('header-container').innerHTML = h);
    </script>

    <div class="container">
        <h1 class="page-title">Create Project</h1>

        <form id="createProjectForm" class="section">

            <div class="form-group">
                <label for="name">Project Name</label>
                <input id="name" name="name" type="text" required>
            </div>

            <div class="form-group">
                <label for="division">Division</label>
                <select id="division" name="division" required></select>
            </div>

            <div class="form-group">
                <label for="projectType">Project Type</label>
                <select id="projectType" name="projectType" required></select>
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status" required>
                    <option value="Planned">Planned</option>
                    <option value="Active">Active</option>
                    <option value="Completed">Completed</option>
                    <option value="On Hold">On Hold</option>
                </select>
            </div>

            <div class="form-inline">
                <div class="form-group">
                    <label for="startDate">Start Date</label>
                    <input id="startDate" name="startDate" type="date">
                </div>

                <div class="form-group">
                    <label for="endDate">End Date</label>
                    <input id="endDate" name="endDate" type="date">
                </div>
            </div>

            <button type="submit" class="btn-primary">Create Project</button>
        </form>

        <a class="back-link" href="/frontend/projects/index.html">Back to Projects</a>
    </div>

    <!-- Footer Include -->
    <div id="footer-container"></div>
    <script>
        fetch('/frontend/includes/footer.html')
            .then(r => r.text())
            .then(h => document.getElementById('footer-container').innerHTML = h);
    </script>

    <script>
        async function loadSelectOptions() {
            try {
                const [divRes, typeRes] = await Promise.all([
                    fetch('/api/divisions'),
                    fetch('/api/project-types')
                ]);

                const divisions = await divRes.json();
                const types = await typeRes.json();

                const divisionSelect = document.getElementById('division');
                const typeSelect = document.getElementById('projectType');

                divisions.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.id;
                    opt.textContent = d.name;
                    divisionSelect.appendChild(opt);
                });

                types.forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t.id;
                    opt.textContent = t.name;
                    typeSelect.appendChild(opt);
                });

            } catch (err) {
                alert('Unable to load form options.');
            }
        }

        async function submitForm(e) {
            e.preventDefault();

            const form = document.getElementById('createProjectForm');
            const data = Object.fromEntries(new FormData(form));

            try {
                const res = await fetch('/api/projects', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!res.ok) throw new Error('Failed to create project');

                window.location.href = '/frontend/projects/index.html';

            } catch (err) {
                alert('Unable to create project.');
            }
        }

        loadSelectOptions();
        document.getElementById('createProjectForm').addEventListener('submit', submitForm);
    </script>

</body>
</html>
