<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Project | Driv-en</title>

    <link rel="stylesheet" href="/frontend/css/layout.css">
    <link rel="stylesheet" href="/frontend/css/form.css">
</head>

<body>

    <!-- Header Include -->
    <div id="header-container"></div>
    <script>
        fetch('/frontend/includes/header.html')
            .then(r => r.text())
            .then(h => document.getElementById('header-container').innerHTML = h);
    </script>

    <div class="container">
        <h1 class="page-title">Edit Project</h1>

        <form id="editProjectForm" class="section">

            <div class="form-group">
                <label for="name">Project Name</label>
                <input id="name" name="name" type="text" required>
            </div>

            <div class="form-group">
                <label for="division">Division</label>
                <select id="division" name="division" required></select>
            </div>

            <div class="form-group">
                <label for="projectType">Project Type</label>
                <select id="projectType" name="projectType" required></select>
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status" required>
                    <option value="Planned">Planned</option>
                    <option value="Active">Active</option>
                    <option value="Completed">Completed</option>
                    <option value="On Hold">On Hold</option>
                </select>
            </div>

            <div class="form-inline">
                <div class="form-group">
                    <label for="startDate">Start Date</label>
                    <input id="startDate" name="startDate" type="date">
                </div>

                <div class="form-group">
                    <label for="endDate">End Date</label>
                    <input id="endDate" name="endDate" type="date">
                </div>
            </div>

            <button type="submit" class="btn-primary">Save Changes</button>
        </form>

        <a class="back-link" href="/frontend/projects/index.html">Back to Projects</a>
    </div>

    <!-- Footer Include -->
    <div id="footer-container"></div>
    <script>
        fetch('/frontend/includes/footer.html')
            .then(r => r.text())
            .then(h => document.getElementById('footer-container').innerHTML = h);
    </script>

    <script>
        function getParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        async function loadSelectOptions() {
            try {
                const [divRes, typeRes] = await Promise.all([
                    fetch('/api/divisions'),
                    fetch('/api/project-types')
                ]);

                const divisions = await divRes.json();
                const types = await typeRes.json();

                const divisionSelect = document.getElementById('division');
                const typeSelect = document.getElementById('projectType');

                divisions.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.id;
                    opt.textContent = d.name;
                    divisionSelect.appendChild(opt);
                });

                types.forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t.id;
                    opt.textContent = t.name;
                    typeSelect.appendChild(opt);
                });

            } catch (err) {
                alert('Unable to load form options.');
            }
        }

        async function loadProject() {
            const id = getParam('id');
            if (!id) {
                alert('Invalid project ID.');
                return;
            }

            try {
                const res = await fetch(`/api/projects/${id}`);
                if (!res.ok) throw new Error('Failed to load project');

                const p = await res.json();

                document.getElementById('name').value = p.name || '';
                document.getElementById('division').value = p.divisionId || '';
                document.getElementById('projectType').value = p.projectTypeId || '';
                document.getElementById('status').value = p.status || '';
                document.getElementById('startDate').value = p.startDate || '';
                document.getElementById('endDate').value = p.endDate || '';

            } catch (err) {
                alert('Unable to load project.');
            }
        }

        async function submitForm(e) {
            e.preventDefault();

            const id = getParam('id');
            const form = document.getElementById('editProjectForm');
            const data = Object.fromEntries(new FormData(form));

            try {
                const res = await fetch(`/api/projects/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!res.ok) throw new Error('Failed to update project');

                window.location.href = '/frontend/projects/index.html';

            } catch (err) {
                alert('Unable to update project.');
            }
        }

        loadSelectOptions().then(loadProject);
        document.getElementById('editProjectForm').addEventListener('submit', submitForm);
    </script>

</body>
</html>
