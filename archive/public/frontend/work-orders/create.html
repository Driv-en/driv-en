<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Work Order | Driv-en</title>

    <link rel="stylesheet" href="/frontend/css/layout.css">
    <link rel="stylesheet" href="/frontend/css/form.css">
</head>

<body>

    <!-- Header Include -->
    <div id="header-container"></div>
    <script>
        fetch('/frontend/includes/header.html')
            .then(r => r.text())
            .then(h => document.getElementById('header-container').innerHTML = h);
    </script>

    <div class="container">
        <h1 class="page-title">Create Work Order</h1>

        <form id="createWorkOrderForm" class="section">

            <div class="form-group">
                <label for="title">Title</label>
                <input id="title" name="title" type="text" required>
            </div>

            <div class="form-group">
                <label for="equipment">Equipment</label>
                <select id="equipment" name="equipment" required></select>
            </div>

            <div class="form-group">
                <label for="assignedTo">Assigned To</label>
                <select id="assignedTo" name="assignedTo"></select>
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status">
                    <option value="Open">Open</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tasks">Tasks (one per line)</label>
                <textarea id="tasks" name="tasks" rows="6" placeholder="Diagnose issue&#10;Replace filter&#10;Test operation"></textarea>
            </div>

            <button type="submit" class="btn-primary">Create Work Order</button>
        </form>

        <a class="back-link" href="/frontend/work-orders/index.html">Back to Work Orders</a>
    </div>

    <!-- Footer Include -->
    <div id="footer-container"></div>
    <script>
        fetch('/frontend/includes/footer.html')
            .then(r => r.text())
            .then(h => document.getElementById('footer-container').innerHTML = h);
    </script>

    <script>
        async function loadSelectOptions() {
            try {
                const [equipRes, empRes] = await Promise.all([
                    fetch('/api/equipment'),
                    fetch('/api/employees')
                ]);

                const equipment = await equipRes.json();
                const employees = await empRes.json();

                const equipmentSelect = document.getElementById('equipment');
                const assignedSelect = document.getElementById('assignedTo');

                equipment.forEach(eq => {
                    const opt = document.createElement('option');
                    opt.value = eq.id;
                    opt.textContent = eq.name;
                    equipmentSelect.appendChild(opt);
                });

                employees.forEach(emp => {
                    const opt = document.createElement('option');
                    opt.value = emp.id;
                    opt.textContent = `${emp.firstName} ${emp.lastName}`;
                    assignedSelect.appendChild(opt);
                });

            } catch (err) {
                alert('Unable to load form options.');
            }
        }

        async function submitForm(e) {
            e.preventDefault();

            const form = document.getElementById('createWorkOrderForm');
            const data = Object.fromEntries(new FormData(form));

            // Convert tasks textarea → array
            data.tasks = data.tasks
                ? data.tasks.split('\n').map(t => t.trim()).filter(t => t.length > 0)
                : [];

            try {
                const res = await fetch('/api/work-orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!res.ok) throw new Error('Failed to create work order');

                window.location.href = '/frontend/work-orders/index.html';

            } catch (err) {
                alert('Unable to create work order.');
            }
        }

        loadSelectOptions();
        document.getElementById('createWorkOrderForm').addEventListener('submit', submitForm);
    </script>

</body>
</html>
