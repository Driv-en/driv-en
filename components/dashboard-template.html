<!-- ==========================================================================
     DRIV‑EN DASHBOARD TEMPLATE
     ==========================================================================
     HOW TO USE THIS TEMPLATE:

     1. Copy this entire file.
     2. Rename it to your new page name (e.g., onboarding-employees.html).
     3. Place it in the /public/ folder on GitHub.
     4. Update these sections (search for "UPDATE" to find them):
        a. UPDATE: Page title — change <title> and <body data-page-title="...">
        b. UPDATE: SEO — change description, canonical URL
        c. UPDATE: Page-specific styles — add your CSS in the <style> block
        d. UPDATE: Page content — replace the placeholder with your HTML
        e. UPDATE: Page-specific script — add your JavaScript
     5. Push to GitHub — Cloudflare Pages auto-deploys in 1-2 minutes.

     WHAT THIS TEMPLATE INCLUDES (shared, do not remove):
     - Favicon links
     - Shared dashboard CSS: /styles/dashboard.css
     - Theme toggle (light/dark mode, saved in localStorage)
     - Shared dashboard header (auto-loaded): /components/dashboard-header.html
       - Customer logo (from D1, syncs across devices)
       - DRIV-EN logo
       - Page title (from body data-page-title)
       - Theme toggle slide switch
       - Logout button
     - Shared dashboard JS: /components/dashboard-common.js
       - Loads the header
       - Sets the page title
       - Loads customer logo from D1
       - Initializes theme toggle
       - Loads session (greeting + org_id)
     - Shared auth check: /components/auth-check.js (currently inactive)
     - Cloudflare Web Analytics

     WHAT YOU ADD PER PAGE:
     - Page-specific CSS (in the <style> block, use "page-" prefix for classes)
     - Page-specific HTML (in the <main> section)
     - Page-specific JavaScript (in the <script> block at the bottom)

     CSS CLASS NAMING CONVENTION:
     - Shared classes from dashboard.css: .dash-card, .dash-btn, .dash-input, etc.
     - Page-specific classes: use "page-" prefix (e.g., .page-employee-list)
     - This prevents conflicts between pages.

     AVAILABLE SHARED CSS CLASSES (from dashboard.css):
     - Layout:     .dash-main, .dash-greeting-bar
     - Cards:      .dash-card
     - Buttons:    .dash-btn, .dash-btn-danger, .dash-btn-secondary
     - Inputs:     .dash-input, .dash-label
     - Tables:     .dash-table
     - Badges:     .dash-badge, .dash-badge-success, .dash-badge-info,
                   .dash-badge-warning, .dash-badge-danger, .dash-badge-muted
     - Utilities:  .dash-text-center, .dash-text-right, .dash-text-muted,
                   .dash-mt-1/2/3, .dash-mb-1/2/3, .dash-flex, .dash-flex-between,
                   .dash-gap-1/2, .dash-hidden

     AVAILABLE SHARED JS FUNCTIONS (from dashboard-common.js):
     - dashToggleTheme()  — toggles light/dark mode
     - dashLogout()       — logs out and redirects to login
     - window.dashUser    — the logged-in user object (null until session loads)
     - "dashSessionLoaded" event — fired when user session is loaded

     EXAMPLE: Listening for session load in your page script:
     document.addEventListener("dashSessionLoaded", function(e) {
       console.log("User:", e.detail.email);
       console.log("Org ID:", e.detail.org_id);
     });

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ===== UPDATE: PAGE-SPECIFIC SEO ===== -->
<title>DRIV‑EN | [Page Name]</title>
<meta name="description" content="[Page description for search engines]">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://www.driv-en.com/public/[page-name].html">
<!-- ===== END PAGE-SPECIFIC SEO ===== -->

<!-- Favicon (do not remove) -->
<link rel="icon" type="image/png" href="/icons/favicon.png" sizes="48x48">
<link rel="icon" type="image/png" href="/icons/favicon-96.png" sizes="96x96">
<link rel="icon" type="image/png" href="/icons/favicon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/icons/favicon-180.png">

<!-- ===== SHARED DASHBOARD CSS (do not remove) ===== -->
<!-- Bump ?v= number when dashboard.css changes -->
<link rel="stylesheet" href="/styles/dashboard.css?v=1">

<!-- ===== THEME TOGGLE (do not remove) ===== -->
<!-- Applies the saved theme before the page renders to prevent flash -->
<script>
(function() {
  var saved = localStorage.getItem("driven-theme");
  var system = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  var theme = saved || system;
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>

<!-- ===== UPDATE: PAGE-SPECIFIC STYLES ===== -->
<!-- Add your page-specific CSS here. Use "page-" prefix for class names. -->

    /* Example page-specific styles (delete and replace with your own) */

    .page-demo-card {

      padding: 20px;
    }

</style>

<!-- ===== UPDATE: PAGE TITLE ===== -->

     This text appears in the header's title row (centered).
     Example: data-page-title="Employees"

<!-- ===== UPDATE: PAGE CONTENT ===== -->

<main class="dash-main">

</main>
<!-- ===== END PAGE CONTENT ===== -->

<!-- ===== SHARED DASHBOARD JS (do not remove) ===== -->
<!-- Loads the header, sets page title, loads logo, initializes theme, loads session -->

<script src="/components/auth-check.js"></script>

<!-- ===== UPDATE: PAGE-SPECIFIC SCRIPT ===== -->
<!-- Add your page-specific JavaScript here -->
<script>
    /* Example: Listen for session load to get user info */
    document.addEventListener("dashSessionLoaded", function(e) {
      // e.detail contains the user object:
      // e.detail.email     — user's email
      // e.detail.first_name — user's first name
      // e.detail.org_id    — organization ID (also in localStorage "driven_customer_id")

      console.log("Session loaded for:", e.detail ? e.detail.email : "unknown user");

      // Add your page-specific logic here
    });

    /* Example: A page-specific function */

      // Your code here
    }
</script>
