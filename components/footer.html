<!-- Footer component: keep markup-only here. Scripts inside fetched HTML are not executed when
     the component is inserted via innerHTML. Set the year from the parent page after loading the
     component (see website/blank.html for an example). -->
<footer class="driven-footer" role="contentinfo">
  <div class="footer-box">
    <!-- full-bleed green bar (matches header color) -->
    <div class="driven-header-green" aria-hidden="true"></div>

    <div class="footer-inner">
      <!-- Row 1: copyright, year, company (centered) -->
      <div class="footer-company">
        &copy; <span id="footer-year"></span> Digital Safety Inspection, LLC<span class="footer-dash"> -</span><br class="footer-break">All rights reserved
      </div>

      <!-- Row 2: legal links (centered, smaller, green links) -->
      <nav class="footer-legal" aria-label="Legal">
        <ul class="footer-legal-list">
          <li><a href="/public/legal/privacy">Privacy Policy</a></li>
          <li aria-hidden="true">|</li>
          <li><a href="/public/legal/terms">Terms of Service</a></li>
          <li aria-hidden="true">|</li>
          <li><a href="/public/legal/refund">Refund Policy</a></li>
          <li aria-hidden="true">|</li>
          <li><a href="mailto:support@driv-en.com">Contact Us</a></li>
        </ul>
      </nav>
    </div>
  </div>
</footer>
