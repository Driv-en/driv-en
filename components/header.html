<!-- ========================= -->
<!-- DRIV‑EN HEADER COMPONENT  -->
<!-- ========================= -->

<div class="driven-header">

    <!-- BLACK HEADER BAR -->
    <div class="driven-header-bar">

        <!-- HAMBURGER (mobile only) -->
        <!-- Changed to a button for accessibility; spans used for the three bars -->
        <button class="driven-hamburger" id="drivenHamburger"
                aria-controls="drivenMobileNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
        </button>

        <!-- LOGO -->
        <div class="driven-header-logo">
            <a href="/website/index.html">
                <img src="/logo.png" alt="Driv-en Logo">
            </a>
        </div>

        <!-- NAV (desktop only) -->
        <div class="driven-header-nav" role="navigation" aria-label="Primary">
            <a href="/website/index.html">Home</a>
            <a href="/website/about.html">About</a>
            <a href="/website/modules.html">Modules</a>
            <a href="/website/equipment.html">Equipment</a>
            <a href="/website/safety.html">Safety</a>
            <a href="/website/project.html">Project</a>
            <a href="/website/referral.html">Referral Program</a>
        </div>

        <!-- LOGIN ICON -->
        <div class="driven-header-login">
            <a href="/public/login.html">
                <img src="/icons/driven-login-icon.png" alt="Login">
            </a>
        </div>

    </div>

    <!-- GREEN BAR -->
    <div class="driven-header-green" aria-hidden="true"></div>

    <!-- MOBILE NAV -->
    <nav class="driven-mobile-nav" id="drivenMobileNav" aria-hidden="true" aria-label="Mobile">
        <a href="/website/index.html">Home</a>
        <a href="/website/about.html">About</a>
        <a href="/website/modules.html">Modules</a>
        <a href="/website/equipment.html">Equipment</a>
        <a href="/website/safety.html">Safety</a>
        <a href="/website/project.html">Project</a>
        <a href="/website/referral.html">Referral Program</a>
    </nav>

</div>

<script>
(function () {
  const drivenHamburger = document.getElementById("drivenHamburger");
  const drivenMobileNav = document.getElementById("drivenMobileNav");

  // If either element is missing, bail out safely.
  if (!drivenHamburger || !drivenMobileNav) return;

  // Helper to open/close and keep aria in sync
  function openNav() {
    drivenMobileNav.classList.add("active");
    drivenHamburger.setAttribute("aria-expanded", "true");
    drivenMobileNav.setAttribute("aria-hidden", "false");
  }
  function closeNav() {
    drivenMobileNav.classList.remove("active");
    drivenHamburger.setAttribute("aria-expanded", "false");
    drivenMobileNav.setAttribute("aria-hidden", "true");
  }
  function toggleNav() {
    const expanded = drivenHamburger.getAttribute("aria-expanded") === "true";
    if (expanded) closeNav(); else openNav();
  }

  // Click the hamburger to toggle
  drivenHamburger.addEventListener("click", (e) => {
    e.stopPropagation();
    toggleNav();
  });

  // Close when a mobile nav link is clicked
  drivenMobileNav.querySelectorAll("a").forEach((a) => {
    a.addEventListener("click", () => {
      closeNav();
    });
  });

  // Close on Escape
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      // Only act if nav is open
      if (drivenHamburger.getAttribute("aria-expanded") === "true") {
        closeNav();
        drivenHamburger.focus();
      }
    }
  });

  // Optional: close when clicking outside the mobile nav
  document.addEventListener("click", (e) => {
    if (drivenHamburger.getAttribute("aria-expanded") === "true") {
      const clickInsideNav = drivenMobileNav.contains(e.target) || drivenHamburger.contains(e.target);
      if (!clickInsideNav) closeNav();
    }
  });

})();
</script>
