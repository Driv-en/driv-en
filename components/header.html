<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Driv‑en — Header</title>

  <!-- Header styles (ensure this path matches your repo) -->
  <link rel="stylesheet" href="/styles/header.css" />
</head>
<body>

  <!-- ========================= -->
  <!-- DRIV‑EN HEADER COMPONENT  -->
  <!-- ========================= -->

  <header class="driven-header">

    <!-- BLACK HEADER BAR -->
    <div class="driven-header-bar">

      <!-- HAMBURGER (mobile only) -->
      <!-- Accessible button with three spans for the bars -->
      <button
        class="driven-hamburger"
        id="drivenHamburger"
        aria-controls="drivenMobileNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
        type="button"
      >
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>

      <!-- LOGO -->
      <div class="driven-header-logo">
        <a href="/website/index.html">
          <img src="/logo.png" alt="Driv‑en Logo">
        </a>
      </div>

      <!-- NAV (desktop only) -->
      <nav class="driven-header-nav" role="navigation" aria-label="Primary">
        <a href="/website/index.html">Home</a>
        <a href="/website/about.html">About</a>
        <a href="/website/modules.html">Modules</a>
        <a href="/website/equipment.html">Equipment</a>
        <a href="/website/safety.html">Safety</a>
        <a href="/website/project.html">Project</a>
        <a href="/website/referral.html">Referral Program</a>
      </nav>

      <!-- LOGIN ICON -->
      <div class="driven-header-login">
        <a href="/public/login.html">
          <img src="/icons/driven-login-icon.png" alt="Login">
        </a>
      </div>

    </div><!-- .driven-header-bar -->

    <!-- GREEN BAR -->
    <div class="driven-header-green" aria-hidden="true"></div>

    <!-- MOBILE NAV -->
    <nav
      class="driven-mobile-nav"
      id="drivenMobileNav"
      aria-hidden="true"
      aria-label="Mobile"
    >
      <a href="/website/index.html">Home</a>
      <a href="/website/about.html">About</a>
      <a href="/website/modules.html">Modules</a>
      <a href="/website/equipment.html">Equipment</a>
      <a href="/website/safety.html">Safety</a>
      <a href="/website/project.html">Project</a>
      <a href="/website/referral.html">Referral Program</a>
    </nav>

  </header>

  <!-- Load the header script (defer so DOM is present) -->
  <script src="/scripts/header.js" defer></script>
</body>
</html>
