<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Equipment Detail | DRIV-EN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <header class="global-header"></header>

  <div class="sticky-wrapper">
    <main>
      <section class="page-header">
        <h1>Equipment Detail</h1>
        <p>Specs, status, and history for a single unit.</p>
      </section>

      <section class="equipment-specs">
        <h2>Specs</h2>
        <!-- Make, model, year, type, etc. -->
      </section>

      <section class="equipment-status">
        <h2>Status</h2>
        <!-- Current status, downtime, out-of-service -->
      </section>

      <section class="equipment-meter">
        <h2>Meter & Fuel</h2>
        <!-- Meter readings, fuel usage -->
      </section>

      <section class="equipment-attachments">
        <h2>Attachments & Documents</h2>
        <!-- Files, configs -->
      </section>

      <section class="equipment-pm">
        <h2>Preventative Maintenance</h2>
        <!-- PM schedules, completions -->
      </section>

      <section class="equipment-inspections">
        <h2>Inspections</h2>
        <!-- Inspection history -->
      </section>

      <section class="equipment-workorders">
        <h2>Work Orders</h2>
        <!-- Related work orders -->
      </section>
    </main>

    <footer class="global-footer"></footer>
  </div>
</body>
</html>
