<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inspection Detail | DRIV-EN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <header class="global-header"></header>

  <div class="sticky-wrapper">
    <main>
      <section class="page-header">
        <h1>Inspection Detail</h1>
        <p>Single inspection record and safety status.</p>
      </section>

      <section class="inspection-info">
        <h2>Inspection Info</h2>
        <!-- Equipment, operator, date -->
      </section>

      <section class="inspection-form">
        <h2>Inspection Checklist</h2>
        <!-- Form: checklist items, pass/fail, safety flag -->
      </section>

      <section class="inspection-result">
        <h2>Result</h2>
        <!-- Summary, work order trigger -->
      </section>
    </main>

    <footer class="global-footer"></footer>
  </div>
</body>
</html>
