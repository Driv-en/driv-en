<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PM Detail | DRIV-EN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <header class="global-header"></header>

  <div class="sticky-wrapper">
    <main>
      <section class="page-header">
        <h1>PM Detail</h1>
        <p>Single PM assignment, completion, and review.</p>
      </section>

      <section class="pm-info">
        <h2>PM Info</h2>
        <!-- Equipment, PM template, due date -->
      </section>

      <section class="pm-completion-form">
        <h2>Completion</h2>
        <!-- Form: completed date, meter, notes, pass/fail -->
      </section>

      <section class="pm-review">
        <h2>Review</h2>
        <!-- Manager/Foreman review, work order trigger -->
      </section>
    </main>

    <footer class="global-footer"></footer>
  </div>
</body>
</html>
