<header style="background:#222; padding:15px; color:#fff;">
    <div style="display:flex; align-items:center; justify-content:space-between;">

        <!-- Left side: Customer Branding -->
        <div style="display:flex; align-items:center; gap:15px;">
            <!-- Customer Logo -->
            <img id="customerLogo" src="" alt="Customer Logo" style="height:40px; display:none;">

            <!-- Customer Name -->
            <span id="customerName" style="font-size:20px; font-weight:bold;"></span>
        </div>

        <!-- Right side: Driv-en Branding -->
        <div style="font-size:24px; font-weight:bold;">
            DRIV-EN
        </div>

        <!-- Navigation -->
        <nav>
            <a href="#" style="color:#fff; margin-right:20px; text-decoration:none;">Dashboard</a>
            <a href="#" style="color:#fff; margin-right:20px; text-decoration:none;">Equipment</a>
            <a href="#" style="color:#fff; margin-right:20px; text-decoration:none;">Inspections</a>
            <a href="#" style="color:#fff; text-decoration:none;">Logout</a>
        </nav>
    </div>
</header>

<script>
    // Worker will inject customer branding here
    fetch('/api/customer-branding')
        .then(response => response.json())
        .then(data => {
            if (data.logoUrl) {
                const logo = document.getElementById('customerLogo');
                logo.src = data.logoUrl;
                logo.style.display = 'block';
            }

            if (data.customerName) {
                document.getElementById('customerName').textContent = data.customerName;
            }
        });
</script>
