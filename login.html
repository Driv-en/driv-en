<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Driv-en | Login</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f7f7f7;
            color: #222;
        }

        /* Logo */
        .logo-container {
            padding: 40px 24px 10px 24px;
            text-align: center;
        }

        .logo-container img {
            width: 200px;
            height: auto;
        }

        /* Login Box */
        .login-box {
            width: 360px;
            margin: 40px auto;
            background: white;
            padding: 24px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 700;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            display: block;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        input.error {
            border-color: #cc0000;
        }

        .login-button {
            width: 100%;
            background: #ffcc00;
            color: #111;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .error-banner {
            background: #ffdddd;
            color: #cc0000;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px;
            background: #222;
            color: white;
            margin-top: 40px;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <!-- Logo -->
    <div class="logo-container">
        <img src="logo.png" alt="Driv-en Logo" />
    </div>

    <!-- Login Box -->
    <div class="login-box">
        <h2>Login</h2>

        <div id="error-banner" class="error-banner">
            Invalid credentials.
        </div>

        <form id="login-form">
            <label>Email</label>
            <input type="email" id="email" required />

            <label>Password</label>
            <input type="password" id="password" required />

            <button type="submit" class="login-button">Login</button>
        </form>
    </div>

    <!-- Footer -->
    <footer>
        © 2026 Digital Safety Inspection, LLC. Driv-en is a Digital Safety Inspection, LLC platform.
    </footer>

    <script>
        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email");
            const password = document.getElementById("password");
            const errorBanner = document.getElementById("error-banner");

            email.classList.remove("error");
            password.classList.remove("error");
            errorBanner.style.display = "none";

            const response = await fetch("/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    email: email.value.trim(),
                    password: password.value.trim()
                })
            });

            const result = await response.json();

            if (!result.success) {
                errorBanner.style.display = "block";
                email.classList.add("error");
                password.classList.add("error");
                return;
            }

            switch (result.role) {
                case "Technician":
                    window.location.href = "/dashboard/tech";
                    break;
                case "Operator":
                    window.location.href = "/dashboard/operator";
                    break;
                case "Foreman":
                    window.location.href = "/dashboard/foreman";
                    break;
                case "Manager":
                    window.location.href = "/dashboard/manager";
                    break;
                case "Admin":
                    window.location.href = "/dashboard/admin";
                    break;
                default:
                    window.location.href = "/login";
            }
        });
    </script>

</body>
</html>
