<body>

<!-- Header (auto-loaded) -->
<div id="header"></div>

<!-- ===== PAGE CONTENT ===== -->
<div class="change-section">
    <div class="change-icon-wrap">
        <span class="login-icon-mask"></span>
        <img src="/icons/driven-login-icon.png" class="login-icon-fallback" alt="DRIV‑EN login icon">
    </div>
    <h2>Change Your Password</h2>
    <p class="subtitle">You're required to set a new password before continuing.</p>

    <div id="error-banner" class="error-banner"></div>
    <div id="success-banner" class="success-banner">
        Password changed successfully. Redirecting to your dashboard...
    </div>

    <form id="change-form">
        <label>Current Password<span class="required-star">*</span></label>
        <input type="password" id="current-password" required />

        <label>New Password<span class="required-star">*</span></label>
        <input type="password" id="new-password" required />
        <div class="password-hint">Minimum 8 characters.</div>

        <label>Confirm New Password<span class="required-star">*</span></label>
        <input type="password" id="confirm-password" required />

        <button type="submit" class="change-button">Update Password</button>
    </form>
</div>
<!-- ===== END PAGE CONTENT ===== -->

<!-- Footer (auto-loaded) -->
<div id="footer"></div>

<!-- ===== SHARED SCRIPT (do not remove) ===== -->
<script>
async function loadComponent(id, file) {
    try {
        const el = document.getElementById(id);
        const html = await fetch(file).then(r => r.text());
        el.innerHTML = html;
    } catch (e) {
        console.error("Component failed:", id, file, e);
    }
}

document.addEventListener("DOMContentLoaded", async () => {
    await loadComponent("header", "/components/header.html");
    await loadComponent("footer", "/components/footer.html");

    const yearEl = document.getElementById('footer-year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();
});
</script>
<script src="/components/nav.js?v=2"></script>

<!-- ===== CHANGE PASSWORD SCRIPT ===== -->
<script>
    document.getElementById("change-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const currentPassword = document.getElementById("current-password");
        const newPassword = document.getElementById("new-password");
        const confirmPassword = document.getElementById("confirm-password");
        const errorBanner = document.getElementById("error-banner");
        const successBanner = document.getElementById("success-banner");

        // Reset states
        [currentPassword, newPassword, confirmPassword].forEach(el => el.classList.remove("error"));
        errorBanner.style.display = "none";
        successBanner.style.display = "none";

        // Client-side validation
        if (newPassword.value.length < 8) {
            errorBanner.textContent = "New password must be at least 8 characters.";
            errorBanner.style.display = "block";
            newPassword.classList.add("error");
            return;
        }

        if (newPassword.value !== confirmPassword.value) {
            errorBanner.textContent = "New passwords do not match.";
            errorBanner.style.display = "block";
            newPassword.classList.add("error");
            confirmPassword.classList.add("error");
            return;
        }

        // Submit to worker
        const response = await fetch("/auth/change-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                current_password: currentPassword.value,
                new_password: newPassword.value
            })
        });

        const result = await response.json();

        if (!result.success) {
            errorBanner.textContent = result.error || "Failed to change password.";
            errorBanner.style.display = "block";
            if (result.error && result.error.toLowerCase().includes("current password")) {
                currentPassword.classList.add("error");
            }
            return;
        }

        // Success — get role from session and redirect to dashboard
        successBanner.style.display = "block";

        const sessionRes = await fetch("/auth/session");
        const sessionData = await sessionRes.json();

        if (sessionData.authenticated) {
            const dashboards = {
                "Admin": "/dashboard/admin",
                "Project Manager": "/dashboard/project",
                "Equipment Manager": "/dashboard/equipment",
                "Mechanic": "/dashboard/mechanic",
                "Employee": "/dashboard/employee"
            };
            window.location.href = dashboards[sessionData.user.role] || "/dashboard";
        } else {
            window.location.href = "/login";
        }
    });

    // Redirect to login if not authenticated
    fetch("/auth/session").then(r => r.json()).then(data => {
        if (!data.authenticated) {
            window.location.href = "/login";
        }
    });
</script>
