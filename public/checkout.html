<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DRIV‑EN – Checkout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.png" />

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 16px 24px;
      border-bottom: 1px solid #1f2937;
      background: #020617;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header img.logo {
      height: 88px;
    }

    header .title-block h1 {
      font-size: 18px;
      margin: 0;
    }

    header .title-block span {
      font-size: 12px;
      color: #9ca3af;
    }

    main {
      flex: 1;
      max-width: 900px;
      margin: 32px auto;
      padding: 0 16px;
      box-sizing: border-box;
      width: 100%;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    p {
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 16px;
    }

    .card {
      border: 1px solid #1f2937;
      background: #020617;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
      overflow: hidden;
      box-sizing: border-box;
      width: 100%;
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 16px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-field label {
      font-size: 13px;
      color: #e5e7eb;
      font-weight: 600;
    }

    .form-field input,
    .form-field select {
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #374151;
      background: #0f172a;
      color: #e5e7eb;
      box-sizing: border-box;
      font-size: 13px;
    }

    .form-field input.error,
    .form-field select.error {
      border-color: #ef4444;
      background: #1e293b;
    }

    .module-row {
      display: grid;
      grid-template-columns: 1fr 120px 120px;
      padding: 10px 0;
      border-bottom: 1px solid #1f2937;
      column-gap: 12px;
      box-sizing: border-box;
      width: 100%;
    }

    .module-row:last-child {
      border-bottom: none;
    }

    .module-name {
      font-size: 15px;
      font-weight: 600;
    }

    .unit-price {
      font-size: 15px;
      font-weight: 600;
      text-align: right;
      color: #e5e7eb;
    }

    .extended-price {
      font-size: 15px;
      font-weight: 600;
      text-align: right;
      color: #22c55e;
    }

    .savings-line {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 6px;
      background: #022c22;
      border: 1px solid #22c55e;
      font-size: 14px;
      color: #bbf7d0;
      font-weight: 600;
    }

    .footer-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    button {
      font-size: 13px;
      border-radius: 6px;
      padding: 10px 16px;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .btn-secondary {
      background: #020617;
      border-color: #374151;
      color: #e5e7eb;
    }

    .btn-primary {
      background: #22c55e;
      border-color: #16a34a;
      color: #022c22;
      font-weight: 600;
    }

    .status-bar {
      margin-top: 12px;
      font-size: 12px;
      color: #9ca3af;
      min-height: 18px;
    }

    .status-bar.error {
      color: #ef4444;
    }

    .status-bar.success {
      color: #4ade80;
    }

    footer {
      padding: 16px;
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
      border-top: 1px solid #1f2937;
      background: #020617;
      box-sizing: border-box;
      width: 100%;
    }

    .footer-line-2 {
      display: block;
      margin-top: 4px;
      color: #6b7280;
    }

    #billing-address-element,
    #card-element {
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #374151;
      background: #0f172a;
      color: #e5e7eb;
      box-sizing: border-box;
      font-size: 13px;
      margin-bottom: 10px;
    }

    @media (max-width: 600px) {
      header img.logo {
        height: 48px;
      }
      main {
        padding: 0 12px;
      }
      .card {
        padding: 16px;
      }
      .form-row {
        grid-template-columns: 1fr;
      }
      .module-row {
        grid-template-columns: minmax(0, 60%) 1fr 1fr;
      }
      .module-name {
        word-break: break-word;
      }
      .extended-price {
        text-align: right;
        padding-top: 0;
      }
    }

    @media print {
      header {
        position: static !important;
        background: #ffffff !important;
        border-bottom: 1px solid #000000 !important;
      }
      body,
      main,
      .card,
      footer {
        background: #ffffff !important;
        color: #000000 !important;
      }
      .card {
        border-color: #000000 !important;
      }
      .extended-price {
        color: #000000 !important;
      }
      .savings-line {
        background: #ffffff !important;
        border-color: #000000 !important;
        color: #000000 !important;
      }
    }
  </style>

  <script src="https://js.stripe.com/v3/"></script>
</head>

<body>
  <!-- HEADER -->
  <header>
    <img class="logo" src="/logo.png" alt="DRIV‑EN Logo" />
    <div class="title-block">
      <h1>DRIV‑EN – Checkout</h1>
      <span>Step 3 · Confirm your order</span>
    </div>
  </header>

  <main>
    <!-- ORDER NUMBER + PO -->
    <div class="card">
      <h3>Order Details</h3>
      <div class="form-row">
        <div class="form-field">
          <label>Order Number</label>
          <input id="orderNumber" type="text" readonly />
        </div>
        <div class="form-field">
          <label>Purchase Order (optional)</label>
          <input id="poNumber" type="text" />
        </div>
      </div>
    </div>

    <!-- MODULES SELECTED -->
    <div class="card">
      <h3>Modules Selected</h3>
      <div id="modulesList"></div>
      <div class="savings-line" id="invoiceSavingsBox"></div>
    </div>

    <!-- VALIDATION BANNER -->
    <div id="statusBanner" class="status-bar"></div>

    <!-- CUSTOMER INFORMATION -->
    <div class="card">
      <h3>Customer Information</h3>
      <div class="form-row">
        <div class="form-field">
          <label>Company Name *</label>
          <input id="companyName" type="text" />
        </div>
        <div class="form-field">
          <label>Contact Name *</label>
          <input id="contactName" type="text" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label>Phone *</label>
          <input id="phone" type="text" />
        </div>
        <div class="form-field">
          <label>Email *</label>
          <input id="email" type="email" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label>Street *</label>
          <input id="street" type="text" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label>City *</label>
          <input id="city" type="text" />
        </div>
        <div class="form-field">
          <label>State *</label>
          <input id="state" type="text" />
        </div>
        <div class="form-field">
          <label>Zip *</label>
          <input id="zip" type="text" />
        </div>
      </div>
    </div>

    <!-- BILLING INFORMATION -->
    <div class="card">
      <h3>Billing Information & Payment</h3>

      <div class="form-field">
        <label>
          <input type="checkbox" id="billingSameAsCompany" checked />
          Billing address is the same as company address
        </label>
      </div>

      <div id="billing-address-element"></div>
      <div id="card-element"></div>
      <div id="card-errors" class="status-bar error"></div>
    </div>

    <!-- SUCCESS BANNER -->
    <div id="statusSuccess" class="status-bar success"></div>

    <!-- BUTTONS -->
    <div class="footer-actions">
      <button class="btn-secondary" id="btnBackModules">Back to Modules</button>
      <button class="btn-secondary" id="btnBackCart">Back to Cart</button>
      <button class="btn-secondary" id="btnPrint">Print</button>
      <button class="btn-primary" id="btnConfirm">Confirm & Pay</button>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    © 2026 Digital Safety Inspection, LLC.
    <span class="footer-line-2">Driv-en is a Digital Safety Inspection, LLC platform.</span>
  </footer>

  <script>
    // ORDER NUMBER
    function generateOrderNumber() {
      const date = new Date();
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      const rand = String(Math.floor(Math.random() * 90000) + 10000);
      return `DRN-${y}${m}${d}-${rand}`;
    }
    document.getElementById("orderNumber").value = generateOrderNumber();

    // PRICING
    const PRICES = {
      equipment: 149,
      pm: 299,
      inspections: 199,
      extraction: 149,
      workorders: 149,
      fuel: 49,
      transfers: 79
    };

    const BUNDLES = {
      "Operations Bundle": {
        modules: ["equipment", "pm", "inspections", "extraction"],
        price: 499
      },
      "Full Equipment Bundle": {
        modules: ["equipment", "pm", "inspections", "workorders", "extraction"],
        price: 529
      },
      "Complete Platform Bundle": {
        modules: ["equipment", "pm", "inspections", "workorders", "fuel", "transfers", "extraction"],
        price: 599
      }
    };

    const MODULE_MAP = {
      equipment: "Equipment Management (Required)",
      pm: "Preventative Maintenance",
      inspections: "Equipment Inspections",
      extraction: "Extraction Engine",
      workorders: "Work Orders",
      fuel: "Fuel Usage Tracking",
      transfers: "Equipment Transfer Tracking"
    };

    function renderModules() {
      const payload = JSON.parse(localStorage.getItem("driven_checkout_payload") || "{}");
      const selections = JSON.parse(localStorage.getItem("driven_modules") || "{}");

      const selectedModules = ["equipment"];
      if (selections.pm) selectedModules.push("pm");
      if (selections.inspections) selectedModules.push("inspections");
      if (selections.workorders) selectedModules.push("workorders");
      if (selections.fuel) selectedModules.push("fuel");
      if (selections.transfers) selectedModules.push("transfers");
      if (selections.extraction) selectedModules.push("extraction");

      const bundleName = payload.bundle || selections.bundle || null;
      const bundle = bundleName ? BUNDLES[bundleName] : null;
      const bundleModules = bundle ? new Set(bundle.modules) : new Set();

      let sumUnitPrices = 0;
      let chargeTotal = 0;
      let html = "";

      selectedModules.forEach(key => {
        const name = MODULE_MAP[key];
        const price = PRICES[key];
        sumUnitPrices += price;

        const extended = bundleModules.has(key) ? "-" : `$${price}`;
        if (!bundleModules.has(key)) chargeTotal += price;

        html += `
          <div class="module-row">
            <div class="module-name">${name}</div>
            <div class="unit-price">$${price}</div>
            <div class="extended-price">${extended}</div>
          </div>
        `;
      });

      if (bundle) {
        chargeTotal = bundle.price;
        html += `
          <div class="module-row">
            <div class="module-name">${bundleName}</div>
            <div class="unit-price">Bundle</div>
            <div class="extended-price">$${bundle.price}</div>
          </div>
        `;
      }

      document.getElementById("modulesList").innerHTML = html;

      let savingsNumber = 0;
      if (payload.billingPeriod === "monthly") {
        savingsNumber = sumUnitPrices - chargeTotal;
      } else {
        const annualUnitTotal = sumUnitPrices * 12;
        const subtotal = Number(payload.invoiceSubtotal || 0);
        savingsNumber = annualUnitTotal - subtotal;
      }
      if (savingsNumber < 0) savingsNumber = 0;

      document.getElementById("invoiceSavingsBox").textContent =
        `Total Savings: $${savingsNumber.toFixed(2)}`;
    }
    renderModules();

    // NAVIGATION
    document.getElementById("btnBackCart").onclick = () => {
      window.location.href = "cart.html";
    };
    document.getElementById("btnBackModules").onclick = () => {
      window.location.href = "module-selection.html";
    };
    document.getElementById("btnPrint").onclick = () => {
      window.print();
    };

    // VALIDATION
    function validateForm() {
      const fields = [
        "companyName",
        "contactName",
        "phone",
        "email",
        "street",
        "city",
        "state",
        "zip"
      ];

      let firstMissing = null;
      let valid = true;

      fields.forEach(id => {
        const el = document.getElementById(id);
        el.classList.remove("error");
        if (!el.value.trim()) {
          el.classList.add("error");
          valid = false;
          if (!firstMissing) firstMissing = el;
        }
      });

      const banner = document.getElementById("statusBanner");
      banner.classList.remove("error");
      banner.style.display = "none";

      if (!valid) {
        banner.textContent = "Please complete all required fields.";
        banner.classList.add("error");
        banner.style.display = "block";
        window.scrollTo({ top: 0, behavior: "smooth" });
        if (firstMissing) firstMissing.focus();
      }

      return valid;
    }

    // STRIPE
    let stripe;
    let elements;
    let cardElement;
    let billingAddressElement;
    let clientSecret;

    async function initStripe() {
      stripe = Stripe("pk_test_YOUR_PUBLISHABLE_KEY_HERE"); // replace with real key

      const response = await fetch("/create-payment-intent", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          // include metadata if needed
        })
      });

      const data = await response.json();
      clientSecret = data.clientSecret;

      elements = stripe.elements({ clientSecret });

      billingAddressElement = elements.create("address", {
        mode: "billing"
      });
      billingAddressElement.mount("#billing-address-element");

      cardElement = elements.create("payment");
      cardElement.mount("#card-element");
    }

    initStripe().catch(err => {
      console.error("Stripe initialization error:", err);
      document.getElementById("card-errors").textContent =
        "Unable to initialize payment form. Please try again later.";
    });

    // CONFIRM & PAY
    document.getElementById("btnConfirm").addEventListener("click", async () => {
      if (!validateForm()) return;

      const payload = JSON.parse(localStorage.getItem("driven_checkout_payload") || "{}");

      const orderData = {
        orderNumber: document.getElementById("orderNumber").value,
        companyName: document.getElementById("companyName").value.trim(),
        contactName: document.getElementById("contactName").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        email: document.getElementById("email").value.trim(),
        street: document.getElementById("street").value.trim(),
        city: document.getElementById("city").value.trim(),
        state: document.getElementById("state").value.trim(),
        zip: document.getElementById("zip").value.trim(),
        poNumber: document.getElementById("poNumber").value.trim(),
        billingPeriod: payload.billingPeriod,
        invoiceSubtotal: Number(payload.invoiceSubtotal || 0),
        invoiceTax: Number(payload.invoiceTax || 0),
        invoiceTotal: Number(payload.invoiceTotal || 0),
        totalSavings: Number(
          document
            .getElementById("invoiceSavingsBox")
            .textContent.replace(/[^\d.-]/g, "")
        ) || 0
      };

      console.log("Order data (pre-payment):", orderData);

      document.getElementById("card-errors").textContent = "";
      const statusSuccess = document.getElementById("statusSuccess");
      statusSuccess.textContent = "";

      try {
        const { error } = await stripe.confirmPayment({
          elements,
          confirmParams: {
            // return_url: "https://www.driv-en.com/public/onboarding-start.html",
          }
        });

        if (error) {
          document.getElementById("card-errors").textContent =
            error.message || "Payment error.";
          return;
        }

        statusSuccess.innerHTML =
          'Order confirmed. Thank you for choosing <img src="/logo.png" alt="DRIV‑EN Logo" style="height:80px;vertical-align:middle;">';
      } catch (err) {
        console.error("Payment confirmation error:", err);
        document.getElementById("card-errors").textContent =
          "An unexpected error occurred while processing your payment.";
      }
    });
  </script>
</body>
</html>
