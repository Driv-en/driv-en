<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DRIV‑EN – Checkout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Stripe.js -->
  <script src="https://js.stripe.com/v3/"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background: #f3f4f6;
      color: #111827;
    }

    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    h1, h2, h3 {
      margin: 0 0 12px;
      font-weight: 600;
    }

    .order-header {
      margin-bottom: 16px;
    }

    .order-header-line {
      margin-bottom: 8px;
      font-size: 14px;
    }

    .order-header-line span.label {
      font-weight: 600;
    }

    .card {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }

    .card-gray {
      background: #f9fafb;
      border: 1px solid #d1d5db;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .field-row {
      display: flex;
      gap: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .field {
      flex: 1;
      min-width: 180px;
      display: flex;
      flex-direction: column;
    }

    .field label {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .field input,
    .field select {
      padding: 8px 10px;
      border-radius: 4px;
      border: 1px solid #d1d5db;
      font-size: 14px;
    }

    .field input.error,
    .field select.error {
      border-color: #b91c1c;
    }

    .status-banner {
      display: none;
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
    }

    .status-banner.error {
      display: block;
      background: #fee2e2;
      color: #b91c1c;
    }

    .status-banner.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .status-banner-icon {
      margin-right: 6px;
    }

    .modules-list {
      font-size: 14px;
    }

    .modules-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .modules-row span.name {
      font-weight: 500;
    }

    .modules-row span.price {
      font-weight: 500;
    }

    .totals-row {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 14px;
    }

    .totals-row span.label {
      font-weight: 600;
    }

    .totals-row span.value {
      font-weight: 600;
    }

    .buttons-row {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 16px;
      border-radius: 6px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-primary {
      background: #2563eb;
      color: #ffffff;
    }

    .logo-inline {
      height: 80px;
      vertical-align: middle;
    }

    #card-element,
    #billing-address-element {
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      margin-bottom: 10px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 13px;
    }

    footer {
      text-align: center;
      padding: 20px 0;
      font-size: 14px;
      color: #374151;
    }

    .footer-line-2 {
      display: block;
      margin-top: 4px;
      font-size: 13px;
      color: #4b5563;
    }

    @media (max-width: 640px) {
      .page {
        padding: 16px 12px 32px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- ORDER HEADER -->
    <div class="order-header">
      <div class="order-header-line">
        <span class="label">Order Number:</span>
        <span id="orderNumber"></span>
      </div>
      <div class="order-header-line">
        <span class="label">Purchase Order (optional):</span>
        <input id="poNumber" type="text"
               style="width: 260px; padding: 6px 8px; border-radius: 4px; border: 1px solid #d1d5db; font-size: 13px;" />
      </div>
    </div>

    <!-- MODULES SELECTED CARD -->
    <div class="card card-gray">
      <div class="card-title">Modules Selected & Pricing Summary</div>
      <div class="modules-list" id="modulesList"></div>

      <div class="totals-row">
        <span class="label">Billing Period:</span>
        <span class="value" id="invoicePeriod"></span>
      </div>
      <div class="totals-row">
        <span class="label">Subtotal:</span>
        <span class="value" id="invoiceSubtotal"></span>
      </div>
      <div class="totals-row">
        <span class="label">Tax:</span>
        <span class="value" id="invoiceTax"></span>
      </div>
      <div class="totals-row">
        <span class="label">Total:</span>
        <span class="value" id="invoiceTotal"></span>
      </div>
      <div class="totals-row">
        <span class="label">Total Savings:</span>
        <span class="value" id="invoiceSavingsBox"></span>
      </div>
    </div>

    <!-- VALIDATION BANNER (ABOVE CUSTOMER INFO) -->
    <div id="statusBanner" class="status-banner">
      <span class="status-banner-icon">⚠</span>
      <span id="statusBannerText"></span>
    </div>

    <!-- CUSTOMER INFORMATION CARD -->
    <div class="card">
      <div class="card-title">Customer Information</div>
      <div class="field-row">
        <div class="field">
          <label for="companyName">Company Name *</label>
          <input id="companyName" type="text" />
        </div>
        <div class="field">
          <label for="contactName">Contact Name *</label>
          <input id="contactName" type="text" />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="phone">Phone *</label>
          <input id="phone" type="text" />
        </div>
        <div class="field">
          <label for="email">Email *</label>
          <input id="email" type="email" />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="street">Street *</label>
          <input id="street" type="text" />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="city">City *</label>
          <input id="city" type="text" />
        </div>
        <div class="field">
          <label for="state">State *</label>
          <input id="state" type="text" />
        </div>
        <div class="field">
          <label for="zip">Zip *</label>
          <input id="zip" type="text" />
        </div>
      </div>
    </div>

    <!-- BILLING INFORMATION (STRIPE ELEMENTS) -->
    <div class="card">
      <div class="card-title">Billing Information & Payment</div>

      <div class="checkbox-row">
        <input type="checkbox" id="billingSameAsCompany" checked />
        <label for="billingSameAsCompany">Billing address is the same as company address</label>
      </div>

      <div id="billing-address-element"></div>
      <div id="card-element"></div>
      <div id="card-errors" style="color:#b91c1c; font-size:13px; margin-top:4px;"></div>
    </div>

    <!-- SUCCESS BANNER -->
    <div id="statusSuccess" class="status-banner">
      <span id="statusSuccessText"></span>
    </div>

    <!-- BUTTONS -->
    <div class="buttons-row">
      <button type="button" class="btn-secondary" id="btnBackModules">Back to Modules</button>
      <button type="button" class="btn-secondary" id="btnBackCart">Back to Cart</button>
      <button type="button" class="btn-secondary" id="btnPrint">Print</button>
      <button type="button" class="btn-primary" id="btnConfirm">Confirm & Pay</button>
    </div>
  </div>

  <!-- OFFICIAL FOOTER -->
  <footer>
    © 2026 Digital Safety Inspection, LLC.
    <span class="footer-line-2">Driv-en is a Digital Safety Inspection, LLC platform.</span>
  </footer>

  <script>
    // DOM refs
    const modulesListEl = document.getElementById("modulesList");
    const invoicePeriodEl = document.getElementById("invoicePeriod");
    const invoiceSubtotalEl = document.getElementById("invoiceSubtotal");
    const invoiceTaxEl = document.getElementById("invoiceTax");
    const invoiceTotalEl = document.getElementById("invoiceTotal");
    const invoiceSavingsBoxEl = document.getElementById("invoiceSavingsBox");

    const statusBanner = document.getElementById("statusBanner");
    const statusBannerText = document.getElementById("statusBannerText");
    const statusSuccess = document.getElementById("statusSuccess");
    const statusSuccessText = document.getElementById("statusSuccessText");

    const companyNameEl = document.getElementById("companyName");
    const contactNameEl = document.getElementById("contactName");
    const phoneEl = document.getElementById("phone");
    const emailEl = document.getElementById("email");
    const streetEl = document.getElementById("street");
    const cityEl = document.getElementById("city");
    const stateEl = document.getElementById("state");
    const zipEl = document.getElementById("zip");
    const poNumberEl = document.getElementById("poNumber");

    const PRICES = {
      equipment: 149,
      pm: 299,
      inspections: 199,
      extraction: 149,
      workorders: 149,
      fuel: 49,
      transfers: 79
    };

    const BUNDLES = {
      "Operations Bundle": {
        modules: ["equipment", "pm", "inspections", "extraction"],
        price: 499
      },
      "Full Equipment Bundle": {
        modules: ["equipment", "pm", "inspections", "workorders", "extraction"],
        price: 529
      },
      "Complete Platform Bundle": {
        modules: ["equipment", "pm", "inspections", "workorders", "fuel", "transfers", "extraction"],
        price: 599
      }
    };

    const MODULE_MAP = {
      equipment: "Equipment Management (Required)",
      pm: "Preventative Maintenance",
      inspections: "Equipment Inspections",
      extraction: "Extraction Engine",
      workorders: "Work Orders",
      fuel: "Fuel Usage Tracking",
      transfers: "Equipment Transfer Tracking"
    };

    function generateOrderNumber() {
      const date = new Date();
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      const rand = String(Math.floor(Math.random() * 90000) + 10000);
      return `DRN-${y}${m}${d}-${rand}`;
    }

    document.getElementById("orderNumber").textContent = generateOrderNumber();

    function renderModulesAndTotals() {
      const payload = JSON.parse(localStorage.getItem("driven_checkout_payload") || "{}");
      const selections = JSON.parse(localStorage.getItem("driven_modules") || "{}");

      const rows = [];
      const selectedModules = ["equipment"];
      if (selections.pm) selectedModules.push("pm");
      if (selections.inspections) selectedModules.push("inspections");
      if (selections.workorders) selectedModules.push("workorders");
      if (selections.fuel) selectedModules.push("fuel");
      if (selections.transfers) selectedModules.push("transfers");
      if (selections.extraction) selectedModules.push("extraction");

      const bundleName = payload.bundle || selections.bundle || null;
      const bundle = bundleName ? BUNDLES[bundleName] : null;
      const bundleModules = bundle ? new Set(bundle.modules) : new Set();

      let sumUnitPrices = 0;
      let chargeTotal = 0;

      selectedModules.forEach(key => {
        const name = MODULE_MAP[key];
        const price = PRICES[key];
        sumUnitPrices += price;

        const extended = bundleModules.has(key) ? "-" : `$${price}`;
        if (!bundleModules.has(key)) chargeTotal += price;

        rows.push(`
          <div class="modules-row">
            <span class="name">${name}</span>
            <span class="price">${extended}</span>
          </div>
        `);
      });

      if (bundle) {
        chargeTotal = bundle.price;
        rows.push(`
          <div class="modules-row">
            <span class="name">${bundleName}</span>
            <span class="price">$${bundle.price}</span>
          </div>
        `);
      }

      modulesListEl.innerHTML = rows.join("");

      invoicePeriodEl.textContent =
        payload.billingPeriod === "annual"
          ? "Annual (10% off)"
          : "Monthly";

      const subtotal = Number(payload.invoiceSubtotal || 0);
      const tax = Number(payload.invoiceTax || 0);
      const total = Number(payload.invoiceTotal || 0);

      invoiceSubtotalEl.textContent = `$${subtotal.toFixed(2)}`;
      invoiceTaxEl.textContent = `$${tax.toFixed(2)}`;
      invoiceTotalEl.textContent = `$${total.toFixed(2)}`;

      let savingsNumber = 0;

      if (payload.billingPeriod === "monthly") {
        savingsNumber = sumUnitPrices - chargeTotal;
      } else {
        const annualUnitTotal = sumUnitPrices * 12;
        savingsNumber = annualUnitTotal - subtotal;
      }

      if (savingsNumber < 0) savingsNumber = 0;

      invoiceSavingsBoxEl.textContent = `$${savingsNumber.toFixed(2)}`;
    }

    renderModulesAndTotals();

    // NAV BUTTONS
    document.getElementById("btnBackCart").addEventListener("click", () => {
      window.location.href = "cart.html";
    });

    document.getElementById("btnBackModules").addEventListener("click", () => {
      window.location.href = "module-selection.html";
    });

    document.getElementById("btnPrint").addEventListener("click", () => {
      window.print();
    });

    // VALIDATION
    function validateForm() {
      let valid = true;
      statusBanner.classList.remove("error");
      statusBanner.style.display = "none";
      statusBannerText.textContent = "";

      statusSuccess.classList.remove("success");
      statusSuccess.style.display = "none";
      statusSuccessText.textContent = "";

      const requiredFields = [
        companyNameEl,
        contactNameEl,
        phoneEl,
        emailEl,
        streetEl,
        cityEl,
        stateEl,
        zipEl
      ];

      requiredFields.forEach(field => {
        field.classList.remove("error");
      });

      let firstMissing = null;

      requiredFields.forEach(field => {
        if (!field.value || field.value.trim() === "") {
          field.classList.add("error");
          valid = false;
          if (!firstMissing) firstMissing = field;
        }
      });

      if (!valid) {
        statusBannerText.textContent = "Please complete all required fields.";
        statusBanner.classList.add("error");
        statusBanner.style.display = "block";

        window.scrollTo({ top: 0, behavior: "smooth" });

        if (firstMissing) {
          firstMissing.focus();
        }
      }

      return valid;
    }

    // STRIPE ELEMENTS SETUP (skeleton)
    let stripe;
    let elements;
    let cardElement;
    let billingAddressElement;
    let clientSecret;

    async function initializeStripe() {
      stripe = Stripe("pk_test_YOUR_PUBLISHABLE_KEY_HERE"); // replace with real key

      const response = await fetch("/create-payment-intent", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          // send metadata if needed (order number, modules, etc.)
        })
      });

      const data = await response.json();
      clientSecret = data.clientSecret;

      elements = stripe.elements({ clientSecret });

      billingAddressElement = elements.create("address", {
        mode: "billing"
      });
      billingAddressElement.mount("#billing-address-element");

      cardElement = elements.create("payment");
      cardElement.mount("#card-element");
    }

    initializeStripe().catch(err => {
      console.error("Stripe initialization error:", err);
      document.getElementById("card-errors").textContent =
        "Unable to initialize payment form. Please try again later.";
    });

    // CONFIRM & PAY
    document.getElementById("btnConfirm").addEventListener("click", async () => {
      if (!validateForm()) return;

      const payload = JSON.parse(localStorage.getItem("driven_checkout_payload") || "{}");

      const orderData = {
        orderNumber: document.getElementById("orderNumber").textContent,
        companyName: companyNameEl.value.trim(),
        contactName: contactNameEl.value.trim(),
        phone: phoneEl.value.trim(),
        email: emailEl.value.trim(),
        street: streetEl.value.trim(),
        city: cityEl.value.trim(),
        state: stateEl.value.trim(),
        zip: zipEl.value.trim(),
        poNumber: poNumberEl.value.trim(),
        billingPeriod: payload.billingPeriod,
        invoiceSubtotal: Number(payload.invoiceSubtotal || 0),
        invoiceTax: Number(payload.invoiceTax || 0),
        invoiceTotal: Number(payload.invoiceTotal || 0),
        totalSavings: Number(
          invoiceSavingsBoxEl.textContent.replace(/[^\d.-]/g, "")
        ) || 0
      };

      console.log("Order data (pre-payment):", orderData);

      document.getElementById("card-errors").textContent = "";

      try {
        const { error } = await stripe.confirmPayment({
          elements,
          confirmParams: {
            // return_url can be set if you want redirect after payment
            // return_url: "https://www.driv-en.com/public/onboarding-start.html",
          }
        });

        if (error) {
          document.getElementById("card-errors").textContent =
            error.message || "Payment error.";
          return;
        }

        // Stripe webhook will handle payment_intent.succeeded / checkout.session.completed

        statusSuccessText.innerHTML =
          `Order confirmed. Thank you for choosing <img src="/logo.png" class="logo-inline">`;
        statusSuccess.classList.add("success");
        statusSuccess.style.display = "block";

        // No scroll on success
      } catch (err) {
        console.error("Payment confirmation error:", err);
        document.getElementById("card-errors").textContent =
          "An unexpected error occurred while processing your payment.";
      }
    });
  </script>
</body>
</html>
