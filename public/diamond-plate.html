<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DRIV‑EN Tread Plate Background</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #bfc2c4; /* stainless base tone */
      background-image:
        /* subtle tread pattern using repeating diamond shapes */
        repeating-linear-gradient(
          45deg,
          rgba(255,255,255,0.08) 0px,
          rgba(255,255,255,0.08) 2px,
          transparent 2px,
          transparent 8px
        ),
        repeating-linear-gradient(
          -45deg,
          rgba(0,0,0,0.08) 0px,
          rgba(0,0,0,0.08) 2px,
          transparent 2px,
          transparent 8px
        ),
        /* brushed metal texture */
        url("https://www.transparenttextures.com/patterns/brushed-aluminum.png");
      background-blend-mode: overlay;
      background-size: 20px 20px, 20px 20px, auto;
      font-family: system-ui, sans-serif;
      color: #222;
    }

    .content {
      position: relative;
      max-width: 960px;
      margin: 60px auto;
      padding: 40px;
      background: rgba(245, 245, 245, 0.9);
      border: 1px solid rgba(80, 80, 80, 0.6);
      border-radius: 6px;
      box-shadow:
        0 0 0 2px rgba(255,255,255,0.4) inset,
        0 18px 40px rgba(0,0,0,0.35);
    }

    h1 {
      margin-top: 0;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="content">
    <h1>DRIV‑EN Stainless Tread Plate</h1>
    <p>Background now looks like real treaded stainless steel — industrial, clean, and believable.</p>
  </div>
</body>
</html>
