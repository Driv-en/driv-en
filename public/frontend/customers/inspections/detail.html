<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer • Inspection Detail | Driv-en</title>

    <link rel="stylesheet" href="/frontend/css/layout.css">
    <link rel="stylesheet" href="/frontend/css/form.css">

    <style>
        .detail-section {
            background: #fff;
            border: 1px solid #ddd;
            padding: 24px;
            border-radius: 6px;
            margin-top: 24px;
        }

        .detail-row {
            margin-bottom: 16px;
        }

        .detail-label {
            font-weight: 700;
            margin-bottom: 4px;
        }

        .btn-secondary {
            padding: 10px 16px;
            background: #e0e0e0;
            color: #000;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 24px;
            display: inline-block;
        }

        .btn-secondary:hover {
            background: #d5d5d5;
        }
    </style>
</head>

<body>

    <!-- Header Include -->
    <div id="header-container"></div>
    <script>
        fetch('/frontend/includes/header.html')
            .then(r => r.text())
            .then(h => document.getElementById('header-container').innerHTML = h);
    </script>

    <div class="container">
        <h1 class="page-title">Customer • Inspection Detail</h1>

        <div id="detailContainer" class="detail-section">
            <!-- Dynamic content loads here -->
        </div>

        <a class="btn-secondary" href="/frontend/customers/inspections/index.html">Back</a>
    </div>

    <!-- Footer Include -->
    <div id="footer-container"></div>
    <script>
        fetch('/frontend/includes/footer.html')
            .then(r => r.text())
            .then(h => document.getElementById('footer-container').innerHTML = h);
    </script>

    <script>
        function getParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        async function loadInspection() {
            const id = getParam('id');
            if (!id) {
                alert('Invalid inspection ID.');
                return;
            }

            try {
                const res = await fetch(`/api/customer/inspections/${id}`);
                if (!res.ok) throw new Error('Failed to load inspection');

                const ins = await res.json();
                const container = document.getElementById('detailContainer');

                container.innerHTML = `
                    <div class="detail-row">
                        <div class="detail-label">Equipment</div>
                        <div>${ins.equipmentName || '—'}</div>
                    </div>

                    <div class="detail-row">
                        <div class="detail-label">Inspector</div>
                        <div>${ins.inspectorName || '—'}</div>
                    </div>

                    <div class="detail-row">
                        <div class="detail-label">Status</div>
                        <div>${ins.status}</div>
                    </div>

                    <div class="detail-row">
                        <div class="detail-label">Date</div>
                        <div>${ins.date || '—'}</div>
                    </div>

                    <div class="detail-row">
                        <div class="detail-label">Notes</div>
                        <div>${ins.notes || '—'}</div>
                    </div>
                `;
            } catch (err) {
                alert('Unable to load inspection.');
            }
        }

        loadInspection();
    </script>

</body>
</html>
