<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee | Driv-en</title>

    <link rel="stylesheet" href="/frontend/css/layout.css">
    <link rel="stylesheet" href="/frontend/css/form.css">
</head>

<body>

    <!-- Header Include -->
    <div id="header-container"></div>
    <script>
        fetch('/frontend/includes/header.html')
            .then(r => r.text())
            .then(h => document.getElementById('header-container').innerHTML = h);
    </script>

    <div class="container">
        <h1 class="page-title">Edit Employee</h1>

        <form id="editEmployeeForm" class="section">

            <div class="form-inline">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input id="firstName" name="firstName" type="text" required>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input id="lastName" name="lastName" type="text" required>
                </div>
            </div>

            <div class="form-group">
                <label for="role">Role</label>
                <select id="role" name="role" required></select>
            </div>

            <div class="form-group">
                <label for="division">Division</label>
                <select id="division" name="division"></select>
            </div>

            <div class="form-inline">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email">
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input id="phone" name="phone" type="text">
                </div>
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
            </div>

            <button type="submit" class="btn-primary">Save Changes</button>
        </form>

        <a class="back-link" href="/frontend/employees/index.html">Back to Employees</a>
    </div>

    <!-- Footer Include -->
    <div id="footer-container"></div>
    <script>
        fetch('/frontend/includes/footer.html')
            .then(r => r.text())
            .then(h => document.getElementById('footer-container').innerHTML = h);
    </script>

    <script>
        function getParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        async function loadSelectOptions() {
            try {
                const [roleRes, divRes] = await Promise.all([
                    fetch('/api/roles'),
                    fetch('/api/divisions')
                ]);

                const roles = await roleRes.json();
                const divisions = await divRes.json();

                const roleSelect = document.getElementById('role');
                const divisionSelect = document.getElementById('division');

                roles.forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = r.id;
                    opt.textContent = r.name;
                    roleSelect.appendChild(opt);
                });

                divisions.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.id;
                    opt.textContent = d.name;
                    divisionSelect.appendChild(opt);
                });

            } catch (err) {
                alert('Unable to load form options.');
            }
        }

        async function loadEmployee() {
            const id = getParam('id');
            if (!id) {
                alert('Invalid employee ID.');
                return;
            }

            try {
                const res = await fetch(`/api/employees/${id}`);
                if (!res.ok) throw new Error('Failed to load employee');

                const emp = await res.json();

                document.getElementById('firstName').value = emp.firstName || '';
                document.getElementById('lastName').value = emp.lastName || '';
                document.getElementById('role').value = emp.roleId || '';
                document.getElementById('division').value = emp.divisionId || '';
                document.getElementById('email').value = emp.email || '';
                document.getElementById('phone').value = emp.phone || '';
                document.getElementById('status').value = emp.status || '';

            } catch (err) {
                alert('Unable to load employee.');
            }
        }

        async function submitForm(e) {
            e.preventDefault();

            const id = getParam('id');
            const form = document.getElementById('editEmployeeForm');
            const data = Object.fromEntries(new FormData(form));

            try {
                const res = await fetch(`/api/employees/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!res.ok) throw new Error('Failed to update employee');

                window.location.href = '/frontend/employees/index.html';

            } catch (err) {
                alert('Unable to update employee.');
            }
        }

        loadSelectOptions().then(loadEmployee);
        document.getElementById('editEmployeeForm').addEventListener('submit', submitForm);
    </script>

</body>
</html>
