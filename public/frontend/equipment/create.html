<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Equipment | Driv-en</title>

    <link rel="stylesheet" href="/frontend/css/layout.css">
    <link rel="stylesheet" href="/frontend/css/form.css">
</head>

<body>

    <!-- Header Include -->
    <div id="header-container"></div>
    <script>
        fetch('/frontend/includes/header.html')
            .then(r => r.text())
            .then(h => document.getElementById('header-container').innerHTML = h);
    </script>

    <div class="container">
        <h1 class="page-title">Create Equipment</h1>

        <form id="createEquipmentForm" class="section">

            <div class="form-group">
                <label for="name">Equipment Name</label>
                <input id="name" name="name" type="text" required>
            </div>

            <div class="form-group">
                <label for="type">Equipment Type</label>
                <select id="type" name="type" required></select>
            </div>

            <div class="form-group">
                <label for="serialNumber">Serial Number</label>
                <input id="serialNumber" name="serialNumber" type="text">
            </div>

            <div class="form-group">
                <label for="division">Assigned Division</label>
                <select id="division" name="division"></select>
            </div>

            <div class="form-inline">
                <div class="form-group">
                    <label for="year">Year</label>
                    <input id="year" name="year" type="number" min="1900" max="2100">
                </div>

                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                        <option value="Maintenance">Maintenance</option>
                    </select>
                </div>
            </div>

            <div class="form-inline">
                <div class="form-group">
                    <label for="manufacturer">Manufacturer</label>
                    <input id="manufacturer" name="manufacturer" type="text">
                </div>

                <div class="form-group">
                    <label for="model">Model</label>
                    <input id="model" name="model" type="text">
                </div>
            </div>

            <button type="submit" class="btn-primary">Create Equipment</button>
        </form>

        <a class="back-link" href="/frontend/equipment/index.html">Back to Equipment</a>
    </div>

    <!-- Footer Include -->
    <div id="footer-container"></div>
    <script>
        fetch('/frontend/includes/footer.html')
            .then(r => r.text())
            .then(h => document.getElementById('footer-container').innerHTML = h);
    </script>

    <script>
        async function loadSelectOptions() {
            try {
                const [typeRes, divRes] = await Promise.all([
                    fetch('/api/equipment-types'),
                    fetch('/api/divisions')
                ]);

                const types = await typeRes.json();
                const divisions = await divRes.json();

                const typeSelect = document.getElementById('type');
                const divisionSelect = document.getElementById('division');

                types.forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t.id;
                    opt.textContent = t.name;
                    typeSelect.appendChild(opt);
                });

                divisions.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.id;
                    opt.textContent = d.name;
                    divisionSelect.appendChild(opt);
                });

            } catch (err) {
                alert('Unable to load form options.');
            }
        }

        async function submitForm(e) {
            e.preventDefault();

            const form = document.getElementById('createEquipmentForm');
            const data = Object.fromEntries(new FormData(form));

            try {
                const res = await fetch('/api/equipment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!res.ok) throw new Error('Failed to create equipment');

                window.location.href = '/frontend/equipment/index.html';

            } catch (err) {
                alert('Unable to create equipment.');
            }
        }

        loadSelectOptions();
        document.getElementById('createEquipmentForm').addEventListener('submit', submitForm);
    </script>

</body>
</html>
