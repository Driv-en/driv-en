<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driv-en | Header</title>

    <link rel="stylesheet" href="/frontend/css/layout.css">
    <link rel="stylesheet" href="/frontend/css/form.css">
    <link rel="stylesheet" href="/frontend/css/theme.css">

    <style>
        /* Embedded fallback styles — overridden by layout.css */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .header {
            width: 100%;
            background: #1a1a1a;
            color: #fff;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 999;
            border-bottom: 3px solid #00c853;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-logo {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
        }

        .header-logo span.driv {
            color: silver;
            font-weight: 900;
        }

        .header-logo span.en {
            color: #ff1744;
            font-weight: 900;
        }

        .header-logo span.hyphen {
            color: #00c853;
            margin: 0 4px;
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-nav a {
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            padding: 6px 10px;
            border-radius: 4px;
            transition: background 0.2s ease;
        }

        .header-nav a:hover {
            background: #333;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-display {
            font-size: 15px;
            font-weight: 500;
            color: #e0e0e0;
        }

        .logout-btn {
            background: #ff1744;
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.2s ease;
        }

        .logout-btn:hover {
            background: #d50000;
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="header-left">
            <div class="header-logo">
                <span class="driv">DRIV</span>
                <span class="hyphen">—</span>
                <span class="en">EN</span>
            </div>

            <nav class="header-nav">
                <a href="/frontend/dashboard.html">Dashboard</a>
                <a href="/frontend/equipment/index.html">Equipment</a>
                <a href="/frontend/pm/index.html">PMs</a>
                <a href="/frontend/inspections/index.html">Inspections</a>
                <a href="/frontend/work-orders/index.html">Work Orders</a>
                <a href="/frontend/projects/index.html">Projects</a>
                <a href="/frontend/employees/index.html">Employees</a>
            </nav>
        </div>

        <div class="header-right">
            <div class="user-display" id="userDisplay">Loading...</div>
            <a class="logout-btn" href="/frontend/login.html">Logout</a>
        </div>
    </header>

    <script>
        // Session display logic — production ready
        async function loadUser() {
            try {
                const res = await fetch('/api/session');
                if (!res.ok) throw new Error('Session fetch failed');

                const data = await res.json();
                document.getElementById('userDisplay').textContent = data.displayName || 'User';
            } catch (err) {
                document.getElementById('userDisplay').textContent = 'Unknown User';
            }
        }

        loadUser();
    </script>

</body>
</html>
