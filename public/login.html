<style>
    /* ===== PAGE-SPECIFIC STYLES (add per page) ===== */

    .login-section {
        max-width: 360px;
        margin: 40px auto 80px auto;
        padding: 10px 24px;
    }

    .login-icon-wrap {
        text-align: center;
        margin-bottom: 16px;
    }

    .login-section h2 {
        text-align: center;
        margin-bottom: 24px;
        font-size: 26px;
        font-weight: 700;
    }

    label {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 6px;
        display: block;
    }

    .required-star {
        color: #cc0000;
        margin-left: 3px;
    }

    input[type="email"],
    input[type="password"] {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        margin-bottom: 16px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
    }

    input.error {
        border-color: #cc0000;
    }

    /* TRUE 3-COLUMN ACTION ROW */
    .action-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: -6px;
        margin-bottom: 20px;
        width: 100%;
    }

    .action-col-1 {
        flex: 0 0 auto; /* checkbox column */
        display: flex;
        align-items: center;
        margin-right: 6px;
    }

    .action-col-2 {
        flex: 1; /* Remember me column */
        display: flex;
        align-items: center;
        white-space: nowrap;
        font-weight: bold;
        font-size: 14px;
    }

    .action-col-3 {
        flex: 1; /* Forgot Password column */
        text-align: right;
        white-space: nowrap;
    }

    .action-col-3 a {
        color: #111;
        font-size: 14px;
        text-decoration: underline;
        cursor: pointer;
    }

    .login-button {
        width: 100%;
        background: #ffcc00;
        color: #111;
        border: none;
        padding: 12px;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }

    .error-banner {
        background: #ffdddd;
        color: #cc0000;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 16px;
        text-align: center;
        font-size: 14px;
        display: none;
    }

    /* No Account Section */
    .no-account {
        text-align: center;
        margin-top: 24px;
        font-size: 14px;
    }

    .no-account-line {
        font-weight: 600;
        margin-bottom: 6px;
    }

    .no-account-line-2 {
        font-size: 14px;
    }

    /* ===== SHARED STYLES (do not remove) ===== */

    /* Inline logo for headings and buttons */
    .inline-logo {
        height: 3.75em;
        vertical-align: middle;
        display: inline-block;
    }

    /* DRIV-EN colored text for paragraphs */
    .brand-driv {
        color: #8c8c8c;
        font-weight: bold;
        font-style: italic;
        letter-spacing: -1px;
    }
    .brand-dash {
        color: #2da94f;
        font-weight: bold;
        font-style: italic;
        letter-spacing: -1px;
    }
    .brand-en {
        color: #dc2626;
        font-weight: bold;
        font-style: italic;
        letter-spacing: -1px;
    }

    /* Login icon (used on pages that display it) */
    .login-icon-mask {
        display: inline-block;
        width: 64px;
        height: 64px;
        background-color: #fff;
        -webkit-mask-image: url('/icons/driven-login-icon.png');
        -webkit-mask-repeat: no-repeat;
        -webkit-mask-position: center;
        -webkit-mask-size: contain;
        mask-image: url('/icons/driven-login-icon.png');
        mask-repeat: no-repeat;
        mask-position: center;
        mask-size: contain;
        vertical-align: middle;
    }

    .login-icon-fallback {
        width: 64px;
        height: auto;
        filter: invert(1) brightness(200%);
        -webkit-filter: invert(1) brightness(200%);
        vertical-align: middle;
        display: none;
    }

    @supports not (mask-image: url('')) {
        .login-icon-mask { display: none; }
        .login-icon-fallback { display: inline-block; }
    }
</style>

<body>

<!-- Header (auto-loaded) -->
<div id="header"></div>

<!-- ===== PAGE CONTENT ===== -->
<div class="login-section">
    <div class="login-icon-wrap">
        <span class="login-icon-mask"></span>
        <img src="/icons/driven-login-icon.png" class="login-icon-fallback" alt="DRIV‑EN login icon">
    </div>
    <h2>Login to <span class="brand-driv">DRIV</span><span class="brand-dash">‑</span><span class="brand-en">EN</span></h2>

    <div id="error-banner" class="error-banner">
        Invalid credentials.
    </div>

    <form id="login-form">
        <label>Email Address<span class="required-star">*</span></label>
        <input type="email" id="email" required />

        <label>Password<span class="required-star">*</span></label>
        <input type="password" id="password" required />

        <!-- FIXED 3-COLUMN ACTION ROW -->
        <div class="action-row">
            <div class="action-col-1">
                <input type="checkbox" id="remember" />
            </div>

            <div class="action-col-2">
                Remember me
            </div>

            <div class="action-col-3">
                <a id="forgot-link">Forgot Password?</a>
            </div>
        </div>

        <button type="submit" class="login-button">Login</button>
    </form>

    <div class="no-account">
        <div class="no-account-line">Don't have an account?</div>
        <div class="no-account-line-2">Contact your Human Resources Department.</div>
    </div>
</div>
<!-- ===== END PAGE CONTENT ===== -->

<!-- Footer (auto-loaded) -->
<div id="footer"></div>

<!-- ===== SHARED SCRIPT (do not remove) ===== -->
<script>
async function loadComponent(id, file) {
    try {
        const el = document.getElementById(id);
        const html = await fetch(file).then(r => r.text());
        el.innerHTML = html;
    } catch (e) {
        console.error("Component failed:", id, file, e);
    }
}

document.addEventListener("DOMContentLoaded", async () => {
    await loadComponent("header", "/components/header.html");
    await loadComponent("footer", "/components/footer.html");

    const yearEl = document.getElementById('footer-year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();
});
</script>
<script src="/components/nav.js?v=2"></script>

<!-- ===== LOGIN SCRIPT ===== -->
<script>
    // Forgot Password — uses the real /auth/forgot-password flow
    document.getElementById("forgot-link").addEventListener("click", async () => {
        const email = document.getElementById("email").value.trim();
        if (!email) {
            alert("Please enter your email address first, then click Forgot Password.");
            return;
        }
        try {
            const resp = await fetch("/auth/forgot-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email })
            });
            const data = await resp.json();
            if (data.success) {
                alert("If an account exists for " + email + ", a password reset link has been sent to that email.");
            } else {
                alert("Could not process request: " + (data.error || "Unknown error"));
            }
        } catch (e) {
            alert("Could not process request. Please try again.");
        }
    });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const remember = document.getElementById("remember");
        const errorBanner = document.getElementById("error-banner");

        email.classList.remove("error");
        password.classList.remove("error");
        errorBanner.style.display = "none";

        const response = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                email: email.value.trim(),
                password: password.value.trim(),
                remember: remember.checked
            })
        });

        const result = await response.json();

        if (!result.success) {
            // If 2FA is required, skip it for now and just show a message
            // (2FA is disabled during development — will re-enable later)
            if (result.requires2FA) {
                // Temporarily bypass 2FA — just show message that 2FA is not required
                errorBanner.textContent = "2FA is enabled on this account. 2FA is temporarily disabled during setup. Please contact your administrator.";
                errorBanner.style.display = "block";
                return;
            }
            errorBanner.textContent = result.error || "Invalid credentials.";
            errorBanner.style.display = "block";
            email.classList.add("error");
            password.classList.add("error");
            return;
        }

        // Force password change on first login
        if (result.must_change_password) {
            window.location.href = "/change-password";
            return;
        }

        // Redirect to role-based dashboard
        const dashboards = {
            "Admin": "/dashboard/admin",
            "Project Manager": "/dashboard/project",
            "Equipment Manager": "/dashboard/equipment",
            "Mechanic": "/dashboard/mechanic",
            "Employee": "/dashboard/employee"
        };

        window.location.href = dashboards[result.role] || "/dashboard";
    });
</script>

</body>
