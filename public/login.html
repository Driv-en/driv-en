    /* ===== PAGE-SPECIFIC STYLES (add per page) ===== */

    .login-section {
        max-width: 360px;
        margin: 40px auto 80px auto;
        padding: 10px 24px;

    .login-icon-wrap {
        text-align: center;

    }

    label {

    }

    .required-star {
        color: #cc0000;
        margin-left: 3px;
    }

    input[type="email"],

    input[type="text"] {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        margin-bottom: 16px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
    }

    /* Hide native browser password reveal eyeball icon (Edge/Chrome) */
    input[type="password"]::-ms-reveal,
    input[type="password"]::-webkit-reveal {
        display: none;
    }

    /* Password field with show/hide toggle */
    .password-wrapper {
        position: relative;
        margin-bottom: 16px;
    }
    .password-wrapper input {
        margin-bottom: 0;
        padding-right: 40px;
    }
    .password-toggle-btn {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        color: #2563eb;
        padding: 4px;
        line-height: 1;
    }
    .password-toggle-btn:hover { color: #1d4ed8; }

    input.error {
        border-color: #cc0000;
    }

    /* TRUE 3-COLUMN ACTION ROW */
    .action-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: -6px;
        margin-bottom: 20px;
        width: 100%;
    }

    .action-col-1 {
        flex: 0 0 auto; /* checkbox column */
        display: flex;
        align-items: center;
        margin-right: 6px;
    }

    .action-col-2 {
        flex: 1; /* Remember me column */
        display: flex;
        align-items: center;
        white-space: nowrap;
        font-weight: bold;
        font-size: 14px;
    }

    .action-col-3 {
        flex: 1; /* Forgot Password column */
        text-align: right;
        white-space: nowrap;
    }

    .action-col-3 a {
        color: #111;
        font-size: 14px;
        text-decoration: underline;
        cursor: pointer;
    }

    .login-button {
        width: 100%;
        background: #ffcc00;
        color: #111;
        border: none;
        padding: 12px;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }

    .error-banner {
        background: #ffdddd;
        color: #cc0000;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 16px;
        text-align: center;
        font-size: 14px;
        display: none;
    }

    /* No Account Section */
    .no-account {
        text-align: center;
        margin-top: 24px;
        font-size: 14px;
    }

    .no-account-line {
        font-weight: 600;
        margin-bottom: 6px;
    }

    .no-account-line-2 {
        font-size: 14px;
    }

    /* Layer 1: Referral Partner login link */
    .referrer-link-section {
        text-align: center;
        margin-top: 20px;
        padding-bottom: 10px;
    }
    .referrer-divider {

        margin: 0 20px 16px 20px;

        font-size: 13px;

<script>
async function loadComponent(id, file) {
    try {
        const el = document.getElementById(id);
        const html = await fetch(file).then(r => r.text());
        el.innerHTML = html;
    } catch (e) {
        console.error("Component failed:", id, file, e);
    }
}

document.addEventListener("DOMContentLoaded", async () => {
    await loadComponent("header", "/components/header.html");
    await loadComponent("footer", "/components/footer.html");

    const yearEl = document.getElementById('footer-year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();
});
</script>
<script src="/components/nav.js?v=2"></script>

<!-- ===== LOGIN SCRIPT ===== -->
<script>
    // Show/Hide password toggle
    function togglePasswordVisibility() {
        var passwordInput = document.getElementById("password");
        var toggleLabel = document.getElementById("password-toggle-icon");
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleLabel.textContent = "HIDE";
        } else {
            passwordInput.type = "password";
            toggleLabel.textContent = "SHOW";
        }
    }

    // Forgot Password — uses the real /auth/forgot-password flow
    document.getElementById("forgot-link").addEventListener("click", async () => {
        const email = document.getElementById("email").value.trim();
        if (!email) {
            alert("Please enter your email address first, then click Forgot Password.");
            return;
        }
        try {
            const resp = await fetch("/auth/forgot-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email })
            });
            const data = await resp.json();
            if (data.success) {
                alert("If an account exists for " + email + ", a password reset link has been sent to that email.");
            } else {
                alert("Could not process request: " + (data.error || "Unknown error"));
            }
        } catch (e) {
            alert("Could not process request. Please try again.");
        }
    });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const remember = document.getElementById("remember");
        const errorBanner = document.getElementById("error-banner");

        email.classList.remove("error");
        password.classList.remove("error");
        errorBanner.style.display = "none";

        const response = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                email: email.value.trim(),
                password: password.value.trim(),
                remember: remember.checked
            })
        });

        const result = await response.json();

        if (!result.success) {
            // Layer 3: If server detects this is a referrer account, show redirect banner
            if (result.error === "referrer_account") {
                errorBanner.style.display = "none";
                document.getElementById("referrer-redirect-banner").style.display = "block";
                email.classList.add("error");
                return;
            }
            errorBanner.textContent = result.error || "Invalid credentials.";
            errorBanner.style.display = "block";
            email.classList.add("error");
            password.classList.add("error");
            return;
        }

        // Force password change on first login
        if (result.must_change_password) {
            window.location.href = "/change-password";
            return;
        }

        // Redirect based on role
        // DRIV-EN Founder → Owner Dashboard (platform-wide view)
        // Admin → Admin Dashboard (single customer org view)
        // All other roles → Onboarding Dashboard
        if (result.role === "DRIV-EN Founder") {
            window.location.href = "/app/dashboard/owner-dashboard.html";
        } else if (result.role === "Admin") {
            window.location.href = "/app/dashboard/admin.html";
        } else {
            // Non-admin users go to the Onboarding Dashboard
            window.location.href = "/app/dashboard/onboarding-dashboard.html";
        }
    });
</script>
