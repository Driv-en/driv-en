    /* FORGOT PASSWORD MODAL */

    }

    .modal-box p {

        color: #555;
        margin: 0 0 16px 0;

    }

    .modal-box input[type="email"] {

        padding: 10px;
        box-sizing: border-box;

    .modal-buttons {

    .modal-buttons button {

    /* ===== SHARED STYLES (do not remove) ===== */

<script>
async function loadComponent(id, file) {
    try {
        const el = document.getElementById(id);
        const html = await fetch(file).then(r => r.text());
        el.innerHTML = html;
    } catch (e) {
        console.error("Component failed:", id, file, e);
    }
}

document.addEventListener("DOMContentLoaded", async () => {
    await loadComponent("header", "/components/header.html");
    await loadComponent("footer", "/components/footer.html");

    const yearEl = document.getElementById('footer-year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();
});
</script>

<!-- ===== LOGIN SCRIPT ===== -->
<script>
    // Password visibility toggle (Show/Hide text)
    document.getElementById("passwordToggle").addEventListener("click", function() {
        var input = document.getElementById("password");
        var toggle = this;
        if (input.type === "password") {
            input.type = "text";
            toggle.textContent = "Hide";
            toggle.title = "Hide password";
        } else {
            input.type = "password";
            toggle.textContent = "Show";
            toggle.title = "Show password";
        }
    });

    // FORGOT PASSWORD MODAL
    const forgotModal = document.getElementById("forgotModal");
    const forgotLink = document.getElementById("forgot-link");
    const forgotCancel = document.getElementById("forgotCancel");
    const forgotSubmit = document.getElementById("forgotSubmit");
    const forgotEmail = document.getElementById("forgotEmail");
    const forgotMessage = document.getElementById("forgotMessage");

    forgotLink.addEventListener("click", () => {
        forgotModal.classList.add("active");
        forgotMessage.className = "modal-message";
        forgotMessage.textContent = "";
        forgotEmail.value = document.getElementById("email").value || "";
        forgotEmail.focus();
    });

    forgotCancel.addEventListener("click", () => {
        forgotModal.classList.remove("active");
    });

    forgotModal.addEventListener("click", (e) => {
        if (e.target === forgotModal) forgotModal.classList.remove("active");
    });

    forgotSubmit.addEventListener("click", async () => {
        const email = forgotEmail.value.trim();
        if (!email) {
            forgotMessage.className = "modal-message error";
            forgotMessage.textContent = "Please enter your email address.";
            return;
        }

        forgotSubmit.disabled = true;
        forgotSubmit.textContent = "Sending\u2026";
        forgotMessage.className = "modal-message";
        forgotMessage.textContent = "";

        try {
            const response = await fetch("/auth/forgot-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email })
            });

            const result = await response.json();

            forgotMessage.className = "modal-message success";
            forgotMessage.textContent = result.message || "If an account exists for that email, a reset link has been sent.";
            forgotEmail.value = "";
        } catch (e) {
            forgotMessage.className = "modal-message error";
            forgotMessage.textContent = "An error occurred. Please try again.";
        }

        forgotSubmit.disabled = false;
        forgotSubmit.textContent = "Send Reset Link";
    });

    // LOGIN FORM SUBMIT
    document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const remember = document.getElementById("remember");
        const errorBanner = document.getElementById("error-banner");

        email.classList.remove("error");
        password.classList.remove("error");
        errorBanner.style.display = "none";

        const response = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                email: email.value.trim(),
                password: password.value.trim(),
                remember: remember.checked
            })
        });

        const result = await response.json();

        if (!result.success) {
            if (result.requires2FA) {
                sessionStorage.setItem("driven_2fa_email", email.value.trim());
                window.location.href = "/public/2fa-verify.html?email=" + encodeURIComponent(email.value.trim());
                return;
            }
            errorBanner.textContent = result.error || "Invalid credentials.";
            errorBanner.style.display = "block";
            email.classList.add("error");
            password.classList.add("error");
            return;
        }

        // Force password change on first login
        if (result.must_change_password) {
            window.location.href = "/public/change-password.html";
            return;
        }

        // Prompt to set up 2FA if not enabled
        if (!result.twofa_enabled) {
            var setup2FA = confirm("Would you like to enable Two-Factor Authentication (2FA) for added security?\n\nYou can use Google Authenticator, Microsoft Authenticator, or Authy.");
            if (setup2FA) {
                window.location.href = "/public/2fa-setup.html";
                return;
            }
        }

        // Redirect to role-based dashboard
        const dashboards = {
            "Admin": "/public/dashboard/admin.html",
            "Equipment Admin": "/public/dashboard/equipment-admin.html",
            "Safety Admin": "/public/dashboard/safety-admin.html",
            "Plant Admin": "/public/dashboard/plant-admin.html",
            "Manager": "/public/dashboard/manager.html",
            "Superintendent": "/public/dashboard/superintendent.html",
            "Foreman": "/public/dashboard/foreman.html",
            "Crew Leader": "/public/dashboard/crew-leader.html",
            "Technician": "/public/dashboard/technician.html",
            "Operator": "/public/dashboard/operator.html",
            "Safety Manager": "/public/dashboard/safety-manager.html",
            "Safety Representative": "/public/dashboard/safety-rep.html",
            "Equipment Manager": "/public/dashboard/equipment-manager.html",
            "Equipment Manager Assistant": "/public/dashboard/equipment-mgr-asst.html",
            "Shop Foreman": "/public/dashboard/shop-foreman.html",
            "QC / Inspector": "/public/dashboard/qc-inspector.html",
            "Read-Only Internal": "/public/dashboard/read-only.html",
            "Field Personnel / Craftsman": "/public/dashboard/field-personnel.html",
            "President / CEO": "/public/dashboard/ceo.html",
            "Project Coordinator": "/public/dashboard/project-coordinator.html",
            "Dispatcher": "/public/dashboard/dispatcher.html",
            "Scheduler": "/public/dashboard/scheduler.html",
            "Sales / Business Development": "/public/dashboard/sales.html",
            "Estimator": "/public/dashboard/estimator.html",
            "Human Resources": "/public/dashboard/hr.html",
            "Accounting / Finance": "/public/dashboard/accounting.html",
            "Payroll": "/public/dashboard/payroll.html",
            "Logistics Coordinator": "/public/dashboard/logistics.html",
            "Warehouse / Inventory Clerk": "/public/dashboard/warehouse.html",
            "Plant Manager": "/public/dashboard/plant-manager.html"
        };

        window.location.href = dashboards[result.role] || "/dashboard";
    });
</script>
