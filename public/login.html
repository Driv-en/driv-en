<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Driv-en | Login</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f7f7f7;
            color: #222;
        }

        /* Logo */
        .logo-container {
            padding: 15px 24px 15px 24px; /* 15px above and below */
            text-align: center;
            position: sticky;
            top: 0;
            background: #f7f7f7;
            z-index: 999;
        }

        .logo-container img {
            width: 200px; /* original size */
            height: auto;
        }

        /* Login Section */
        .login-section {
            max-width: 360px;
            margin: 20px auto;
            padding: 10px 24px;
        }

        .login-section h2 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 26px;
            font-weight: 700;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            display: block;
        }

        .required-star {
            color: #cc0000;
            margin-left: 3px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        input.error {
            border-color: #cc0000;
        }

        .remember-row {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .remember-row input {
            width: auto;
            margin-right: 8px;
        }

        .forgot-password {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: #111;
            font-size: 14px;
            text-decoration: underline;
            cursor: pointer;
        }

        .login-button {
            width: 100%;
            background: #ffcc00;
            color: #111;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .error-banner {
            background: #ffdddd;
            color: #cc0000;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        /* No Account Section */
        .no-account {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
        }

        .no-account-line {
            font-weight: 600;
            margin-bottom: 6px;
        }

        .no-account-line-2 {
            font-size: 14px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px;
            background: #222;
            color: white;
            margin-top: 40px;
            font-size: 15px;
            position: sticky;
            bottom: 0;
            z-index: 999;
        }

        footer a {
            color: #00aa00;
            text-decoration: none;
            font-weight: 600;
        }

        footer a:hover {
            text-decoration: underline;
        }

        .footer-line {
            font-size: 13px;
        }

        .footer-company,
        .footer-platform {
            font-size: 15px;
        }

        @media (max-width: 600px) {
            footer {
                padding: 20px;
                font-size: 14px;
            }

            .footer-company,
            .footer-platform,
            .footer-line {
                display: block;
                margin-top: 8px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- Logo -->
    <div class="logo-container">
        <a href="/index.html">
            <img src="/logo.png" alt="Driv-en Logo" />
        </a>
    </div>

    <!-- Login Section -->
    <div class="login-section">
        <h2>Login</h2>

        <div id="error-banner" class="error-banner">
            Invalid credentials.
        </div>

        <form id="login-form">
            <label>Email Address<span class="required-star">*</span></label>
            <input type="email" id="email" required />

            <label>Password<span class="required-star">*</span></label>
            <input type="password" id="password" required />

            <div class="remember-row">
                <input type="checkbox" id="remember" />
                <label for="remember">Remember me</label>
            </div>

            <div class="forgot-password">
                <a id="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" class="login-button">Login</button>
        </form>

        <div class="no-account">
            <div class="no-account-line">Don’t have an account?</div>
            <div class="no-account-line-2">Contact your Human Resources Department.</div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
      <span class="footer-company">© Digital Safety Inspection LLC</span>
      <span class="footer-platform">DRIV‑EN Platform</span><br>

      <span class="footer-line">
        <a href="/public/legal/terms.html">Terms of Service</a> |
        <a href="/public/legal/privacy.html">Privacy Policy</a> |
      </span>

      <span class="footer-line">
        <a href="/public/legal/refund.html">Refund Policy</a> |
        <a href="mailto:support@driv-en.com">Contact</a>
      </span>
    </footer>

    <script>
        document.getElementById("forgot-link").addEventListener("click", () => {
            alert("Please contact your Human Resources Department to reset your password.");
        });

        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email");
            const password = document.getElementById("password");
            const remember = document.getElementById("remember");
            const errorBanner = document.getElementById("error-banner");

            email.classList.remove("error");
            password.classList.remove("error");
            errorBanner.style.display = "none";

            const response = await fetch("/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    email: email.value.trim(),
                    password: password.value.trim(),
                    remember: remember.checked
                })
            });

            const result = await response.json();

            if (!result.success) {
                errorBanner.style.display = "block";
                email.classList.add("error");
                password.classList.add("error");
                return;
            }

            switch (result.role) {
                case "Technician": window.location.href = "/dashboard/tech"; break;
                case "Operator": window.location.href = "/dashboard/operator"; break;
                case "Foreman": window.location.href = "/dashboard/foreman"; break;
                case "Manager": window.location.href = "/dashboard/manager"; break;
                case "Admin": window.location.href = "/dashboard/admin"; break;
                default: window.location.href = "/login";
            }
        });
    </script>

</body>
</html>
