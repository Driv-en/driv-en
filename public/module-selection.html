<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DRIV‑EN – Module Selection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.png" />

  <style>
    html, body {
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ⭐ Sticky Header */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 16px 24px;
      border-bottom: 4px solid #2ecc71;
      background: #020617;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header img.logo {
      height: 88px;
    }

    header .title-block h1 {
      font-size: 18px;
      margin: 0;
    }

    header .title-block span {
      font-size: 12px;
      color: #9ca3af;
    }

    main {
      flex: 1;
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 16px;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    p {
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 16px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    .card {
      border: 1px solid #1f2937;
      background: #020617;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .module-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
    }

    .module-item {
      padding: 12px;
      border: 1px solid #1f2937;
      border-radius: 6px;
      background: #0f172a;
    }

    .module-item label {
      font-size: 15px;
      font-weight: 600;
      color: #e5e7eb;
      display: block;
      margin-bottom: 6px;
    }

    .module-desc {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 10px;
      line-height: 1.45;
    }

    .module-price {
      font-size: 13px;
      color: #e5e7eb;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .module-item input {
      transform: scale(1.2);
      cursor: pointer;
    }

    .notify-box {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #9ca3af;
    }

    .footer-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    button {
      font-size: 13px;
      border-radius: 6px;
      padding: 8px 14px;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .btn-secondary {
      background: #020617;
      border-color: #374151;
      color: #e5e7eb;
    }

    .btn-primary {
      background: #22c55e;
      border-color: #16a34a;
      color: #022c22;
      font-weight: 600;
    }

    .status-bar {
      margin-top: 12px;
      font-size: 12px;
      color: #9ca3af;
      min-height: 18px;
    }

    .coming-soon {
      padding: 20px;
      border: 1px solid #1f2937;
      background: #020617;
      border-radius: 8px;
    }

    .coming-item {
      margin-top: 12px;
      padding: 12px;
      background: #0f172a;
      border-radius: 6px;
      border: 1px solid #1f2937;
    }

    .coming-item-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .coming-item-desc {
      font-size: 13px;
      color: #9ca3af;
      line-height: 1.45;
    }

    .plan-banner {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #22c55e;
      background: #022c22;
      font-size: 13px;
      color: #bbf7d0;
    }

    .pricing-note {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 6px;
    }

    .bundle-note {
      font-size: 12px;
      color: #e5e7eb;
      margin-top: 12px;
      line-height: 1.6;
    }

    .bundle-title {
      font-size: 14px;
      font-weight: 600;
      color: #e5e7eb;
    }

    .bundle-item {
      margin-left: 12px;
      margin-top: 6px;
    }

    .bundle-item span {
      color: #9ca3af;
      font-size: 12px;
    }

    footer {
      background-color: #111;
      color: #eee;
      text-align: center;
      padding: 24px;
      margin-top: 48px;
      border-top: 4px solid #2ecc71;
      font-size: 0.9rem;
      width: 100%;
    }

    footer a {
      color: #2ecc71;
      text-decoration: none;
      margin: 0 8px;
    }
  </style>
</head>

<body>

  <!-- ⭐ NOTHING ABOVE THIS HEADER -->
  <header>
    <div class="title-block">
      <h1>DRIV‑EN – Module Selection</h1>
      <span>Step 1 · Choose your modules</span>
    </div>
    <img src="/logo.png" alt="DRIV‑EN Logo" class="logo" />
  </header>

  <main>
    <!-- your full module-selection content remains unchanged -->
  </main>

  </footer>

</body>
</html>
