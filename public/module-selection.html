<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Driv-en Module Selection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/main.css">
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }
        .page-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .header {
            margin-bottom: 24px;
        }
        .header h1 {
            margin: 0 0 8px 0;
        }
        .header p {
            margin: 0;
            color: #555;
        }
        .customer-banner {
            background: #fff;
            border: 1px solid #ddd;
            padding: 12px 16px;
            margin-bottom: 24px;
            border-radius: 4px;
        }
        .customer-banner strong {
            display: block;
            margin-bottom: 4px;
        }
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .module-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .module-header {
            margin-bottom: 8px;
        }
        .module-name {
            font-weight: 600;
            margin: 0 0 4px 0;
        }
        .module-status {
            font-size: 0.9rem;
            color: #007b5e;
        }
        .module-description {
            font-size: 0.9rem;
            color: #555;
            margin: 8px 0 12px 0;
        }
        .module-pricing {
            font-size: 0.95rem;
            margin-bottom: 12px;
        }
        .module-pricing span {
            display: block;
        }
        .module-actions {
            margin-top: auto;
        }
        .module-actions button {
            padding: 8px 12px;
            font-size: 0.9rem;
            border-radius: 4px;
            border: 1px solid #007bff;
            background: #007bff;
            color: #fff;
            cursor: pointer;
        }
        .module-actions button.secondary {
            border-color: #666;
            background: #fff;
            color: #333;
            margin-left: 8px;
        }
        .summary-panel {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 16px;
        }
        .summary-panel h2 {
            margin: 0 0 8px 0;
        }
        .summary-line {
            font-size: 0.95rem;
            margin: 4px 0;
        }
        .summary-line strong {
            margin-right: 4px;
        }
        .summary-modules {
            margin: 8px 0 12px 0;
            font-size: 0.9rem;
        }
        .summary-modules ul {
            margin: 4px 0 0 18px;
            padding: 0;
        }
        .summary-modules li {
            margin: 2px 0;
        }
        .summary-actions {
            margin-top: 12px;
        }
        .summary-actions button {
            padding: 10px 16px;
            font-size: 0.95rem;
            border-radius: 4px;
            border: 1px solid #28a745;
            background: #28a745;
            color: #fff;
            cursor: pointer;
        }
        .summary-actions button.disabled {
            background: #ccc;
            border-color: #aaa;
            cursor: not-allowed;
        }
        .message {
            margin-top: 8px;
            font-size: 0.9rem;
        }
        .message.error {
            color: #b00020;
        }
        .message.success {
            color: #007b5e;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="header">
            <h1>Choose Your Driv-en Modules</h1>
            <p>Select additional modules to add to your base plan. Grandfathered customers see their free modules below.</p>
        </div>

        <div id="customerBanner" class="customer-banner" style="display:none;">
            <strong id="customerPlanTitle"></strong>
            <span id="customerPlanDetails"></span>
        </div>

        <div class="modules-grid" id="modulesGrid">
            <!-- Module cards rendered by JS -->
        </div>

        <div class="summary-panel">
            <h2>Summary</h2>
            <div class="summary-line">
                <strong>Base Plan:</strong>
                <span id="basePlanSummary">Loading...</span>
            </div>
            <div class="summary-line">
                <strong>Additional Modules:</strong>
                <span id="additionalModulesSummary">None selected</span>
            </div>
            <div class="summary-line">
                <strong>Estimated Monthly Total:</strong>
                <span id="monthlyTotal">$0</span>
            </div>
            <div class="summary-line">
                <strong>Estimated Annual Total (10% off):</strong>
                <span id="annualTotal">$0</span>
            </div>

            <div class="summary-modules">
                <strong>Selected Modules:</strong>
                <ul id="selectedModulesList">
                    <!-- Populated by JS -->
                </ul>
            </div>

            <div class="summary-actions">
                <button id="checkoutBtn">Proceed to Checkout</button>
                <div id="summaryMessage" class="message"></div>
            </div>
        </div>
    </div>

    <script>
        // Static pricing map for v1.0
        const MODULE_PRICING = {
            "Equipment Management": 149,
            "Preventative Maintenance": 299,
            "Equipment Inspections": 199,
            "Extraction Engine": 49,
            "Work Orders": 149,
            "Fuel Usage Tracking": 99,
            "Equipment Transfer Tracking": 79
        };

        // State
        let customerState = {
            isGrandfathered: false,
            freeUntil: null,
            baseModules: [],
            selectedPaidModules: []
        };

        // Fetch customer + module info from backend
        async function loadCustomerModules() {
            try {
                const response = await fetch("/api/customer/modules", {
                    method: "GET",
                    headers: { "Content-Type": "application/json" }
                });

                if (!response.ok) {
                    throw new Error("Failed to load customer modules.");
                }

                const data = await response.json();

                // Expected backend response shape:
                // {
                //   isGrandfathered: true/false,
                //   freeUntil: "2026-12-31",
                //   baseModules: ["Equipment Management", "Equipment Inspections"],
                //   activeModules: [...],
                //   availableModules: [...]
                // }

                customerState.isGrandfathered = !!data.isGrandfathered;
                customerState.freeUntil = data.freeUntil || null;
                customerState.baseModules = data.baseModules || [];

                renderCustomerBanner();
                renderModuleCards(data);
                updateSummary();
            } catch (err) {
                const banner = document.getElementById("customerBanner");
                banner.style.display = "block";
                document.getElementById("customerPlanTitle").textContent = "Error loading modules";
                document.getElementById("customerPlanDetails").textContent = err.message;
            }
        }

        function renderCustomerBanner() {
            const banner = document.getElementById("customerBanner");
            const titleEl = document.getElementById("customerPlanTitle");
            const detailsEl = document.getElementById("customerPlanDetails");

            if (customerState.isGrandfathered) {
                banner.style.display = "block";
                titleEl.textContent = "Grandfathered 2026 Base Plan";
                detailsEl.textContent = "Your base plan (Equipment Management + Inspections without extraction engine) is free until " +
                    (customerState.freeUntil || "12/31/2026") + ". You can still purchase additional modules below.";
            } else {
                banner.style.display = "block";
                titleEl.textContent = "Standard Plan";
                detailsEl.textContent = "Select the modules you want to include in your subscription.";
            }
        }

        function renderModuleCards(data) {
            const grid = document.getElementById("modulesGrid");
            grid.innerHTML = "";

            const allModules = [
                "Equipment Management",
                "Preventative Maintenance",
                "Equipment Inspections",
                "Extraction Engine",
                "Work Orders",
                "Fuel Usage Tracking",
                "Equipment Transfer Tracking"
            ];

            allModules.forEach(moduleName => {
                const card = document.createElement("div");
                card.className = "module-card";

                const header = document.createElement("div");
                header.className = "module-header";

                const nameEl = document.createElement("h2");
                nameEl.className = "module-name";
                nameEl.textContent = moduleName;

                const statusEl = document.createElement("div");
                statusEl.className = "module-status";

                const descriptionEl = document.createElement("div");
                descriptionEl.className = "module-description";

                const pricingEl = document.createElement("div");
                pricingEl.className = "module-pricing";

                const actionsEl = document.createElement("div");
                actionsEl.className = "module-actions";

                // Description per module (customer-facing)
                if (moduleName === "Equipment Management") {
                    descriptionEl.textContent = "Basic fleet tracking: unit #, year/make/model, project, meter, status.";
                } else if (moduleName === "Preventative Maintenance") {
                    descriptionEl.textContent = "Autogenerate PM templates and schedules; technicians complete PMs with checklists, photos, meters, safety reporting.";
                } else if (moduleName === "Equipment Inspections") {
                    descriptionEl.textContent = "Templates tailored to equipment type and configuration. Without PM, uses default/config-based templates.";
                } else if (moduleName === "Extraction Engine") {
                    descriptionEl.textContent = "Analyzes manuals and manufacturer documentation to generate PM and inspection templates.";
                } else if (moduleName === "Work Orders") {
                    descriptionEl.textContent = "Repairs, diagnostics, safety fixes, and non-PM maintenance with full documentation.";
                } else if (moduleName === "Fuel Usage Tracking") {
                    descriptionEl.textContent = "Tracks fuel usage, cost, and efficiency; updates meters and supports PM scheduling.";
                } else if (moduleName === "Equipment Transfer Tracking") {
                    descriptionEl.textContent = "Tracks movement between projects/divisions/yards and adjusts PM/Inspection schedules.";
                }

                // Status + pricing logic
                const isBaseModule = customerState.baseModules.includes(moduleName);
                const price = MODULE_PRICING[moduleName] || 0;

                if (customerState.isGrandfathered && isBaseModule) {
                    statusEl.textContent = "Included (Grandfathered)";
                    pricingEl.innerHTML = `
                        <span>Standard price: $${price}/month</span>
                        <span><strong>FREE until ${customerState.freeUntil || "12/31/2026"}</strong></span>
                    `;
                } else {
                    statusEl.textContent = "Available";
                    pricingEl.innerHTML = `
                        <span>Price: $${price}/month</span>
                        <span>Annual billing: 10% discount</span>
                    `;
                }

                // Actions
                if (customerState.isGrandfathered && isBaseModule) {
                    const btn = document.createElement("button");
                    btn.className = "secondary";
                    btn.textContent = "Included in Base Plan";
                    btn.disabled = true;
                    actionsEl.appendChild(btn);
                } else {
                    const btn = document.createElement("button");
                    btn.textContent = "Add to Plan";
                    btn.addEventListener("click", () => toggleModuleSelection(moduleName, price));
                    actionsEl.appendChild(btn);
                }

                header.appendChild(nameEl);
                header.appendChild(statusEl);
                card.appendChild(header);
                card.appendChild(descriptionEl);
                card.appendChild(pricingEl);
                card.appendChild(actionsEl);

                grid.appendChild(card);
            });
        }

        function toggleModuleSelection(moduleName, price) {
            const idx = customerState.selectedPaidModules.findIndex(m => m.name === moduleName);
            if (idx >= 0) {
                customerState.selectedPaidModules.splice(idx, 1);
            } else {
                customerState.selectedPaidModules.push({ name: moduleName, price });
            }
            updateSummary();
        }

        function updateSummary() {
            const baseSummaryEl = document.getElementById("basePlanSummary");
            const additionalSummaryEl = document.getElementById("additionalModulesSummary");
            const monthlyTotalEl = document.getElementById("monthlyTotal");
            const annualTotalEl = document.getElementById("annualTotal");
            const selectedListEl = document.getElementById("selectedModulesList");

            // Base plan summary
            if (customerState.isGrandfathered) {
                baseSummaryEl.textContent = "Grandfathered 2026 Base Plan: Equipment Management + Equipment Inspections (no extraction engine), free until " +
                    (customerState.freeUntil || "12/31/2026") + ".";
            } else {
                baseSummaryEl.textContent = "Standard plan; base modules determined by your initial selection.";
            }

            // Additional modules summary
            if (customerState.selectedPaidModules.length === 0) {
                additionalSummaryEl.textContent = "None selected";
            } else {
                additionalSummaryEl.textContent = customerState.selectedPaidModules
                    .map(m => m.name)
                    .join(", ");
            }

            // Selected modules list
            selectedListEl.innerHTML = "";
            customerState.selectedPaidModules.forEach(m => {
                const li = document.createElement("li");
                li.textContent = `${m.name} — $${m.price}/month`;
                selectedListEl.appendChild(li);
            });

            // Totals
            const monthlyTotal = customerState.selectedPaidModules.reduce((sum, m) => sum + m.price, 0);
            const annualTotal = Math.round(monthlyTotal * 12 * 0.9); // 10% discount

            monthlyTotalEl.textContent = `$${monthlyTotal}`;
            annualTotalEl.textContent = `$${annualTotal}`;
        }

        async function proceedToCheckout() {
            const messageEl = document.getElementById("summaryMessage");

            if (customerState.selectedPaidModules.length === 0) {
                messageEl.className = "message error";
                messageEl.textContent = "No additional modules selected. Add at least one module to proceed to checkout.";
                return;
            }

            try {
                const response = await fetch("/api/customer/checkout", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        modules: customerState.selectedPaidModules.map(m => m.name)
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || "Checkout failed.");
                }

                messageEl.className = "message success";
                messageEl.textContent = "Checkout initialized. Redirecting to Stripe…";

                if (result.checkoutUrl) {
                    setTimeout(() => {
                        window.location.href = result.checkoutUrl;
                    }, 1200);
                }
            } catch (err) {
                messageEl.className = "message error";
                messageEl.textContent = err.message;
            }
        }

        document.getElementById("checkoutBtn").addEventListener("click", proceedToCheckout);

        // Initial load
        loadCustomerModules();
    </script>
</body>
</html>
