<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRIV‑EN | Onboarding Dashboard</title>
<meta name="description" content="Complete your DRIV‑EN onboarding steps.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/icons/favicon.png" sizes="48x48">
<link rel="stylesheet" href="/styles/dashboard.css?v=4">
<script>
(function() {
  var saved = localStorage.getItem("driven-theme");
  var system = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  var theme = saved || system;
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>
<style>
    .ob-greeting-bar { max-width: 1100px; margin: 0 auto; padding: 12px 20px 0 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .ob-greeting-text { font-size: 16px; color: var(--text-muted); font-weight: 500; }
    .ob-greeting-text strong { color: var(--text); }
    .ob-admin-btn { display: inline-flex; align-items: center; gap: 6px; background: #1e40af; border: 1px solid #2563eb; color: #dbeafe; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer; }
    .ob-admin-btn:hover { background: #1d4ed8; color: #fff; }
    .ob-step-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-top: 20px; }
    .ob-step-card { background: var(--bg-step); border: 1px solid var(--border); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px; position: relative; }
    .ob-step-header { display: flex; align-items: flex-start; gap: 8px; }
    .ob-step-title { font-size: 15px; font-weight: 600; color: var(--text); flex: 1; }
    .ob-info-icon { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: #f97316; color: #ffffff; font-size: 12px; font-weight: 700; cursor: pointer; border: none; flex-shrink: 0; }
    .ob-info-icon:hover { background: #ea580c; }
    .ob-info-popup { display: none; position: absolute; top: 40px; right: 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; font-size: 12px; color: var(--text-muted); line-height: 1.5; max-width: 280px; z-index: 20; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .ob-info-popup.active { display: block; }
    .ob-info-popup strong { color: var(--text); }
    .ob-info-popup-close { position: absolute; top: 6px; right: 8px; background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 2px 6px; }
    .ob-step-status { font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; width: fit-content; }
    .ob-completed { background: #065f46; border: 1px solid #059669; color: #d1fae5; }
    .ob-ready { background: #1e40af; border: 1px solid #2563eb; color: #dbeafe; }
    .ob-locked-prereq { background: #7f1d1d; border: 1px solid #b91c1c; color: #fee2e2; }
    .ob-admin-only { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); }
    .ob-step-body { font-size: 13px; color: var(--text-muted); line-height: 1.4; }
    .ob-assigned-to { font-size: 12px; color: var(--text-muted); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 6px; }
    .ob-assigned-to-label { font-weight: 600; color: var(--text); }
    .ob-assigned-to-name { color: var(--text-muted); }
    .ob-assigned-to-name.unassigned { font-style: italic; color: var(--text-muted); opacity: 0.7; }
    .ob-btn-primary { background: var(--primary); border: 1px solid var(--primary-hover); color: #ffffff; padding: 8px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; width: fit-content; }
    .ob-btn-primary:hover { background: var(--primary-hover); }
    .ob-kp-list { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
    .ob-kp-list-title { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .ob-kp-person { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; padding: 4px 8px; background: var(--bg-card); border-radius: 4px; }
    .ob-kp-person-name { font-weight: 600; color: var(--text); }
    .ob-kp-person-tasks { color: var(--text-muted); font-size: 11px; }
    .ob-kp-person-email { color: #60a5fa; font-size: 11px; }
    .ob-kp-loading { font-size: 12px; color: var(--text-muted); }
    .ob-logo-upload-area { display: flex; align-items: center; gap: 16px; margin-top: 8px; }
    .ob-logo-preview { width: 120px; height: 60px; border: 2px dashed var(--border); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-muted); overflow: hidden; }
    .ob-logo-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .ob-logo-upload-btn { background: var(--primary); border: 1px solid var(--primary-hover); color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .ob-logo-upload-btn:hover { background: var(--primary-hover); }
    .ob-logo-status { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .ob-popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; }
    .ob-popup-overlay.active { display: block; }
    @media (max-width: 800px) { .ob-step-grid { grid-template-columns: 1fr; } .ob-info-popup { max-width: 220px; right: 8px; } }
</style>
</head>
<body data-page-title="Onboarding Dashboard">
<div class="steel-bg"></div>
<div class="steel-overlay"></div>
<div id="dashHeader"></div>
<div class="ob-greeting-bar">
  <div class="ob-greeting-text" id="dashGreetingText">Welcome</div>
  <a href="/public/dashboard/admin.html" class="ob-admin-btn driven-admin-only">&larr; Admin Dashboard</a>
</div>
<main class="dash-main">
  <div class="dash-card">
    <h2>Onboarding Steps</h2>
    <p>This dashboard shows the current status of each onboarding step.</p>
    <div id="nonAdminNotice" style="display:none;background:#1e3a5f;border:1px solid #2563eb;color:#dbeafe;padding:12px 16px;border-radius:6px;margin-bottom:16px;font-size:13px;">
      <strong>Your assigned tasks:</strong> <span id="assignedTasksList"></span><br>
      Only the steps you are assigned to are shown below.
    </div>
    <div class="ob-step-grid" id="stepGrid">
      <!-- Step cards generated by JS -->
    </div>
  </div>
</main>
<div class="ob-popup-overlay" id="popupOverlay" onclick="closeAllPopups()"></div>
<script src="/components/dashboard-common.js?v=3"></script>
<script src="/components/auth-check.js?v=3"></script>
<script>
    function togglePopup(id) {
      var popup = document.getElementById(id);
      var overlay = document.getElementById("popupOverlay");
      var isActive = popup.classList.contains("active");
      closeAllPopups();
      if (!isActive) { popup.classList.add("active"); overlay.classList.add("active"); }
    }
    function closeAllPopups() {
      document.querySelectorAll(".ob-info-popup").forEach(function(p) { p.classList.remove("active"); });
      document.getElementById("popupOverlay").classList.remove("active");
    }
    var STEP_TASK_MAP = { "step1": "Admin Only", "step2": "Admin Only", "step3": "Employees", "step4": "Clients", "step5": "Divisions", "step6": "Project Types", "step7": "Projects", "step8": "Equipment" };
    var userAssignedTasks = [];
    var userIsAdmin = false;
    async function loadUserAssignedTasks() {
      if (window.dashUser && window.dashUser.role === "Admin") { userIsAdmin = true; return; }
      var customerId = localStorage.getItem("driven_customer_id");
      if (!customerId || !window.dashUser || !window.dashUser.email) return;
      try {
        var response = await fetch("/api/onboarding/key-personnel/list?customerId=" + encodeURIComponent(customerId));
        var data = await response.json();
        if (data.success && data.keyPersonnel) {
          var userEmail = window.dashUser.email.toLowerCase().trim();
          var foundUser = data.keyPersonnel.find(function(kp) { return kp.email && kp.email.toLowerCase().trim() === userEmail; });
          if (foundUser && foundUser.roles) { userAssignedTasks = foundUser.roles.map(function(r) { return r.role; }); }
        }
      } catch (e) {}
    }
    function filterStepsByAssignment() {
      if (userIsAdmin) return;
      Object.keys(STEP_TASK_MAP).forEach(function(stepId) {
        var card = document.getElementById(stepId);
        if (!card) return;
        var task = STEP_TASK_MAP[stepId];
        if (task === "Admin Only") { card.style.display = "none"; }
        else { if (userAssignedTasks.indexOf(task) === -1) { card.style.display = "none"; } }
      });
      var adminBtn = document.getElementById("adminDashBtn");
      if (adminBtn) adminBtn.style.display = "none";
      var notice = document.getElementById("nonAdminNotice");
      var tasksList = document.getElementById("assignedTasksList");
      if (notice && tasksList) { tasksList.textContent = userAssignedTasks.length > 0 ? userAssignedTasks.join(", ") : "No tasks assigned yet."; notice.style.display = "block"; }
    }
    document.addEventListener("dashSessionLoaded", async function() {
      await loadUserAssignedTasks();
      filterStepsByAssignment();
    });
</script>
</body>
</html>
