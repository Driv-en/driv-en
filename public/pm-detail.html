<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PM Detail | DRIV‑EN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/styles/global.css">
</head>
<body>

  <header class="app-header">
    <div class="app-header-inner">
      <a href="/index.html" class="app-logo">
        <span class="logo-driv">DRIV</span><span class="logo-en">-EN</span>
      </a>
      <nav class="app-nav-desktop">
        <a href="/equipment.html">Equipment</a>
        <a href="/pm.html">PM</a>
        <a href="/inspections.html">Inspections</a>
        <a href="/workorders.html">Work Orders</a>
        <a href="/admin.html">Admin</a>
      </nav>
      <button class="app-mobile-menu-btn" id="appMobileMenuBtn">☰</button>
    </div>
  </header>

  <nav class="app-nav-mobile" id="appNavMobile">
    <a href="/equipment.html">Equipment</a>
    <a href="/pm.html">PM</a>
    <a href="/inspections.html">Inspections</a>
    <a href="/workorders.html">Work Orders</a>
    <a href="/admin.html">Admin</a>
  </nav>

  <div class="app-sticky-wrapper">
    <main class="app-main">

      <section class="app-page-header">
        <h1>PM Detail</h1>
        <p>Single PM assignment, completion, and review.</p>
      </section>

      <section class="app-section">
        <h2 class="app-section-title">PM Info</h2>
        <div id="pmInfo">
          <!-- Equipment, PM template, due date -->
        </div>
      </section>

      <section class="app-section">
        <h2 class="app-section-title">Completion</h2>
        <form class="app-form" id="pmCompletionForm">
          <div class="form-group">
            <label for="pmCompletedDate">Completed Date</label>
            <input type="date" id="pmCompletedDate" name="pmCompletedDate" required>
          </div>
          <div class="form-group">
            <label for="pmMeter">Meter Reading</label>
            <input type="number" id="pmMeter" name="pmMeter">
          </div>
          <div class="form-group">
            <label for="pmNotes">Notes</label>
            <textarea id="pmNotes" name="pmNotes"></textarea>
          </div>
          <button type="submit" class="app-btn-primary">Complete PM</button>
        </form>
      </section>

      <section class="app-section">
        <h2 class="app-section-title">Review</h2>
        <form class="app-form" id="pmReviewForm">
          <div class="form-group">
            <label for="pmReviewStatus">Review Status</label>
            <select id="pmReviewStatus" name="pmReviewStatus">
              <option value="">Select...</option>
              <option value="approved">Approved</option>
              <option value="requires_work_order">Requires Work Order</option>
            </select>
          </div>
          <div class="form-group">
            <label for="pmReviewNotes">Review Notes</label>
            <textarea id="pmReviewNotes" name="pmReviewNotes"></textarea>
          </div>
          <button type="submit" class="app-btn-primary">Submit Review</button>
        </form>
      </section>

    </main>

    <footer class="app-footer">
      <p>© 2026 DRIV‑EN — Built for the Field.</p>
    </footer>
  </div>

  <script>
    const mobileBtn = document.getElementById('appMobileMenuBtn');
    const mobileNav = document.getElementById('appNavMobile');
    mobileBtn.addEventListener('click', () => {
      mobileNav.classList.toggle('open');
    });

    const header = document.querySelector('.app-header');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 10) header.classList.add('sticky');
      else header.classList.remove('sticky');
    });

    // TODO: integrate with Worker: load PM info, submit completion and review
  </script>
</body>
</html>
