<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRIV‑EN | Reset Password</title>
<meta name="description" content="Reset your DRIV-EN account password.">
<link rel="canonical" href="https://www.driv-en.com/public/reset-password.html">

<meta property="og:title" content="DRIV‑EN | Reset Password">
<meta property="og:description" content="Reset your DRIV-EN account password.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.driv-en.com/public/reset-password.html">
<meta property="og:image" content="https://www.driv-en.com/logo.png">

<!-- Favicon -->
<link rel="icon" type="image/png" href="/icons/favicon.png" sizes="48x48">
<link rel="icon" type="image/png" href="/icons/favicon-96.png" sizes="96x96">
<link rel="icon" type="image/png" href="/icons/favicon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/icons/favicon-180.png">

<!-- Shared stylesheets -->
<link rel="stylesheet" href="/styles/header.css?v=6">
<link rel="stylesheet" href="/styles/footer.css?v=3">

<style>
    .reset-section {
        max-width: 360px;
        margin: 40px auto 80px auto;
        padding: 10px 24px;
    }

    .reset-icon-wrap {
        text-align: center;
        margin-bottom: 16px;
    }

    .reset-section h2 {
        text-align: center;
        margin-bottom: 8px;
        font-size: 26px;
        font-weight: 700;
    }

    .reset-section p.subtitle {
        text-align: center;
        color: #555;
        font-size: 14px;
        margin-bottom: 24px;
    }

    label {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 6px;
        display: block;
    }

    .password-field-wrap {
        position: relative;
        margin-bottom: 16px;
    }

    .password-field-wrap input {
        width: 100%;
        padding: 10px;
        padding-right: 40px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
    }

    .password-field-wrap input.error {
        border-color: #cc0000;
    }

    .password-toggle {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        background: none;
        border: none;
        padding: 4px;
        font-size: 18px;
        color: #666;
        line-height: 1;
    }

    .password-toggle:hover {
        color: #111;
    }

    .password-hint {
        font-size: 12px;
        color: #666;
        margin: -8px 0 16px 0;
    }

    .reset-button {
        width: 100%;
        background: #2563eb;
        color: #fff;
        border: none;
        padding: 12px;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }

    .reset-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .error-banner {
        background: #ffdddd;
        color: #cc0000;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 16px;
        text-align: center;
        font-size: 14px;
        display: none;
    }

    .success-banner {
        background: #ddffdd;
        color: #006600;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 16px;
        text-align: center;
        font-size: 14px;
        display: none;
    }

    .back-to-login {
        text-align: center;
        margin-top: 24px;
        font-size: 14px;
    }

    .back-to-login a {
        color: #2563eb;
        text-decoration: underline;
        cursor: pointer;
    }

    .brand-driv { color: #8c8c8c; font-weight: bold; font-style: italic; letter-spacing: -1px; }
    .brand-dash { color: #2da94f; font-weight: bold; font-style: italic; letter-spacing: -1px; }
    .brand-en { color: #dc2626; font-weight: bold; font-style: italic; letter-spacing: -1px; }

    .login-icon-mask {
        display: inline-block;
        width: 64px;
        height: 64px;
        background-color: #fff;
        -webkit-mask-image: url('/icons/driven-login-icon.png');
        -webkit-mask-repeat: no-repeat;
        -webkit-mask-position: center;
        -webkit-mask-size: contain;
        mask-image: url('/icons/driven-login-icon.png');
        mask-repeat: no-repeat;
        mask-position: center;
        mask-size: contain;
        vertical-align: middle;
    }

    .login-icon-fallback {
        width: 64px;
        height: auto;
        filter: invert(1) brightness(200%);
        -webkit-filter: invert(1) brightness(200%);
        vertical-align: middle;
        display: none;
    }

    @supports not (mask-image: url('')) {
        .login-icon-mask { display: none; }
        .login-icon-fallback { display: inline-block; }
    }

    input[type="password"]::-ms-reveal,
    input[type="password"]::-ms-clear {
        display: none;
    }

</style>
</head>

<body>

<div id="header"></div>

<div class="reset-section">
    <div class="reset-icon-wrap">
        <span class="login-icon-mask"></span>
        <img src="/icons/driven-login-icon.png" class="login-icon-fallback" alt="DRIV‑EN login icon">
    </div>
    <h2>Reset Password</h2>
    <p class="subtitle"><span class="brand-driv">DRIV</span><span class="brand-dash">‑</span><span class="brand-en">EN</span></p>

    <div id="error-banner" class="error-banner"></div>
    <div id="success-banner" class="success-banner"></div>

    <form id="reset-form">
        <label>New Password<span style="color:#cc0000;">*</span></label>
        <div class="password-field-wrap">
            <input type="password" id="newPassword" required />
                        <button type="button" class="password-toggle" id="toggle1" title="Show password">Show</button>

        </div>

        <label>Confirm New Password<span style="color:#cc0000;">*</span></label>
        <div class="password-field-wrap">
            <input type="password" id="confirmPassword" required />
                        <button type="button" class="password-toggle" id="toggle2" title="Show password">Show</button>

        </div>

        <div class="password-hint">Minimum 8 characters.</div>

        <button type="submit" class="reset-button" id="resetBtn">Reset Password</button>
    </form>

    <div class="back-to-login">
        <a href="/public/login">Back to Login</a>
    </div>
</div>

<div id="footer"></div>

<script>
async function loadComponent(id, file) {
    try {
        const el = document.getElementById(id);
        const html = await fetch(file).then(r => r.text());
        el.innerHTML = html;
    } catch (e) {
        console.error("Component failed:", id, file, e);
    }
}

document.addEventListener("DOMContentLoaded", async () => {
    await loadComponent("header", "/components/header.html");
    await loadComponent("footer", "/components/footer.html");
    const yearEl = document.getElementById('footer-year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();
});
</script>
<script src="/components/nav.js?v=2"></script>

<script>
    // Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get("token");

    const errorBanner = document.getElementById("error-banner");
    const successBanner = document.getElementById("success-banner");
    const resetBtn = document.getElementById("resetBtn");

    if (!token) {
        errorBanner.textContent = "Invalid reset link. Please request a new password reset.";
        errorBanner.style.display = "block";
        resetBtn.disabled = true;
    }

    // Password visibility toggles
    function setupToggle(inputId, toggleId) {
        const input = document.getElementById(inputId);
        const toggle = document.getElementById(toggleId);
        toggle.addEventListener("click", function() {
            if (input.type === "password") {
                input.type = "text";
                toggle.textContent = "Hide";
                toggle.title = "Hide password";
            } else {
                input.type = "password";
                toggle.textContent = "Show";
                toggle.title = "Show password";
            }
        });
    }

    setupToggle("newPassword", "toggle1");
    setupToggle("confirmPassword", "toggle2");

    // Form submit
    document.getElementById("reset-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBanner.style.display = "none";
        successBanner.style.display = "none";

        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (newPassword !== confirmPassword) {
            errorBanner.textContent = "Passwords do not match.";
            errorBanner.style.display = "block";
            return;
        }

        if (newPassword.length < 8) {
            errorBanner.textContent = "Password must be at least 8 characters.";
            errorBanner.style.display = "block";
            return;
        }

        resetBtn.disabled = true;
        resetBtn.textContent = "Resetting\u2026";

        try {
            const response = await fetch("/auth/reset-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token: token, newPassword: newPassword })
            });

            const result = await response.json();

            if (result.success) {
                successBanner.textContent = result.message || "Password reset successfully!";
                successBanner.style.display = "block";
                document.getElementById("reset-form").style.display = "none";

                setTimeout(() => {
                    window.location.href = "/public/login";
                }, 3000);
            } else {
                errorBanner.textContent = result.error || "Failed to reset password.";
                errorBanner.style.display = "block";
                resetBtn.disabled = false;
                resetBtn.textContent = "Reset Password";
            }
        } catch (err) {
            errorBanner.textContent = "An error occurred. Please try again.";
            errorBanner.style.display = "block";
            resetBtn.disabled = false;
            resetBtn.textContent = "Reset Password";
        }
    });
</script>
</body>
</html>
