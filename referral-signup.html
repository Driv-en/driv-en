<!DOCTYPE html>
<html>
<head>
  <title>Referral Signup</title>
</head>
<body>

<h2>Referral Partner Signup</h2>

<form id="referralForm">
  <label>Name</label><br>
  <input type="text" id="name" required><br><br>

  <label>Email</label><br>
  <input type="email" id="email" required><br><br>

  <label>Phone</label><br>
  <input type="text" id="phone" required><br><br>

  <button type="submit">Submit</button>
</form>

<script>
document.getElementById("referralForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const payload = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    phone: document.getElementById("phone").value
  };

  const response = await fetch("https://airtable-form-handler.jblood.workers.dev", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  if (response.ok) {
    alert("Referral submitted successfully!");
  } else {
    alert("Error submitting referral.");
  }
});
</script>

</body>
</html>
