<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Driv-en Referral Signup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; max-width: 600px; }
    input, button { width: 100%; padding: 12px; margin-top: 10px; }
    h1 { font-size: 28px; }
    .module-list { margin-top: 20px; }
  </style>
</head>

<body>

  <h1>Run Your Entire Equipment Operation in One Platform</h1>
  <p>Built for contractors. Fast onboarding. No long-term contracts.</p>

  <h2>Get Started</h2>

  <form id="referralForm">
    <input type="text" id="companyName" placeholder="Company Name" required>
    <input type="text" id="contactName" placeholder="Your Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="tel" id="phone" placeholder="Phone" required>

    <!-- Hidden referral code -->
    <input type="hidden" id="referralCode">

    <button type="submit">Start Subscription</button>
    <button type="button" id="demoButton">Request a Demo</button>
  </form>

  <div class="module-list">
    <h3>Included Modules</h3>
    <ul>
      <li>Equipment</li>
      <li>Safety</li>
      <li>Training</li>
      <li>PM Scheduling</li>
      <li>Compliance</li>
      <li>Project Ops</li>
    </ul>
  </div>

  <script>
    // Extract referral code from URL
    const params = new URLSearchParams(window.location.search);
    const refCode = params.get("ref");
    document.getElementById("referralCode").value = refCode;

    // Submit form → send to Airtable webhook
    document.getElementById("referralForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const payload = {
        companyName: document.getElementById("companyName").value,
        contactName: document.getElementById("contactName").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        referralCode: refCode,
        action: "subscription"
      };

      await fetch("YOUR_AIRTABLE_WEBHOOK_URL", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      alert("Thank you! We’ll reach out shortly to complete your setup.");
    });

    // Demo button
    document.getElementById("demoButton").addEventListener("click", async () => {
      const payload = {
        referralCode: refCode,
        action: "demo-request"
      };

      await fetch("YOUR_AIRTABLE_WEBHOOK_URL", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      alert("Demo request received! We’ll contact you soon.");
    });
  </script>

</body>
</html>
