<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Referral Partner Login | Driv‑en</title>

<!-- Favicon -->
<link rel="icon" type="image/png" href="/assets/icons/favicon.png?v=2026" sizes="48x48">
<link rel="icon" type="image/png" href="/assets/icons/favicon-96.png?v=2026" sizes="96x96">
<link rel="icon" type="image/png" href="/assets/icons/favicon-192.png?v=2026" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/icons/favicon-180.png?v=2026">

<!-- Shared stylesheets -->
<link rel="stylesheet" href="/styles/header.css?v=6">
<link rel="stylesheet" href="/styles/footer.css?v=3">

<style>
    .login-section {
        max-width: 360px;
        margin: 40px auto 80px auto;
        padding: 10px 24px;
    }

    .login-icon-wrap {
        text-align: center;
        margin-bottom: 16px;
    }

    .login-section h2 {
        text-align: center;
        margin-bottom: 8px;
        font-size: 26px;
        font-weight: 700;
    }

    .login-subtitle {
        text-align: center;
        margin-bottom: 24px;
        font-size: 15px;
        color: #64748b;
    }

    label {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 6px;
        display: block;
    }

    .required-star { color: #cc0000; margin-left: 3px; }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        margin-bottom: 16px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
    }

    .password-wrapper {
        position: relative;
        margin-bottom: 16px;
    }
    .password-wrapper input { margin-bottom: 0; padding-right: 40px; }
    .password-toggle-btn {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        color: #2563eb;
        padding: 4px;
        line-height: 1;
    }

    .login-button {
        width: 100%;
        background: #ffcc00;
        color: #111;
        border: none;
        padding: 12px;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }

    .error-banner {
        background: #ffdddd;
        color: #cc0000;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 16px;
        text-align: center;
        font-size: 14px;
        display: none;
    }

    .forgot-link {
        text-align: center;
        margin-top: 16px;
        font-size: 14px;
    }
    .forgot-link a {
        color: #2563eb;
        text-decoration: underline;
        cursor: pointer;
    }

    .back-link {
        text-align: center;
        margin-top: 24px;
        font-size: 14px;
    }
    .back-link a {
        color: #64748b;
        text-decoration: none;
    }
    .back-link a:hover { text-decoration: underline; }

    /* ===== SHARED STYLES (do not remove) ===== */
    .inline-logo { height: 3.75em; vertical-align: middle; display: inline-block; }
    .brand-driv { color: #8c8c8c; font-weight: bold; font-style: italic; letter-spacing: -1px; }
    .brand-dash { color: #2da94f; font-weight: bold; font-style: italic; letter-spacing: -1px; }
    .brand-en { color: #dc2626; font-weight: bold; font-style: italic; letter-spacing: -1px; }
    .login-icon-mask {
        display: inline-block;
        width: 64px;
        height: 64px;
        background-color: #fff;
        -webkit-mask-image: url('/assets/icons/driven-login-icon.png');
        -webkit-mask-repeat: no-repeat;
        -webkit-mask-position: center;
        -webkit-mask-size: contain;
        mask-image: url('/assets/icons/driven-login-icon.png');
        mask-repeat: no-repeat;
        mask-position: center;
        mask-size: contain;
        vertical-align: middle;
    }
    .login-icon-fallback {
        width: 64px;
        height: auto;
        filter: invert(1) brightness(200%);
        -webkit-filter: invert(1) brightness(200%);
        vertical-align: middle;
        display: none;
    }
    @supports not (mask-image: url('')) {
        .login-icon-mask { display: none; }
        .login-icon-fallback { display: inline-block; }
    }
</style>
</head>

<body>

<!-- Header (auto-loaded) -->
<div id="header"></div>

<div class="login-section">
    <div class="login-icon-wrap">
        <span class="login-icon-mask"></span>
        <img src="/assets/icons/driven-login-icon.png" class="login-icon-fallback" alt="DRIV‑EN login icon">
    </div>
    <h2>Referral Partner Login</h2>
    <p class="login-subtitle">Sign in to view your referrals and commissions</p>

    <div id="error-banner" class="error-banner"></div>

    <form id="login-form">
        <label>Email Address<span class="required-star">*</span></label>
        <input type="email" id="email" required />

        <label>Password<span class="required-star">*</span></label>
        <div class="password-wrapper">
            <input type="password" id="password" required />
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility()">
                <span id="password-toggle-icon" style="color:#2563eb;font-size:12px;font-weight:600;">SHOW</span>
            </button>
        </div>

        <button type="submit" class="login-button">Login</button>
    </form>

    <div class="forgot-link">
        <a id="forgot-link">Forgot Password?</a>
    </div>

    <div class="back-link">
        <a href="/website/referral-program.html">&larr; Back to Referral Program</a>
    </div>
</div>

<!-- Footer (auto-loaded) -->
<div id="footer"></div>

<script>
async function loadComponent(id, file) {
    try {
        const el = document.getElementById(id);
        const html = await fetch(file).then(r => r.text());
        el.innerHTML = html;
    } catch (e) {
        console.error("Component failed:", id, file, e);
    }
}

document.addEventListener("DOMContentLoaded", async () => {
    await loadComponent("header", "/components/header.html");
    await loadComponent("footer", "/components/footer.html");
    const yearEl = document.getElementById('footer-year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();
});
</script>
<script src="/components/nav.js?v=2"></script>

<script>
    function togglePasswordVisibility() {
        var passwordInput = document.getElementById("password");
        var toggleLabel = document.getElementById("password-toggle-icon");
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleLabel.textContent = "HIDE";
        } else {
            passwordInput.type = "password";
            toggleLabel.textContent = "SHOW";
        }
    }

    // Forgot Password
    document.getElementById("forgot-link").addEventListener("click", async () => {
        const email = document.getElementById("email").value.trim();
        if (!email) {
            alert("Please enter your email address first, then click Forgot Password.");
            return;
        }
        try {
            const resp = await fetch("/referral/forgot-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email })
            });
            const data = await resp.json();
            if (data.success) {
                alert("If an account exists for " + email + ", a password reset link has been sent to that email.");
            } else {
                alert("Could not process request: " + (data.error || "Unknown error"));
            }
        } catch (e) {
            alert("Could not process request. Please try again.");
        }
    });

    // Login
    document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const errorBanner = document.getElementById("error-banner");

        errorBanner.style.display = "none";

        const response = await fetch("/referral/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                email: email.value.trim(),
                password: password.value.trim(),
                remember: false
            })
        });

        const result = await response.json();

        if (!result.success) {
            errorBanner.textContent = result.error || "Invalid credentials.";
            errorBanner.style.display = "block";
            return;
        }

        // Redirect to referrer dashboard
        window.location.href = "/app/dashboard/referrer-dashboard.html";
    });
</script>

</body>
</html>
