<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Referral Partner Password Reset | Driv‑en</title>

<link rel="icon" type="image/png" href="/assets/icons/favicon.png?v=2026" sizes="48x48">
<link rel="icon" type="image/png" href="/assets/icons/favicon-96.png?v=2026" sizes="96x96">
<link rel="icon" type="image/png" href="/assets/icons/favicon-192.png?v=2026" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/icons/favicon-180.png?v=2026">

<link rel="stylesheet" href="/styles/header.css?v=6">
<link rel="stylesheet" href="/styles/footer.css?v=3">

<style>
    .reset-section {
        max-width: 400px;
        margin: 40px auto 80px auto;
        padding: 10px 24px;
    }
    .reset-section h2 {
        text-align: center;
        margin-bottom: 8px;
        font-size: 24px;
    }
    .reset-subtitle {
        text-align: center;
        margin-bottom: 24px;
        font-size: 15px;
        color: #64748b;
    }
    label {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 6px;
        display: block;
    }
    input[type="password"] {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        margin-bottom: 16px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
    }
    .reset-button {
        width: 100%;
        background: #ffcc00;
        color: #111;
        border: none;
        padding: 12px;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }
    .message-banner {
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 16px;
        text-align: center;
        font-size: 14px;
        display: none;
    }
    .message-success { background: #dcfce7; color: #166534; }
    .message-error { background: #ffdddd; color: #cc0000; }
    .back-link {
        text-align: center;
        margin-top: 24px;
        font-size: 14px;
    }
    .back-link a { color: #64748b; text-decoration: none; }
    .back-link a:hover { text-decoration: underline; }
</style>
</head>

<body>

<div id="header"></div>

<div class="reset-section">
    <h2>Reset Your Password</h2>
    <p class="reset-subtitle">Enter a new password for your Referral Partner account</p>

    <div id="msg" class="message-banner"></div>

    <form id="reset-form">
        <label>New Password<span style="color:#cc0000;">*</span></label>
        <input type="password" id="new_password" required minlength="8" placeholder="Minimum 8 characters" />

        <label>Confirm New Password<span style="color:#cc0000;">*</span></label>
        <input type="password" id="confirm_password" required minlength="8" />

        <button type="submit" class="reset-button">Reset Password</button>
    </form>

    <div class="back-link">
        <a href="/public/referrer-login.html">&larr; Back to Login</a>
    </div>
</div>

<div id="footer"></div>

<script>
async function loadComponent(id, file) {
    try {
        const el = document.getElementById(id);
        const html = await fetch(file).then(r => r.text());
        el.innerHTML = html;
    } catch (e) {
        console.error("Component failed:", id, file, e);
    }
}

document.addEventListener("DOMContentLoaded", async () => {
    await loadComponent("header", "/components/header.html");
    await loadComponent("footer", "/components/footer.html");
    const yearEl = document.getElementById('footer-year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();
});

document.getElementById("reset-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msgEl = document.getElementById("msg");
    const newPwd = document.getElementById("new_password").value;
    const confirmPwd = document.getElementById("confirm_password").value;

    msgEl.style.display = "none";

    if (newPwd !== confirmPwd) {
        msgEl.className = "message-banner message-error";
        msgEl.textContent = "Passwords do not match.";
        msgEl.style.display = "block";
        return;
    }

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (!token) {
        msgEl.className = "message-banner message-error";
        msgEl.textContent = "No reset token found. Please use the link from your email.";
        msgEl.style.display = "block";
        return;
    }

    try {
        const resp = await fetch("/referral/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: token, new_password: newPwd })
        });
        const data = await resp.json();

        if (data.success) {
            msgEl.className = "message-banner message-success";
            msgEl.textContent = "Password reset successfully! Redirecting to login...";
            msgEl.style.display = "block";
            setTimeout(() => { window.location.href = "/public/referrer-login.html"; }, 2000);
        } else {
            msgEl.className = "message-banner message-error";
            msgEl.textContent = data.error || "Failed to reset password.";
            msgEl.style.display = "block";
        }
    } catch (err) {
        msgEl.className = "message-banner message-error";
        msgEl.textContent = "Network error. Please try again.";
        msgEl.style.display = "block";
    }
});
</script>

</body>
</html>
