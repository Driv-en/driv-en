<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ===== PAGE-SPECIFIC SEO (replace per page) ===== -->
<title>DRIV‑EN | Blank Test Page!</title>
<meta name="description" content="">
<meta name="keywords" content="">
<link rel="canonical" href="">
<!-- ===== END PAGE-SPECIFIC SEO ===== -->

<!-- Favicon -->
<link rel="icon" href="/favicon.png" type="image/png">

<!-- Shared stylesheets -->
<link rel="stylesheet" href="/styles/header.css?v=3">
<link rel="stylesheet" href="/styles/footer.css?v=3">

<style>
    /* ===== PAGE-SPECIFIC STYLES (add per page) ===== */

    .blank-content {
        max-width: 900px;
        margin: 120px auto 80px auto;
        padding: 40px;
        background: #f7f7f7;
        border: 2px dashed #ccc;
        text-align: center;
        font-size: 20px;
        color: #444;
    }

    /* ===== SHARED STYLES (do not remove) ===== */

    /* Inline logo for headings and buttons */
    .inline-logo {
        height: 3.75em;
        vertical-align: middle;
        display: inline-block;
    }

    /* DRIV-EN colored text for paragraphs */
    .brand-driv {
        color: #8c8c8c;
        font-weight: bold;
        font-style: italic;
        letter-spacing: -1px;
    }
    .brand-dash {
        color: #2da94f;
        font-weight: bold;
        font-style: italic;
        letter-spacing: -1px;
    }
    .brand-en {
        color: #dc2626;
        font-weight: bold;
        font-style: italic;
        letter-spacing: -1px;
    }

    /* Login icon (used on pages that display it) */
    .login-icon-mask {
        display: inline-block;
        width: 64px;
        height: 64px;
        background-color: #fff;
        -webkit-mask-image: url('/icons/driven-login-icon.png');
        -webkit-mask-repeat: no-repeat;
        -webkit-mask-position: center;
        -webkit-mask-size: contain;
        mask-image: url('/icons/driven-login-icon.png');
        mask-repeat: no-repeat;
        mask-position: center;
        mask-size: contain;
        vertical-align: middle;
    }

    .login-icon-fallback {
        width: 64px;
        height: auto;
        filter: invert(1) brightness(200%);
        -webkit-filter: invert(1) brightness(200%);
        vertical-align: middle;
        display: none;
    }

    @supports not (mask-image: url('')) {
        .login-icon-mask { display: none; }
        .login-icon-fallback { display: inline-block; }
    }
</style>

</head>

<body>

<!-- Header (auto-loaded) -->
<div id="header"></div>

<!-- ===== PAGE CONTENT (replace per page) ===== -->
<div class="blank-content">
    This is a blank test page.<br>
    If the header and footer look correct here,<br>
    they will look correct everywhere.
</div>
<!-- ===== END PAGE CONTENT ===== -->

<!-- Footer (auto-loaded) -->
<div id="footer"></div>

<!-- ===== SHARED SCRIPT (do not remove) ===== -->
<script>
async function loadComponent(id, file) {
    try {
        const el = document.getElementById(id);
        const html = await fetch(file).then(r => r.text());
        el.innerHTML = html;
    } catch (e) {
        console.error("Component failed:", id, file, e);
    }
}

document.addEventListener("DOMContentLoaded", async () => {
    await loadComponent("header", "/components/header.html");
    await loadComponent("footer", "/components/footer.html");

    // Set footer copyright year
    const yearEl = document.getElementById('footer-year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();

    // Hamburger toggle
    const hamburger = document.getElementById('drivenHamburger');
    const mobileNav = document.getElementById('drivenMobileNav');

    if (hamburger && mobileNav) {
        hamburger.addEventListener('click', function() {
            const isActive = this.classList.toggle('active');
            mobileNav.classList.toggle('active', isActive);
            this.setAttribute('aria-expanded', isActive);
            mobileNav.setAttribute('aria-hidden', !isActive);
        });
    }
});
</script>
<!-- ===== END SHARED SCRIPT ===== -->

</body>
</html>
