# ==========================================
# AIRTABLE FORM HANDLER WORKER — wrangler.toml (BACKUP)
# Generated: August 30, 2026 (Session 7 — Checkpoint 2)
# Source: Cloudflare API binding data
#
# This worker handles form submissions to Airtable and uploads W9 files to R2.
# No routes — invoked via fetch.
# Source code NOT in workspace — deployed via wrangler by GitHub AI.
#
# Bindings (from Cloudflare API):
#   - Secret: AIRTABLE_API_KEY
#   - R2: w9-uploads (bucket for W9 tax form uploads)
#   - Var: AIRTABLE_BASE_ID (likely)
# ==========================================

name = "airtable-form-handler"
main = "src/index.js"
compatibility_date = "2024-09-01"

# R2 bucket — W9 tax form uploads
[[r2_buckets]]
binding = "W9_UPLOADS"
bucket_name = "w9-uploads"

# Plain-text vars
[vars]
AIRTABLE_BASE_ID = "appbZPijYF3evhSkK"

# Secrets — set with:
#   npx wrangler secret put AIRTABLE_API_KEY
