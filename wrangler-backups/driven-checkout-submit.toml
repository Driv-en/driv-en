# ==========================================
# DRIV-EN CHECKOUT SUBMIT WORKER — wrangler.toml (BACKUP)
# Generated: August 30, 2026 (Session 7 — Checkpoint 2)
# Source: Cloudflare API binding data + workspace source code
#
# This worker handles checkout form submissions: validates Turnstile,
# creates customer records in Airtable, sends confirmation emails via SendGrid.
# No routes — invoked via fetch from the checkout page.
#
# Bindings (from Cloudflare API):
#   - Secret: AIRTABLE_API_KEY
#   - Secret: SENDGRID_API_KEY
#   - Secret: TURNSTILE_SECRET_KEY (if configured)
#   - Secret: CHECKOUT_SECRET (if configured)
#   - Var: AIRTABLE_BASE_ID
#   - Var: AIRTABLE_TABLE_NAME
#   - Var: ONBOARDING_DOMAIN
#   - Var: SENDGRID_FROM_EMAIL
#   - Var: SUPPORT_CONTACT
# ==========================================

name = "driven-checkout-submit"
main = "worker.js"
compatibility_date = "2024-09-01"

# Plain-text vars
[vars]
AIRTABLE_BASE_ID = "appbZPijYF3evhSkK"
AIRTABLE_TABLE_NAME = "Customer"
ONBOARDING_DOMAIN = "https://driv-en.com"
SENDGRID_FROM_EMAIL = "support@driv-en.com"
SUPPORT_CONTACT = "support@driv-en.com"

# Secrets — set with:
#   npx wrangler secret put AIRTABLE_API_KEY
#   npx wrangler secret put SENDGRID_API_KEY
#   npx wrangler secret put TURNSTILE_SECRET_KEY
#   npx wrangler secret put CHECKOUT_SECRET
