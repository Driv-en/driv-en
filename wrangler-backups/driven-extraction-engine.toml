# ==========================================
# DRIVEN EXTRACTION ENGINE WORKER — wrangler.toml (BACKUP)
# Generated: August 30, 2026 (Session 7 — Checkpoint 2)
# Source: Cloudflare API binding data
#
# Extraction engine — processes uploaded documents/images to extract
# equipment data automatically. Uses R2 for file storage and Airtable
# for record management.
# No routes — invoked via fetch.
# Source code NOT in workspace — deployed via wrangler by GitHub AI.
# This is a FUTURE feature (FUTURE-3 in the features report).
#
# Bindings (from Cloudflare API):
#   - Secret: AIRTABLE_API_KEY (or AIRTABLE_TOKEN)
#   - R2: driven-storage
#   - Var: AIRTABLE_BASE_ID
# ==========================================

name = "driven-extraction-engine"
main = "src/index.js"
compatibility_date = "2024-09-01"

# R2 bucket — document/image storage for extraction
[[r2_buckets]]
binding = "DRIVEN_STORAGE"
bucket_name = "driven-storage"

# Plain-text vars
[vars]
AIRTABLE_BASE_ID = "appbZPijYF3evhSkK"

# Secrets — set with:
#   npx wrangler secret put AIRTABLE_API_KEY
