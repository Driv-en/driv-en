# ==========================================
# DRIV-EN EMPLOYEES API WORKER — wrangler.toml (BACKUP)
# Generated: August 30, 2026 (Session 7 — Checkpoint 2)
# Source: Cloudflare API binding data + workspace source code
#
# This worker serves employee data filtered by the caller's organization (org_id).
# It requires JWT authentication (same JWT_SECRET as driv-en-auth worker).
# NOT CURRENTLY DEPLOYED — ready for deployment when needed.
#
# SECURITY FIX (Session 7): Added JWT auth + org_id multi-tenant filtering.
# Previously returned ALL employees across ALL organizations with no auth.
#
# Bindings (required for deployment):
#   - D1: DB → employees-db (2cc94c17-f60c-4a52-bead-57507b1292f4)
#   - Secret: JWT_SECRET (must match driv-en-auth worker)
# ==========================================

name = "employees-api"
main = "src/index.js"
compatibility_date = "2024-09-25"

# D1 database — employees + key_personnel_roles tables
[[d1_databases]]
binding = "DB"
database_name = "employees-db"
database_id = "2cc94c17-f60c-4a52-bead-57507b1292f4"

# Secrets — set with:
#   npx wrangler secret put JWT_SECRET
# JWT_SECRET must be the SAME value as the driv-en-auth worker's JWT_SECRET.
